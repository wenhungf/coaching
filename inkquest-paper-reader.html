chosocial function (max 25)", "Pain and discomfort (max 15)", "GOHAI-T (max 60)"], ["", "Coefficients", "Coefficients", "Coefficients", "Coefficients"]], "rows": [["Age (years)", "0.01", "−0.05", "0.09", "0.01"], ["Remaining natural teeth", "0.17 *", "0.25 *", "0.06", "0.03"], ["Total denture satisfaction scores", "0.65 *", "0.55 *", "0.56 *", "0.45 *"], ["Satisfaction with chewing ability", "0.54 *", "0.49 *", "0.43 *", "0.35 *"], ["Satisfaction with ability to speak clearly", "0.56 *", "0.47 *", "0.49 *", "0.38 *"], ["Satisfaction with appearance", "0.43 *", "0.31 *", "0.43 *", "0.29 *"], ["Satisfaction with tasting ability", "0.49 *", "0.44 *", "0.40 *", "0.31 *"], ["Satisfaction with retention of dentures (total, estimate)", "0.50 *", "0.43 *", "0.40 *", "0.35 *"], ["Satisfaction with comfort (total, estimate)", "0.52 *", "0.40 *", "0.47 *", "0.40 *"]], "note": "* p < 0.05。相關係數越接近 1，關聯越強；負號代表反向。注意年齡那一列全部接近 0，這就是論文說「年齡沒有顯著相關」的依據。"}, {"no": "Table 5", "title": "Hierarchical multiple regression analysis of GOHAI-T scores", "zh": "GOHAI-T 分數的階層式多元迴歸分析", "head": [["Block and variables", ["Model I", 3], ["Model II", 3], ["Model III", 3], ["Model IV", 3]], ["", "B", "β", "t", "B", "β", "t", "B", "β", "t", "B", "β", "t"]], "rows": [["**Socio-demographic characteristics"], ["Age", "0.03", "0.02", "0.31", "0.10", "0.08", "1.28", "0.07", "0.05", "1.11", "0.06", "0.04", "0.94"], ["Female vs. male", "0.01", "0.00", "0.01", "0.01", "0.00", "0.01", "0.52", "0.03", "0.67", "0.71", "0.04", "0.90"], ["Lower than high school vs. high school or above", "1.51", "0.09", "1.33", "2.56", "0.15", "2.29 *", "1.93", "0.11", "2.32 *", "1.92", "0.11", "2.28 *"], ["Living alone — Yes vs. no", "2.53", "0.12", "1.98 *", "2.26", "0.11", "1.82", "1.73", "0.08", "1.87", "1.55", "0.07", "1.66"], ["Able to afford living expenses — No vs. yes", "−2.60", "−0.13", "−2.13 *", "−2.27", "−0.11", "−1.92", "−1.26", "−0.06", "−1.43", "−1.39", "−0.07", "−1.55"], ["**Dentition and denture status"], ["Remaining natural teeth", "", "", "", "0.41", "0.36", "3.72 **", "0.24", "0.21", "2.87 **", "0.29", "0.26", "3.34 **"], ["Single CD vs. CD", "", "", "", "−5.07", "−0.27", "−3.47 **", "−2.54", "−0.14", "−2.28 *", "−2.24", "−0.12", "−1.94"], ["Single RPD vs. CD", "", "", "", "−3.47", "−0.18", "−2.17 *", "−3.18", "−0.17", "−2.60 *", "−3.07", "−0.16", "−2.47 *"], ["Full-mouth RPD vs. CD", "", "", "", "−4.43", "−0.24", "−2.04", "−2.59", "−0.14", "−1.57", "−2.52", "−0.13", "−1.52"], ["**Factors related to denture wearing"], ["Presence of oral pain — Yes vs. no", "", "", "", "", "", "", "−1.28", "−0.04", "−0.89", "−1.56", "−0.05", "−1.07"], ["Perceived loose denture — Yes vs. no", "", "", "", "", "", "", "−3.12", "−0.15", "−2.84 **", "−3.50", "−0.17", "−3.15 **"], ["Presence of oral ulcer — Yes vs. no", "", "", "", "", "", "", "−4.83", "−0.18", "−3.46 **", "−4.23", "−0.16", "−2.97 **"], ["Perceived halitosis — Yes vs. no", "", "", "", "", "", "", "−1.74", "−0.06", "−1.23", "−1.90", "−0.06", "−1.35"], ["Perceived dry mouth — Yes vs. no", "", "", "", "", "", "", "−1.88", "−0.08", "−1.61", "−2.00", "−0.08", "−1.71"], ["Total denture satisfaction scores", "", "", "", "", "", "", "0.77", "0.44", "8.79 **", "0.79", "0.45", "8.85 ***"], ["**Dental care service usage"], ["Regular dental checkups — No vs. yes", "", "", "", "", "", "", "", "", "", "−1.77", "−0.09", "−1.86"], ["Treatment during toothache — No vs. yes", "", "", "", "", "", "", "", "", "", "1.52", "0.06", "1.16"], ["Dental visits in the last year — No vs. yes", "", "", "", "", "", "", "", "", "", "−0.18", "−0.01", "−0.22"], ["**Model fit 模型適配"], ["R²", "", "", "0.035", "", "", "0.124 ***", "", "", "0.524 ***", "", "", "0.533 ***"], ["Adjusted R²", "", "", "0.018", "", "", "0.094 ***", "", "", "0.496 ***", "", "", "0.500 ***"], ["F (df1, df2)", "", "", "F(5,271) = 1.99", "", "", "F(9,267) = 4.20", "", "", "F(15,261) = 19.13", "", "", "F(18,258) = 16.35"], ["p", "", "", "0.081", "", "", "0.000", "", "", "0.000", "", "", "0.000"], ["ΔR²", "", "", "0.035", "", "", "0.089 ***", "", "", "0.400 ***", "", "", "0.009"], ["F change", "", "", "F(5,271) = 1.99", "", "", "F(4,267) = 6.75", "", "", "F(6,261) = 36.50", "", "", "F(3,258) = 1.68"], ["p for F change", "", "", "0.081", "", "", "0.000", "", "", "0.0000", "", "", "0.172"]], "note": "* p < 0.05、** p < 0.01、*** p < 0.001。VIF 設定小於 5 以避免多重共線性。這是全篇最重要的表：看最下面的 ΔR² 那一列，Model III 一口氣多解釋了 0.400（40%），就是「假牙相關因素最重要」的證據。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "Despite the important findings, our study had several limitations that should be considered with some caution when interpreting the results.", "zh": "儘管有重要發現，本研究仍有若干限制，解讀結果時應審慎考量。", "g": "<em>Despite + 名詞</em>（儘管……）後面不能接句子，這點跟 Although 不同。討論段先講限制再談發現，是這篇作者的安排；多數論文則是放在最後。"}, {"en": "First, we did not use a population-based sample, but a convenience sample from the Senior Citizens’ College of Kaohsiung City, and thus, our study represents only a subgroup of the public.", "zh": "第一，本研究並非採用族群為基礎的樣本，而是取自高雄市長青學苑的方便樣本，因此僅代表部分族群。", "g": "<em>not A but B</em>（不是 A 而是 B）是很好用的對比句型。這裡作者主動承認取樣限制——誠實交代限制反而讓論文更可信，您寫的時候也該這樣。"}, {"en": "Future research should focus on generalizing the findings to elderly Taiwanese people wearing removable dentures.", "zh": "未來研究應著重於將結果推論至全體配戴活動假牙的台灣長者。", "g": "<em>Future research should...</em>（未來研究應……）是討論段的固定收尾句型之一。口試被問「你的研究有什麼不足」時，可以用這個結構回答。"}, {"en": "Second, the present study is characterized by a cross-sectional design, and therefore, we cannot make inferences with respect to the direction of the observed associations.", "zh": "第二，本研究為橫斷式設計，因此無法推論所觀察到的關聯之方向性。", "g": "這句是整篇最重要的方法學提醒：橫斷式研究只能說「兩者有關」，不能說「誰造成誰」。是假牙滿意度讓生活品質變好，還是生活品質好的人比較滿意假牙？這份資料分不出來。"}, {"en": "The third limitation was related to the study instrument.", "zh": "第三項限制與研究工具有關。"}, {"en": "Because no Chinese version of the GOHAI for Taiwanese had been validated when the study was performed, the original English version was translated by the researchers and was examined among a convenience sample of elderly subjects in Kaohsiung City for its construct validity and internal reliability.", "zh": "由於研究進行時尚無經過驗證的台灣中文版 GOHAI，研究者自行翻譯英文原版，並在高雄市長者的方便樣本中檢驗其建構效度與內部信度。", "g": "<em>had been validated</em> 是過去完成被動式：在「研究進行」這個過去時間點之前，就已經（沒有）被驗證過。時間有前後層次時，較早的那件事用 had + 過去分詞。"}, {"en": "Therefore, further studies may be required to determine whether this version can be applied to the elderly Taiwanese population.", "zh": "因此，可能仍需進一步研究來確認此版本能否適用於台灣長者族群。"}, {"en": "To enable the development of patient-oriented approaches in public health care and provide appropriate oral health care to elderly people wearing removable dentures, it is important to know which predictors actually affect the OHRQoL of elderly people.", "zh": "為了發展以病人為中心的公共衛生策略，並為配戴活動假牙的長者提供適當的口腔照護，了解哪些預測因子真正影響長者的口腔健康相關生活品質相當重要。"}, {"en": "Results of the hierarchical multiple regression showed that factors related to denture wearing were most strongly associated with OHRQoL, with denture satisfaction being the strongest predictor, and the number of remaining natural teeth was the second highest predictor.", "zh": "階層式多元迴歸結果顯示，與配戴假牙相關的因素和口腔健康相關生活品質關聯最強，其中假牙滿意度是最強的預測因子，剩餘天然牙數目則居第二。"}, {"en": "In addition, the OHRQoL of elderly people wearing removable dentures could also be predicted by education level, denture status, perceived loose denture, and presence of oral ulcer.", "zh": "此外，教育程度、假牙狀況、自覺假牙鬆脫與口腔潰瘍，也能預測配戴活動假牙長者的口腔健康相關生活品質。"}, {"en": "Thus, among the predictors analyzed in this study, denture satisfaction was the best predictor of OHRQoL of elderly people wearing removable dentures.", "zh": "因此，在本研究分析的預測因子中，假牙滿意度是配戴活動假牙長者口腔健康相關生活品質的最佳預測因子。"}, {"en": "The findings of this study suggested that high satisfaction with removable dentures was significantly related to a high GOHAI-T score, indicating a low level of impairment of OHRQoL.", "zh": "本研究發現，對活動假牙的高滿意度與較高的 GOHAI-T 分數顯著相關，代表口腔健康相關生活品質受損程度較低。"}, {"en": "This is in line with the findings of previous studies that showed a positive correlation between self-reported denture satisfaction and OHRQoL in the elderly.", "zh": "此結果與先前研究一致，該等研究顯示長者自陳的假牙滿意度與口腔健康相關生活品質呈正相關。", "g": "<em>in line with</em>（與……一致）是討論段比對前人研究的常用片語，同義的還有 <em>consistent with</em>、<em>in accordance with</em>。相反的是 <em>in contrast to</em>（與……相反）。"}, {"en": "In their 2-year longitudinal analysis, Stober et al. showed that elderly patients’ satisfaction with complete dentures was associated with OHRQoL, based on scores on the shortened version of the OHIP.", "zh": "Stober 等人在為期兩年的縱貫分析中，以簡短版 OHIP 分數顯示長者對全口假牙的滿意度與口腔健康相關生活品質有關。", "g": "<em>longitudinal</em>（縱貫）是追蹤同一批人一段時間，跟 <em>cross-sectional</em>（橫斷）只看一個時間點正好相對。縱貫研究才比較能談因果。"}, {"en": "Recently, Kuo et al. reported that patients’ satisfaction with complete dentures was significantly related to an improvement in their OHRQoL, as measured using the OHIP-14.", "zh": "近期 Kuo 等人以 OHIP-14 測量後指出，病人對全口假牙的滿意度與其口腔健康相關生活品質的改善顯著相關。"}, {"en": "In their cross-sectional analysis, Lee et al. showed that if the elderly are satisfied with their dentures, OHRQoL may be unaffected by oral health problems.", "zh": "Lee 等人的橫斷式分析顯示，若長者對自己的假牙感到滿意，口腔健康問題可能不會影響其口腔健康相關生活品質。"}, {"en": "A recent study described a positive correlation between professional ratings of removable denture quality and a low OHIP score, indicating a low level of impairment of OHRQoL.", "zh": "近期一項研究指出，專業人員對活動假牙品質的評分與較低的 OHIP 分數呈正相關，代表口腔健康相關生活品質受損較輕。"}, {"en": "However, a poorly fitting denture may be well tolerated in one person, while a well fitting denture may create problems for another.", "zh": "然而，同一副不密合的假牙，某些人可以適應良好，而密合良好的假牙卻可能造成另一個人的困擾。", "g": "<em>while</em> 在這裡不是「當……的時候」，而是「然而、相對地」，用來對比兩件事。這個用法在論文很常見，讀錯會整句誤解。"}, {"en": "Garrett et al. reported that 55% of 21 patients with poorly fitting dentures had moderate-to-complete denture satisfaction, as judged by examining dentists assessing the need for denture replacement.", "zh": "Garrett 等人指出，在二十一位假牙不密合的病人中，有 55% 對假牙的滿意度達中度至完全滿意；這是由評估是否需更換假牙的牙醫師判定的。"}, {"en": "Närhi et al. found a weak or statistically nonsignificant correlation between patients’ denture satisfaction and clinical measurements such as anatomic conditions, as well as denture quality.", "zh": "Närhi 等人發現，病人的假牙滿意度與解剖條件等臨床測量值及假牙品質之間，相關性微弱或未達統計顯著。"}, {"en": "Thus, denture satisfaction is not based on the technical quality of the dentures alone.", "zh": "因此，假牙滿意度並非僅取決於假牙的技術品質。", "g": "這句是整段的重點句（topic sentence 的結論版）。前面連舉三個研究，全都指向這一句。讀討論段時，找出這種「因此……」的句子，就抓到了作者真正想說的話。"}, {"en": "Moreover, Turker et al. suggested that although patients seek technical advice, psychological and emotional factors play an important role in their poor adaptation to the denture.", "zh": "再者，Turker 等人指出，儘管病人尋求的是技術上的建議，心理與情緒因素在其難以適應假牙上其實扮演重要角色。", "g": "<em>play an important role in</em>（在……扮演重要角色）是討論段的高頻片語，寫作時很好用，介系詞固定用 in。"}, {"en": "Another study showed that the dentist–patient relationship and psychological factors had a great impact on patients’ acceptance of and adaptation to removable dentures.", "zh": "另一項研究顯示，醫病關係與心理因素對病人接受並適應活動假牙有很大影響。", "g": "<em>acceptance of and adaptation to</em>——兩個名詞各配自己的介系詞（acceptance of / adaptation to），不能共用。這是英文寫作容易出錯的細節。"}, {"en": "Therefore, in addition to clinical and technical skills, gaining a better understanding of patient behavior and psychology, and improving communication, are crucial to improving patients’ denture satisfaction.", "zh": "因此，除了臨床與技術能力之外，更了解病人的行為與心理並改善溝通，對提升病人的假牙滿意度至關重要。", "g": "這句對口腔衛生師特別有意義：它把「溝通能力」寫進了專業建議裡。您日後寫討論或做衛教設計時，這是可以直接引用的立場。"}, {"en": "In the present study, subjects with a perceived loose denture gained significantly lower mean GOHAI-T scores, indicating a worse OHRQoL than those without a perceived loose denture.", "zh": "本研究中，自覺假牙鬆脫者的 GOHAI-T 平均分數顯著較低，代表其口腔健康相關生活品質比未自覺鬆脫者差。"}, {"en": "This result is in accordance with those of previous studies showing that denture loosening was a significant contributing factor to low OHRQoL.", "zh": "此結果與先前研究一致，該等研究顯示假牙鬆脫是造成口腔健康相關生活品質低落的重要因素。"}, {"en": "Moreover, Hassel et al. showed that improving retention of previously insufficiently retained dentures was positively associated with OHRQoL among removable denture wearers.", "zh": "再者，Hassel 等人顯示，改善原本固位不足的假牙之固位力，與活動假牙配戴者的口腔健康相關生活品質呈正相關。"}, {"en": "Hassel et al. further indicated that denture loosening affects many aspects of quality of life, both psychological and social.", "zh": "Hassel 等人進一步指出，假牙鬆脫會影響生活品質的許多面向，包括心理與社會層面。"}, {"en": "Komagamine et al. also reported that sufficient retention of lower dentures is important to improving OHRQoL in edentulous patients.", "zh": "Komagamine 等人也指出，下顎假牙有足夠的固位力，對改善無牙患者的口腔健康相關生活品質相當重要。"}, {"en": "Hence, it is necessary to identify and improve retention of previously insufficiently retained dentures in order to improve the OHRQoL of elderly persons wearing removable dentures.", "zh": "因此，找出並改善原本固位不足的假牙，是提升配戴活動假牙長者口腔健康相關生活品質的必要做法。"}, {"en": "Removable dentures can injure oral tissues, and their use is associated with a high frequency of oral mucosal lesions.", "zh": "活動假牙可能傷害口腔組織，其使用與口腔黏膜病灶的高發生率有關。"}, {"en": "In the present study, subjects who had had an oral ulcer were more likely to report a poorer OHRQoL than their counterparts without oral ulcer experiences.", "zh": "本研究中，曾有口腔潰瘍者比沒有此經驗者更容易回報較差的口腔健康相關生活品質。", "g": "<em>had had</em> 不是打錯字：前面的 had 是過去完成式的助動詞，後面的 had 是「有」。合起來就是「在那之前曾經有過」。<em>counterparts</em> 指的是「對照的另一群人」。"}, {"en": "This finding is consistent with the results of many previous studies showing that oral ulcers were associated with a poor OHRQoL.", "zh": "此發現與許多先前研究一致，該等研究顯示口腔潰瘍與較差的口腔健康相關生活品質有關。"}, {"en": "In a study evaluating the sensitivity of patient-centered outcome measures to treatment, McGrath et al. suggested that patients with ulcers and symptomatic oral mucosal lesions had poorer OHRQoL than their counterparts with non-symptomatic lesions.", "zh": "McGrath 等人在一項評估以病人為中心的成效指標對治療敏感度的研究中指出，有潰瘍及有症狀口腔黏膜病灶的病人，其口腔健康相關生活品質比無症狀者差。"}, {"en": "Recently, Suliman et al. showed that oral ulcerative lesions were significantly associated with oral impacts on daily performance, indicating poor quality of life.", "zh": "近期 Suliman 等人顯示，口腔潰瘍性病灶與日常生活表現受口腔影響顯著相關，代表生活品質較差。"}, {"en": "Moreover, Mandali et al. suggested that recall visits and shortened denture usage are essential for prevention of oral mucosal lesions.", "zh": "再者，Mandali 等人建議，定期回診與縮短假牙配戴時間，對預防口腔黏膜病灶至關重要。", "g": "<em>recall visit</em> 是牙科的「回診、定期召回」，不是「回想」。這是專業領域的特殊用法，一般字典查不太到，靠上下文和領域知識判斷。"}, {"en": "Therefore, to improve the OHRQoL of the elderly population, it is important to educate and regularly review patients who wear dentures with regard to oral tissue injuries.", "zh": "因此，若要改善長者族群的口腔健康相關生活品質，針對口腔組織傷害對假牙配戴者進行衛教並定期追蹤相當重要。"}, {"en": "Our results demonstrated that the number of remaining natural teeth was positively associated with OHRQoL; thus, the larger the number of remaining natural teeth, the lower the impact on the OHRQoL.", "zh": "本研究結果顯示，剩餘天然牙數目與口腔健康相關生活品質呈正相關；也就是說，剩餘天然牙越多，對生活品質的影響越小。", "g": "<em>the + 比較級, the + 比較級</em>（越……就越……）是很實用的句型：the larger the number, the lower the impact。中文的「越……越……」直接對應這個結構。"}, {"en": "Zaitsu et al. suggested that the number of missing teeth was significantly associated with low GOHAI scores, indicating a poor OHRQoL.", "zh": "Zaitsu 等人指出，缺牙數目與較低的 GOHAI 分數顯著相關，代表口腔健康相關生活品質較差。"}, {"en": "In their meta-analysis, Gerritsen et al. showed that tooth loss is associated with impairment of OHRQoL, and this association seems to be independent of the assessment instrument used and the context of the included samples.", "zh": "Gerritsen 等人的統合分析顯示，缺牙與口腔健康相關生活品質受損有關，且此關聯似乎不受所用評估工具與樣本背景影響。", "g": "<em>meta-analysis</em>（統合分析）是把很多篇研究的數據合併起來重新分析，證據等級比單一研究高。查文獻時看到 meta-analysis 或 systematic review，優先讀。"}, {"en": "Moreover, Jain et al. indicated that a decrease in the number of remaining natural teeth was correlated with poor OHRQoL, independent of the effect of age and gender.", "zh": "再者，Jain 等人指出，剩餘天然牙數目減少與較差的口腔健康相關生活品質相關，且不受年齡與性別影響。"}, {"en": "Our study also showed that denture status was a predictor of OHRQoL, and that removable partial denture (RPD) wearers experienced a more adverse impact on their OHRQoL than did complete denture wearers.", "zh": "本研究也顯示假牙狀況是口腔健康相關生活品質的預測因子，且活動局部假牙（RPD）配戴者所受的負面影響大於全口假牙配戴者。"}, {"en": "Another study found that RPD users experienced impaired OHRQoL more often than did CD users.", "zh": "另一項研究發現，活動局部假牙使用者出現生活品質受損的情形，比全口假牙使用者更常見。"}, {"en": "In addition, Wong et al. reported that in a sample of community-dwelling elderly Chinese people, those who wore RPD experienced a greater OHRQoL impairment than did CD wearers.", "zh": "此外，Wong 等人指出，在社區居住的華人長者樣本中，配戴活動局部假牙者的生活品質受損程度大於全口假牙配戴者。"}, {"en": "These findings probably result from the unrealistic expectations of the wearers from their dentures; that is, RPD wearers tend to compare their dentures with natural teeth.", "zh": "這些發現可能源自配戴者對假牙的不切實際期待，也就是說，活動局部假牙的配戴者傾向拿假牙和天然牙相比。", "g": "<em>result from</em>（源自、起因於）與 <em>result in</em>（導致）方向完全相反，只差一個介系詞。這組是很多人會弄反的地方，寫的時候要特別小心。"}, {"en": "In contrast, researchers have shown that CD wearers have usually previously used RPD and might accept the lack of teeth and oral discomfort as a part of the aging process.", "zh": "相對地，研究顯示全口假牙配戴者通常先前就用過活動局部假牙，可能已把缺牙與口腔不適視為老化過程的一部分。"}, {"en": "Thus, CD wearers might be more accepting of the limitations of denture functions than RPD wearers are.", "zh": "因此，全口假牙配戴者對假牙功能限制的接受度，可能高於活動局部假牙配戴者。"}, {"en": "In our study, educational level had a significant influence on GOHAI-T scores.", "zh": "本研究中，教育程度對 GOHAI-T 分數有顯著影響。"}, {"en": "Subjects with a higher education level were more likely to have poorer OHRQoL, indicating more perceived dental problems in this group than in those with an education level lower than high school.", "zh": "教育程度較高者的口腔健康相關生活品質反而較差，代表這群人自覺的口腔問題比高中以下學歷者更多。", "g": "這是一個反直覺的結果，作者接下來連用兩段解釋它。討論段的價值就在這裡：不是重述結果，而是回答「為什麼會這樣」。"}, {"en": "A possible explanation for this trend may be related to a person’s expectations.", "zh": "此一趨勢的可能解釋，或許與個人的期待有關。", "g": "<em>A possible explanation ... may be ...</em>——一句話裡放了 possible 和 may 兩層保留。學術英文在提出解釋時刻意講得很保守，因為那只是推測，不是證據。"}, {"en": "Subjects with a lower level of education may have lower standards or expectations in their evaluation of health satisfaction or life satisfaction and, accordingly, be more likely to be satisfied than those who are more highly educated.", "zh": "教育程度較低者在評估健康或生活滿意度時，標準或期待可能較低，因而比高學歷者更容易感到滿意。"}, {"en": "Another possible reason is that subjects with a higher education level may be more concerned about problems with oral health and esthetics than those with a lower education level.", "zh": "另一個可能原因是，高學歷者可能比低學歷者更在意口腔健康與美觀方面的問題。"}, {"en": "Therefore, those with a lower education level and lower expectations may report higher GOHAI-T scores, indicating a better OHRQoL.", "zh": "因此，教育程度較低、期待也較低者，可能回報較高的 GOHAI-T 分數，代表較佳的口腔健康相關生活品質。"}, {"en": "Compared to other international literature dealing with OHRQoL in the elderly, we found lower GOHAI-T values in this study.", "zh": "與其他探討長者口腔健康相關生活品質的國際文獻相比，本研究的 GOHAI-T 數值較低。"}, {"en": "One possible reason for this is that the subjects in this study were elderly individuals wearing removable dentures.", "zh": "可能原因之一是本研究的受試者全都是配戴活動假牙的長者。"}, {"en": "Hogenius et al. showed that compared to people with natural teeth, those who wear removable dentures experience more significant negative impacts on social and emotional aspects of life.", "zh": "Hogenius 等人顯示，與擁有天然牙者相比，配戴活動假牙者在生活的社交與情緒層面受到更明顯的負面影響。"}, {"en": "Another possible reason may be that the subjects in this study were sourced from the Government Senior Citizens’ Service Center in Taiwan.", "zh": "另一個可能原因是，本研究的受試者來自台灣的政府長青服務中心。"}, {"en": "Elderly people attending this center tend to have a higher education level and better socioeconomic status.", "zh": "會來這個中心的長者，教育程度與社經地位往往較高。"}, {"en": "Subjects with a higher level of education may have higher expectations relating to their oral health satisfaction and, accordingly, be more likely to have lower GOHAI-T values.", "zh": "教育程度較高者對口腔健康滿意度的期待可能較高，因而更容易出現較低的 GOHAI-T 數值。"}, {"en": "The present study was performed in 2009, at which time the GOHAI had not yet been translated for use in Taiwan.", "zh": "本研究於 2009 年執行，當時 GOHAI 尚未翻譯成可供台灣使用的版本。"}, {"en": "A Chinese version of the GOHAI for older people living in Hong Kong and southern China was developed in 2002.", "zh": "供香港與華南地區長者使用的中文版 GOHAI 已於 2002 年發展完成。"}, {"en": "Though the Taiwanese language is influenced by Chinese culture, there are a number of differences between the spoken and written Chinese of Hong Kong and that of Taiwan, so the wording of the questions in the Chinese version of the GOHAI could confuse elderly Taiwanese individuals.", "zh": "雖然台灣的語言深受中華文化影響，但香港與台灣在口語及書面中文上仍有不少差異，因此中文版 GOHAI 的題目用詞可能會讓台灣長者感到困惑。", "g": "<em>that of Taiwan</em> 裡的 that 是為了避免重複 “the spoken and written Chinese”。英文很討厭重複，會用 that / those 代替前面提過的名詞。讀到 that 要回頭找它指誰。"}, {"en": "Therefore, in the current study, we did not use the Chinese version of the GOHAI for assessing OHRQoL measures.", "zh": "因此，本研究並未採用該中文版 GOHAI 來評估口腔健康相關生活品質。"}, {"en": "Instead, a Chinese version of the GOHAI for use with Taiwanese people specifically (GOHAI-T) was developed.", "zh": "取而代之的是，研究者發展了專供台灣民眾使用的中文版 GOHAI（GOHAI-T）。"}, {"en": "A strength of the current study was that we simultaneously controlled both for factors related to denture wearing and for relevant influencing factors mentioned in previous similar studies.", "zh": "本研究的優點在於同時控制了與配戴假牙相關的因素，以及先前類似研究中提到的相關影響因素。", "g": "<em>A strength of the current study was that...</em>——講完限制之後講優點，是討論段常見的平衡寫法。您寫論文時兩邊都要有，只講優點會顯得不誠實。"}, {"en": "In the final model, the overall explanatory power was 0.533.", "zh": "最終模型的整體解釋力為 0.533。"}, {"en": "The present findings confirmed that factors related to denture wearing were most strongly associated with OHRQoL, with denture satisfaction being the strongest predictor.", "zh": "本研究結果證實，與配戴假牙相關的因素和口腔健康相關生活品質的關聯最強，其中假牙滿意度是最強的預測因子。"}, {"en": "Therefore, in clinical practice, denture satisfaction is a useful tool to evaluate the effect of denture treatment on OHRQoL.", "zh": "因此，在臨床實務上，假牙滿意度是評估假牙治療對口腔健康相關生活品質影響的實用工具。"}, {"en": "However, a weakness of the study was that the nature of the causality in which denture satisfaction is used to predict OHRQoL was still unclear due to the cross-sectional design.", "zh": "然而，本研究的弱點在於，由於採橫斷式設計，以假牙滿意度預測口腔健康相關生活品質的因果性質仍不明確。", "g": "<em>causality</em>（因果關係）與 <em>correlation</em>（相關）是完全不同的兩件事。這篇從頭到尾守住這條線：只說相關，不說因果。這是您做問卷研究時最該學起來的一課。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "In conclusion, of the factors analyzed in this study, those related to denture wearing were most strongly associated with OHRQoL, and denture satisfaction was the strongest predictor among them.", "zh": "總結而言，在本研究分析的各項因素中，與配戴假牙相關的因素和口腔健康相關生活品質的關聯最強，其中又以假牙滿意度為最強的預測因子。", "g": "<em>In conclusion</em>（總結而言）是收尾的標準信號詞，同義的還有 <em>To sum up</em>、<em>Overall</em>。上台報告最後一張投影片就可以用這句開頭。"}, {"en": "It is suggested that denture satisfaction is useful as a tool for assessing the effect of denture treatment on the OHRQoL of elderly individuals wearing removable dentures.", "zh": "研究建議，假牙滿意度可作為評估假牙治療對配戴活動假牙長者口腔健康相關生活品質影響的工具。", "g": "<em>It is suggested that...</em> 又是被動，而且連「誰建議的」都不講。這是學術英文最保守的表達方式：把主張說出來，但不把自己擺在前面。"}]}], "mesh": [["Aged", "老年人（65 歲以上）", "PubMed 為每篇論文貼上的主題標籤。Aged 指 65 歲以上的受試者。"], ["Aged, 80 and over", "80 歲以上長者", "樣本中若含 80 歲以上者會另外標記。本研究平均年齡 76.8 歲。"], ["Attitude to Health", "健康態度", "受試者對自身健康的看法與態度，本研究的「自覺」項目屬於這一類。"], ["Cross-Sectional Studies", "橫斷式研究", "在單一時間點蒐集資料的研究設計。只能看關聯，不能下因果結論。"], ["Deglutition / physiology", "吞嚥／生理學", "Deglutition 是 swallowing 的醫學用語。斜線後面是子標題，表示從生理角度切入。"], ["Dental Care / statistics & numerical data", "牙科照護／統計數據", "對應本研究的「牙科醫療服務使用情形」。"], ["Denture Retention / psychology", "假牙固位／心理層面", "Retention 是假牙的固位力；子標題 psychology 表示探討的是心理感受，不是力學測量。"], ["Denture, Complete / psychology", "全口假牙／心理層面", "星號代表這是本篇的主要主題（major topic）。"], ["Denture, Partial, Removable / psychology", "活動局部假牙／心理層面", "MeSH 的寫法是「大類, 次類, 修飾語」，倒著讀才順：removable partial denture。"], ["Educational Status", "教育程度", "本研究發現教育程度會顯著影響 GOHAI-T 分數。"], ["Facial Pain / psychology", "顏面疼痛／心理層面", "對應本研究的「自覺口腔疼痛」。"], /* ---------- render ---------- */
/* Panels are rendered up front and shown/hidden with a class.
   Removing a block element from inline flow makes WebKit drop the
   collapsed space that follows it, so the DOM must never change here. */
function panelHtml(st){
  return '<div class="tr"><span class="lab">\u4e2d\u8b6f</span>'+st.zh+
    (st.g?'<div class="gnote"><span class="lab">\u53e5\u578b\u00b7\u6587\u6cd5</span>'+st.g+'</div>':'')+'</div>';
}
function tableHtml(t,ti){
  var h='<div class="tblblock"><div class="tblhead"><span class="tblname">'+esc(t.no)+
        ' \u00b7 '+esc(t.zh)+'</span>'+
        '<button class="tblbtn" data-tbl="'+ti+'">Show table \u986f\u793a\u8868\u683c</button></div>'+
        '<div class="tblbody" hidden><p class="tblcap">'+esc(t.title)+'</p><div class="tblwrap'+(t.wrap?' text':'')+'"><table>';
  h+='<thead>';
  t.head.forEach(function(row){
    h+='<tr>';
    row.forEach(function(c){
      if(Array.isArray(c)) h+='<th colspan="'+c[1]+'">'+esc(c[0])+'</th>';
      else h+='<th>'+esc(c)+'</th>';
    });
    h+='</tr>';
  });
  h+='</thead><tbody>';
  var ncol=t.head[t.head.length-1].length;
  t.rows.forEach(function(r){
    if(r.length===1&&r[0].indexOf('**')===0){
      h+='<tr class="grp"><td colspan="'+ncol+'">'+esc(r[0].slice(2))+'</td></tr>';
    }else{
      h+='<tr>';
      for(var i=0;i<ncol;i++) h+='<td>'+esc(r[i]!==undefined?r[i]:'')+'</td>';
      h+='</tr>';
    }
  });
  h+='</tbody></table></div>';
  if(t.note) h+='<p class="tblnote">'+t.note+'</p>';
  return h+'</div></div>';
}
function secHtml(sec,si,which){
  var h='<h2 class="sec">'+esc(sec.h)+' <span class="zh">'+sec.zh+'</span></h2><div class="para">';
  sec.s.forEach(function(st,ti){
    h+='<span class="sent" role="button" tabindex="0" data-w="'+which+'" data-s="'+si+'" data-t="'+ti+'">'+
       esc(st.en)+'</span>'+panelHtml(st)+' ';
  });
  h+='</div>';
  (sec.tables||[]).forEach(function(t){ h+=tableHtml(t,TBL.push(t)-1); });
  return h;
}

function render(i){
  cur=i;
  var p=P();
  TBL=[];
  VOCAB={};
  if(p.vocab){
    for(var k in p.vocab) VOCAB[k]=p.vocab[k];
    var ART=/^(a|an|the)\s+/i, add={};
    for(var k2 in VOCAB){ if(ART.test(k2)){ var bare=k2.replace(ART,''); if(bare&&!(bare in VOCAB)&&!(bare in add)) add[bare]=VOCAB[k2]; } }
    for(var b in add) VOCAB[b]=add[b];
  }
  TERMS=Object.keys(VOCAB).sort(function(a,b){return b.length-a.length;});

  document.getElementById('barTitle').innerHTML='<b>'+p.no+'</b> &nbsp;'+esc(p.short);
  document.getElementById('kicker').textContent=p.no+' · '+p.part;
  document.getElementById('pTitle').innerHTML= p.titleZh
    ? '<span class="sent" role="button" tabindex="0" data-w="title" data-s="0" data-t="0">'+esc(p.title)+'</span>'+
      panelHtml({zh:p.titleZh,g:p.titleG})
    : esc(p.title);
  document.getElementById('pCite').innerHTML=
    '<b>'+esc(p.authors)+'</b><br>'+esc(p.journal)+' · doi:'+esc(p.doi)+
    '<span class="lic">'+esc(p.lic)+'</span>';

  var html='';
  (p.abstract||[]).forEach(function(sec,si){ html+=secHtml(sec,si,'a'); });
  document.getElementById('body').innerHTML=html;

  var ftEl=document.getElementById('ftBody');
  if(p.fulltext&&p.fulltext.length){
    var f='<div class="bigrule"><span class="lbl">FULL TEXT · 全文</span></div>';
    p.fulltext.forEach(function(sec,si){ f+=secHtml(sec,si,'f'); });
    if(p.mesh&&p.mesh.length){
      f+='<h2 class="sec">MeSH terms <span class="zh">PubMed 主題詞</span></h2>'+
         '<p class="meshnote">PubMed 為每篇論文貼上的標準主題標籤。用這些詞去搜尋，比自己拼關鍵字準得多。點任一標籤看說明。</p><div class="mesh">';
      p.mesh.forEach(function(m,mi){
        f+='<span class="mterm" role="button" tabindex="0" data-mi="'+mi+'">'+esc(m[0])+'</span>';
      });
      f+='</div>';
    }
    ftEl.innerHTML=f;
    document.getElementById('ftBar').hidden=false;
  }else{
    ftEl.innerHTML='';
    document.getElementById('ftBar').hidden=true;
  }
  ftOpen=false; ftEl.hidden=true;
  var fb=document.getElementById('ftBtn');
  fb.classList.remove('on'); fb.textContent='Continue to the full text';

  document.getElementById('foot').innerHTML=
    '<span class="strong">InkQuest Reading Room · annotated research reading.</span> '+
    'Source text: '+esc(p.authors)+'. <em>'+esc(p.title)+'</em> '+esc(p.journal)+'. '+esc(p.lic)+
    '<br>Translation, glossary and grammar notes are original InkQuest teaching material. '+
    '<span class="strong han">僅供教學使用。</span>';

  linkify(); buildWordbank(); markToc(); doSearch();
  allOpen=false;
  window.scrollTo(0,0);
}

/* ---------- glossary ---------- */
function isWordChar(c){return (c>='a'&&c<='z')||(c>='A'&&c<='Z')||(c>='0'&&c<='9');}
function ciFind(text,term){
  var lt=text.toLowerCase(), lterm=term.toLowerCase(), idx=lt.indexOf(lterm);
  while(idx!==-1){
    var b=idx>0?text.charAt(idx-1):'', a=(idx+term.length<text.length)?text.charAt(idx+term.length):'';
    if(!isWordChar(b)&&!isWordChar(a)) return idx;
    idx=lt.indexOf(lterm,idx+1);
  }
  return -1;
}
function sig(e){return e[2]+'|'+e[1];}
function processTextNode(node){
  var text=node.nodeValue; if(!text||!/[A-Za-z]/.test(text)) return;
  var bestIdx=-1,bestTerm=null;
  for(var i=0;i<TERMS.length;i++){
    var t=TERMS[i];
    if(USED[sig(VOCAB[t])]) continue;
    var idx=ciFind(text,t); if(idx===-1) continue;
    if(bestIdx===-1||idx<bestIdx||(idx===bestIdx&&t.length>bestTerm.length)){bestIdx=idx;bestTerm=t;}
  }
  if(bestTerm===null) return;
  var e=VOCAB[bestTerm]; USED[sig(e)]=1;
  var m=text.substr(bestIdx,bestTerm.length);
  var pre=text.slice(0,bestIdx), post=text.slice(bestIdx+bestTerm.length);
  var btn=document.createElement('span');
  btn.className='gl'; btn.setAttribute('role','button'); btn.setAttribute('tabindex','0');
  btn.setAttribute('data-gt',e[2]); btn.setAttribute('data-gw',m);
  btn.setAttribute('data-gz',e[1]); btn.setAttribute('data-gd',e[0]); btn.setAttribute('data-gl',e[3]||'');
  btn.setAttribute('aria-expanded','false'); btn.textContent=m;
  var par=node.parentNode;
  if(pre) par.insertBefore(document.createTextNode(pre),node);
  par.insertBefore(btn,node);
  var pn=document.createTextNode(post); par.insertBefore(pn,node); par.removeChild(node);
  processTextNode(pn);
}
function linkify(){
  USED={};
  if(!TERMS.length) return;
  Array.prototype.forEach.call(document.querySelectorAll('#body .sent, #ftBody .sent'),function(s){
    var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null,false), ns=[], n;
    while((n=w.nextNode())) ns.push(n);
    for(var i=0;i<ns.length;i++){ if(ns[i].parentNode) processTextNode(ns[i]); }
  });
}

/* ---------- sentence panels ---------- */
function panelOf(el){
  var n=el.nextElementSibling;
  return (n&&n.classList.contains('tr'))?n:null;
}
function toggleSent(el,force){
  var p=panelOf(el); if(!p) return false;
  var want=(force===undefined)?!p.classList.contains('show'):force;
  p.classList.toggle('show',want);
  el.classList.toggle('open',want);
  return want;
}
function visibleSents(){
  var sel='#pTitle .sent, #body .sent';
  if(ftOpen) sel+=', #ftBody .sent';
  return document.querySelectorAll(sel);
}
function setAll(open){
  Array.prototype.forEach.call(visibleSents(),function(s){ toggleSent(s,open); });
  allOpen=open;
}

/* ---------- popup ---------- */
var pop=document.getElementById('pop');
var pT=document.getElementById('pop-tag'),pH=document.getElementById('pop-h'),
    pZ=document.getElementById('pop-zh'),pD=document.getElementById('pop-d'),
    pLv=document.getElementById('pop-lvl'),pArr=document.getElementById('pop-arrow');
var LABEL={v:"Word 單字",p:"Phrase 片語",c:"Grammar 文法",f:"Research term 研究術語",m:"MeSH term 主題詞"};
var openBtn=null;
function closePop(){ pop.classList.remove('show'); if(openBtn){openBtn.setAttribute('aria-expanded','false');openBtn=null;} }
function showPop(btn,t,head,zh,def,lvl){
  pT.className='tag '+t; pT.textContent=LABEL[t]||'';
  pH.textContent=head; pZ.textContent=zh; pD.textContent=def;
  pLv.textContent=lvl?('CEFR '+lvl):'';
  pop.classList.add('show');
  if(window.matchMedia('(max-width:600px)').matches){ pArr.style.display='none'; }
  else{
    pArr.style.display='block';
    var r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,
        sx=window.scrollX,sy=window.scrollY,vw=document.documentElement.clientWidth;
    var left=sx+r.left+r.width/2-pw/2; left=Math.max(sx+10,Math.min(left,sx+vw-pw-10));
    var top=sy+r.bottom+12, below=true;
    if(r.bottom+12+ph>window.innerHeight&&r.top-12-ph>0){ top=sy+r.top-ph-12; below=false; }
    pop.style.left=left+'px'; pop.style.top=top+'px';
    var ax=sx+r.left+r.width/2-left-7; ax=Math.max(12,Math.min(ax,pw-26));
    pArr.style.left=ax+'px'; pArr.style.top=below?'-7px':(ph-7)+'px';
  }
  btn.setAttribute('aria-expanded','true'); openBtn=btn;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var g=e.target.closest?e.target.closest('.gl'):null;
  if(g){ e.stopPropagation();
    if(openBtn===g){closePop();}
    else{closePop();showPop(g,g.getAttribute('data-gt'),g.getAttribute('data-gw'),
         g.getAttribute('data-gz'),g.getAttribute('data-gd'),g.getAttribute('data-gl'));}
    return; }
  var m=e.target.closest?e.target.closest('.mterm'):null;
  if(m){ e.stopPropagation();
    var d=P().mesh[+m.getAttribute('data-mi')];
    if(openBtn===m){closePop();} else {closePop();showPop(m,'m',d[0],d[1],d[2],'');}
    return; }
  var tb=e.target.closest?e.target.closest('.tblbtn'):null;
  if(tb){ e.stopPropagation();
    var body=tb.parentNode.nextElementSibling, show=body.hidden;
    body.hidden=!show;
    tb.classList.toggle('on',show);
    tb.textContent=show?'Hide table \u6536\u8d77\u8868\u683c':'Show table \u986f\u793a\u8868\u683c';
    return; }
  if(pop.classList.contains('show')&&!pop.contains(e.target)){ closePop(); return; }
  var s=e.target.closest?e.target.closest('.sent'):null;
  if(s){ toggleSent(s); return; }
});
document.getElementById('popclose').addEventListener('click',function(e){e.stopPropagation();closePop();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closePop(); closeDrawer(); return; }
  if(e.key==='Enter'||e.key===' '){
    var t=e.target;
    if(t.classList&&t.classList.contains('gl')){ e.preventDefault();
      if(openBtn===t){closePop();} else {closePop();showPop(t,t.getAttribute('data-gt'),t.getAttribute('data-gw'),
        t.getAttribute('data-gz'),t.getAttribute('data-gd'),t.getAttribute('data-gl'));} }
    else if(t.classList&&t.classList.contains('mterm')){ e.preventDefault();
      var d=P().mesh[+t.getAttribute('data-mi')];
      if(openBtn===t){closePop();} else {closePop();showPop(t,'m',d[0],d[1],d[2],'');} }
    else if(t.classList&&t.classList.contains('sent')){ e.preventDefault(); toggleSent(t); }
  }
});
window.addEventListener('resize',closePop);
document.getElementById('openAllBtn').onclick=function(){ setAll(true); closeDrawer(); };
document.getElementById('closeAllBtn').onclick=function(){ setAll(false); closeDrawer(); };
document.getElementById('ftBtn').onclick=function(){ setFullText(!ftOpen); };

function setFullText(open){
  ftOpen=open;
  var el=document.getElementById('ftBody'), b=document.getElementById('ftBtn');
  el.hidden=!open;
  b.classList.toggle('on',open);
  b.textContent=open?'Hide the full text':'Continue to the full text';
  if(!open){
    Array.prototype.forEach.call(document.querySelectorAll('#ftBody .sent.open'),
      function(s){toggleSent(s,false);});
  }
  doSearch();
}

/* ---------- drawer ---------- */
var drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function openDrawer(p){
  drawer.classList.add('open'); scrim.classList.add('show');
  if(p){ document.querySelector('.tab[data-pane="'+p+'"]').click(); }
}
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('show'); }
document.getElementById('menuBtn').onclick=function(){ openDrawer('toc'); };
document.getElementById('searchBtn').onclick=function(){ openDrawer('search'); setTimeout(function(){document.getElementById('q').focus();},260); };
scrim.onclick=closeDrawer;
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    document.getElementById('pane-'+t.getAttribute('data-pane')).classList.add('on');
  };
});

function buildToc(){
  var html='';
  PAPERS.forEach(function(p,i){
    html+='<button class="tocitem'+(p.done?'':' todo')+'" data-i="'+i+'"'+(p.done?'':' disabled')+'>'+
      '<em>'+p.no+' · '+p.part+(p.done?'':' · 尚未製作')+'</em>'+esc(p.short)+
      '<span class="meta">'+esc(p.journal)+'<br>'+p.why+'</span></button>';
  });
  document.getElementById('pane-toc').innerHTML=html;
  document.querySelectorAll('.tocitem:not(.todo)').forEach(function(b){
    b.onclick=function(){ render(+b.getAttribute('data-i')); closeDrawer(); };
  });
}
function markToc(){
  document.querySelectorAll('.tocitem[data-i]').forEach(function(b){
    b.classList.toggle('cur',+b.getAttribute('data-i')===cur);
  });
}

/* ---------- search ---------- */
function ctx(text,pos,len){
  var a=Math.max(0,pos-38), b=Math.min(text.length,pos+len+46);
  return (a>0?'…':'')+esc(text.slice(a,pos))+'<b>'+esc(text.slice(pos,pos+len))+'</b>'+
         esc(text.slice(pos+len,b))+(b<text.length?'…':'');
}
function doSearch(){
  var q=document.getElementById('q').value.trim();
  var box=document.getElementById('hits'), note=document.getElementById('qnote');
  clearFlash();
  if(q.length<2){ box.innerHTML=''; note.textContent='Type at least two letters. 中英文都可以搜尋。'; return; }
  var lq=q.toLowerCase(), out='', n=0, p=P();
  function scan(list,which,label){
    (list||[]).forEach(function(sec,si){
      sec.s.forEach(function(st,ti){
        var hay=[[st.en,'en'],[st.zh,'zh'],[st.g||'','g']];
        for(var h=0;h<hay.length;h++){
          var txt=hay[h][0].replace(/<[^>]+>/g,''), pos=txt.toLowerCase().indexOf(lq);
          if(pos!==-1){
            n++;
            out+='<button class="hitrow" data-w="'+which+'" data-s="'+si+'" data-t="'+ti+'">'+
                 '<span class="hr-ch">'+esc(label)+' · '+esc(sec.h)+'</span>'+
                 '<span class="hr-sn">'+ctx(txt,pos,q.length)+'</span></button>';
            break;
          }
        }
      });
    });
  }
  if(p.titleZh){
    var tt=[p.title,p.titleZh,p.titleG||''];
    for(var i=0;i<tt.length;i++){
      var t2=tt[i].replace(/<[^>]+>/g,''), pz=t2.toLowerCase().indexOf(lq);
      if(pz!==-1){ n++; out+='<button class="hitrow" data-w="title" data-s="0" data-t="0">'+
        '<span class="hr-ch">Title · 標題</span><span class="hr-sn">'+ctx(t2,pz,q.length)+'</span></button>'; break; }
    }
  }
  scan(p.abstract,'a','Abstract');
  scan(p.fulltext,'f','Full text');
  note.textContent = n ? (n+' result'+(n===1?'':'s')+' 筆結果') : 'Nothing found 找不到';
  box.innerHTML=out;
  box.querySelectorAll('.hitrow').forEach(function(b){
    b.onclick=function(){ jumpTo(b.getAttribute('data-w'),b.getAttribute('data-s'),b.getAttribute('data-t')); };
  });
}
function clearFlash(){ document.querySelectorAll('.sent.flash').forEach(function(s){s.classList.remove('flash');}); }
function jumpTo(w,si,ti){
  if(w==='f'&&!ftOpen) setFullText(true);
  closeDrawer(); clearFlash();
  var root = w==='title' ? '#pTitle' : (w==='f'?'#ftBody':'#body');
  var el=document.querySelector(root+' .sent[data-s="'+si+'"][data-t="'+ti+'"]');
  if(!el) return;
  el.classList.add('flash');
  el.scrollIntoView({block:'center'});
  toggleSent(el,true);
}
document.getElementById('q').addEventListener('input',doSearch);

/* ---------- word bank ---------- */
function buildWordbank(){
  var GROUPS=[["v","Words","單字"],["p","Phrases","片語"],["c","Grammar","文法"],["f","Research terms","研究術語"]];
  var src=P().vocab||{}, seen={}, byType={v:[],p:[],c:[],f:[]};
  for(var k in src){
    var e=src[k], s2=e[2]+'|'+e[1];
    if(seen[s2]) continue; seen[s2]=1;
    byType[e[2]].push([k,e]);
  }
  var html='';
  GROUPS.forEach(function(G){
    var items=byType[G[0]]; if(!items.length) return;
    items.sort(function(a,b){return a[0].toLowerCase().localeCompare(b[0].toLowerCase());});
    html+='<div class="wbhead '+G[0]+'"><span class="pip"></span>'+G[1]+
          ' <span style="font-family:var(--han);font-weight:600">'+G[2]+'</span>'+
          '<span class="n">'+items.length+'</span></div>';
    items.forEach(function(it){
      html+='<div class="wb"><span class="t">'+esc(it[0])+'</span> · <span class="z">'+it[1][1]+
            '</span><span class="x">'+esc(it[1][0])+'</span></div>';
    });
  });
  document.getElementById('pane-words').innerHTML=html||'<p class="qnote">No word bank for this paper yet.</p>';
}

document.querySelectorAll('#sizes button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#sizes button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.documentElement.style.setProperty('--fs',b.getAttribute('data-size')+'px');
  };
});

buildToc();
render(0);
</script>
