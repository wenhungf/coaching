此，在臨床實務上，假牙滿意度是評估假牙治療對口腔健康相關生活品質影響的實用工具。"}, {"en": "However, a weakness of the study was that the nature of the causality in which denture satisfaction is used to predict OHRQoL was still unclear due to the cross-sectional design.", "zh": "然而，本研究的弱點在於，由於採橫斷式設計，以假牙滿意度預測口腔健康相關生活品質的因果性質仍不明確。", "g": "<em>causality</em>（因果關係）與 <em>correlation</em>（相關）是完全不同的兩件事。這篇從頭到尾守住這條線：只說相關，不說因果。這是做問卷研究時最該學起來的一課。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "In conclusion, of the factors analyzed in this study, those related to denture wearing were most strongly associated with OHRQoL, and denture satisfaction was the strongest predictor among them.", "zh": "總結而言，在本研究分析的各項因素中，與配戴假牙相關的因素和口腔健康相關生活品質的關聯最強，其中又以假牙滿意度為最強的預測因子。", "g": "<em>In conclusion</em>（總結而言）是收尾的標準信號詞，同義的還有 <em>To sum up</em>、<em>Overall</em>。上台報告最後一張投影片就可以用這句開頭。"}, {"en": "It is suggested that denture satisfaction is useful as a tool for assessing the effect of denture treatment on the OHRQoL of elderly individuals wearing removable dentures.", "zh": "研究建議，假牙滿意度可作為評估假牙治療對配戴活動假牙長者口腔健康相關生活品質影響的工具。", "g": "<em>It is suggested that...</em> 又是被動，而且連「誰建議的」都不講。這是學術英文最保守的表達方式：把主張說出來，但不把自己擺在前面。"}]}], "mesh": [["Aged", "老年人（65 歲以上）", "PubMed 為每篇論文貼上的主題標籤。Aged 指 65 歲以上的受試者。"], ["Aged, 80 and over", "80 歲以上長者", "樣本中若含 80 歲以上者會另外標記。本研究平均年齡 76.8 歲。"], ["Attitude to Health", "健康態度", "受試者對自身健康的看法與態度，本研究的「自覺」項目屬於這一類。"], ["Cross-Sectional Studies", "橫斷式研究", "在單一時間點蒐集資料的研究設計。只能看關聯，不能下因果結論。"], ["Deglutition / physiology", "吞嚥／生理學", "Deglutition 是 swallowing 的醫學用語。斜線後面是子標題，表示從生理角度切入。"], ["Dental Care / statistics & numerical data", "牙科照護／統計數據", "對應本研究的「牙科醫療服務使用情形」。"], ["Denture Retention / psychology", "假牙固位／心理層面", "Retention 是假牙的固位力；子標題 psychology 表示探討的是心理感受，不是力學測量。"], ["Denture, Complete / psychology*", "全口假牙／心理層面", "星號代表這是本篇的主要主題（major topic）。注意星號打在 psychology 上，表示重點是心理層面，不是假牙本身的技術問題。"], ["Denture, Partial, Removable / psychology*", "活動局部假牙／心理層面", "MeSH 的寫法是「大類, 次類, 修飾語」，倒著讀才順：removable partial denture。"], ["Educational Status", "教育程度", "本研究發現教育程度會顯著影響 GOHAI-T 分數。"], ["Facial Pain / psychology", "顏面疼痛／心理層面", "對應本研究的「自覺口腔疼痛」。"], ["Female", "女性", "性別標籤。論文只要有女性受試者就會標記。"], ["Geriatric Assessment", "老年評估", "針對長者的整體功能評估，GOHAI 屬於這一類工具。"], ["Halitosis / psychology", "口臭／心理層面", "對應本研究的「自覺口臭」。"], ["Humans", "人類", "表示這是人體研究，不是動物或細胞實驗。查 PubMed 時很常用來過濾。"], ["Interpersonal Relations", "人際關係", "對應 GOHAI 中「因口腔問題而避免社交」的題目。"], ["Male", "男性", "性別標籤。"], ["Mastication / physiology", "咀嚼／生理學", "咀嚼功能，本研究以自覺咀嚼能力測量。"], ["Oral Health*", "口腔健康", "本篇的主要主題之一（帶星號）。"], ["Oral Ulcer / psychology", "口腔潰瘍／心理層面", "對應本研究的「自覺口腔潰瘍」。"], ["Patient Satisfaction", "病人滿意度", "本研究的核心變項：假牙滿意度。"], ["Quality of Life*", "生活品質", "本篇的主要主題之一（帶星號）。搜尋文獻時這是最關鍵的一個詞。"], ["Self Concept", "自我概念", "對應 GOHAI 中「因口腔問題而在意自己形象」的題目。"], ["Social Class", "社會階層", "社經地位，本研究以教育程度與生活費負擔能力測量。"], ["Speech / physiology", "言語／生理學", "說話功能，GOHAI 物理功能面向的一部分。"], ["Taiwan", "台灣", "地理標籤。搜尋台灣本土研究時可以直接加這個詞。"], ["Xerostomia / psychology", "口乾症／心理層面", "Xerostomia 是 dry mouth 的醫學用語。"]], "vocab": {"removable dentures": ["dentures the wearer can take out and put back — not fixed in the mouth", "活動假牙（可自行取下佩戴）", "v", "B2"], "removable prosthesis": ["another word for a removable denture; papers switch terms to avoid repeating", "活動補綴物：即活動假牙，論文換字避免重複", "v", "C1"], "denture wearing": ["the fact of using a denture, treated here as a factor that can be studied", "配戴假牙（本研究把它當成一個可分析的因素）", "p", "B2"], "denture": ["a set of artificial teeth", "假牙、義齒", "v", "B2"], "edentulous": ["having no natural teeth left", "無牙的（重音在第二音節 e-DEN-tu-lous）", "v", "C1"], "oral function": ["how well the mouth does its jobs — chewing, speaking, swallowing", "口腔功能：咀嚼、說話、吞嚥等", "p", "B2"], "esthetics": ["how something looks; appearance (British spelling: aesthetics)", "美觀、外觀（英式拼法 aesthetics）", "v", "C1"], "oral health related-quality of life": ["how much a person's mouth affects their daily life, comfort and confidence", "口腔健康相關生活品質", "f", "C1"], "OHRQoL": ["short for oral health-related quality of life", "口腔健康相關生活品質的縮寫", "f", "C1"], "HRQoL": ["health-related quality of life — the broader, whole-body version of OHRQoL", "健康相關生活品質：範圍比 OHRQoL 大，少一個 O", "f", "C1"], "Additional information is required": ["a formal, impersonal way of saying 'we need to know more'", "「還需要更多資訊」的學術寫法，不說 we", "c", "B2"], "assess": ["to judge or measure something carefully", "評估", "v", "B2"], "factors": ["the things that may cause or affect a result", "因素", "v", "B1"], "The purpose of this study is to": ["the standard opening for stating what a paper set out to do", "論文交代研究目的的標準句型", "c", "B1"], "evaluate": ["to judge the value or quality of something", "評估、評定", "v", "B2"], "the association between": ["the statistical relationship linking two things — always 'between A and B'", "……之間的關聯（固定搭配 between A and B）", "p", "B2"], "be associated with": ["to be linked to — states a relationship, never a cause", "與……有關聯（只講關聯，不講因果）", "p", "B2"], "sample": ["the group of people actually studied, standing for a larger population", "樣本：實際受測的那群人", "f", "B2"], "convenience sample": ["a group recruited because they were easy to reach, not randomly chosen", "方便樣本：找得到誰就收誰，非隨機抽樣", "f", "C1"], "study population": ["the whole group a study draws its participants from", "研究母群、研究對象", "f", "B2"], "mean age": ["the average age of the group", "平均年齡", "f", "B1"], "face-to-face interviews": ["asking questions in person rather than by post or phone", "面對面訪談", "p", "B1"], "socio-demographic characteristics": ["background facts such as age, sex, education and income", "社會人口特徵：年齡、性別、教育程度等", "f", "C1"], "dental care service usage": ["how often and why a person goes to the dentist", "牙科醫療服務使用情形", "p", "B2"], "regular dental checkups": ["routine visits to the dentist when nothing is wrong", "定期口腔檢查", "p", "B1"], "perceived": ["as the person themselves reports it — not measured by a dentist. The key word of this paper.", "自覺的、受訪者自己認為的（非客觀檢查）——本篇關鍵字", "v", "B2"], "self-rated": ["scored by the person about themselves", "自評的", "v", "B2"], "loose denture": ["a denture that moves or slips instead of staying in place", "假牙鬆脫、不穩", "p", "B1"], "oral ulcer": ["a painful open sore inside the mouth", "口腔潰瘍、口瘡", "p", "B2"], "halitosis": ["the medical word for bad breath", "口臭（醫學用語）", "v", "C1"], "dry mouth": ["not enough saliva; the medical term is xerostomia", "口乾（醫學用語 xerostomia）", "p", "B1"], "denture satisfaction": ["how happy the wearer is with their own denture", "假牙滿意度", "p", "B2"], "Geriatric Oral Health Assessment Index": ["a 12-question scale built to measure oral quality of life in older adults", "老年口腔健康評估指標：專為長者設計的 12 題量表", "f", "C1"], "GOHAI": ["the 12-item scale used in this paper. Higher score = better quality of life.", "本研究使用的 12 題量表。分數越高代表生活品質越好", "f", "C1"], "GOHAI-T": ["the Taiwanese Chinese version of the GOHAI scale", "GOHAI 的台灣中文版", "f", "C1"], "Oral Health Impact Profile": ["a rival scale (OHIP). Careful: higher OHIP score = WORSE quality of life.", "口腔健康影響量表（OHIP）。注意：分數越高代表生活品質越差", "f", "C1"], "OHIP": ["Oral Health Impact Profile. Its scores run the opposite way to GOHAI.", "口腔健康影響量表，分數方向與 GOHAI 相反", "f", "C1"], "remaining natural teeth": ["the teeth a person still has of their own", "剩餘的天然牙", "p", "B1"], "denture status": ["what kind of denture a person wears, and where", "假牙狀況（種類與位置）", "p", "B2"], "mastication": ["chewing (medical word). Stress the third syllable: mas-ti-CA-tion.", "咀嚼（醫學用語，重音在第三音節）", "v", "C1"], "oral mucosal lesions": ["damaged patches on the soft tissue lining the mouth", "口腔黏膜病灶", "p", "C1"], "Hierarchical multiple regression analysis": ["regression run in steps. One group of variables goes in, you note how much it explains, then the next group goes in and you see how much MORE it explains. That gain is what the paper is really measuring.", "階層式多元迴歸分析：分步跑迴歸。先丟一組變項，記下能解釋多少；再丟下一組，看「多」解釋了多少。那個增加量就是這篇論文真正在測的東西", "f", "C2"], "was performed": ["passive voice — the standard way Methods sections describe what was done", "被動語態，Methods 段的標準寫法", "c", "B2"], "was measured using": ["the standard Methods pattern for naming a tool", "「以……測量」，Methods 的標準句型", "c", "B2"], "dependent variable": ["the outcome you are trying to explain. Only ONE per model. Here it is the GOHAI-T score. Ask: which thing is doing the depending? That one is dependent.", "依變項：你想解釋的那個結果，一個模型只有一個。本研究是 GOHAI-T 分數。記法：誰「依賴」誰？被依賴的就是依變項。英文也叫 outcome variable 或 response variable", "f", "C1"], "independent": ["used to predict the outcome; also means 'not affected by'. Independent variables go IN, the dependent variable comes OUT.", "自變項的；也有「不受影響的」之意。記法：自變項是丟進去的，依變項是跑出來的", "v", "C1"], "predictors": ["the factors used to explain or predict the outcome", "預測因子", "f", "C1"], "accounted for": ["explained (a share of the variation) — a statistics use, not 'gave a reason'", "解釋了（多少變異），統計專用用法", "p", "C1"], "account for": ["to make up (a proportion of), or to explain (variation)", "占（多少比例）；或解釋（變異）", "p", "B2"], "variance": ["how much scores differ from one another. 'Explaining the variance' means accounting for why some people score high and others low.", "變異量：分數彼此差得多遠。「解釋變異」就是解釋為什麼有人分數高、有人分數低", "f", "C1"], "statistically significant": ["unlikely to be caused by chance alone", "統計上顯著：不太可能只是巧合", "f", "C1"], "significance level": ["the cut-off for calling a result significant, usually 5%", "顯著水準，通常設為 5%（α = 0.05）", "f", "C1"], "cross-sectional": ["measured at a single point in time — can show links, never causes", "橫斷式：單一時間點測量，只能看關聯不能談因果", "f", "C1"], "longitudinal": ["following the same people over time", "縱貫式：追蹤同一批人一段時間", "f", "C1"], "meta-analysis": ["a study that pools the numbers from many earlier studies", "統合分析：合併多篇研究的數據重新分析", "f", "C2"], "excluded": ["left out of the study on purpose, by a stated rule", "（依規則）排除在外", "v", "B2"], "informed consent": ["written agreement to join, given after the risks are explained", "知情同意", "f", "C1"], "Institutional Review Board": ["the ethics committee that must approve research on people", "人體試驗審查委員會（IRB）", "f", "C1"], "reliability": ["whether a measure gives consistent results. Compare validity: reliability is hitting the same spot every time, validity is hitting the right spot.", "信度：量得穩不穩。跟效度的差別：信度是每次都射中同一點，效度是射中正確的那一點", "f", "C1"], "validity": ["whether a measure really captures what it claims to", "效度：量得準不準", "f", "C1"], "convergent validity": ["evidence that a scale agrees with another measure of the same thing", "聚斂效度", "f", "C2"], "internal consistency": ["whether the items in a scale hang together", "內部一致性", "f", "C1"], "Cronbach": ["Cronbach's alpha — the usual number reported for internal consistency", "Cronbach's alpha：最常見的信度指標", "f", "C1"], "test-retest": ["measuring the same people twice to see if scores stay stable", "重測（信度）", "f", "C1"], "Likert scale": ["an agreement scale, usually 1 to 5. Say LIK-ert, not LIE-kert.", "李克特量表（唸 LIK-ert，不是 LIE-kert）", "f", "B2"], "questionnaire": ["a set of written questions. Stress the last syllable: kwes-tio-NAIR.", "問卷（重音在最後一音節）", "v", "B1"], "cross-cultural adaptation": ["reworking a translated scale so it makes sense in the new culture", "跨文化調適：翻譯後還要調整成在地說得通", "f", "C2"], "respectively": ["in the same order as just listed — the order must match exactly", "分別地（順序必須一一對應）", "c", "B2"], "positively associated": ["when one goes up, so does the other", "呈正相關", "p", "B2"], "correlation": ["a statistical link between two measures", "相關", "f", "B2"], "causality": ["one thing actually causing another — more than correlation", "因果關係", "f", "C1"], "controlling for": ["removing the influence of other factors so one effect can be seen", "控制（其他因素的影響）", "p", "C1"], "multicollinearity": ["when two predictors measure almost the same thing. The model then cannot tell which one matters, and the numbers turn unstable. VIF is the check.", "多重共線性：兩個預測因子量到幾乎相同的東西，模型分不出是哪一個在起作用，數字就變得不穩。用 VIF 檢查", "f", "C2"], "skewness": ["how lopsided a distribution is", "偏態", "f", "C2"], "kurtosis": ["how peaked a distribution is", "峰度", "f", "C2"], "robust": ["not easily upset by broken assumptions in the data", "穩健的：不易受假設違反影響", "v", "C1"], "had the greatest impact on": ["affected it more than anything else did", "對……的影響最大", "p", "B2"], "the strongest predictor": ["the factor that explains the outcome better than any other", "最強的預測因子", "p", "B2"], "This suggests that": ["a careful way of stating a conclusion — shows, not proves", "這顯示……（謹慎的結論語氣，不是證明）", "c", "B2"], "et al.": ["Latin for 'and others'. Say 'et AL'. Used when a paper has several authors.", "等人（拉丁文縮寫，唸 et AL）", "c", "B2"], "in line with": ["agreeing with; matching what others found", "與……一致", "p", "B2"], "in accordance with": ["following, or agreeing with", "依照、與……一致", "p", "B2"], "consistent with": ["matching; not contradicting", "與……一致", "p", "B2"], "In contrast": ["signals that the opposite is coming next", "相對地、相反地", "c", "B1"], "gap in the literature": ["something earlier research has not answered — the reason a study exists", "文獻缺口：前人沒做過的那一塊", "p", "C1"], "hypothesis": ["the prediction a study sets out to test", "研究假設", "f", "B2"], "the former": ["the first of two things just mentioned (opposite: the latter)", "前者（相對於 the latter 後者）", "p", "C1"], "generalizing": ["applying findings from a sample to a wider population", "推論、類推到更大的族群", "v", "C1"], "limitations": ["the weaknesses a paper admits about itself", "研究限制", "f", "B2"], "mediated by": ["A affects C only through B; B is the middle step", "被……中介：A 透過 B 才影響 C", "p", "C2"], "play an important role in": ["to matter a lot in something", "在……扮演重要角色", "p", "B2"], "result from": ["to be caused by. Careful: 'result in' means the opposite.", "源自、起因於（注意 result in 是「導致」，方向相反）", "p", "B2"], "counterparts": ["the matching people in the other group", "對照的另一群人", "v", "C1"], "recall visits": ["scheduled follow-up dental appointments — not 'remembering'", "（牙科）定期回診，不是「回想」", "p", "C1"], "In conclusion": ["the standard signal that the final summary is starting", "總結而言", "c", "B1"], "In the present study": ["a formal way of saying 'in this study of ours'", "在本研究中", "c", "B2"], "Future research should": ["the standard way to hand unfinished work to the next study", "未來研究應……", "c", "B2"], "fertility rate": ["how many children are born per woman in a population", "生育率", "f", "B2"], "geriatric": ["relating to the medical care of old people. Say jer-ee-AT-rik.", "老年醫學的（唸 jer-ee-AT-rik）", "v", "C1"], "well-being": ["a person's overall health, comfort and happiness", "福祉、整體安適", "v", "B2"], "emphasized": ["given special importance", "被強調、被重視", "v", "B2"], "substantially": ["by a large amount", "大幅地、可觀地", "v", "B2"], "implant-supported": ["held in place by screws fixed into the jawbone", "植體支持式的（以植牙固定）", "p", "C1"], "adapt to": ["to get used to something new", "適應", "p", "B1"], "impairments": ["losses or weakening of a function", "損害、功能減損", "v", "C1"], "socioeconomic status": ["a person's position in society, from income, job and education", "社經地位", "f", "C1"], "subjective": ["based on personal feeling rather than outside measurement", "主觀的（相對於 objective 客觀的）", "v", "B2"], "prior to": ["before — the formal version", "在……之前（正式用語）", "p", "B2"], "intact": ["undamaged; complete", "完好的、未受損的", "v", "C1"], "cognitive": ["relating to thinking, memory and understanding", "認知的", "v", "C1"], "summation": ["the result of adding things together", "加總", "v", "C1"], "utilized": ["used — the formal version", "使用（正式用語）", "v", "B2"], "guidelines": ["official advice on how something should be done", "指引、準則", "v", "B1"], "mobility": ["how much a tooth moves; graded I to III", "（牙齒的）動搖度，分為第一至第三度", "f", "C1"], "extensive": ["covering a large area or amount", "大範圍的、廣泛的", "v", "B2"], "expressed as": ["written or reported in a particular form", "以……方式表示", "p", "B2"], "distributions": ["how values are spread across a range", "分布", "f", "C1"], "transformed": ["changed mathematically, e.g. by taking the log", "（數學上）轉換過的", "v", "C1"], "assumptions": ["conditions a statistical test takes for granted", "（統計）假設前提", "f", "C1"], "variability": ["how much values differ from one another", "變異程度", "f", "C1"], "majority": ["more than half", "多數、過半", "v", "B1"], "adverse": ["harmful or unfavourable", "不利的、負面的", "v", "C1"], "tolerated": ["put up with; accepted without complaint", "被容忍、被接受", "v", "C1"], "contributing factor": ["one of several things that help cause a result", "促成因素", "p", "B2"], "injure": ["to hurt or damage", "傷害、損傷", "v", "B1"], "symptomatic": ["causing noticeable symptoms", "有症狀的（相對於 non-symptomatic 無症狀的）", "v", "C1"], "essential": ["absolutely necessary", "必要的、不可或缺的", "v", "B1"], "demonstrated": ["showed clearly with evidence", "（以證據）顯示、證明", "v", "B2"], "community-dwelling": ["living at home in the community, not in an institution", "社區居住的（非住在機構）", "p", "C2"], "unrealistic": ["not matching what is actually possible", "不切實際的", "v", "B2"], "expectations": ["what a person believes will or should happen", "期待、預期", "v", "B1"], "simultaneously": ["at the same time", "同時地", "v", "C1"], "explanatory power": ["how much of the outcome a model can explain", "解釋力", "f", "C1"], "weakness": ["a weak point; the opposite of a strength", "弱點（相對於 strength 優點）", "v", "B1"], "recruited": ["found and signed up for a study", "招募（受試者）", "v", "B2"], "carried out": ["done, performed", "執行、進行", "p", "B1"], "conducted": ["carried out (a study or analysis)", "進行（研究或分析）", "v", "B2"], "worse": ["the comparative of BAD. The set is bad → worse → worst; good → better → best. Never 'more bad' or 'worser'.", "較差。bad 的比較級，三階是 bad / worse / worst（壞、較壞、最壞），對應的好是 good / better / best。沒有 more bad 也沒有 worser", "c", "B1"], "t-test": ["compares the average of exactly TWO groups", "t 檢定：只能比較兩組的平均值", "f", "C1"], "one-way analysis of variance": ["ANOVA — compares the averages of THREE or more groups", "單因子變異數分析（ANOVA）：比較三組以上的平均值", "f", "C1"], "Spearman": ["Spearman's rank correlation — used when data are ranks or not normally distributed", "Spearman 等級相關：資料是等級或不呈常態時使用", "f", "C2"], "STATA": ["a statistics software package, like SPSS", "一種統計軟體，與 SPSS 同類", "f", "B2"], "continuous variables": ["measures that can take any value on a scale — age, score, weight", "連續變項：可以連續取值的，如年齡、分數", "f", "C1"], "categorical variables": ["measures that fall into groups — sex, denture type, yes/no", "類別變項：分組的，如性別、假牙種類、是/否", "f", "C1"], "standard error": ["how much the sample average would wobble if you sampled again. Written SE.", "標準誤（SE）：重新抽樣時平均值會摆動多少。與標準差 SD 不同", "f", "C1"], "beta value": ["the standardized coefficient. Because it has no units, betas CAN be compared with each other — the biggest beta is the strongest predictor.", "beta（β）值：標準化後的係數。沒有單位，所以可以互相比大小——β 最大者就是最強的預測因子", "f", "C2"], "R squared": ["the share of the outcome the model explains, from 0 to 1. 0.53 means 53%.", "R 平方：模型能解釋的比例，0 到 1。0.53 就是 53%", "f", "C1"], "blocks of predictors": ["groups of related variables entered together as one step", "一組組的預測因子：相關變項打包成一步一起投入", "p", "C2"], "predictive power": ["how much better the model predicts after something is added", "預測力", "p", "B2"], "standardized regression coefficients": ["coefficients rescaled so variables with different units can be compared", "標準化迴歸係數：把單位拉到一樣，不同變項才能比大小", "f", "C2"], "variance inflation factors": ["VIF — checks whether predictors are too similar to each other", "變異數膨脹因子（VIF）：檢查預測因子是不是彼此太像", "f", "C2"], "bivariate analysis": ["looking at two variables at a time, with nothing else controlled. The first, rough pass.", "雙變項分析：一次只看兩個變項、不控制其他因素。是第一轮的粗篩", "f", "C1"], "kappa coefficient": ["a 0-to-1 score for how much two ratings agree, after chance agreement is removed. Over 0.8 is very good; this study got 0.90.", "kappa 係數：測兩次評定的一致程度，0 到 1，已扣除碰巧的部分。0.8 以上很好，本研究是 0.90", "f", "C2"], "intra-examiner": ["the SAME examiner checked twice. Compare inter- (between different examiners).", "檢查者内：同一人前後檢兩次。intra- 是內部，inter- 是之間", "c", "C2"], "robust linear regression": ["a re-run with a method less upset by odd data, used to check the first result holds", "穩健線性迴歸：用比較不怕異常資料的方法重跑一次，驗證原結果穩不穩", "f", "C2"], "multiple linear regression": ["predicting one outcome from several variables at once", "多元線性迴歸：用好幾個變項同時預測一個結果", "f", "C1"], "explored": ["examined; investigated", "探討、檢視", "v", "B1"], "percentages": ["values expressed out of 100", "百分比", "v", "B1"], "counts": ["plain numbers of cases, written n", "個數（寫作 n）", "v", "B1"], "median": ["the middle value when all values are lined up in order", "中位數：排序後最中間的那個值", "f", "C1"], "independent predictors": ["the variables used to do the predicting. A model can have many. Here there are 18, including age, education and denture satisfaction.", "自變項（預測因子）：用來預測的那些變項，一個模型可以有很多個。本研究有 18 個。英文也叫 independent variable 或 explanatory variable", "f", "C1"], "hierarchical": ["done in ordered steps, one layer at a time", "階層式的：一層一層、有順序地進行", "v", "C1"]}}, {"id": "taira2023", "no": "Paper 2", "part": "Abstract + full text", "short": "Denture use and food form in long-term care", "title": "Association between denture use and food form in older adults requiring long-term care: A multicenter cross-sectional study", "titleZh": "需長期照護長者的假牙使用與食物型態之關聯：多中心橫斷式研究", "titleG": "又是一個沒有動詞的名詞片語標題，拆法同樣是找介系詞：<em>Association between A and B in C: D</em> — A（假牙使用）與 B（食物型態）在 C（需長期照護的長者）身上的關聯，冒號後面的 D 交代研究設計。醫學論文標題很愛在冒號後面補研究設計，看到冒號就知道後面是方法而不是結論。", "authors": "Taira K, Watanabe Y, Okada K, Kondo M, Takeda M, Ito K, Nakajima J, Iwasaki M, Itoda M, Inohara K, Sasaki R, Nishi Y, Furuya J, Watanabe Y, Umemoto G, Kishima M, Tohara T, Sato Y, Yoshida M, Yamazaki Y", "journal": "J Prosthodont Res, 2023; 67(3): 366-375", "doi": "10.2186/jpr.JPR_D_21_00161", "lic": "Open access under CC BY-NC 4.0 — non-commercial use only; annotated here for private teaching.", "why": "888 位日本機構住民、37 家機構。跟題目最接近的一篇，也是 11/28 英文報告的建議選擇。", "done": true, "abstract": [{"h": "Purpose", "zh": "研究目的", "s": [{"en": "This study aimed to determine whether denture use contributes to maintaining and improving food forms in long-term care facility (LTCFs) residents.", "zh": "本研究旨在確認配戴假牙是否有助於維持並改善長期照護機構住民的食物型態。", "g": "<em>aimed to determine whether...</em>（旨在確認是否……）是研究目的句的另一個標準寫法，跟 Yen 那篇的 “The purpose of this study is to evaluate...” 是同一類。兩句都背下來，寫自己的論文時任選一個。注意 <em>contribute to + Ving</em>，介系詞 to 後面要接動名詞，不是原形動詞。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "In 888 residents of 37 LTCFs in Japan, the following were investigated: nutritional intake status, food forms, age, sex, Barthel index (BI), clinical dementia rating (CDR), number of teeth present, number of occlusal supports, swallowing function, and use of dentures.", "zh": "研究對日本 37 家長期照護機構的 888 位住民，調查了以下項目：營養攝取狀況、食物型態、年齡、性別、巴氏量表（BI）、臨床失智評估量表（CDR）、現存牙數、咬合支持數、吞嚥功能，以及假牙使用情形。", "g": "<em>the following were investigated:</em>（以下項目接受了調查）後面接冒號再列清單，是 Methods 段最省字的寫法。這句要學的是：先講「調查了什麼」，冒號之後一口氣列完，不必每一項都寫一句。"}, {"en": "Among all residents, those who were well-nourished and had ≤9 occlusal supports were analyzed.", "zh": "在所有住民中，僅分析營養狀況良好且咬合支持數小於或等於 9 者。", "g": "<em>≤</em> 唸作 “less than or equal to”。研究刻意只留下這一群人，因為咬合支持多的人本來就吃得好，留下來會稀釋掉假牙的效果。這種「先篩出真正想看的人」的動作叫 <em>restriction</em>，是研究設計的常見手法。"}, {"en": "Based on standardized criteria, the food forms consumed by the subjects were divided into two groups: dysphagia and normal diet, which were further classified into four levels.", "zh": "依標準化的判定準則，將受試者食用的食物型態分為兩類：吞嚥調整飲食與一般飲食，再進一步細分為四個等級。", "g": "<em>be divided into</em>（被分成）與 <em>be classified into</em>（被歸類為）是同義替換，論文為了避免重複而交替使用。<em>further</em> 在這裡是「進一步」，不是「更遠」。"}, {"en": "Analysis was performed using a generalized estimation equation with the four levels of food forms as dependent variables and age, sex, BI, CDR, presence of dysphagia, number of teeth present, and use of dentures as independent variables.", "zh": "分析採用廣義估計方程式，以四個等級的食物型態為依變項，並以年齡、性別、巴氏量表、臨床失智評估量表、是否有吞嚥困難、現存牙數與假牙使用情形為自變項。", "g": "又是 <em>with A as dependent variables and B as independent variables</em> 這個結構——跟 Yen 那篇一模一樣，只是換了統計方法。讀第二篇論文的好處就在這裡：句型開始重複，會越讀越快。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The final analysis included 622 (70.0%) residents.", "zh": "最終納入分析者為 622 位（70.0%）住民。", "g": "<em>final analysis</em>（最終分析）指的是層層排除之後真正拿來算的樣本。從 888 人到 622 人，中間排除了誰、為什麼排除，Methods 必須交代清楚。"}, {"en": "Of these, 380 (61.1%) used dentures.", "zh": "其中 380 位（61.1%）有使用假牙。", "g": "<em>Of these</em>（其中）是承接上一句數字的簡短說法，等於 “Of these residents”。報告數據時很好用，可以少寫一個完整句子。"}, {"en": "The analyses revealed that food form was significantly associated with age (adjusted odds ratio [OR], 0.98), BI (OR, 1.04), number of teeth present (OR, 1.03), presence of dysphagia (OR, 0.44), and use of dentures (OR, 2.82).", "zh": "分析顯示食物型態與年齡（調整後勝算比 OR 為 0.98）、巴氏量表（OR 1.04）、現存牙數（OR 1.03）、是否有吞嚥困難（OR 0.44）與假牙使用情形（OR 2.82）顯著相關。", "g": "<em>odds ratio（OR，勝算比）</em>的讀法：OR = 1 表示沒有差別；大於 1 表示機會提高；小於 1 表示機會降低。所以假牙的 2.82 是「使用假牙者吃到較高等級食物型態的機會將近三倍」，而吞嚥困難的 0.44 是「機會不到一半」。<em>adjusted</em>（調整後）代表已經把其他因素的影響扣掉了。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Denture use was associated with food forms among Japanese LTCF residents.", "zh": "在日本長期照護機構住民中，假牙使用情形與食物型態有關。"}, {"en": "This indicates that the use of dentures is related to the maintenance of food forms, even in the elderly who participate in few activities of daily living, have reduced cognitive function, and require long-term care.", "zh": "這顯示即使是日常生活活動參與少、認知功能下降且需要長期照護的長者，配戴假牙仍與食物型態的維持有關。", "g": "<em>even in...</em>（即使在……身上）是這篇結論的關鍵詞。作者想說的不只是「假牙有用」，而是「連最弱的族群也有用」。找到 even、especially、particularly 這類字，就找到了作者強調的重點。"}]}], "fulltext": [{"h": "Introduction", "zh": "前言", "s": [{"en": "A dysphagia diet is provided to 26–67% of residents in long-term care facilities (LTCFs) to prevent aspiration.", "zh": "為預防嗆入，長期照護機構有 26–67% 的住民被提供吞嚥調整飲食。", "g": "開場就丟數字，是流行病學論文的常見起手式：先證明「這件事很普遍」，再談問題。<em>to prevent aspiration</em> 是不定詞表目的（為了預防）。"}, {"en": "However, a dysphagia diet may have a poor appearance, taste, and reduced nutritional value, which may cause dehydration.", "zh": "然而，吞嚥調整飲食可能外觀不佳、味道不好、營養價值降低，並可能導致脫水。", "g": "<em>However</em> 一出現，代表要翻面了：上一句講好處或現狀，這一句講代價。論文的問題意識常常就藏在第一個 However 後面。"}, {"en": "Furthermore, the intake of a dysphagia diet is associated with a lower quality of life.", "zh": "此外，食用吞嚥調整飲食與較低的生活品質有關。"}, {"en": "Therefore, maintaining and improving food forms in dysphagia diets is essential to maintain and improve the health and QOL of LTCF residents.", "zh": "因此，維持並改善吞嚥調整飲食的食物型態，對於維持與提升機構住民的健康與生活品質相當重要。", "g": "注意這三句的連接詞鏈：<em>However → Furthermore → Therefore</em>（然而 → 此外 → 因此）。這就是論文段落的骨架。讀前言時先把這些連接詞圈出來，論證的走向立刻清楚。"}, {"en": "In LTCF residents, the efficiency of the masticatory function is better in those with partial dentures than in those without partial dentures.", "zh": "在機構住民中，有配戴局部假牙者的咀嚼功能效率優於未配戴者。", "g": "<em>better in A than in B</em>——比較級的完整結構。介系詞 in 要重複出現在兩邊，這是台灣學生常漏掉的細節。"}, {"en": "Moreover, when food is divided into normal and dysphagia diets, the number of teeth present and tooth contact pairs, natural or artificial, significantly affect the maintenance of food forms.", "zh": "再者，當食物分為一般飲食與吞嚥調整飲食時，現存牙數以及天然或人工的牙齒接觸對數，都會顯著影響食物型態的維持。", "g": "<em>natural or artificial</em> 夾在兩個逗號之間，是在補充說明前面的 tooth contact pairs（不論是真牙還是假牙的接觸）。這種插入補充在論文極常見，讀的時候先跳過、抓完主幹再回頭。"}, {"en": "Until 2013, each institution and region used different terms to describe identical dysphagia diets in Japan.", "zh": "在 2013 年之前，日本各機構與各地區對同樣的吞嚥調整飲食使用不同的名稱。"}, {"en": "Therefore, the relationship between food forms assessed using standardized criteria and the use of dentures has not been fully elucidated.", "zh": "因此，以標準化準則評估的食物型態與假牙使用之間的關係，尚未被充分釐清。", "g": "<em>has not been fully elucidated</em>（尚未被充分釐清）是宣告研究缺口的高級說法，等於 “we still do not know”。同類的還有 remains unclear、has not been established。這三個片語擇一背下來，寫前言結尾直接用。"}, {"en": "Furthermore, a decline in activities of daily living (ADL) and cognitive function reportedly makes the use of dentures difficult.", "zh": "此外，據報導日常生活活動能力（ADL）與認知功能下降會使假牙的使用變得困難。", "g": "<em>reportedly</em>（據報導、據稱）是一個很有用的副詞：表示這是別人講的、作者不完全背書。學術寫作常用它來保持距離。"}, {"en": "However, few studies have examined whether dentures are associated with food forms even in LTCF residents with a decline in ADL and cognitive function.", "zh": "然而，很少有研究檢視在 ADL 與認知功能下降的機構住民身上，假牙是否仍與食物型態有關。", "g": "<em>few studies have examined...</em>（很少有研究檢視過……）是研究缺口的第二號句型。注意 few 是「很少」（偏負面），a few 是「有幾個」（偏正面），差一個 a 意思就反了。"}, {"en": "Many nursing home residents do not use dentures despite needing them, which is likely related to poorly fitting dentures.", "zh": "許多養護機構住民雖然需要假牙卻沒有使用，這可能與假牙不密合有關。", "g": "<em>despite + Ving</em>（儘管……）後面不能接句子。<em>poorly fitting</em>（不密合的）是假牙研究的核心詞，跟 ill-fitting 同義。"}, {"en": "Other factors, such as denture mismanagement, loss of dentures, and lack of oral care services, may also make denture use difficult for elderly residents in need of care.", "zh": "其他因素，例如假牙管理不當、假牙遺失、缺乏口腔照護服務，也可能使需要照護的長者難以使用假牙。", "g": "這一句對口腔衛生師特別有意義：它把問題從「病人的嘴」擴大到「照護系統」。<em>mismanagement</em> 的 mis- 是表示「錯誤地」的字首，同類的還有 misuse、misunderstand。"}, {"en": "Furthermore, it can be assumed that there is little cooperation between oral healthcare providers and nursing staff.", "zh": "此外，可以推測口腔照護提供者與護理人員之間缺乏合作。", "g": "<em>it can be assumed that...</em>（可以推測……）又是被動加虛主詞，把推測講出來但不把自己擺在前面。跟 Yen 那篇的 “It is suggested that...” 是同一套路。"}, {"en": "Therefore, we hypothesized that the use of dentures might be related to the maintenance of food forms, even in LTCF residents with a decline in ADL and cognitive function.", "zh": "因此，我們假設即使在 ADL 與認知功能下降的機構住民身上，配戴假牙仍可能與食物型態的維持有關。", "g": "<em>we hypothesized that...</em>（我們假設……）——研究假設句，注意後面用 <em>might be</em> 而非 is，因為假設還沒驗證。這跟 Yen 那篇用 would be 是同樣的道理。"}, {"en": "Consequently, we conducted a cross-sectional survey on the use of dentures and food forms in Japanese LTCF residents to examine this relationship.", "zh": "於是，我們針對日本機構住民的假牙使用與食物型態進行橫斷式調查，以檢驗這項關係。", "g": "<em>Consequently</em>（於是、因此）跟 Therefore 同義，論文為了不重複而換字。前言的最後一句幾乎一定是「所以我們做了這個研究」。"}]}, {"h": "Methods · Study design and participants", "zh": "研究方法 · 設計與對象", "s": [{"en": "This was a cross-sectional study including Japanese LTCF residents.", "zh": "本研究為納入日本長期照護機構住民的橫斷式研究。"}, {"en": "A workshop was held for 30 specially appointed committee members of the Japanese Society of Gerodontology to explain the study content and establish unified evaluation criteria for survey items that were repeatedly standardized until all evaluations were in perfect agreement to ensure consistent assessments.", "zh": "研究為日本老年牙醫學會的 30 位特聘委員舉辦工作坊，說明研究內容並建立調查項目的統一評估準則，反覆標準化直到所有評估完全一致，以確保評估的一致性。", "g": "<em>unified evaluation criteria</em>（統一的評估準則）是多中心研究的命脈：37 家機構、不同人評估，如果標準不一，資料就沒有可比性。這正是多中心研究比單中心麻煩、但也更有說服力的地方。"}, {"en": "Subsequently, each committee member explained the study content to the institution’s chief and the staff of their corresponding facilities.", "zh": "隨後，各委員向其對應機構的負責人與工作人員說明研究內容。"}, {"en": "For this study, the members of the appointed committee collaborated with 37 facilities in 17 regions.", "zh": "本研究由特聘委員與 17 個地區的 37 家機構合作進行。", "g": "<em>multicenter</em>（多中心）的具體內容就在這句：17 個地區、37 家機構。相較於 Yen 那篇的單一來源（高雄市長青學苑），這篇的代表性更廣——這是報告時可以拿來比較兩篇的一個角度。"}, {"en": "In cases where it was possible to obtain consent from a participating LTCF resident, the researcher directly explained the study contents and obtained written consent for participation in the study from the LTCF resident.", "zh": "若能取得住民本人同意，研究者即直接向住民說明研究內容並取得書面同意書。"}, {"en": "In cases where it was difficult to obtain consent from potential study participants, their families received a written explanation of the study to obtain written consent from them.", "zh": "若難以取得潛在受試者本人的同意，則向其家屬提供書面說明並取得家屬的書面同意。", "g": "這兩句處理的是研究倫理的難題：受試者有認知功能下降，可能無法自己同意。做法是改由家屬代理同意（<em>proxy consent</em>）。這在失智族群研究中是標準程序，研究若涉及機構長者也會遇到。"}, {"en": "Written consent was obtained from 888 residents and their families to participate in the study, and the study was conducted between October 2018 and February 2019.", "zh": "共取得 888 位住民及其家屬的書面同意，研究於 2018 年 10 月至 2019 年 2 月間執行。"}, {"en": "This study was approved by the ethics committee of the Japanese Society of Gerodontology and the epidemiological research ethics committee of Hokkaido University.", "zh": "本研究經日本老年牙醫學會倫理委員會與北海道大學流行病學研究倫理委員會核准。", "g": "注意這篇過了<em>兩個</em>倫理委員會：學會的與大學的。多中心研究常常需要多重審查。"}, {"en": "This study was conducted following the ethical principles of the Declaration of Helsinki.", "zh": "本研究依赫爾辛基宣言的倫理原則執行。", "g": "<em>Declaration of Helsinki</em>（赫爾辛基宣言）是人體研究倫理的國際準則。幾乎每篇涉及人的論文都會寫這一句，自己的論文也一定要寫。"}]}, {"h": "Methods · Survey items", "zh": "研究方法 · 調查項目", "s": [{"en": "During the survey, the research members provided training on the evaluation of survey items to all nurses and registered dietitians of the included institutions, and the evaluation criteria were unified.", "zh": "調查期間，研究人員對各參與機構的所有護理師與營養師進行調查項目評估訓練，並統一評估準則。", "g": "<em>registered dietitian</em>（營養師）是這篇的關鍵角色之一：食物型態是由營養師判定的。這篇論文的資料其實是靠護理師與營養師收集的，不是牙醫——對口腔衛生背景的人來說，這正是跨領域合作的實例。"}, {"en": "The participants’ age, sex, BMI, recent serum albumin levels, nutritional methods, and use of dentures during meals were transcribed from nursing records by the nurses and registered dietitians in charge.", "zh": "受試者的年齡、性別、體重指數、近期血清白蛋白值、營養攝取方式與用餐時假牙使用情形，由負責的護理師與營養師自護理紀錄轉錄。", "g": "<em>serum albumin</em>（血清白蛋白）是營養狀況的常用血液指標，偏低代表營養不良。<em>in charge</em>（負責的）放在名詞後面修飾。<em>transcribed from nursing records</em> 說明資料是從既有紀錄抄來的，不是研究者現場量的——這種叫 <em>retrospective</em>（回溯性）取材。"}, {"en": "A charge nurse evaluated physical function using the Barthel index (BI).", "zh": "由責任護理師以巴氏量表（BI）評估身體功能。", "g": "<em>Barthel index</em>（巴氏量表）測的是日常生活活動能力：吃飯、穿衣、上廁所、移動等，滿分 100 分，分數越高越獨立。台灣申請長照與外籍看護也用這張表。"}, {"en": "Cognitive function was assessed using the clinical dementia rating (CDR) by nurses who received prior training from co-investigators on the standardized assessment criteria.", "zh": "認知功能由接受過共同研究者標準化評估訓練的護理師以臨床失智評估量表（CDR）評估。", "g": "<em>CDR</em>（臨床失智評估量表）分為 0、0.5、1、2、3 五級：0 是正常，0.5 是可疑，1 輕度，2 中度，3 重度。這篇有七成以上住民在 2 級以上，是相當嚴重的族群。"}, {"en": "Finally, a Japanese psychiatrist specializing in dementia, certified as a dementia specialist in Japan, checked all assessments and determined the final CDR score.", "zh": "最後由日本失智症專科精神科醫師檢核所有評估結果，並判定最終的 CDR 分數。", "g": "這一句在交代品質控管：不是護理師說了算，最後有專科醫師把關。研究方法寫得越細，審查者越放心——這是值得學的寫作習慣。"}, {"en": "Each facility’s registered dietitian calculated the average daily total oral energy intake for each resident during the previous week by referring to the amount of food provided by the dietitians and the amount of remaining food visually checked by the nurses and caregivers.", "zh": "各機構的營養師參考供餐量，以及護理師與照顧者目測的剩食量，計算每位住民前一週的每日平均口腔熱量攝取量。", "g": "<em>visually checked</em>（目測）是很務實的做法：機構不可能把每份剩菜秤重，所以靠目視估計。作者後面在討論段也承認了這個方法的限制。做研究常常要在精準與可行之間妥協。"}, {"en": "Participants were classified into oral and parenteral intake groups according to enteral and intravenous administration routes for nutrition.", "zh": "受試者依腸道與靜脈營養給予途徑，分為口腔攝取組與非口腔攝取組。", "g": "三個詞要分清楚：<em>oral</em>（經口）、<em>enteral</em>（經腸道，如鼻胃管）、<em>parenteral</em>（非經腸道，如靜脈注射）。這是營養照護的基本分類。"}, {"en": "The residents were assigned to the poorly nourished group if their average daily total oral energy intake was <75% or the well-nourished group if their average daily total oral energy intake was ≥75%.", "zh": "每日平均口腔熱量攝取量低於 75% 者歸入營養不良組，達 75% 以上者歸入營養良好組。", "g": "<em>be assigned to</em>（被分配到）是分組的標準說法。75% 這個切點不是隨便定的，作者在討論段解釋了它來自日本長照保險的分類標準——任何切點都應該有依據，這也是口試常被問的問題。"}, {"en": "The well-nourished group was further classified into two subgroups: a group with ≥10 occlusal supports and another with ≤9 occlusal supports.", "zh": "營養良好組再進一步分為兩個次組：咬合支持數 10 以上者與 9 以下者。", "g": "<em>subgroup</em>（次組、亞組）。這裡是分組的第二層。讀 Methods 時建議邊讀邊在紙上畫流程圖：888 人 → 排除 → 785 人 → 分營養良好／不良 → 再分咬合支持多／少 → 622 人。畫出來就不會迷路。"}, {"en": "The dietitian in charge classified dysphagia diets according to the Japanese Dysphagia Diet 2013 guidelines proposed by the Japanese Society of Dysphagia Rehabilitation.", "zh": "由負責營養師依日本吞嚥復健學會提出的「日本吞嚥調整食 2013」指引分類吞嚥調整飲食。", "g": "<em>JDD 2013</em> 是日本本國的吞嚥飲食分級標準。台灣目前多採用國際的 IDDSI 架構，作者在討論段也把兩套系統做了對照——這是報告時很好用的一個切入點，因為台灣現場也在處理同樣的標準轉換問題。"}, {"en": "Dysphagia diets were classified into five codes (0 to 4), with higher codes indicating dysphagia diets that were closer to a normal diet.", "zh": "吞嚥調整飲食分為 0 到 4 五個代碼，代碼越高代表越接近一般飲食。", "g": "<em>with higher codes indicating...</em> 又是那個 <em>with + 名詞 + Ving</em> 的補充結構。這篇跟 Yen 那篇都反覆用它，代表這真的是論文高頻句型，值得專門練。"}, {"en": "Although a normal diet is stiffer than a dysphagia diet, it is classified into two food forms.", "zh": "雖然一般飲食比吞嚥調整飲食更硬，但仍分為兩種食物型態。", "g": "<em>stiffer</em>（較硬的）——注意這裡用 stiff 而不是 hard 來形容食物質地。本研究題目正是食物質地，這類形容詞要成組蒐集：hard、soft、stiff、tender、chewy、crisp。"}, {"en": "The lower level comprised soft, tender, and easily chewable food forms or food forms that had been modified.", "zh": "較低的等級包含軟質、細嫩、易咀嚼的食物型態，或經過調整處理的食物型態。", "g": "<em>comprise</em>（包含、由……組成）是比 include 更正式的字。<em>tender</em>（細嫩的）常用來形容肉質。<em>modified</em>（經調整的）在吞嚥飲食語境中就是「切碎、勾芡、打成泥」這類處理。"}, {"en": "A higher level represented normal meals that were not modified for easier consumption.", "zh": "較高的等級代表未經調整以便於進食的一般餐食。"}, {"en": "Consequently, dysphagia and normal diets were classified into the following four levels: food form 1, JDD 2013 level <2-2; food form 2, JDD 2013 levels 3 and 4; food form 3, soft normal diet or normal modified diet; food form 4, normal diet that has not been modified to be soft and easy to eat.", "zh": "因此，吞嚥調整飲食與一般飲食共分為以下四個等級：食物型態 1 為 JDD 2013 等級低於 2-2；食物型態 2 為 JDD 2013 等級 3 與 4；食物型態 3 為軟質一般飲食或經調整的一般飲食；食物型態 4 為未經軟化調整的一般飲食。", "g": "這四個等級就是這篇的依變項，整篇的結論都建立在它上面。讀論文遇到核心變項的定義，一定要停下來確認清楚，否則後面每個數字都會看不懂。"}, {"en": "The swallowing function of the participants was assessed using a questionnaire for dysphagia screening developed by Ohkuma et al.", "zh": "受試者的吞嚥功能以 Ohkuma 等人開發的吞嚥困難篩檢問卷評估。"}, {"en": "This questionnaire consists of 15 items reflecting the history of pneumonia; nutritional status; oral, pharyngeal, and esophageal function; and epiglottis function.", "zh": "該問卷包含 15 題，涵蓋肺炎病史、營養狀況、口腔、咽部與食道功能，以及會厭功能。", "g": "解剖位置由上到下記一組：<em>oral</em>（口腔）→ <em>pharyngeal</em>（咽）→ <em>esophageal</em>（食道），中間有 <em>epiglottis</em>（會厭）擋住氣管。這組詞在吞嚥領域會一直出現。"}, {"en": "Each question was evaluated using a three-point scale: “A, severe symptoms;” “B, mild symptoms;” and “C, no symptoms.”", "zh": "每題以三點量表評估：A 為嚴重症狀、B 為輕微症狀、C 為無症狀。"}, {"en": "Based on previous studies, we considered that a participant had “dysphagia” if any of the 15 items were answered with “A” and “no dysphagia” if all items were answered with “B” or “C”.", "zh": "依據先前研究，只要 15 題中任一題答 A 即視為有吞嚥困難；全部答 B 或 C 則視為無吞嚥困難。", "g": "<em>if any of ... were answered with A</em>——只要有一題就算，這是很寬鬆的判定門檻（寧可多抓不要漏掉）。篩檢工具通常都這樣設計：<em>sensitivity</em>（敏感度）優先於 <em>specificity</em>（特異度）。"}]}, {"h": "Methods · Assessments", "zh": "研究方法 · 口腔評估", "s": [{"en": "A survey was conducted by 30 dentists and dental hygienists who were pretrained using the agreed-upon uniform evaluation criteria.", "zh": "調查由 30 位事先依統一評估準則受訓的牙醫師與口腔衛生師執行。", "g": "注意這句：<em>dental hygienists</em>（口腔衛生師）正是本研究題目所屬的專業。在日本的研究裡，口腔衛生師是正式的資料收集者之一。報告這篇時，這是一個可以順帶提起的點。"}, {"en": "The dentists and dental hygienists were unaware of the food form consumed by the residents.", "zh": "牙醫師與口腔衛生師並不知道住民所食用的食物型態。", "g": "<em>unaware of</em>（不知道）在這裡是刻意設計的，就是<em>盲法（blinding）</em>：評估口腔狀況的人不知道結果變項，才不會不自覺地往預期方向評。這一句很小，但是研究品質的重要標誌，口試時值得主動提。"}, {"en": "“Number of teeth present” was defined as the number of erupted teeth in the oral cavity, excluding roots with collapsed crowns and teeth with a score of 3 according to Miller’s mobility index.", "zh": "「現存牙數」定義為口腔內已萌發的牙齒數，但排除牙冠崩塌的殘根以及 Miller 動搖度指數第三級的牙齒。", "g": "又是 <em>was defined as</em>。跟 Yen 那篇對照會發現兩篇的定義幾乎一樣（都排除殘根與第三度動搖），代表這是這個領域的共識做法。自己收資料時可以直接沿用，並引用這兩篇作為依據。"}, {"en": "When the crown structure of the tooth is lost and only a residual root is present, it is considered the “stump of the tooth” and corresponds to “C4” used in Japanese dental examinations to describe carious lesions.", "zh": "當牙冠結構喪失、僅存殘根時，稱為「殘根」，對應日本牙科檢查中用來描述齲齒病灶的「C4」。", "g": "<em>C1 到 C4</em> 是日本的齲齒分級。台灣的分級方式不同，所以讀日本論文時遇到本國專用分級，要先確認它對應什麼——這也是跨國比較研究的一個常見障礙。"}, {"en": "The dentists and dental hygienists surveyed residents or their caregivers about their use of dentures.", "zh": "牙醫師與口腔衛生師向住民或其照顧者詢問假牙使用情形。"}, {"en": "The “number of occlusal supports” was defined as the number of supports in which the same type of teeth on the ipsilateral upper and lower jaws belonged to one of the following combinations: tooth present and tooth present; tooth present and implant; tooth present and pontic; and pontic and pontic.", "zh": "「咬合支持數」定義為同側上下顎同類型牙齒符合以下組合之一的支持數：真牙對真牙、真牙對植體、真牙對牙橋假牙，以及牙橋假牙對牙橋假牙。", "g": "<em>ipsilateral</em>（同側的）對應 <em>contralateral</em>（對側的）。<em>pontic</em> 是牙橋中間懸空的那顆假牙。這個定義的重點是：上下要能對咬到，才算一個「咬合支持」——能對咬才咬得動食物。"}, {"en": "Roots with collapsed crowns, teeth affected by severe periodontitis, and wisdom teeth were excluded from the study.", "zh": "牙冠崩塌的殘根、嚴重牙周病的牙齒與智齒均排除在外。", "g": "<em>wisdom teeth</em>（智齒）被排除，因為它位置太後面、常常沒有對咬，算進去會高估咬合能力。研究裡每一個排除決定背後都該有理由。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "Categorical variables were analyzed using the chi-square test for item-specific comparisons between the well-nourished and poorly nourished groups.", "zh": "類別變項以卡方檢定進行營養良好組與營養不良組之間的逐項比較。", "g": "<em>chi-square test</em>（卡方檢定，唸 KY-square）是比較「類別變項」分布差異的標準方法，例如男女比例在兩組間是否不同。Yen 那篇也用了它。兩篇都出現的方法，優先記。"}, {"en": "Categorical variables with two terms were tested using the Cochran–Armitage trend test, and variables with three or more categories were tested using the Kruskal–Wallis test.", "zh": "二分類的類別變項以 Cochran–Armitage 趨勢檢定，三類以上者以 Kruskal–Wallis 檢定。", "g": "這裡的邏輯跟 Yen 那篇的「兩組用 t 檢定、三組以上用 ANOVA」一樣：組數決定方法。只是這篇的資料不呈常態，所以改用無母數（non-parametric）版本的 Kruskal–Wallis。"}, {"en": "Continuous variables were analyzed using the independent t-test or Mann–Whitney U test, considering normality.", "zh": "連續變項依常態性採用獨立 t 檢定或 Mann–Whitney U 檢定。", "g": "<em>considering normality</em>（考量常態性）是關鍵：資料呈常態就用 t 檢定，不呈常態就用 Mann–Whitney U。這組配對務必記牢，是生統考試的必考題。"}, {"en": "Subsequently, the items expected to have trends or differences between residents with occlusal supports ≤9 who ate any of the four food forms were tested using the Jonckheere–Terpstra trend test.", "zh": "隨後，針對咬合支持數 9 以下、食用四種食物型態之一的住民，以 Jonckheere–Terpstra 趨勢檢定檢視預期存在趨勢或差異的項目。", "g": "<em>trend test</em>（趨勢檢定）問的不是「有沒有差」，而是「有沒有順著方向遞增或遞減」。因為食物型態 1 到 4 是有順序的等級，用趨勢檢定比單純比大小更有力。"}, {"en": "A multivariate analysis was performed in residents with ≤9 occlusal supports to examine the relationship between food forms and the use of dentures.", "zh": "在咬合支持數 9 以下的住民中進行多變項分析，以檢視食物型態與假牙使用之間的關係。"}, {"en": "Based on previous test results, the four aforementioned levels of food forms were used as dependent variables, and sex, age, BI, CDR, number of teeth present, dysphagia, and use of dentures were independent variables.", "zh": "依先前檢定結果，以上述四個食物型態等級為依變項，性別、年齡、BI、CDR、現存牙數、吞嚥困難與假牙使用為自變項。", "g": "<em>aforementioned</em>（前述的）是很正式的字，等於 “mentioned above”。讀到它就回頭找前面提過的那個東西。"}, {"en": "In multivariate analysis, adjusted odds ratios (ORs) with 95% confidence intervals (CIs) were obtained using a generalized estimation equation, considering that the corresponding data had a hierarchical structure across multiple facilities.", "zh": "多變項分析以廣義估計方程式取得調整後勝算比（OR）與 95% 信賴區間（CI），因為資料在多家機構之間具有階層結構。", "g": "這句解釋了為什麼用廣義估計方程式而不是普通迴歸：同一家機構的住民吃同一個廚房煮的飯，資料彼此不獨立（<em>hierarchical structure</em>，階層結構）。忽略這件事會低估誤差。<em>95% CI</em>（信賴區間）如果跨過 1，就代表不顯著——看 OR 一定要連 CI 一起看。"}, {"en": "All statistical analyses were performed with SPSS Statistics version 26, and a p-value <0.05 was considered statistically significant.", "zh": "所有統計分析以 SPSS Statistics 26 版執行，p 值小於 0.05 視為統計上顯著。", "g": "這篇用 SPSS，Yen 那篇用 STATA。兩個都是常見軟體；課程若要求 SPSS，正好對得上這篇。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Of the 888 residents investigated using cross-sectional surveys, 785 were included in the analysis: 176 males and 609 females, with a mean age of 86.6 years and a standard deviation of 7.8 years.", "zh": "在接受橫斷式調查的 888 位住民中，785 位納入分析：男性 176 位、女性 609 位，平均年齡 86.6 歲，標準差 7.8 歲。", "g": "平均年齡 86.6 歲——比 Yen 那篇的 76.8 歲高了整整十歲，而且女性占近八成。兩篇的族群差很多，這正是比較兩篇時最該先講清楚的事。"}, {"en": "We excluded 60 residents who received parenteral nutrition and 43 participants with missing data.", "zh": "排除 60 位接受非經腸道營養者與 43 位資料缺漏者。", "g": "<em>missing data</em>（資料缺漏）是量性研究永遠要交代的事。排除多少人、為什麼排除，必須寫清楚，否則讀者無法判斷結果有沒有偏差。"}, {"en": "The characteristics of the participants were as follows: age: median, 87.0 years; BI: median, 30.0; number of teeth present: median, 5; and number of occlusal supports: median, 0.", "zh": "受試者特徵如下：年齡中位數 87.0 歲；巴氏量表中位數 30.0；現存牙數中位數 5 顆；咬合支持數中位數 0。", "g": "咬合支持數的中位數是 <em>0</em>——意思是超過一半的人完全沒有能對咬的牙齒。這個數字讓整篇論文的意義立刻清楚：對這群人來說，假牙不是加分，而是能不能咬東西的唯一途徑。"}, {"en": "There were 710 (90.4%) and 75 (9.6%) residents in the well-nourished and poorly nourished groups, respectively.", "zh": "營養良好組有 710 位（90.4%），營養不良組有 75 位（9.6%）。"}, {"en": "A comparison of both groups showed that the well-nourished group had significantly higher BMI, BI, and serum albumin levels, as well as significantly lower age and proportion of females than the poorly nourished group.", "zh": "兩組比較顯示，營養良好組的體重指數、巴氏量表與血清白蛋白值顯著較高，年齡與女性比例則顯著較低。", "g": "<em>as well as</em>（以及）用來連接兩串並列的內容。這句一次講了五個變項的方向，讀的時候先分成「較高的那些」與「較低的那些」兩堆。"}, {"en": "Of the 710 residents in the well-nourished group, 88 (12.4%) had ≥10 occlusal supports, and 622 (87.6%) had ≤9 occlusal supports.", "zh": "營養良好組的 710 位住民中，88 位（12.4%）咬合支持數 10 以上，622 位（87.6%）為 9 以下。"}, {"en": "Those with ≥10 occlusal supports were significantly younger and had a significantly higher BMI and number of teeth present than those with ≤9 occlusal supports.", "zh": "咬合支持數 10 以上者顯著較年輕，且體重指數與現存牙數顯著較高。"}, {"en": "Of the 622 residents with ≤9 occlusal supports, 99 (15.9%) ate food form 1, 164 (26.4%) ate food form 2, 244 (39.2%) ate food form 3, and 115 (18.5%) ate food form 4.", "zh": "咬合支持數 9 以下的 622 位住民中，99 位（15.9%）食用食物型態 1、164 位（26.4%）食物型態 2、244 位（39.2%）食物型態 3、115 位（18.5%）食物型態 4。"}, {"en": "As food forms approached a normal diet, age and the rate of dysphagia decreased significantly, while BI, the number of teeth present, and the rate of use of dentures increased significantly.", "zh": "隨著食物型態越接近一般飲食，年齡與吞嚥困難比例顯著下降，而巴氏量表、現存牙數與假牙使用率則顯著上升。", "g": "<em>As A..., B...</em>（隨著 A……，B……）是描述趨勢的好句型。注意這裡的 <em>while</em> 又是「相對地」而不是「當……時」——前半下降、後半上升，正好對比。假牙使用率從食物型態 1 的 31.3% 一路升到食物型態 4 的 84.3%，這個梯度就是整篇的核心圖像。"}, {"en": "Analyses using generalized estimation equations revealed that age, BI, number of teeth present, use of dentures, and dysphagia were significantly associated with the four levels of food forms.", "zh": "廣義估計方程式分析顯示，年齡、巴氏量表、現存牙數、假牙使用與吞嚥困難均與四個食物型態等級顯著相關。"}, {"en": "Moreover, the correlation matrix did not indicate independent variables with a correlation coefficient |r| > 0.8.", "zh": "此外，相關矩陣未顯示任何自變項的相關係數絕對值超過 0.8。", "g": "這一句在檢查<em>多重共線性</em>：如果兩個自變項相關太高（超過 0.8），就代表它們在量同一件事，模型會不穩。Yen 那篇用 VIF 檢查，這篇用相關矩陣——兩種做法都可以，目的相同。<em>|r|</em> 是絕對值，不論正負。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "This study investigated the actual food forms consumed by Japanese LTCF residents.", "zh": "本研究調查了日本長期照護機構住民實際食用的食物型態。"}, {"en": "The results revealed that food forms closer to a normal diet were associated with increased BI, a higher number of teeth present, absence of dysphagia, and use of dentures.", "zh": "結果顯示，越接近一般飲食的食物型態，與較高的巴氏量表分數、較多的現存牙數、無吞嚥困難以及使用假牙有關。"}, {"en": "This indicates that the use of dentures may have contributed to the maintenance of food forms, even in residents with a decline in ADL and cognitive function.", "zh": "這顯示即使在 ADL 與認知功能下降的住民身上，假牙仍可能有助於維持食物型態。", "g": "注意 <em>may have contributed</em>（可能曾有助於）：這是很克制的說法。橫斷式研究不能講因果，所以連「有助於」都要加上 may。這個分寸跟 Yen 那篇一樣。"}, {"en": "A cross-sectional study of 639 Canadian LTCF residents reported significant associations of the four food forms with ADL and cognitive performance scores.", "zh": "一項針對 639 位加拿大機構住民的橫斷式研究，指出四種食物型態與 ADL 及認知表現分數顯著相關。"}, {"en": "Previous studies also reported that dysphagia risk, a factor that directly affects food intake, was positively correlated with modified food texture.", "zh": "先前研究也指出，直接影響進食的吞嚥困難風險，與經調整的食物質地呈正相關。", "g": "<em>modified food texture</em>（經調整的食物質地）就是論文題目裡的「食物質地」。這篇論文的 food form 與題目裡的 food texture 是同一個概念的不同說法——寫文獻回顧時，這兩個詞都要當關鍵字搜尋。"}, {"en": "There was no significant association between food forms and cognitive function between the groups in our study.", "zh": "本研究中，食物型態與認知功能在各組間並無顯著關聯。"}, {"en": "However, we found significant associations between food forms and ADL, as well as food form and dysphagia risk, similar to the aforementioned Canadian study.", "zh": "然而，我們發現食物型態與 ADL，以及食物型態與吞嚥困難風險之間存在顯著關聯，與前述加拿大研究相似。", "g": "討論段的標準動作：把自己的結果跟別人的比，一項一項講「這裡一致、那裡不一致」。不一致的地方還要試著解釋原因，這就是討論的價值。"}, {"en": "Moreover, a dysphagia diet may be chosen to prevent aspiration when masticatory and swallowing abilities decline.", "zh": "再者，當咀嚼與吞嚥能力下降時，可能會選用吞嚥調整飲食以預防嗆入。"}, {"en": "Studies conducted on Japanese people aged ≥65 years reported that a higher level of competence in daily living and the number of teeth present were significantly associated with objective masticatory function.", "zh": "針對 65 歲以上日本人的研究指出，較高的日常生活能力與現存牙數，與客觀咀嚼功能顯著相關。", "g": "<em>objective masticatory function</em>（客觀咀嚼功能）是用儀器測的，相對於 <em>subjective</em>（主觀的，問本人）。研究若要測咀嚼能力，就得決定用哪一種——這是可以帶去問指導教授的問題。"}, {"en": "The results of our study support these findings.", "zh": "本研究結果支持這些發現。", "g": "<em>support these findings</em>（支持這些發現）是討論段最常見的收束句之一，等於「我的結果跟前人一致」。同義的還有 are consistent with、are in line with。"}, {"en": "According to the correlation matrix in this study, no independent variable had a correlation coefficient of |r| > 0.8.", "zh": "依本研究的相關矩陣，沒有任何自變項的相關係數絕對值超過 0.8。"}, {"en": "Therefore, we considered the possibility of multicollinearity low, and all independent variables were included in the analysis.", "zh": "因此，我們認為多重共線性的可能性低，故將所有自變項納入分析。"}, {"en": "Generally, significant confounding is present between the loss of teeth and the use of dentures.", "zh": "一般而言，缺牙與假牙使用之間存在顯著的干擾效應。", "g": "<em>confounding</em>（干擾、混淆）是流行病學的核心概念：兩個因素糾纏在一起，分不清是誰的效果。牙齒少的人才需要假牙，所以這兩件事天生相關——作者接下來要解釋為什麼這篇沒出現這個問題。"}, {"en": "However, this was not observed in this study.", "zh": "然而本研究並未觀察到此現象。"}, {"en": "This may indicate that many participants with fewer teeth had their dentures removed.", "zh": "這可能表示許多牙齒較少的受試者其實把假牙取下不用了。", "g": "這個解釋很值得注意：牙齒少的人「應該」要戴假牙，但實際上反而不戴。這正是這篇論文想喊的重點——機構裡有一大群該戴而沒戴的人。"}, {"en": "Furthermore, no significant association was found between the CDR scores and food forms, possibly because ≥70% of residents had severe cognitive decline with CDR scores ≥2.", "zh": "此外，CDR 分數與食物型態之間未發現顯著關聯，可能是因為超過 70% 的住民 CDR 分數達 2 以上、認知功能嚴重下降。", "g": "這叫<em>天花板／地板效應</em>：當大多數人都集中在量表的同一端，就看不出差異了。不是因素不重要，而是這群樣本沒有變異可比。口試時如果被問「為什麼這個因素不顯著」，這是一個標準且漂亮的答法。"}, {"en": "The rates of age, cognitive decline, and use of dentures were higher in the present study than in studies conducted in other countries.", "zh": "本研究的年齡、認知功能下降比例與假牙使用率，均高於其他國家的研究。"}, {"en": "However, in Japan, the percentage of the total population of older people is the highest globally, and the percentage of people with cognitive decline is high.", "zh": "然而在日本，老年人口占總人口的比例為全球最高，認知功能下降者的比例也高。", "g": "這一段在處理「我的數字跟別人不一樣」的問題。作者的解法是：因為日本人口結構本來就特殊。這是合理的辯護，但也提醒讀者——這篇的結果要套到台灣之前，得先確認兩國族群是否可比。"}, {"en": "Accordingly, the participants in this study were similar to the general Japanese LTCF resident population.", "zh": "因此，本研究受試者與一般日本機構住民族群相似。"}, {"en": "Dietary intake was used as an index for nutritional assessment.", "zh": "本研究以飲食攝取量作為營養評估指標。"}, {"en": "Although BMI is commonly used, it is often difficult to measure the height and weight of the elderly, especially those who need nursing care, due to various factors such as inability to stand or deformity of the spinal column.", "zh": "雖然體重指數是常用指標，但長者（尤其是需照護者）常因無法站立或脊柱變形等因素而難以測量身高與體重。", "g": "這是很實務的一段：理論上最好的指標，現場可能根本量不到。做機構研究一定會遇到這種取捨。若要收高齡者的資料，這類現場限制值得提前想清楚。"}, {"en": "In the present study, the stumps of teeth were not counted based on the number of teeth according to the classification of carious lesions used in dental examinations in Japan.", "zh": "本研究依日本牙科檢查的齲齒病灶分類，未將殘根計入牙齒數。"}, {"en": "The present study postulates that the use of removable prosthetic devices in the ≤9 occlusal support group is advisable.", "zh": "本研究主張，咬合支持數 9 以下者宜使用活動補綴裝置。", "g": "<em>postulate</em>（主張、假定）是比 suggest 更強一點的字。<em>advisable</em>（可取的、建議的）。這句是作者給臨床的建議，也是整篇論文的實務價值所在。"}, {"en": "According to these guidelines, oral rehabilitation treatment is a generic term for a treatment process that involves occlusal treatment, restorative and prosthetic therapy, orthodontic treatment, and implant therapy to restore oral function lost due to periodontal disease.", "zh": "依該指引，口腔重建治療是一個總稱，涵蓋咬合治療、修復與補綴治療、齒顎矯正與植牙治療，目的是恢復因牙周病喪失的口腔功能。", "g": "<em>generic term</em>（總稱、通稱）。這一句把一個大詞拆成四個子項目，是定義專業術語的標準寫法。寫論文的名詞解釋段可以直接套這個句型。"}, {"en": "Moreover, these guidelines recommend the use of removable prosthetic devices, particularly when the number of occlusal supports is ≤9.", "zh": "此外，該指引建議使用活動補綴裝置，特別是在咬合支持數 9 以下時。", "g": "這解釋了「9」這個切點的來源——來自日本牙周病學會的指引，不是作者自己訂的。任何切點都要有出處，這是口試最常被追問的地方之一。"}, {"en": "In Japan, doctors and nurses at LTCFs usually assess the patients’ eating behaviors and determine the optimal dietary approach.", "zh": "在日本，機構的醫師與護理師通常負責評估病人的進食行為並決定最適飲食方式。"}, {"en": "However, since the use of dentures is rarely considered in this assessment, this study was conducted.", "zh": "然而，由於此項評估很少考量假牙使用情形，本研究因此進行。", "g": "這一句是整篇論文真正的動機，而且非常實務：決定飲食的人不看假牙。作者想用數據去改變一個照護流程。這是報告時最有力的一張投影片。"}, {"en": "In the International Dysphagia Diet Standardization Initiative (IDDSI) framework, which is considered an international criterion for dysphagia diets, each of the dysphagia stages is considered to correspond to the following food forms: minced and moist, soft and bite-sized, easy-to-chew, and regular diets.", "zh": "在被視為吞嚥飲食國際標準的 IDDSI 架構中，各吞嚥等級分別對應以下食物型態：細碎濕潤、軟質小口、易咀嚼與一般飲食。", "g": "<em>IDDSI</em> 就是台灣現在推的那一套。這四個詞務必背下來：<em>minced and moist</em>（細碎濕潤）、<em>soft and bite-sized</em>（軟質小口）、<em>easy-to-chew</em>（易咀嚼）、<em>regular</em>（一般）。論文寫到食物質地時，幾乎一定會用到 IDDSI 的分級名稱。"}, {"en": "We believe that the classification used in this study approximates that of the IDDSI framework.", "zh": "我們認為本研究採用的分類近似於 IDDSI 架構。", "g": "<em>approximates that of</em>——那個 <em>that</em> 又是為了避免重複 “the classification”。這個代稱用法在 Yen 那篇也出現過，是論文的固定習慣。"}, {"en": "Patients in the poorly nourished group were excluded from the analysis based on previous studies suggesting that if the food form provided to LTCF residents is unsuitable, their nutritional status becomes poor.", "zh": "營養不良組被排除於分析之外，依據是先前研究指出若提供給住民的食物型態不適當，其營養狀況會變差。"}, {"en": "The exclusion of the poorly nourished group from further analyses may have created selection bias.", "zh": "將營養不良組排除於後續分析之外，可能造成選樣偏差。", "g": "<em>selection bias</em>（選樣偏差）：因為挑人的方式而讓結果失真。主動承認它、再解釋為什麼影響不大，比假裝沒這回事可信得多。"}, {"en": "However, since similar results were obtained in analyses including the poorly nourished group, and the poorly nourished group was much smaller than the well-nourished group, we believe that the effect of excluding the poorly nourished group is insignificant.", "zh": "然而，納入營養不良組的分析也得到相似結果，且該組人數遠少於營養良好組，因此我們認為排除的影響不大。", "g": "這就是<em>敏感度分析</em>的實例：把排除的人放回去再跑一次，結果一樣，就證明排除沒有扭曲結論。跟 Yen 那篇用穩健迴歸重跑是同一個思路。"}, {"en": "As the number of teeth present and occlusal supports has been reported to be associated with food avoidance, these results also support the findings of previous studies.", "zh": "由於現存牙數與咬合支持數已被報導與食物迴避行為有關，這些結果也支持先前研究的發現。", "g": "<em>food avoidance</em>（食物迴避）是指因為咬不動而刻意不吃某些食物。這個詞跟「能吃的食物質地」這個題目直接相關，值得列進關鍵字清單。"}, {"en": "Moreover, a low number of teeth and posterior occluding pairs are associated with a high risk of malnutrition, and our results are consistent with the results of previous studies that confirm significant differences in BMI between the groups.", "zh": "此外，牙齒數少與後牙咬合對數少與營養不良的高風險有關，本研究結果與先前確認各組間體重指數存在顯著差異的研究一致。", "g": "<em>posterior occluding pairs</em>（後牙咬合對）——後牙才是磨碎食物的主力，前牙只負責咬斷。這個區別在咀嚼功能研究裡很重要。"}, {"en": "Greater cognitive impairment, dependence on other people to perform ADL, and risk of dysphagia have been reported to be associated with a dysphagia diet prescription for LTCF residents.", "zh": "認知功能損害較重、日常生活需依賴他人，以及吞嚥困難風險，都被報導與機構住民被開立吞嚥調整飲食有關。"}, {"en": "Additionally, it has been shown that the number of teeth present significantly affects food forms when food is divided into regular and dysphagia diets.", "zh": "此外，已有研究顯示當食物分為一般飲食與吞嚥調整飲食時，現存牙數會顯著影響食物型態。"}, {"en": "Therefore, we believe that the results of our study support those of previous studies.", "zh": "因此，我們認為本研究結果支持先前研究的發現。"}, {"en": "The present study showed that dentures may have contributed to the maintenance of food forms, even in residents with a decline in ADL and cognitive function.", "zh": "本研究顯示，即使在 ADL 與認知功能下降的住民身上，假牙仍可能有助於維持食物型態。"}, {"en": "However, it is undesirable to force all elderly people receiving care to use dentures because there are several reports of denture-related accidents, such as accidental ingestion, in denture users with cognitive impairment.", "zh": "然而，不宜強迫所有受照護長者使用假牙，因為已有多起報告指出認知功能受損的假牙使用者發生誤食等假牙相關意外。", "g": "這一段是整篇論文最重要的倫理轉折。前面一直在講假牙的好處，這裡忽然自己踩剎車：認知障礙者可能把假牙吞下去。好的論文不會只推銷自己的結論。"}, {"en": "Furthermore, dentures can cause changes in oral sensation and decrease oropharyngeal swallowing efficiency.", "zh": "此外，假牙可能改變口腔感覺並降低口咽吞嚥效率。"}, {"en": "Second, nursing homes now focus on creating an environment in which patients can die peacefully and painlessly at the end of their lives.", "zh": "其次，養護機構現今著重於營造讓住民能在生命末期平靜無痛離世的環境。"}, {"en": "For example, there is a movement to introduce comfort feeding only (CFO) as an oral intake at the end of dementia.", "zh": "例如，有一股推動在失智末期採用「僅以舒適為目的的餵食」（CFO）作為經口攝取方式的趨勢。", "g": "<em>comfort feeding only</em>（僅求舒適的餵食）是安寧照護的概念。這個詞目前可能還陌生，但在高齡口腔照護的討論裡越來越重要。"}, {"en": "In CFO, the goal of feeding is not to nourish but to enjoy life.", "zh": "在 CFO 中，餵食的目標不是營養，而是享受生活。", "g": "<em>not to nourish but to enjoy life</em>——又是 <em>not A but B</em> 的對比句型，而且是全篇最有力量的一句。整段的重點在這裡：有時候吃東西的意義不是活下去，而是活得好。"}, {"en": "Patients should eat what they want to eat, when they want to eat, in the amount they want to eat, and should not be forced to eat against their preference.", "zh": "住民應能吃自己想吃的、在想吃的時候吃、吃自己想要的量，不應被強迫違背自身意願進食。", "g": "三個 <em>they want to eat</em> 的平行重複是刻意的修辭，讀起來有節奏也有力量。論文很少出現這種寫法，作者在這裡明顯放進了價值主張。"}, {"en": "Therefore, it is preferable that the patient is willing to use dentures; however, if the patient experiences pain from using dentures, the decision to not force the patient to use dentures can be taken.", "zh": "因此，最好是住民本人願意使用假牙；但若使用假牙會造成疼痛，也可以決定不強迫使用。"}, {"en": "This study has certain limitations.", "zh": "本研究有若干限制。", "g": "<em>This study has certain limitations.</em> 這句幾乎是所有論文的固定句，看到它就知道限制段開始了。寫論文時可以直接照抄這一句。"}, {"en": "First, the facilities surveyed in this study are relevant to members of the Japanese Society of Gerodontology; therefore, there is bias in institutional sampling.", "zh": "第一，本研究調查的機構與日本老年牙醫學會成員有關，因此機構取樣存在偏差。"}, {"en": "We analyzed data from 622 participants, which we considered a sufficient sample size according to the sample sizes of previous studies.", "zh": "我們分析了 622 位受試者的資料，依先前研究的樣本數判斷，此樣本量足夠。"}, {"en": "Unfortunately, we did not have information on the number of people who had explanations about participation in the study, the number of people who declined, or the reasons for their refusal.", "zh": "可惜我們沒有關於接受研究說明人數、拒絕人數或拒絕原因的資訊。"}, {"en": "Therefore, the results of this study should be interpreted with caution due to possible selection bias.", "zh": "因此，由於可能存在選樣偏差，本研究結果應謹慎解讀。", "g": "<em>should be interpreted with caution</em>（應謹慎解讀）是限制段的標準收尾。誠實講出來，反而讓結論更可信。"}, {"en": "The clear purpose and content of the study could have led denture non-users and those unable to use dentures to refuse to participate in the study.", "zh": "研究目的與內容明確，可能導致未使用假牙者及無法使用假牙者拒絕參與。"}, {"en": "However, the analysis that excludes these individuals would not overestimate the observed association because it would work toward not rejecting the null hypothesis.", "zh": "然而，排除這些人的分析並不會高估所觀察到的關聯，因為它的作用方向是傾向不拒絕虛無假設。", "g": "<em>null hypothesis</em>（虛無假設）是「兩者沒有關係」這個預設立場。作者在說：如果偏差存在，它會讓我更難找到關聯，所以我找到的關聯反而更可信。這是很高明的辯護方式，值得學。"}, {"en": "Second, we focused on the food forms; however, experts in swallowing disorders have not determined the food forms of residents using detailed tests, such as video fluoroscopy or video endoscopy.", "zh": "第二，我們著重於食物型態，但吞嚥障礙專家並未以吞嚥攝影或內視鏡等詳細檢查來判定住民的食物型態。", "g": "<em>video fluoroscopy</em>（吞嚥攝影 VFSS）與 <em>video endoscopy</em>（吞嚥內視鏡 VE）是吞嚥評估的兩大客觀工具。這篇沒做，所以吞嚥功能是靠問卷判定的——這是讀這篇時該注意的限制。"}, {"en": "Third, since this was a cross-sectional study, we were unable to determine a causal relationship between denture use and food form.", "zh": "第三，由於本研究為橫斷式研究，我們無法確立假牙使用與食物型態之間的因果關係。", "g": "又是這一句。兩篇論文都在最後鄭重聲明「不能談因果」。這件事重複到這個程度，就知道它有多重要——本研究也會是橫斷式，同樣的話同樣得寫。"}, {"en": "More research is needed to investigate this causal relationship.", "zh": "尚需更多研究來探討此因果關係。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "In conclusion, the use of dentures was associated with food forms, even in LTCF residents with a severe decline in ADL and cognitive function.", "zh": "總結而言，即使在 ADL 與認知功能嚴重下降的機構住民身上，假牙使用仍與食物型態有關。"}, {"en": "This highlights the importance of providing prosthodontic treatment to the elderly in need of long-term care and supporting the use of dentures in cooperation with caregivers if the elderly in need of long-term care are willing to use dentures.", "zh": "這凸顯了為需要長期照護的長者提供補綴治療的重要性，並在長者願意使用假牙時，與照顧者合作支持其使用。", "g": "<em>This highlights the importance of...</em>（這凸顯了……的重要性）是結論段最後一句的高頻句型。注意作者最後還是加了 <em>if ... are willing</em>（若他們願意）這個條件——把前面討論到的倫理顧慮帶進結論，首尾呼應。"}]}], "mesh": [["Activities of Daily Living", "日常生活活動（ADL）", "本篇以巴氏量表測量。NLM 用這個主題詞，代表 ADL 是本篇的重要變項之一。"], ["Aged", "老年人（65 歲以上）", "年齡標籤。本篇平均 86.6 歲。"], ["Cross-Sectional Studies", "橫斷式研究", "研究設計標籤。只能看關聯，不能談因果。"], ["Deglutition Disorders* / etiology", "吞嚥障礙／病因學", "星號代表這是本篇主要主題。斜線後的 etiology（病因學）是子標題，表示探討的是原因。Deglutition Disorders 就是 dysphagia 的 MeSH 正式名稱——這點很重要：搜 dysphagia 時，PubMed 會自動對應到這個詞。"], ["Dentures", "假牙", "注意是複數形 Dentures。MeSH 名詞多用複數。"], ["Humans", "人類", "人體研究標籤，用來排除動物與細胞實驗。"], ["Long-Term Care*", "長期照護", "本篇另一個主要主題。"]], "vocab": {"food form": ["how solid or soft a meal is served — this paper's outcome. Same idea as 'food texture'.", "食物型態：餐食的軟硬與處理程度，即論文題目裡的「食物質地」", "f", "B2"], "food forms": ["the four graded levels of meal texture used in this study", "食物型態（本研究分為四個等級）", "f", "B2"], "dysphagia diet": ["a meal modified to be safer to swallow — minced, softened or thickened", "吞嚥調整飲食：為安全吞嚥而調整過的餐食", "f", "C1"], "normal diet": ["an ordinary meal with no texture modification", "一般飲食：未經質地調整的普通餐食", "p", "B1"], "long-term care facility": ["a residential home for older people needing daily care. Often shortened to LTCF.", "長期照護機構（常縮寫為 LTCF）", "f", "B2"], "residents": ["the older people living in the facility — the study participants here", "住民：住在機構裡的長者，本研究的受試者", "v", "B1"], "aspiration": ["food or liquid going into the airway instead of the stomach", "嗆入、誤入呼吸道", "f", "C1"], "occlusal supports": ["upper and lower teeth that meet, so food can actually be crushed. No support means no chewing.", "咬合支持：上下能對咬的牙齒對；沒有咬合支持就咬不動食物", "f", "C2"], "Barthel index": ["a 0-100 score for daily living ability — eating, dressing, toileting, moving. Higher is more independent.", "巴氏量表：日常生活活動能力評分，0–100，越高越獨立", "f", "C1"], "clinical dementia rating": ["a 0 to 3 staging of dementia severity. 0 normal, 0.5 questionable, 1 mild, 2 moderate, 3 severe.", "臨床失智評估量表（CDR）：0 正常、0.5 可疑、1 輕度、2 中度、3 重度", "f", "C1"], "activities of daily living": ["the basic self-care tasks of everyday life. Abbreviated ADL.", "日常生活活動（ADL）：吃飯、穿衣、如廁等基本自理", "f", "B2"], "adjusted odds ratio": ["How many times more likely an outcome is. 1 = no difference, above 1 = more likely, below 1 = less likely. 'Adjusted' means the effect of the other variables has already been removed.", "調整後勝算比（OR）：1 表示沒差別，大於 1 機會提高，小於 1 機會降低。adjusted 代表已把其他變項的影響扣掉。本篇假牙的 OR 是 2.82，吞嚥困難是 0.44", "f", "C1"], "confidence intervals": ["the plausible range for the true value. If a 95% CI for an OR crosses 1, the result is not significant.", "信賴區間（CI）：真值的合理範圍；OR 的 95% CI 若跨過 1 就不顯著", "f", "C2"], "generalized estimation equation": ["a regression that allows for data being clustered — here, residents grouped inside the same facility", "廣義估計方程式：處理資料有群聚結構（同機構住民彼此不獨立）的迴歸", "f", "C2"], "hierarchical structure": ["data nested in groups, so observations inside a group are not independent", "階層結構：資料分群嵌套，同群內觀察值不獨立", "f", "C2"], "chi-square test": ["compares how categories are distributed between groups", "卡方檢定：比較類別在各組的分布差異", "f", "C1"], "trend test": ["asks not just whether groups differ, but whether values rise or fall in order", "趨勢檢定：問的是有沒有順序性的遞增或遞減", "f", "C2"], "Mann–Whitney U test": ["compares two groups when the data are not normally distributed", "Mann–Whitney U 檢定：資料不呈常態時比較兩組", "f", "C2"], "normality": ["whether data follow the bell-shaped normal distribution. It decides which test you may use.", "常態性：資料是否呈鐘形常態分布，決定能用哪種檢定", "f", "C1"], "multivariate analysis": ["looking at many predictors at once, so each one is judged with the others held steady", "多變項分析：同時放入多個預測因子，互相控制", "f", "C1"], "confounding": ["two factors tangled together so their effects cannot be separated", "干擾、混淆：兩個因素糾纏在一起，分不清誰的效果", "f", "C2"], "multicollinearity": ["predictors so similar that the model cannot tell them apart", "多重共線性：預測因子太相似，模型分不出來", "f", "C2"], "selection bias": ["distortion caused by who ended up in the study and who did not", "選樣偏差：因為誰被納入、誰沒被納入而造成的失真", "f", "C2"], "null hypothesis": ["the default assumption that there is no relationship. Studies try to disprove it.", "虛無假設：預設「沒有關係」，研究要做的是推翻它", "f", "C2"], "malnutrition": ["poor nutrition from eating too little or badly", "營養不良", "v", "B2"], "well-nourished": ["having adequate nutrition", "營養狀況良好的", "p", "B2"], "serum albumin": ["a blood protein used as a marker of nutritional status. Low means poorly nourished.", "血清白蛋白：營養狀況的血液指標，偏低代表營養不良", "f", "C1"], "enteral": ["nutrition delivered into the gut, e.g. by a feeding tube", "經腸道營養，如鼻胃管", "f", "C2"], "parenteral": ["nutrition delivered outside the gut, e.g. into a vein", "非經腸道營養，如靜脈注射", "f", "C2"], "registered dietitian": ["a qualified nutrition professional. In this study they judged the food forms.", "營養師。本研究的食物型態是由營養師判定的", "f", "B2"], "dental hygienists": ["oral hygiene professionals — the author's own profession, and data collectors in this study", "口腔衛生師：本研究的資料收集者之一", "f", "B2"], "masticatory function": ["how well a person can chew", "咀嚼功能", "f", "C1"], "ipsilateral": ["on the same side of the body. Opposite: contralateral.", "同側的（對側是 contralateral）", "v", "C2"], "pontic": ["the false tooth suspended in the middle of a bridge", "牙橋中間懸空的假牙", "f", "C2"], "periodontitis": ["gum disease that destroys the bone holding the teeth", "牙周病（破壞支持骨）", "v", "C1"], "wisdom teeth": ["the third molars at the very back of the mouth", "智齒", "p", "B2"], "erupted": ["of a tooth, having come through the gum", "（牙齒）已萌發的", "v", "C1"], "oropharyngeal": ["relating to the mouth and throat together", "口咽的", "v", "C2"], "comfort feeding only": ["feeding at the end of life aimed at pleasure rather than nutrition", "僅求舒適的餵食：生命末期以享受而非營養為目標", "f", "C2"], "modified": ["changed — here, food chopped, softened or thickened", "經調整的：食物被切碎、軟化或勾芡", "v", "B1"], "minced and moist": ["an IDDSI texture level: finely chopped and wet", "IDDSI 質地等級：細碎濕潤", "p", "C1"], "soft and bite-sized": ["an IDDSI texture level: soft food cut small", "IDDSI 質地等級：軟質小口", "p", "C1"], "easy-to-chew": ["an IDDSI texture level: ordinary food that needs little chewing", "IDDSI 質地等級：易咀嚼", "p", "B2"], "food avoidance": ["deliberately not eating foods that are hard to chew", "食物迴避：刻意不吃咬不動的食物", "p", "B2"], "advisable": ["sensible; worth doing", "可取的、宜採行的", "v", "B2"], "aforementioned": ["mentioned earlier", "前述的", "v", "C1"], "reportedly": ["according to what others have reported — keeps the author at a distance", "據報導、據稱", "c", "C1"], "has not been fully elucidated": ["is still not properly understood — a formal way to state a research gap", "尚未被充分釐清：宣告研究缺口的正式說法", "c", "C2"], "few studies have examined": ["hardly anyone has looked at this — the classic research-gap sentence", "很少有研究檢視過……（研究缺口句型）", "c", "B2"], "we hypothesized that": ["states the prediction the study will test", "我們假設……", "c", "B2"], "This study has certain limitations": ["the fixed sentence that opens a limitations paragraph", "本研究有若干限制（限制段的固定開場句）", "c", "B2"], "should be interpreted with caution": ["read these results carefully, the study has weaknesses", "應謹慎解讀", "p", "C1"], "This highlights the importance of": ["a standard closing move: naming what the findings matter for", "這凸顯了……的重要性", "c", "B2"], "contributes to": ["helps to bring about. Note: contribute TO + noun or -ing.", "有助於（介系詞用 to，後接名詞或動名詞）", "p", "B2"], "comprised": ["was made up of", "由……組成", "v", "C1"], "stiffer": ["harder, less easy to bend or chew", "較硬的", "v", "B2"], "tender": ["soft and easy to chew, especially of meat", "細嫩的、軟的（常形容肉）", "v", "B2"], "poorly fitting": ["not sitting properly in the mouth", "不密合的", "p", "B2"], "mismanagement": ["handling something badly. The prefix mis- means wrongly.", "管理不當（字首 mis- 表示錯誤地）", "v", "C1"], "unaware of": ["not knowing about. Here it marks deliberate blinding.", "不知道；本文指刻意的盲法設計", "p", "B2"], "median": ["the middle value when all values are put in order", "中位數", "f", "C1"], "postulates": ["to put forward as a claim or assumption", "主張、假定", "v", "C2"], "look it up": ["to check it in a book or database later", "查一下（去查資料）", "p", "B1"], "get back to you": ["to reply to you later with the answer", "之後再回覆您", "p", "B1"], "repeat the question": ["say the question again", "再說一次問題", "p", "A2"], "Do you mean": ["used to check you understood correctly", "您的意思是……嗎？（確認理解）", "c", "A2"], "for a moment": ["for a very short time. Not 'for a minute'.", "一下、短暫地（不是 for a minute）", "p", "A2"], "I'm not sure about that": ["an honest, professional way to say you do not know", "我不太確定（誠實而專業的說法）", "c", "A2"], "apply to": ["to be true for; to be relevant to", "適用於", "p", "B1"], "Partly": ["only in some ways — a safe way to open a mixed answer", "部分（安全的立場開場詞）", "c", "B2"], "harder to see": ["more difficult to detect", "比較難看出來", "p", "A2"], "go together": ["occur together, without one causing the other", "一起出現（但沒有因果關係）", "p", "B1"], "such as": ["for example. Followed by a noun, never a clause.", "例如（後接名詞，不接句子）", "c", "A2"], "three times more likely": ["the standard way to say an odds ratio in words", "三倍的機會（用文字講 OR 的標準說法）", "p", "B2"], "biased": ["distorted, not representative", "有偏差的", "v", "B2"]}, "meshLabel": "MeSH terms", "meshLabelZh": "PubMed 主題詞", "meshNote": "PubMed 為本篇編目的 MeSH 主題詞（PMID 35989265）。帶 <em>*</em> 號者為<em>主要主題（major topic）</em>，代表這篇論文主要就是在談它——本篇是 Deglutition Disorders 與 Long-Term Care 兩個。沒有星號的則是次要標籤。<br><br>最值得記的一條是 <em>Deglutition Disorders</em>：它才是「吞嚥障礙」的 MeSH 正式用語，dysphagia 只是同義詞。斜線後的 <em>etiology</em>（病因學）是子標題，表示這篇探討的是原因。PubMed 會自動把 dysphagia 對應過去，但若要用 MeSH 精準檢索，就得用正式名稱。<br><br>作者自訂關鍵字（Cross-sectional study、Denture use、Food forms、Older adults requiring long-term care、Swallowing function）與 MeSH 並不相同，搜尋時兩套都值得試。點任一標籤看說明。", "qa": [{"cat": "Opening the presentation", "catZh": "開場", "items": [{"q": "Could you tell us why you chose this paper?", "qZh": "可以說明您為什麼選這篇論文嗎？", "qG": "開場最常見的一題。考的不是英文，而是有沒有想清楚自己的研究方向。答案要在三句內把「這篇」和「我的題目」連起來。<em>Could you tell us...</em> 是客氣的問法，不是真的在問「可不可以」，所以不要回答 Yes。", "a": "I chose this paper because my own research is about denture wearers and food texture. This study looks at the same question in Japan. It uses a large sample, so I wanted to learn how they measured food forms.", "aZh": "我選這篇是因為我自己的研究是關於假牙配戴者與食物質地。這篇研究在日本探討同樣的問題。它的樣本數大，所以我想學習他們如何測量食物型態。", "aG": "三句，每句都短。第一句講關聯，第二句講這篇是什麼，第三句講想學什麼。<em>my own research</em>（我自己的研究）比 my study 更自然。<em>so I wanted to learn</em> 把話收回到自己身上，讓老師知道是有目的地在讀。"}, {"q": "In one sentence, what did this study find?", "qZh": "用一句話說，這篇研究發現了什麼？", "qG": "這一題是在測有沒有真的讀懂，而不是只把摘要背下來。準備一句 15 字以內的核心句，講到會背。任何論文都該準備這一句。", "a": "It found that residents who used dentures ate food closer to a normal diet, even when they needed a lot of care.", "aZh": "研究發現使用假牙的住民吃的食物更接近一般飲食，即使他們需要大量照護。", "aG": "<em>even when...</em>（即使……）是這篇的靈魂，一定要放進這句話。注意 <em>ate food closer to a normal diet</em> 用的是形容詞比較級 closer 修飾 food，不需要 that is。這樣講最短。"}]}, {"cat": "About the methods", "catZh": "關於研究方法", "items": [{"q": "Why did the authors only analyze residents with nine or fewer occlusal supports?", "qZh": "作者為什麼只分析咬合支持數九以下的住民？", "qG": "老師很愛問「為什麼排除某些人」，因為這考的是研究設計的理解。答案的關鍵詞是 <em>effect</em>（效果）會被 <em>dilute</em>（稀釋）——但這兩個字偏難，所以用簡單說法繞過去。", "a": "Residents with many occlusal supports can already chew well. If the authors included them, the effect of dentures would be harder to see. So they kept only the residents who really need dentures.", "aZh": "咬合支持多的住民本來就咬得動。如果把他們納入，假牙的效果就比較難看出來。所以作者只留下真正需要假牙的住民。", "aG": "不用 dilute 這個字也能講清楚：<em>harder to see</em>（比較難看出來）就夠了。答題原則是用自己會的字把邏輯講對，不要硬用查來的難字——講錯比講簡單糟糕得多。<em>If ... would be ...</em> 是假設語氣，用在談「如果當初那樣做會怎樣」。"}, {"q": "What does an odds ratio of 2.82 mean here?", "qZh": "這裡的勝算比 2.82 是什麼意思？", "qG": "數字題一定會考，而且是最該練熟的一題，因為答案有固定講法。記住三個錨點：等於 1 沒差別、大於 1 機會提高、小於 1 機會降低。", "a": "It means residents who used dentures were about three times more likely to eat a higher level of food form. The number is adjusted, so the other factors are already controlled.", "aZh": "意思是使用假牙的住民吃到較高等級食物型態的機會大約是三倍。這個數字是調整後的，所以其他因素已經被控制了。", "aG": "<em>about three times more likely to</em>（大約三倍的機會）是解讀 OR 的標準說法，背下來換數字就能用。第二句補上 <em>adjusted</em>（已調整）會讓答案聽起來很專業，而且只有九個字。"}, {"q": "Why did they use a generalized estimation equation instead of ordinary regression?", "qZh": "他們為什麼用廣義估計方程式而不是普通迴歸？", "qG": "這是進階題，可能不會問，但如果問了而答得出來，印象分會很高。核心概念只有一個：同一家機構的住民不是獨立的。", "a": "The residents came from thirty-seven facilities. People in the same facility eat the same food, so their data are not independent. This method takes that into account.", "aZh": "住民來自三十七家機構。同一家機構的人吃同樣的食物，所以他們的資料不是獨立的。這個方法把這件事納入考量。", "aG": "<em>eat the same food</em> 這個具體例子比背術語有用得多——它證明是真的懂，不是在複述。<em>take something into account</em>（把某事納入考量）是很實用的片語。"}]}, {"cat": "About limitations", "catZh": "關於研究限制", "items": [{"q": "What is the main limitation of this study?", "qZh": "這篇研究最主要的限制是什麼？", "qG": "限制題幾乎必考。好消息是答案永遠可以從研究設計講起，而這篇是橫斷式研究，所以有一個標準答案。壞消息是如果只講這一句會顯得敷衍，最好再加一項具體的。", "a": "It is a cross-sectional study, so we cannot say dentures cause better food forms. We only know the two things go together. Also, the facilities were all connected to one society, so the sample may be biased.", "aZh": "這是橫斷式研究，所以我們不能說假牙造成較好的食物型態。我們只知道這兩件事會一起出現。另外，這些機構都與同一個學會有關，所以樣本可能有偏差。", "aG": "<em>we cannot say A causes B</em>（我們不能說 A 造成 B）是限制題的萬用第一句。<em>the two things go together</em>（兩件事一起出現）是「有關聯但無因果」的白話說法，比 correlated 好用也好記。"}, {"q": "Do you think these results apply to Taiwan?", "qZh": "您認為這些結果適用於台灣嗎？", "qG": "這一題在測有沒有批判性，不是要選邊站。安全且漂亮的答法是：先說哪裡可能適用，再說哪裡要小心。切記不要只答 Yes 或 No。", "a": "Partly. Tooth loss and denture problems are similar in both countries. But the residents in this study were very old and needed a lot of care. Taiwanese community elderly may be different, so we need local data.", "aZh": "部分適用。缺牙與假牙問題在兩國相似。但這篇研究的住民非常年長且需要大量照護。台灣社區長者可能不同，所以我們需要本地的資料。", "aG": "<em>Partly.</em>（部分適用）一個字就把立場站穩，又不必選邊。這是很好的開場技巧。最後 <em>we need local data</em>（我們需要本地資料）順勢把話帶到自己的研究，一箭雙鵰。"}, {"q": "How will this paper help your own thesis?", "qZh": "這篇論文對您自己的論文有什麼幫助？", "qG": "這一題幾乎一定會出現，而且是最該準備的一題，因為它直接連到指導教授最關心的事。答案要具體到方法層面，不要只說「很有幫助」。", "a": "It shows me how to define food forms with a standard system. I also learned which factors I should control, such as swallowing function and the number of teeth. I plan to use a satisfaction questionnaire as well.", "aZh": "它讓我知道如何用標準化系統定義食物型態。我也學到應該控制哪些因素，例如吞嚥功能與牙齒數量。我還計畫使用滿意度問卷。", "aG": "三句分別對應：定義變項、控制變項、加上自己的東西。這個結構讓答案聽起來像有計畫的研究者，而不是讀者。<em>such as</em>（例如）後面接名詞就好，不要接句子。"}]}, {"cat": "When you get stuck", "catZh": "卡住的時候", "items": [{"q": "You did not hear the question clearly.", "qZh": "沒有聽清楚問題。", "qG": "先練這一句，比任何專業詞彙都重要。台上聽不懂是必然會發生的事，有準備就不會慌。語調要往上，聽起來才客氣。", "a": "I'm sorry, could you repeat the question?", "aZh": "抱歉，可以請您再說一次問題嗎？", "aG": "六個字，務必背到不用想。<em>Could you repeat...</em> 比 What? 或 Pardon? 都禮貌。若第二次仍未聽懂，可以加 <em>Could you speak a little more slowly, please?</em>（可以請您說慢一點嗎？）。"}, {"q": "You heard the question but you are not sure what it means.", "qZh": "聽到問題了，但不確定意思。", "qG": "這一句比直接亂答有用得多：把問題用自己的話講回去，請老師確認。很多時候講到一半就自己懂了。", "a": "Do you mean the number of teeth, or the number of occlusal supports?", "aZh": "您的意思是牙齒數量，還是咬合支持數？", "aG": "<em>Do you mean A, or B?</em>（您的意思是 A 還是 B？）——把模糊的問題切成兩個選項請對方選。這招同時展現出知道 A 和 B 是不同的東西，反而加分。"}, {"q": "You need a moment to think.", "qZh": "需要一點時間思考。", "qG": "沉默三秒在台上感覺像三十秒。有一句話墊著，就有時間整理思緒，而且聽起來從容。", "a": "That's a good question. Let me think for a moment.", "aZh": "這是個好問題。讓我想一下。", "aG": "這兩句是萬用的緩衝句，全世界的學術場合都在用。注意 <em>for a moment</em>（一下）不是 for a minute，後者聽起來真的要一分鐘。"}, {"q": "You do not know the answer.", "qZh": "不知道答案。", "qG": "這是最重要的一句。不知道而承認，遠比硬掰安全——老師一問下去就會露餡。承認之後接一個具體行動，聽起來就負責而不是放棄。", "a": "I'm not sure about that. I will look it up and get back to you.", "aZh": "我不太確定。我會查一下再回覆您。", "aG": "<em>look it up</em>（查資料）與 <em>get back to you</em>（之後回覆您）是兩個非常實用的片語。另一個版本是 <em>The authors didn't discuss that in this study.</em>（作者在這篇研究裡沒有討論到這一點）——如果問題確實超出論文範圍，這句更精準。"}], "tag": "P"}]}, {"no": "Paper 3", "part": "候選", "short": "Diet texture, denture use and denture quality", "title": "Association of Diet Texture With Denture Wearing and Denture Quality in Institutionalized Older Adults Requiring Long-Term Care", "authors": "Hirayama M, Hatanaka Y, Yamane K, et al.", "journal": "Cureus, 2025; 17(11): e97796", "doi": "10.7759/cureus.97796", "lic": "Open access under CC BY 4.0.", "why": "題目最貼近，但 Cureus 期刊排名偏低，恐不符 Q1 要求。當練習材料很好。", "done": false}, {"no": "Paper 4", "part": "候選", "short": "OHIP-14 and satisfaction in denture wearers", "title": "Examination of oral health quality of life and patient satisfaction in removable denture wearers with OHIP-14 scale and visual analog scale: a cross-sectional study", "authors": "Tosun B, Uysal N", "journal": "BMC Oral Health, 2024; 24:1353", "doi": "
