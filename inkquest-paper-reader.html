<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>InkQuest Reading Room · Oral Health Papers</title>
<style>
  :root{
    --paper:#F6F2E9; --panel:#FFFFFF; --ink:#1E1B16; --soft-ink:#4A453B; --rule:#DED6C4;
    --accent:#1F4E6B; --accent-deep:#123549; --accent-tint:rgba(31,78,107,.08);
    --word:#0E7C86; --phrase:#8A5AA8; --gram:#3F7D54; --res:#B8863B;
    --gl-line:#9C907A; --gl-line-hover:#5F5849; --hit:#FBE7A2;
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Songti TC","Noto Serif TC",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --han:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --fs:19px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;color-scheme:light;background:var(--paper)}
  html,body{background:var(--paper)!important}
  body{margin:0;background:var(--paper)!important;color:var(--ink)!important;
    font-family:var(--serif);line-height:1.72;font-size:var(--fs);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}

  #bar{position:sticky;top:0;z-index:30;background:var(--paper);
    border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;
    padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .iconbtn{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);line-height:0;border-radius:5px}
  .iconbtn:hover{background:var(--accent-tint)}
  .iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
  #barTitle{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--soft-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  #barTitle b{color:var(--accent)}

  header.article{margin:32px 0 6px}
  .kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
  h1.title{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;line-height:1.14;font-size:31px;margin:0 0 14px}
  h1.title .sent{border-radius:5px}
  .cite{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--soft-ink);
    border-top:1px solid var(--rule);padding:12px 0 0}
  .cite b{color:var(--ink)}
  .cite .lic{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--res);font-weight:700}
  .toolbar{display:flex;gap:9px;margin:20px 0 4px;flex-wrap:wrap}
  .tbtn{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 13px;border:1px solid var(--rule);
    background:none;color:var(--ink);border-radius:20px;cursor:pointer}
  .tbtn:hover{background:var(--accent-tint);border-color:var(--accent)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}

  article{margin-top:22px}
  #body > h2.sec:first-child{border-top:0;padding-top:0;margin-top:26px}
  h2.sec{font-family:var(--sans);font-weight:800;font-size:15px;color:var(--ink);
    margin:34px 0 12px;padding-top:16px;border-top:1px solid var(--rule);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  h2.sec::before{content:"\25C8";color:var(--accent);font-size:11px}
  h2.sec .zh{font-family:var(--han);font-weight:600;font-size:13px;color:var(--soft-ink)}
  .para{margin:0 0 20px}
  .bigrule{border-top:2px solid var(--ink);margin:44px 0 0;padding-top:10px}
  .bigrule .lbl{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}

  .sent{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-tap-highlight-color:transparent;
    transition:background .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sent:hover{background:rgba(31,78,107,.07)}
  .sent.open{background:rgba(31,78,107,.10)}
  .sent.flash{background:var(--hit)}
  .sent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  mark.hit{background:var(--hit);padding:0 1px;border-radius:2px}

  .tr{display:none;margin:12px 0 16px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
    font-family:var(--han);font-size:16px;line-height:1.78;color:var(--ink)}
  .tr.show{display:block}
  .tr .lab{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.1em;
    color:var(--accent);display:block;margin-bottom:5px}
  .tr .gnote{margin-top:13px;padding-top:12px;border-top:1px dashed var(--rule);
    font-size:14.5px;line-height:1.75;color:var(--soft-ink)}
  .tr .gnote .lab{color:var(--gram)}
  .tr .gnote em{font-family:var(--sans);font-style:normal;font-weight:700;color:var(--ink)}

  .gl{cursor:pointer;border-bottom:1.5px dotted var(--gl-line);transition:background .12s,border-color .12s}
  .gl:hover,.gl[aria-expanded="true"]{background:rgba(30,27,22,.08);border-bottom-color:var(--gl-line-hover)}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:2px}

  .tblblock{margin:22px 0 8px;border-top:1px solid var(--rule);padding-top:14px}
  .tblhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .tblname{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--accent)}
  .tblbtn{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 12px;
    border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:16px;cursor:pointer;margin-left:auto}
  .tblbtn:hover{border-color:var(--accent);background:var(--accent-tint)}
  .tblbtn.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}
  .tblcap{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--soft-ink);margin:12px 0 8px}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
  .tblwrap table{border-collapse:collapse;font-family:var(--sans);font-size:12.5px;min-width:100%}
  .tblwrap th,.tblwrap td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
  .tblwrap thead th{background:#EFE9DA;font-weight:800;color:var(--accent-deep);position:sticky;top:0}
  .tblwrap td:first-child,.tblwrap th:first-child{white-space:normal;min-width:190px}
  .tblwrap.text td,.tblwrap.text th{white-space:normal}
  .tblwrap.text td:nth-child(1),.tblwrap.text th:nth-child(1){min-width:0;width:34px}
  .tblwrap.text td:nth-child(2),.tblwrap.text td:nth-child(3){min-width:0;line-height:1.55}
  .tblwrap.text td,.tblwrap.text th{padding:7px 8px}
  .tblwrap.text td:nth-child(3){font-family:var(--han)}
  .tblwrap tr.grp td{background:#F3EEE1;font-weight:800;color:var(--accent-deep);white-space:normal}
  .tblnote{font-family:var(--han);font-size:13px;line-height:1.7;color:var(--soft-ink);margin:10px 0 0}
  .mesh{margin:10px 0 0;font-family:var(--sans);font-size:15px;line-height:2.1}
  .mesh .mterm{display:inline-block;margin:0 8px 8px 0;padding:5px 11px;border:1px solid var(--rule);
    border-radius:16px;background:var(--panel);cursor:pointer;font-size:14px;
    border-bottom:1px solid var(--rule);-webkit-tap-highlight-color:transparent}
  .mesh .mterm:hover{border-color:var(--res);background:#FBF6EA}
  .meshnote{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--soft-ink);margin:4px 0 14px}

  #pop{position:absolute;z-index:60;max-width:350px;background:var(--ink);color:#F3EEE3;border-radius:12px;
    padding:15px 17px;box-shadow:0 18px 40px -12px rgba(30,27,22,.55);display:none;font-family:var(--sans)}
  #pop.show{display:block}
  #pop .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:5px;margin-bottom:8px}
  #pop .tag.v{background:#5FC6D0;color:#04333a} #pop .tag.p{background:#C79EE0;color:#3a1f4a}
  #pop .tag.c{background:#8FCBA1;color:#123521} #pop .tag.f{background:#E0BC72;color:#2b1f08}
  #pop .tag.m{background:#E0BC72;color:#2b1f08}
  #pop .h{font-weight:800;font-size:15.5px;color:#fff;margin-bottom:2px}
  #pop .zh{font-family:var(--han);font-size:14px;color:#E7C58A;margin-bottom:9px;font-weight:600}
  #pop .d{font-size:13.5px;line-height:1.58;color:#DCD6C9}
  #pop .lvl{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;color:#A9A296;letter-spacing:.06em}
  #pop .arrow{position:absolute;width:14px;height:14px;background:var(--ink);transform:rotate(45deg)}
  #pop .close{position:absolute;top:8px;right:10px;background:none;border:0;color:#9a948a;font-size:20px;cursor:pointer;line-height:1;display:none}

  #scrim{position:fixed;inset:0;background:rgba(30,27,22,.34);z-index:40;display:none}
  #scrim.show{display:block}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:min(88vw,350px);background:var(--panel);z-index:50;
    transform:translateX(-101%);transition:transform .22s ease;display:flex;flex-direction:column;
    box-shadow:0 0 44px -8px rgba(30,27,22,.4)}
  #drawer.open{transform:none}
  .d-head{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--rule)}
  .d-sub{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent);margin:0 0 3px}
  .d-title{font-family:var(--sans);font-size:16px;font-weight:800;margin:0;line-height:1.3}
  .tabs{display:flex;border-bottom:1px solid var(--rule)}
  .tab{flex:1;font-family:var(--sans);font-size:12.5px;font-weight:600;padding:12px 3px;background:none;
    border:0;border-bottom:2px solid transparent;color:var(--soft-ink);cursor:pointer}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .d-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  .pane{display:none;padding:10px 0} .pane.on{display:block}

  .tocitem{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13.5px;line-height:1.45;
    padding:13px 20px;background:none;border:0;border-left:3px solid transparent;color:var(--ink);cursor:pointer}
  .tocitem:hover{background:var(--accent-tint)}
  .tocitem.cur{border-left-color:var(--accent);background:var(--accent-tint);font-weight:700}
  .tocitem.todo{color:#A9A396;cursor:default} .tocitem.todo:hover{background:none}
  .tocitem em{font-style:normal;color:var(--accent);font-size:11px;font-weight:700;display:block;margin-bottom:3px;letter-spacing:.05em}
  .tocitem.todo em{color:#BDB6A7}
  .tocitem .meta{display:block;font-size:11.5px;color:var(--soft-ink);margin-top:4px;font-weight:400}
  .tocitem.todo .meta{color:#BDB6A7}

  #q{width:calc(100% - 40px);margin:12px 20px 6px;font-family:var(--sans);font-size:14px;padding:10px 12px;
    border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--accent)}
  .qnote{font-family:var(--sans);font-size:11.5px;color:var(--soft-ink);padding:4px 20px 8px;margin:0}
  .hitrow{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
    padding:11px 20px;cursor:pointer;font-family:var(--sans)}
  .hitrow:hover{background:var(--accent-tint)}
  .hitrow .hr-ch{font-size:11px;color:var(--accent);font-weight:700;display:block;margin-bottom:3px}
  .hitrow .hr-sn{font-size:12.5px;line-height:1.5;color:var(--soft-ink)}
  .hitrow .hr-sn b{color:var(--ink);background:var(--hit);font-weight:400}

  .wbhead{font-family:var(--sans);font-size:11.5px;font-weight:800;letter-spacing:.08em;
    margin:18px 20px 10px;display:flex;align-items:center;gap:8px}
  .wbhead .pip{width:9px;height:9px;border-radius:3px;flex:none}
  .wbhead.v{color:#0d6870} .wbhead.v .pip{background:var(--word)}
  .wbhead.p{color:#6E4488} .wbhead.p .pip{background:var(--phrase)}
  .wbhead.c{color:#2f6042} .wbhead.c .pip{background:var(--gram)}
  .wbhead.f{color:#8a6420} .wbhead.f .pip{background:var(--res)}
  .wbhead .n{margin-left:auto;font-weight:600;color:var(--soft-ink);letter-spacing:0}
  .wb{padding:0 20px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
  .wb .t{font-family:var(--sans);font-weight:700}
  .wb .z{font-family:var(--han);color:var(--accent-deep);font-size:13px}
  .wb .x{display:block;font-family:var(--sans);color:var(--soft-ink);font-size:12px;margin-top:2px;line-height:1.5}

  .setrow{padding:16px 20px;border-bottom:1px solid var(--rule)}
  .setrow h4{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.06em;margin:0 0 10px;color:var(--soft-ink)}
  .sizes{display:flex;gap:8px}
  .sizes button{flex:1;font-family:var(--sans);font-size:12.5px;padding:9px 6px;border:1px solid var(--rule);
    background:none;border-radius:5px;cursor:pointer;color:var(--ink)}
  .sizes button.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}

  footer{margin:46px 0 60px;border-top:2px solid var(--ink);padding-top:14px;
    font-family:var(--sans);font-size:12px;color:var(--soft-ink);line-height:1.65}
  footer .strong{color:var(--ink);font-weight:700} footer .han{font-family:var(--han)}

  @media(max-width:600px){
    :root{--fs:18px}
    h1.title{font-size:26px}
    #pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;max-width:none;
      border-radius:16px 16px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom,0px))}
    #pop .arrow{display:none} #pop .close{display:block}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bar">
  <button class="iconbtn" id="menuBtn" aria-label="Contents">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div id="barTitle"></div>
  <button class="iconbtn" id="searchBtn" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
</div>

<div class="wrap">
  <header class="article">
    <div class="kicker" id="kicker"></div>
    <h1 class="title" id="pTitle"></h1>
    <div class="cite" id="pCite"></div>
  </header>

  <article id="body"></article>
  <div class="toolbar" id="ftBar">
    <button class="tbtn" id="ftBtn">Continue to the full text</button>
  </div>
  <article id="ftBody" hidden></article>

  <footer id="foot"></footer>
</div>

<div id="scrim"></div>

<aside id="drawer" aria-label="Contents and search">
  <div class="d-head">
    <p class="d-sub">InkQuest</p>
    <p class="d-title">Reading Room · Oral&nbsp;Health Papers</p>
  </div>
  <div class="tabs">
    <button class="tab on" data-pane="toc">Papers</button>
    <button class="tab" data-pane="search">Search</button>
    <button class="tab" data-pane="words">Words</button>
    <button class="tab" data-pane="set">Settings</button>
  </div>
  <div class="d-body">
    <div class="pane on" id="pane-toc"></div>
    <div class="pane" id="pane-search">
      <input id="q" type="search" placeholder="Search this paper&hellip;" autocomplete="off">
      <p class="qnote" id="qnote">Type at least two letters. 中英文都可以搜尋。</p>
      <div id="hits"></div>
    </div>
    <div class="pane" id="pane-words"></div>
    <div class="pane" id="pane-set">
      <div class="setrow">
        <h4>Text size 字級</h4>
        <div class="sizes" id="sizes">
          <button data-size="17">Small</button>
          <button data-size="19" class="on">Medium</button>
          <button data-size="22">Large</button>
        </div>
      </div>
      <div class="setrow">
        <h4>Translations 中譯</h4>
        <div class="sizes">
          <button id="openAllBtn">Open all 全部展開</button>
          <button id="closeAllBtn">Close all 全部收起</button>
        </div>
      </div>
    </div>
  </div>
</aside>

<div id="pop" role="dialog" aria-live="polite">
  <button class="close" id="popclose" aria-label="Close">&times;</button>
  <span class="tag" id="pop-tag"></span>
  <div class="h" id="pop-h"></div>
  <div class="zh" id="pop-zh"></div>
  <div class="d" id="pop-d"></div>
  <div class="lvl" id="pop-lvl"></div>
  <div class="arrow" id="pop-arrow"></div>
</div>

<script>
var PAPERS = [{"id": "yen2015", "no": "Paper 1", "part": "Abstract + full text", "short": "Denture wearing and quality of life in Taiwan", "title": "Impact of removable dentures on oral health-related quality of life among elderly adults in Taiwan", "titleZh": "活動假牙對台灣長者口腔健康相關生活品質的影響", "titleG": "論文標題通常沒有動詞，整個就是一個大名詞片語。拆法是找介系詞：<em>Impact of A on B among C</em> — A（活動假牙）對 B（口腔健康相關生活品質）在 C（台灣長者）身上的影響。看到 of / on / among / in 就切一刀，標題立刻變短。", "authors": "Yen Y-Y, Lee H-E, Wu Y-M, Lan S-J, Wang W-C, Du J-K, Huang S-T, Hsu K-J", "journal": "BMC Oral Health, 2015; 15:1", "doi": "10.1186/1472-6831-15-1", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "277 高雄長者、面對面問卷、橫斷式設計。跟您的題目最接近，第一篇就讀這篇。", "done": true, "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Although the use of removable dentures can improve oral function and esthetics for elderly people, compared to those who do not wear removable dentures, those wearing removable dentures could have worse oral health related-quality of life (OHRQoL).", "zh": "雖然配戴活動假牙可以改善長者的口腔功能與外觀，但與沒有配戴活動假牙的人相比，配戴活動假牙者的口腔健康相關生活品質（OHRQoL）反而可能較差。", "g": "這篇的第一句就是長句，但骨架只有一個：<em>Although A, B</em>。先找 B（主要子句）的主詞和動詞：<em>those wearing removable dentures</em>（主詞）+ <em>could have</em>（動詞）。中間那句 compared to... 是插入語，第一次讀先蓋住。長句不是難，是裝了很多註解；先拆出主詞動詞，句子就散了。"}, {"en": "Additional information is required to assess which factors related to denture wearing influence the OHRQoL of elderly individuals.", "zh": "我們還需要更多資料，才能評估與配戴假牙有關的哪些因素會影響長者的口腔健康相關生活品質。", "g": "<em>is required</em> 是被動語態。論文很少寫 “We need more information”，而是寫 “Additional information is required”——把人拿掉，只講事情。這是學術英文的基本語氣，您自己寫論文也會一直用到。"}, {"en": "The purpose of this study is to evaluate the association between denture wearing and OHRQoL in a sample of elderly individuals in Taiwan.", "zh": "本研究的目的是評估在台灣一組長者樣本中，配戴假牙與口腔健康相關生活品質之間的關聯。", "g": "<em>The purpose of this study is to + 原形動詞</em> 是論文最常見的句型之一，背下來直接可以用在自己的報告第一張投影片。另外記住 <em>association between A and B</em>（A 與 B 的關聯），介系詞固定用 between...and，不能換。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The study population included 277 elderly people wearing removable dentures (mean age = 76.0 years).", "zh": "研究對象包含 277 位配戴活動假牙的長者（平均年齡 76.0 歲）。", "g": "<em>wearing removable dentures</em> 是分詞片語，等於 <em>who wore removable dentures</em>，用來修飾前面的 277 elderly people。論文很愛這種省略關係代名詞的寫法，讀到「名詞 + Ving」就把它還原成 who...，意思馬上出來。"}, {"en": "Using face-to-face interviews, we collected data on the participants’ socio-demographic characteristics, dental care service usage (regular dental checkups, treatment during toothache, dental visits in the last year), and factors related to denture wearing (perceived oral pain, perceived loose denture, perceived oral ulcer, perceived halitosis, perceived dry mouth, and perceived total denture satisfaction scores).", "zh": "我們透過面對面訪談，收集了受訪者的社會人口特徵、牙科醫療服務使用情形（定期口腔檢查、牙痛時就醫、過去一年就診次數），以及與配戴假牙相關的因素（自覺口腔疼痛、自覺假牙鬆脫、自覺口腔潰瘍、自覺口臭、自覺口乾，以及自覺假牙整體滿意度分數）。", "g": "這句看起來嚇人，其實只有三塊：<em>we collected data on A, B, and C</em>。括號裡全部是舉例，第一次讀先跳過、拉出 A/B/C 三塊，句子立刻變短。還有一個關鍵字：<em>perceived</em>，是「受訪者自己覺得的」，不是牙醫檢查出來的，這篇全文反覆出現。"}, {"en": "OHRQoL was measured using the Taiwanese version of the Geriatric Oral Health Assessment Index (GOHAI-T).", "zh": "口腔健康相關生活品質以台灣版老年口腔健康評估指標（GOHAI-T）測量。", "g": "<em>was measured using...</em> 就是「用……來測量」。Methods 段落幾乎整段都是被動式：X was measured / was recorded / was performed。原因是重點在「做了什麼」，不是「誰做的」。寫自己論文的 Methods 時，直接套這個句型。"}, {"en": "The location and number of remaining natural teeth and the type of denture were also recorded.", "zh": "也記錄了剩餘天然牙的位置與數量，以及假牙的類型。", "g": "主詞很長：<em>The location and number of remaining natural teeth and the type of denture</em>，動詞是 <em>were also recorded</em>。主詞一長就容易看丟動詞，所以讀到 and 要先判斷：它是在串主詞，還是在串句子？"}, {"en": "Hierarchical multiple regression analysis was performed using GOHAI-T scores as the dependent variable.", "zh": "以 GOHAI-T 分數為依變項，進行階層式多元迴歸分析。", "g": "又是「被動 + using」。這裡要記一組詞：<em>dependent variable</em>（依變項）是被影響的那一個，其他預測因子叫 <em>independent variables</em>（自變項）。您的生統課會反覆用到這兩個字。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "All the predictors together accounted for 50% of the variance in GOHAI-T scores.", "zh": "所有預測因子合起來可以解釋 GOHAI-T 分數 50% 的變異。", "g": "<em>account for</em> 在這裡不是「解釋原因」，而是統計上的「解釋變異」。看到 <em>accounted for X% of the variance</em> 就直接理解成「解釋了 X%」，不用每次重新推。"}, {"en": "Further, education level, number of natural teeth, denture status, perceived loose denture, perceived oral ulcer, and perceived total denture satisfaction scores had statistically significant influences on OHRQoL.", "zh": "此外，教育程度、天然牙數目、假牙狀況、自覺假牙鬆脫、自覺口腔潰瘍，以及自覺假牙整體滿意度分數，對口腔健康相關生活品質有統計上顯著的影響。", "g": "六個並列主詞配一個動詞 <em>had</em>。讀這種長串列舉時，先找最後一個 <em>and</em>，就知道清單到哪裡結束，動詞緊接在後。搭配記住：<em>have an influence on</em>（對……有影響），介系詞用 on。"}, {"en": "When compared with other variables, factors related to denture wearing, especially perceived total denture satisfaction scores, had the greatest impact on GOHAI-T scores.", "zh": "與其他變項相比，與配戴假牙有關的因素——尤其是自覺假牙整體滿意度分數——對 GOHAI-T 分數的影響最大。", "g": "主詞是 <em>factors</em>，動詞是 <em>had</em>。中間 especially... 是插入補充，兩邊用逗號夾起來，可以先蓋住。最高級 <em>the greatest impact on</em> 前面一定要有 the。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Of the factors analyzed in this study, denture satisfaction was the strongest predictor of OHRQoL.", "zh": "在本研究分析的各項因素中，假牙滿意度是口腔健康相關生活品質最強的預測因子。", "g": "句首的 <em>Of the factors...</em> 等於 <em>Among the factors...</em>，意思是「在……之中」。這種倒裝開頭在結論句很常見，目的是先把範圍圈好再講重點。<em>analyzed</em> 是過去分詞，修飾 factors（被分析的因素）。"}, {"en": "This suggests that denture satisfaction is useful for assessing the effect of denture treatment on the OHRQoL of elderly individuals wearing removable dentures.", "zh": "這顯示假牙滿意度可用於評估假牙治療對配戴活動假牙長者口腔健康相關生活品質的影響。", "g": "<em>This suggests that...</em> 是結論段的標準收尾：不說「證明」，只說「顯示、暗示」。因為橫斷式研究不能講因果，所以用 suggests 而不是 proves——這是審查者最愛抓的點。另外：<em>useful for + Ving</em>，<em>the effect of A on B</em>（A 對 B 的影響）。"}]}], "fulltext": [{"h": "Background", "zh": "前言", "s": [{"en": "Because of the low fertility rate in Taiwan, the elderly population is rapidly increasing.", "zh": "由於台灣生育率偏低，老年人口正快速增加。", "g": "<em>Because of + 名詞</em>（因為某個東西），<em>Because + 句子</em>（因為某件事）。兩個不能混用，這是台灣學生最常寫錯的地方之一。"}, {"en": "By the end of 2026, people aged 65 years or over are expected to account for 20.1% of the total population of Taiwan, and, as such, there is a growing interest in helping the elderly to live a complete and healthy life, physically, mentally, and socially.", "zh": "預計到 2026 年底，65 歲以上人口將占台灣總人口的 20.1%，因此，如何協助長者在生理、心理與社會層面過完整而健康的生活，越來越受到重視。", "g": "<em>are expected to</em>（預計將會）是論文談趨勢與推估的標準說法，比 will 客氣，也比較安全。<em>account for</em> 在這裡是「占（多少比例）」，跟摘要裡統計上的「解釋變異」是同一個片語的不同用法——看上下文決定。"}, {"en": "Oral health is an important part of well-being, and oral health-related quality of life (OHRQoL) should be emphasized when providing dental care to elderly people.", "zh": "口腔健康是整體福祉的重要一環，在提供長者牙科照護時，應重視口腔健康相關生活品質。"}, {"en": "One of the most commonly used measures of OHRQoL is the Geriatric Oral Health Assessment Index (GOHAI), which was developed specifically for use with older adults.", "zh": "最常用的口腔健康相關生活品質測量工具之一是老年口腔健康評估指標（GOHAI），這是專為長者設計的量表。", "g": "<em>One of the most + 形容詞 + 複數名詞</em> 是介紹工具或方法的萬用開場。後面的 <em>which</em> 帶出補充說明，前面有逗號，代表這是額外資訊、不是限定，可以先跳過再回頭讀。"}, {"en": "Many previous studies have shown that implant-supported dentures can substantially improve the wearer’s quality of life; however, the higher cost of treatment with dental implants means that removable dentures continue to be widely used to replace missing teeth, especially in the elderly.", "zh": "許多先前研究顯示，植體支持式假牙能大幅改善配戴者的生活品質；然而，植牙治療費用較高，因此活動假牙仍被廣泛用來替代缺失的牙齒，長者尤其如此。", "g": "分號 <em>;</em> 加 <em>however</em> 是論文轉折的標準寫法：前半講好處，後半講現實限制。<em>Many previous studies have shown that...</em> 是文獻回顧的第一號句型，整篇會出現很多次。"}, {"en": "Unfortunately, individuals wearing a removable prosthesis can experience significant problems with regard to the social and emotional aspects of life, as compared to individuals with natural teeth.", "zh": "遺憾的是，與擁有天然牙的人相比，配戴活動補綴物者在生活的社交與情緒層面可能遭遇明顯的困擾。", "g": "<em>prosthesis</em>（補綴物）在這篇是 denture 的同義替換詞，論文常換字避免重複。讀的時候要意識到：換了字，講的還是同一件事。"}, {"en": "It may be difficult for some individuals to adapt to dentures, as wearing a removable prosthesis demands emotional and functional adjustments.", "zh": "有些人可能難以適應假牙，因為配戴活動補綴物需要在情緒與功能上做出調整。", "g": "<em>It is difficult for someone to do something</em>——這裡的 It 是虛主詞，真正的主詞是後面的 to adapt to dentures。中文沒有這個結構，所以很容易寫成 “Some people are difficult to adapt”（錯）。"}, {"en": "As such, elderly individuals wearing removable dentures may experience more OHRQoL impairments than do those who do not wear removable dentures.", "zh": "因此，配戴活動假牙的長者，其口腔健康相關生活品質受損的程度，可能高於未配戴活動假牙者。"}, {"en": "In elderly people, OHRQoL is known to be associated with socioeconomic status, regular dental visits, subjective masticatory ability, and the number of remaining natural teeth.", "zh": "在長者身上，口腔健康相關生活品質已知與社經地位、定期就診、主觀咀嚼能力，以及剩餘天然牙數目有關。", "g": "<em>be associated with</em>（與……有關聯）是本篇出現頻率最高的片語之一，整篇至少十幾次。注意它只講關聯，不講因果——這正是橫斷式研究能講的極限。"}, {"en": "Factors related to denture wearing that specifically affect the OHRQoL of elderly people wearing removable dentures include denture status, denture satisfaction, perceived loose denture, presence of oral pain, presence of oral ulcer, perceived halitosis and perceived dry mouth.", "zh": "特別會影響配戴活動假牙長者口腔健康相關生活品質的、與配戴假牙相關的因素，包括假牙狀況、假牙滿意度、自覺假牙鬆脫、口腔疼痛、口腔潰瘍、自覺口臭與自覺口乾。", "g": "這句的主詞從句首一路長到 <em>include</em> 才結束。訣竅：找到動詞 include，往前推的全部都是主詞。看到句子讀了兩行還沒出現動詞，就是遇到長主詞了，別慌，繼續往下找。"}, {"en": "Kuo et al. found that increased denture satisfaction was significantly related to an improvement in elderly patients’ OHRQoL.", "zh": "Kuo 等人發現，假牙滿意度提高與長者口腔健康相關生活品質的改善有顯著關聯。", "g": "<em>et al.</em> 是拉丁文 “and others” 的縮寫，唸作 /ˌet ˈæl/，中文就是「等人」。引用他人研究時的標準寫法：作者姓 + et al. + 過去式動詞（found / reported / showed）。"}, {"en": "In addition, Komagamine et al. showed a positive relationship between retention of the lower denture and OHRQoL, using the Oral Health Impact Profile (OHIP), in edentulous patients.", "zh": "此外，Komagamine 等人以口腔健康影響量表（OHIP）在無牙患者中，發現下顎假牙固位力與口腔健康相關生活品質之間呈正向關係。"}, {"en": "Moreover, Ekanayake et al. reported a significant association between halitosis and higher OHIP scores, indicating that people with halitosis had a worse OHRQoL than those who did not have halitosis.", "zh": "再者，Ekanayake 等人指出口臭與較高的 OHIP 分數之間有顯著關聯，顯示有口臭者的口腔健康相關生活品質比沒有口臭者差。", "g": "注意 OHIP 與 GOHAI 的分數方向相反：OHIP 分數越高代表生活品質越差，GOHAI 分數越高代表越好。讀到分數就要先確認方向，否則整段會理解顛倒。<em>indicating that...</em> 是分詞構句，等於 “which indicates that...”。"}, {"en": "In addition, a previous study indicated that elderly patients’ denture satisfaction is associated with health-related quality of life (HRQoL).", "zh": "此外，先前一項研究指出，長者的假牙滿意度與健康相關生活品質（HRQoL）有關。", "g": "注意兩個很像的縮寫：<em>OHRQoL</em> 是口腔健康相關生活品質，<em>HRQoL</em> 是整體健康相關生活品質，少一個 O，範圍大很多。這段刻意在比較兩者。"}, {"en": "However, Inoue et al. showed that HRQoL in patients with removable dentures was mediated by OHRQoL.", "zh": "然而，Inoue 等人顯示，配戴活動假牙者的健康相關生活品質是透過口腔健康相關生活品質而產生中介影響的。", "g": "<em>mediated by</em>（被……中介）是研究方法的專門用語：A 不是直接影響 C，而是先影響 B，再由 B 影響 C。B 就叫中介變項（mediator）。"}, {"en": "Moreover, Lee et al. observed that perceived oral health status, measured by the OHIP, had a greater impact on HRQoL than did the clinical factors, as measured by the 36-Item Short Form (SF-36) Health Survey.", "zh": "再者，Lee 等人觀察到，以 OHIP 測得的自覺口腔健康狀況，對健康相關生活品質的影響大於以 SF-36 健康量表測得的臨床因素。"}, {"en": "Therefore, it is important to assess the predictors of OHRQoL to improve HRQoL.", "zh": "因此，評估口腔健康相關生活品質的預測因子，對於改善整體健康相關生活品質相當重要。"}, {"en": "A previous study showed that although denture wearing could improve oral function and esthetics related to quality of life, people wearing removable dentures had a significantly higher median OHIP score than did those who do not wear removable dentures, indicating a poorer OHRQoL in the former group.", "zh": "先前一項研究顯示，雖然配戴假牙能改善與生活品質相關的口腔功能與外觀，但配戴活動假牙者的 OHIP 中位數分數顯著高於未配戴者，代表前者的口腔健康相關生活品質較差。", "g": "<em>the former</em> 指前面提到的兩者中的「前者」，相對的是 <em>the latter</em>（後者）。論文為了避免重複整串名詞常這樣用，讀到就要回頭確認它指誰。"}, {"en": "Hence, additional information is required to determine which factors related to denture wearing influence the OHRQoL of elderly subjects.", "zh": "因此，還需要更多資料來確定與配戴假牙相關的哪些因素會影響長者的口腔健康相關生活品質。", "g": "這句和摘要裡的第二句幾乎一模一樣，只換了 assess → determine。摘要本來就是全文的濃縮版，這種重疊很正常，也代表您讀懂摘要就等於掌握了骨架。"}, {"en": "Improved understanding of the factors correlated with a better OHRQoL would help in clinical decision making to provide dental treatment appropriate for patients’ specific needs and concerns.", "zh": "更了解哪些因素與較佳的口腔健康相關生活品質有關，有助於臨床決策，提供符合病人特定需求與顧慮的牙科治療。"}, {"en": "Although the relationship between variables related to denture wearing and OHRQoL has been investigated in previous studies, it is unclear which variable is the strongest predictor of OHRQoL.", "zh": "雖然先前研究已探討過與配戴假牙相關的變項和口腔健康相關生活品質之間的關係，但仍不清楚哪一個變項是最強的預測因子。", "g": "<em>Although 前人做過 A，但 B 仍不清楚</em>——這就是論文的「研究缺口」句型，幾乎每篇前言的倒數第二段都會出現。找到這句，就找到了整篇論文存在的理由。"}, {"en": "Therefore, in the current study, we aimed to address this gap in the literature.", "zh": "因此，本研究旨在填補文獻中的這個缺口。", "g": "<em>gap in the literature</em>（文獻缺口）是學術寫作的核心概念：別人沒做過的那一塊，就是您研究的立足點。<em>address a gap</em> 是固定搭配，不是 solve 也不是 fix。"}, {"en": "The research hypothesis was that denture satisfaction would be the strongest predictor of OHRQoL among the variables mentioned above that relate to wearing of removable dentures.", "zh": "研究假設是：在上述與配戴活動假牙相關的變項中，假牙滿意度會是口腔健康相關生活品質最強的預測因子。", "g": "<em>The research hypothesis was that...</em> 直接點名研究假設，後面用 <em>would be</em>（而不是 is），因為假設是還沒驗證的推測。這個時態選擇很重要，寫的時候別用錯。"}]}, {"h": "Methods · Participants", "zh": "研究方法 · 研究對象", "s": [{"en": "This was a cross-sectional study carried out from September 2009 to January 2010.", "zh": "本研究為橫斷式研究，執行期間自 2009 年 9 月至 2010 年 1 月。", "g": "<em>carried out</em> 是過去分詞，修飾前面的 study（被執行的研究），等於 “which was carried out”。這種省略在 Methods 幾乎每句都有。"}, {"en": "A convenience sample of elderly subjects aged 65 years or over who wore removable dentures was recruited from the Kaohsiung City Government Senior Citizens’ Service.", "zh": "研究以方便取樣，自高雄市政府長青服務單位招募 65 歲以上、配戴活動假牙的長者。", "g": "<em>convenience sample</em>（方便樣本）指的是「找得到誰就收誰」，不是隨機抽樣。這會限制結果推論的範圍，作者在討論段也自己承認了。這個詞您寫方法時會用到。"}, {"en": "Subjects were excluded from the study for the following reasons: 1. did not complete the questionnaire; 2. did not eat the foods listed in the questionnaire due to religious beliefs, vegetarianism, or other personal reasons; 3. had three or more incorrect answers on the Short Portable Mental Status Questionnaire (SPMSQ), indicating mild to severe intellectual impairment.", "zh": "以下情況者排除於研究之外：一、未完成問卷；二、因宗教信仰、素食或其他個人理由而不食用問卷所列食物；三、簡易心智狀態問卷（SPMSQ）答錯三題以上，代表有輕度至重度智能障礙。", "g": "<em>exclusion criteria</em>（排除條件）與 <em>inclusion criteria</em>（納入條件）是每篇量性研究都要交代的東西。您做問卷研究時，這一段是必寫的。"}, {"en": "Nine subjects were excluded from the study; five of them were vegetarian, three did not complete their questionnaire, and one additional subject had mild intellectual impairment.", "zh": "共九位受試者被排除：五位為素食者、三位未完成問卷，另一位有輕度智能障礙。"}, {"en": "In the present study, the SPMSQ was used to evaluate the participants’ ability to understand the questionnaire.", "zh": "本研究以 SPMSQ 評估受試者理解問卷的能力。", "g": "<em>In the present study</em>（在本研究中）是論文自我指稱的標準說法，比 “in our study” 正式。同義的還有 “in the current study”。"}, {"en": "The cognitive status of elderly individuals was defined as the number of wrong answers in the 10-question SPMSQ, whereby two or fewer incorrect answers indicate an intact cognitive status, three or four incorrect answers indicate mild intellectual impairment, and five or more incorrect answers indicate moderate to severe intellectual impairment.", "zh": "長者的認知狀態以十題 SPMSQ 的答錯題數定義：答錯兩題以內代表認知功能完整，答錯三至四題代表輕度智能障礙，答錯五題以上代表中度至重度智能障礙。", "g": "<em>was defined as</em>（被定義為）在 Methods 裡非常關鍵：它告訴讀者「這篇論文所說的 X，具體是指什麼」。讀論文時看到 defined as，一定要停下來看清楚。"}, {"en": "Written informed consent was obtained from all subjects prior to data collection.", "zh": "所有受試者於資料收集前均簽署書面知情同意書。", "g": "<em>informed consent</em>（知情同意）是研究倫理的核心，您送 IRB 時一定會用到這個詞。<em>prior to</em> = before，只是比較正式。"}, {"en": "Ethical approval was obtained from the Institutional Review Board at Chung-Ho Memorial Hospital, Kaohsiung Medical University.", "zh": "本研究經高雄醫學大學附設中和紀念醫院人體試驗委員會核准。", "g": "<em>Institutional Review Board（IRB）</em> 就是人體試驗審查委員會。您之後做問卷研究收人體資料，這一關跑不掉，指導教授一定會提。"}]}, {"h": "Methods · Questionnaire", "zh": "研究方法 · 問卷", "s": [{"en": "Information obtained by questionnaires included socio-demographic characteristics (age, gender, education level, living alone or with others, and the ability to afford living expenses), factors related to denture wearing (presence of oral pain, perceived loose denture, presence of oral ulcer, perceived halitosis, perceived dry mouth, and satisfaction with removable dentures), dental health service usage (regular dental checkups, treatment during toothache, dental visits in the last year), and OHRQoL, as measured using the GOHAI.", "zh": "問卷取得的資訊包括：社會人口特徵（年齡、性別、教育程度、獨居或與人同住、負擔生活費的能力）、與配戴假牙相關的因素（口腔疼痛、自覺假牙鬆脫、口腔潰瘍、自覺口臭、自覺口乾、對活動假牙的滿意度）、牙科醫療服務使用情形（定期口腔檢查、牙痛時就醫、過去一年就診次數），以及以 GOHAI 測量的口腔健康相關生活品質。", "g": "這是全篇最長的句子之一，但結構還是那招：<em>Information included A, B, C, and D</em>。括號一律先跳過，先數出有幾大塊，再回頭看細節。這個技巧在您上台報告前整理投影片時特別好用。"}, {"en": "OHRQoL was measured using the GOHAI, which was originally developed for use in older adult populations.", "zh": "口腔健康相關生活品質以 GOHAI 測量，該量表原本就是為長者族群設計的。"}, {"en": "The GOHAI instrument provides a score based on the answers to 12 questions associated with the following three domains of OHRQoL: physical function (PF), including eating, speech, and swallowing; psychosocial function (PSF), including worry or concern about oral health, dissatisfaction with appearance, self-consciousness about oral health, and avoidance of social contact because of oral problems; and pain or discomfort (PD), including the use of medication to relieve pain or discomfort in the mouth.", "zh": "GOHAI 依據十二題的作答給分，涵蓋口腔健康相關生活品質的三個面向：物理功能（PF），包含進食、說話與吞嚥；心理社會功能（PSF），包含對口腔健康的擔憂、對外觀的不滿、對口腔狀況的在意，以及因口腔問題而避免社交；以及疼痛或不適（PD），包含使用藥物緩解口腔疼痛或不適。", "g": "冒號後面用<em>分號</em>分隔三大項，是因為每一項裡面已經有逗號了。看到分號就知道：這是一層更大的切割。讀長列舉時先數分號，就知道有幾大類。"}, {"en": "Score ranges for the dimensions of physical function, psychosocial function, and pain or discomfort are 4–20, 5–25, and 3–15, respectively.", "zh": "物理功能、心理社會功能、疼痛或不適三個面向的分數範圍分別為 4–20、5–25 與 3–15。", "g": "<em>respectively</em>（分別地）是論文寫數據的必備字：前面列了 A、B、C，後面列 1、2、3，用 respectively 表示一一對應。順序絕對不能弄反。"}, {"en": "The original English version of the GOHAI was translated into Chinese for use with Taiwanese people (GOHAI-T).", "zh": "GOHAI 英文原版經翻譯為中文，供台灣民眾使用（GOHAI-T）。"}, {"en": "A panel of professional experts carried out and verified the translation and cross-cultural adaptation of the original English version.", "zh": "由專業專家小組執行並確認英文原版的翻譯與跨文化調適。", "g": "<em>cross-cultural adaptation</em>（跨文化調適）不只是翻譯，還要把題目調整成在地文化說得通的樣子。如果您的研究要用現成的英文量表，這一步是必要的，指導教授一定會問。"}, {"en": "Responses to GOHAI-T items were assessed using a 5-point Likert scale, ranging from 1 = always to 5 = never.", "zh": "GOHAI-T 各題以五點李克特量表計分，從 1 =「總是」到 5 =「從不」。", "g": "<em>Likert scale</em> 唸作 LIK-ert，不是 LIE-kert，這是最常唸錯的研究名詞之一。您的問卷十之八九也會用它。"}, {"en": "Total scores on the GOHAI-T were a summation of all individual scores obtained from the 12 items, with a higher score indicating a lower impact on OHRQoL.", "zh": "GOHAI-T 總分為十二題個別分數的加總，分數越高代表口腔健康相關生活品質受到的影響越小。", "g": "<em>with + 名詞 + Ving</em> 是論文最常用的補充結構：<em>with a higher score indicating...</em>（分數越高就表示……）。學會這個句型，您寫結果時可以少寫很多零碎的短句。"}, {"en": "Denture satisfaction was evaluated by a denture-satisfaction assessment (DSA).", "zh": "假牙滿意度以假牙滿意度評估表（DSA）評量。"}, {"en": "In previous studies in which the DSA was utilized, six questions were used to evaluate the level of subjects’ satisfaction with their removable dentures.", "zh": "在先前使用 DSA 的研究中，以六個題目評估受試者對活動假牙的滿意程度。"}, {"en": "The questions were related to tasting, retention (including upper and lower dentures), esthetics, comfort (including upper and lower dentures), appearance, ability to speak, and mastication ability.", "zh": "題目涵蓋味覺、固位（含上下顎假牙）、美觀、舒適度（含上下顎假牙）、外觀、說話能力與咀嚼能力。", "g": "這六題就是這篇論文測「滿意度」的具體內容。您自己要做假牙滿意度調查的話，這一句是可以直接拿來跟指導教授討論的起點：要不要沿用這六個面向？"}, {"en": "Subjects’ satisfaction was recorded using a 5-point Likert scale, wherein the scores ranged from 1 (very unsatisfied) to 5 (very satisfied).", "zh": "受試者的滿意度以五點李克特量表記錄，分數從 1（非常不滿意）至 5（非常滿意）。"}, {"en": "The scores for questions concerning retention and comfort of the dentures were calculated as average scores of the upper and lower dentures.", "zh": "關於假牙固位與舒適度的題目，其分數以上下顎假牙的平均分數計算。"}, {"en": "Subjects’ responses to the six questions were summed to obtain a total denture satisfaction score.", "zh": "六題的作答加總後即為假牙滿意度總分。"}, {"en": "The sum score can range from 6 to 30, with a higher score indicating more satisfaction with the dentures.", "zh": "總分範圍為 6 至 30 分，分數越高代表對假牙越滿意。"}], "tables": [{"no": "Table 1", "title": "English and Taiwanese versions of the GOHAI", "zh": "GOHAI 的英文版與台灣版題目", "head": [["#", "English question", "台灣版題目 (GOHAI-T)"]], "rows": [["1", "How often did you limit the kinds or amounts of food you eat because of problems with your teeth or dentures?", "您會因為牙齒或假牙問題限制所吃的食物種類或數量嗎？"], ["2", "How often did you have trouble biting or chewing any kinds of food, such as firm meat or apples?", "您有無法咀嚼食物（例如肉類或蘋果）的困擾嗎？"], ["3", "How often were you able to swallow comfortably?", "您能夠舒適的吞嚥食物嗎？"], ["4", "How often have your teeth or dentures prevented you from speaking the way you wanted?", "您有因為牙齒或假牙而妨礙說話嗎？"], ["5", "How often were you able to eat anything without feeling discomfort?", "您吃任何食物時不會感到不舒服嗎？"], ["6", "How often did you limit contacts with people because of the condition of your teeth or dentures?", "您會因為牙齒或假牙狀況不良而限制與人交往嗎？"], ["7", "How often were you pleased or happy with the looks of your teeth and gums, or dentures?", "您對牙齒、牙齦或假牙的外觀感滿意或愉快嗎？"], ["8", "How often did you use medication to relieve pain or discomfort from around your mouth?", "您使用藥物減緩口腔的疼痛或不適嗎？"], ["9", "How often were you worried or concerned about the problems with your teeth, gums, or dentures?", "您擔慮或關心牙齒、牙齦或假牙的問題嗎？"], ["10", "How often did you feel nervous or self-conscious because of problems with your teeth, gums, or dentures?", "您因為牙齒、牙齦或假牙問題，感到緊張或不自在、不舒適嗎？"], ["11", "How often did you feel uncomfortable eating in front of people because of problems with your teeth or dentures?", "您會因為牙齒或假牙問題，在別人面前吃東西感覺到不自在嗎？"], ["12", "How often were your teeth or gums sensitive to hot, cold, or sweets?", "您的牙齒或牙齦，對冷、熱或甜的食物會感覺敏感嗎？"]], "note": "計分：5=always（總是）、4=usually（經常）、3=occasionally（偶爾）、2=seldom（很少）、1=never（從不）。第 3、7、12 題為反向計分。右欄為該研究實際使用的台灣版 GOHAI-T 題目原文。對照左右兩欄很值得做：英文問 How often（多常），中文全部改成「嗎？」的是非問句，這是跨文化調適時常見的調整，不是翻譯錯誤。", "wrap": true}]}, {"h": "Methods · Dental examination", "zh": "研究方法 · 口腔檢查", "s": [{"en": "The dental examinations were carried out by one of the authors, a family dentistry specialist with 15 years of clinical experience, in accordance with the guidelines of the World Health Organization.", "zh": "口腔檢查由作者之一執行，該作者為具十五年臨床經驗的家庭牙醫專科醫師，檢查依世界衛生組織指引進行。", "g": "兩個逗號夾住的 <em>a family dentistry specialist with 15 years of clinical experience</em> 是同位語，用來說明前面的 one of the authors 是誰。看到「名詞，名詞，」的結構，中間那塊通常是在解釋前面那個人或物。"}, {"en": "Intra-examiner reliability (kappa coefficient) was assessed in a sample of 14 subjects during the data collection.", "zh": "檢查者內信度（kappa 係數）在資料收集期間以十四位受試者評估。", "g": "<em>intra-</em> 是「內部的」（同一個人前後兩次），<em>inter-</em> 是「之間的」（不同人之間）。差一個字母，意思完全不同。<em>kappa coefficient</em> 就是用來檢驗這種一致性的指標。"}, {"en": "The kappa coefficient for intra-examiner agreement was 0.90, which indicates a high level of agreement.", "zh": "檢查者內一致性的 kappa 係數為 0.90，代表一致性相當高。"}, {"en": "Information was collected on the location, number, and type of natural teeth, and the kind of dentures.", "zh": "收集了天然牙的位置、數量與類型，以及假牙的種類。"}, {"en": "Teeth that were sound, decayed, filled, or filled but decayed were marked as natural teeth.", "zh": "健康、齲齒、已填補，或已填補但再度齲壞的牙齒，均計為天然牙。", "g": "<em>sound</em> 在這裡不是「聲音」，是「健康完好的」。牙科文獻裡 sound tooth 就是健康牙。一字多義在專業文章裡很常見，靠上下文判斷。"}, {"en": "Teeth with grade III mobility, retained roots, or extensive crown destruction were excluded.", "zh": "第三度動搖的牙齒、殘留牙根，或牙冠嚴重破壞者則不計入。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "We explored the relationships among the variables using STATA version 13.0, with the significance level set at 5%.", "zh": "我們以 STATA 13.0 版探討各變項之間的關係，顯著水準設定為 5%。", "g": "<em>significance level set at 5%</em> 就是 α = 0.05，也就是 p 值小於 0.05 才算顯著。這是醫學研究的慣例門檻，您的生統課會從這裡開始講。"}, {"en": "Continuous variables and categorical variables are expressed as mean ± standard error (SE), counts (n), and percentages (%), respectively.", "zh": "連續變項以平均值±標準誤（SE）表示，類別變項則以個數（n）與百分比（%）表示。", "g": "<em>continuous variable</em>（連續變項，如年齡、分數）與 <em>categorical variable</em>（類別變項，如性別、假牙種類）是統計最基本的分類，決定後面能用哪種檢定。這兩個詞務必記牢。"}, {"en": "Bivariate analysis was used to compare GOHAI-T scores with socio-demographic characteristics, dentition and denture status, dental care service usage, and factors related to denture wearing.", "zh": "以雙變項分析比較 GOHAI-T 分數與社會人口特徵、齒列與假牙狀況、牙科服務使用情形，以及與配戴假牙相關因素之間的關係。", "g": "<em>bivariate</em>（雙變項）是一次只看兩個變項的關係；<em>multivariate / multiple</em>（多變項）是同時放很多個進去。論文通常先做雙變項篩一遍，再做多變項。"}, {"en": "A t-test and one-way analysis of variance were used to assess the distributions of GOHAI-T scores in relation to the categorical variables.", "zh": "以 t 檢定與單因子變異數分析評估 GOHAI-T 分數在各類別變項下的分布。", "g": "<em>t-test</em> 比較兩組，<em>one-way ANOVA</em>（單因子變異數分析）比較三組以上。挑錯檢定是口試最容易被問倒的地方，記住這個分界。"}, {"en": "Correlations between the GOHAI-T scores and continuous variables were evaluated using Spearman’s rank correlation analysis.", "zh": "GOHAI-T 分數與連續變項之間的相關性，以 Spearman 等級相關分析評估。"}, {"en": "The reliability of the GOHAI-T scale was evaluated using the internal consistency approach (Cronbach’s alpha) in the presence and absence of each item for the subjects.", "zh": "GOHAI-T 量表的信度以內部一致性法（Cronbach's alpha）評估，並分別檢視每一題加入與移除後的情形。", "g": "<em>reliability</em>（信度）是「量得穩不穩」，<em>validity</em>（效度）是「量得準不準」。兩個都要交代。Cronbach's alpha 是最常見的信度指標，一般 0.7 以上算可接受。"}, {"en": "Further, the convergent validity of the GOHAI-T was assessed using Spearman’s rank correlation coefficient by examining the correlation between GOHAI-T scores and self-rated oral health for all subjects.", "zh": "此外，以 Spearman 等級相關係數檢視全體受試者的 GOHAI-T 分數與自評口腔健康之間的相關性，藉此評估聚斂效度。", "g": "<em>convergent validity</em>（聚斂效度）的意思是：如果這個量表真的測到了它想測的東西，它應該和另一個測類似東西的指標高度相關。"}, {"en": "The test-retest correlation coefficient for the GOHAI-T was assessed by re-interviewing 30 elderly subjects 1 week after the first interview.", "zh": "重測信度則以三十位長者在首次訪談一週後再次受訪的結果評估。", "g": "<em>test-retest reliability</em>（重測信度）：同一批人隔一段時間再測一次，分數應該差不多。這是問卷研究的標準檢驗，您的量表如果是自編的，一定要做。"}, {"en": "Cronbach’s alpha for internal consistency was 0.801 for the total scale and ranged between 0.764 and 0.813 for each item.", "zh": "整體量表的內部一致性 Cronbach's alpha 為 0.801，各題介於 0.764 至 0.813 之間。"}, {"en": "The correlation coefficient for the GOHAI-T score and self-rated oral health was 0.356.", "zh": "GOHAI-T 分數與自評口腔健康的相關係數為 0.356。"}, {"en": "This supported the convergent validity and showed that a low GOHAI-T score, indicating a higher level of impairment of OHRQoL, was significantly associated with poor self-rated oral health.", "zh": "此結果支持聚斂效度，並顯示較低的 GOHAI-T 分數（代表口腔健康相關生活品質受損較嚴重）與較差的自評口腔健康顯著相關。"}, {"en": "The Spearman’s rank correlation coefficient for the test-retest was 0.797, indicating an acceptable level of reliability.", "zh": "重測的 Spearman 等級相關係數為 0.797，代表信度可接受。"}, {"en": "The internal consistency of the DSA (Cronbach’s alpha) was assessed in the presence and absence of each item for the subjects.", "zh": "DSA 的內部一致性（Cronbach's alpha）同樣以逐題加入與移除的方式評估。"}, {"en": "Cronbach’s alpha was 0.887 for the total scale and ranged between 0.857 and 0.881 for each item, indicating that the DSA had highly acceptable reliability.", "zh": "整體量表的 Cronbach's alpha 為 0.887，各題介於 0.857 至 0.881 之間，顯示 DSA 的信度相當良好。"}, {"en": "The convergent validity of the DSA was assessed by examining the correlation between total denture satisfaction scores and the general satisfaction of the sample subjects.", "zh": "DSA 的聚斂效度則透過檢視假牙滿意度總分與受試者整體滿意度之間的相關性來評估。"}, {"en": "The Spearman’s rank correlation coefficient was 0.7583, which supported the convergent validity and showed that a high total denture satisfaction score was significantly associated with good general denture satisfaction.", "zh": "Spearman 等級相關係數為 0.7583，支持聚斂效度，並顯示假牙滿意度總分越高，整體假牙滿意度也越好。"}, {"en": "Our data indicated that the skewness and kurtosis of the GOHAI-T distribution were −0.77 and 3.25, respectively, and that these values were more normalized than the square-root-transformed or log-transformed GOHAI-T distributions.", "zh": "資料顯示 GOHAI-T 分布的偏態與峰度分別為 −0.77 與 3.25，較平方根轉換或對數轉換後的分布更接近常態。", "g": "<em>skewness</em>（偏態）看分布左右歪不歪，<em>kurtosis</em>（峰度）看尖不尖。兩者都用來判斷資料是否接近常態分布，決定能不能用參數統計。"}, {"en": "Hence, the raw GOHAI-T scores were chosen for multiple linear regression analysis.", "zh": "因此，多元線性迴歸分析採用未經轉換的 GOHAI-T 原始分數。"}, {"en": "Moreover, we conducted a robust linear regression to confirm the analysis results and found that all the statistically significant variables were the same as those obtained using general multiple linear regression.", "zh": "此外，我們另以穩健線性迴歸驗證分析結果，發現所有達統計顯著的變項與一般多元線性迴歸的結果一致。", "g": "<em>robust</em> 在統計裡是「穩健的」，指這個方法比較不怕資料違反假設。用第二種方法重跑一次得到相同結果，叫 <em>sensitivity analysis</em>（敏感度分析），是加強說服力的常見做法。"}, {"en": "Robust regression methods are designed such that they are not overly affected by violations of assumptions by the underlying data-generating process.", "zh": "穩健迴歸法的設計，就是為了讓結果不會因為資料違反假設而受到過度影響。"}, {"en": "To assess the impacts of different blocks of predictors on OHRQoL, we conducted hierarchical multiple regression analysis using all independent predictors, with variance inflation factors under 5 to avoid multicollinearity in the whole model.", "zh": "為評估不同組預測因子對口腔健康相關生活品質的影響，我們以所有自變項進行階層式多元迴歸分析，並將變異數膨脹因子控制在 5 以下，以避免整體模型出現多重共線性。", "g": "<em>multicollinearity</em>（多重共線性）是指幾個自變項彼此太像，結果會不穩。<em>variance inflation factor（VIF）</em> 就是用來檢查它的指標，一般小於 5 或 10 算安全。"}, {"en": "The analysis was performed to determine the most predictive block of variables based on the GOHAI-T scores.", "zh": "此分析用以判斷哪一組變項對 GOHAI-T 分數最具預測力。"}, {"en": "The GOHAI-T score was used as a dependent variable and the blocks of independent variables were entered in the following steps: Step 1, socio-demographic characteristics; Step 2, dentition and denture status; Step 3, dental care service usage; Step 4, factors related to denture wearing.", "zh": "以 GOHAI-T 分數為依變項，自變項分組依序投入：第一步為社會人口特徵，第二步為齒列與假牙狀況，第三步為牙科服務使用情形，第四步為與配戴假牙相關的因素。", "g": "這就是「階層式」的意思：不是一次全部丟進去，而是一組一組加，看每加一組模型能多解釋多少。這個設計正是這篇論文能說「假牙相關因素最重要」的原因。"}, {"en": "R squared shows the percentage of variability in the dependent variable that can be accounted for by all predictors.", "zh": "R 平方代表所有預測因子能解釋依變項多少百分比的變異。"}, {"en": "The change in R squared can be used to measure the amount of predictive power added to the model by the addition of another block of variables in the next step.", "zh": "R 平方的變化量可用來衡量下一步加入另一組變項後，模型增加了多少預測力。", "g": "這就是摘要裡「加入假牙相關因素後多解釋了 40%」的來源。<em>ΔR²</em>（delta R squared）唸作 “change in R squared”，報告時直接說「R 平方增加了多少」即可。"}, {"en": "We compared the standardized regression coefficients of independent variables to determine their impact on the GOHAI-T scores.", "zh": "我們比較各自變項的標準化迴歸係數，以判斷它們對 GOHAI-T 分數的影響程度。", "g": "<em>standardized regression coefficient</em> 就是 beta（β）。因為各變項的單位不同（年齡是歲、分數是分），標準化之後才能互相比較誰的影響大。摘要說滿意度 β=0.45 最大，就是這樣比出來的。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Data were collected from 277 subjects who wore removable dentures.", "zh": "共自 277 位配戴活動假牙的受試者收集資料。"}, {"en": "More than half of them were women, the mean age was 76.8 years, two-thirds had a level of education of high school or above, the majority were living with others, and more than three-fourths were able to afford their living expenses.", "zh": "其中超過半數為女性，平均年齡 76.8 歲，三分之二具高中以上學歷，多數與他人同住，逾四分之三能負擔生活費用。", "g": "英文用分數表達比例的方式要熟：<em>two-thirds</em>（三分之二）、<em>three-fourths</em>（四分之三）。分子用基數、分母用序數，分子大於一時分母加 s。報告數據時常用。"}, {"en": "Further, the mean number of natural teeth was 7.8.", "zh": "此外，天然牙的平均數量為 7.8 顆。"}, {"en": "The distribution of the denture status was as follows: full-mouth complete denture, 24.9%; single complete denture, 24.9%; single partial denture, 24.6%; and full-mouth partial denture, 25.6%.", "zh": "假牙狀況分布如下：全口全口假牙 24.9%、單顎全口假牙 24.9%、單顎局部假牙 24.6%、全口局部假牙 25.6%。", "g": "<em>as follows</em>（如下）後面接冒號再列項目，是報告分布的標準寫法。注意四組比例都在 25% 左右，分布相當平均——這對後面的統計比較是好事。"}, {"en": "Those who had regular dental checkups, treatment during toothache, and dental visits in the last year accounted for 22.4%, 10.8%, and 39.4% of the population, respectively.", "zh": "有定期口腔檢查、牙痛時就醫，以及過去一年曾就診者，分別占 22.4%、10.8% 與 39.4%。"}, {"en": "Regarding factors related to denture wearing, 24 subjects always or often presented with oral pain, 51 perceived that they had a loose denture, 28 had an oral ulcer, 21 had perceived halitosis, 31 had perceived dry mouth, and the total denture satisfaction score was 19.0.", "zh": "在與配戴假牙相關的因素方面，24 位受試者經常或總是有口腔疼痛、51 位自覺假牙鬆脫、28 位有口腔潰瘍、21 位自覺有口臭、31 位自覺口乾，假牙滿意度總分為 19.0。", "g": "<em>Regarding...</em>（關於……）是切換話題的好用開場，等於 “With regard to” 或 “As for”。您上台報告換段落時可以直接用。"}, {"en": "Gender, education level, living status, ability to afford living expenses, denture status, regular dental checkups, treatment during toothache, and dental visits in the last year were not significantly associated with the GOHAI-T scores.", "zh": "性別、教育程度、居住狀況、負擔生活費能力、假牙狀況、定期口腔檢查、牙痛時就醫，以及過去一年就診情形，與 GOHAI-T 分數均無顯著關聯。", "g": "<em>were not significantly associated with</em>——注意「沒有顯著關聯」不等於「沒有關聯」，只是這份資料看不出來。這個分寸在寫討論時很重要，別把不顯著講成「證明無關」。"}, {"en": "However, subjects who had oral pain, perceived that they had a loose denture, had an oral ulcer, or perceived that they had halitosis had lower physical function and total GOHAI-T scores.", "zh": "然而，有口腔疼痛、自覺假牙鬆脫、有口腔潰瘍或自覺口臭的受試者，其物理功能分數與 GOHAI-T 總分均較低。"}, {"en": "Further, those who had perceived dry mouth had lower GOHAI-T scores.", "zh": "此外，自覺口乾者的 GOHAI-T 分數也較低。"}, {"en": "Denture satisfaction scores were positively associated with physical function, psychosocial function, pain or discomfort, and total GOHAI-T scores.", "zh": "假牙滿意度分數與物理功能、心理社會功能、疼痛或不適及 GOHAI-T 總分均呈正相關。", "g": "<em>positively associated</em>（正相關：一個高，另一個也高）對應的是 <em>negatively associated</em>（負相關）。報告結果時這兩個詞用錯，意思會完全相反。"}, {"en": "We also found that the physical function and psychosocial function scores were significantly lower for subjects with a lower number of natural teeth.", "zh": "我們也發現，天然牙數目較少的受試者，其物理功能與心理社會功能分數顯著較低。"}, {"en": "However, age was not significantly correlated with the GOHAI-T scores.", "zh": "然而，年齡與 GOHAI-T 分數並無顯著相關。"}, {"en": "Hierarchical multiple regression was performed to investigate the ability of factors related to denture wearing to predict GOHAI-T scores, after controlling for socio-demographic variables, dentition and denture status, and dental care service usage.", "zh": "在控制社會人口變項、齒列與假牙狀況及牙科服務使用情形後，以階層式多元迴歸探討與配戴假牙相關的因素對 GOHAI-T 分數的預測力。", "g": "<em>after controlling for...</em>（在控制……之後）是多變項分析的關鍵說法：意思是「把這些干擾因素的影響先扣掉」，剩下的才是我們想看的效果。"}, {"en": "Socio-demographic characteristics were entered in Model I, and this model was not statistically significant.", "zh": "第一個模型僅放入社會人口特徵，未達統計顯著。"}, {"en": "We added dentition and denture status to the socio-demographic characteristics in Model II, and the model as a whole explained a total of 12.4% of the variance.", "zh": "第二個模型加入齒列與假牙狀況後，整體模型解釋了 12.4% 的變異。"}, {"en": "The education level, number of natural teeth, and denture status were predictors of GOHAI-T scores.", "zh": "教育程度、天然牙數目與假牙狀況為 GOHAI-T 分數的預測因子。"}, {"en": "In Model III, factors related to denture wearing were added, and the total variance explained by the model increased to 52.4%.", "zh": "第三個模型加入與配戴假牙相關的因素後，模型解釋的總變異提高至 52.4%。", "g": "從 12.4% 一口氣跳到 52.4%——這一句就是整篇論文最重要的一個數字變化。您報告時如果只能講一張投影片，就講這裡。"}, {"en": "The introduction of factors related to denture wearing explained an additional 40.0% of the variance in GOHAI-T scores.", "zh": "加入與配戴假牙相關的因素後，額外解釋了 40.0% 的 GOHAI-T 分數變異。"}, {"en": "Dental care service usage was added in Model IV, and the total variance explained by the model was 53.3%.", "zh": "第四個模型再加入牙科服務使用情形，模型解釋的總變異為 53.3%。"}, {"en": "The introduction of dental care service usage explained an additional 0.9% of the variance in GOHAI-T scores.", "zh": "加入牙科服務使用情形僅額外解釋了 0.9% 的變異。", "g": "只多了 0.9%，等於幾乎沒有貢獻。論文用數字說話：不必寫「這個因素不重要」，把 0.9% 擺出來，讀者自己就看懂了。"}, {"en": "In the final model, 6 of 18 predictor variables were statistically significant, with denture satisfaction having a higher beta value than the remaining natural teeth, denture status, perceived loose denture, presence of oral ulcer, and educational level.", "zh": "在最終模型中，十八個預測變項有六個達統計顯著，其中假牙滿意度的 beta 值高於剩餘天然牙數、假牙狀況、自覺假牙鬆脫、口腔潰瘍與教育程度。"}], "tables": [{"no": "Table 2", "title": "Participants’ characteristics (N = 277)", "zh": "受試者基本特徵（N = 277）", "head": [["Variables", "n", "%"]], "rows": [["**Socio-demographic characteristics 社會人口特徵"], ["Gender 性別 — Male", "131", "47.3"], ["Gender — Female", "146", "52.7"], ["Age 65–69", "79", "28.5"], ["Age 70–79", "106", "38.3"], ["Age ≥80", "92", "33.2"], ["Age, mean ± SE (range)", "76.8 ± 0.4 (65–90)", ""], ["Education — Less than high school", "89", "32.1"], ["Education — High school or above", "188", "67.9"], ["Living status — Alone", "52", "18.8"], ["Living status — With others", "225", "81.2"], ["Able to afford living expenses — Yes", "218", "78.7"], ["Able to afford living expenses — No", "59", "21.3"], ["**Dentition and denture status 齒列與假牙狀況"], ["Remaining natural teeth, mean ± SE (range)", "7.78 ± 0.4 (0–26)", ""], ["Full-mouth complete denture", "69", "24.9"], ["Single complete denture", "69", "24.9"], ["Single partial denture", "68", "24.6"], ["Full-mouth partial denture", "71", "25.6"], ["**Dental care service usage 牙科服務使用"], ["Regular dental checkups", "62", "22.4"], ["Treatment during toothache", "30", "10.8"], ["Dental visits in the last year", "109", "39.4"], ["**Factors related to denture wearing 與配戴假牙相關的因素"], ["Presence of oral pain", "24", "8.7"], ["Perceived loose denture", "51", "18.4"], ["Presence of oral ulcer", "28", "10.1"], ["Perceived halitosis", "21", "7.6"], ["Perceived dry mouth", "31", "11.2"], ["Total denture satisfaction scores, mean ± SE (range)", "19.0 ± 0.3 (6–30)", ""], ["**Oral health related quality of life 口腔健康相關生活品質"], ["GOHAI-T scores", "47.8 ± 0.5 (22–60)", ""], ["Physical function", "14.3 ± 0.2 (4–20)", ""], ["Psychosocial function", "20.8 ± 0.3 (5–25)", ""], ["Pain and discomfort", "12.7 ± 0.1 (3–15)", ""]], "note": "這張表就是論文的「受試者長什麼樣子」。您自己寫論文時，Table 1 或 Table 2 幾乎一定是這種表。"}, {"no": "Table 3", "title": "Oral health-related quality of life in denture-wearing elderly subjects (N = 277)", "zh": "配戴假牙長者的口腔健康相關生活品質（N = 277）", "head": [["Variables", "Physical function (max 20)", "Psychosocial function (max 25)", "Pain and discomfort (max 15)", "GOHAI-T (max 60)"], ["", "Mean ± SE", "Mean ± SE", "Mean ± SE", "Mean ± SE"]], "rows": [["**Gender"], ["Male", "14.37 ± 0.31", "20.86 ± 0.36", "12.84 ± 0.16", "48.08 ± 0.67"], ["Female", "14.18 ± 0.32", "20.66 ± 0.37", "12.61 ± 0.19", "47.44 ± 0.72"], ["**Education level"], ["Less than high school", "14.16 ± 0.27", "20.53 ± 0.31", "12.63 ± 0.15", "47.32 ± 0.60"], ["High school or above", "14.53 ± 0.37", "21.26 ± 0.46", "12.94 ± 0.23", "48.73 ± 0.84"], ["**Living status"], ["Alone", "14.01 ± 0.24", "20.60 ± 0.29", "12.68 ± 0.14", "47.30 ± 0.55"], ["With others", "15.42 ± 0.49", "21.46 ± 0.53", "12.96 ± 0.30", "49.85 ± 1.03"], ["**Able to afford living expenses"], ["Yes", "14.39 ± 0.25", "20.92 ± 0.28", "12.89 ± 0.13", "48.20 ± 0.53"], ["No", "13.88 ± 0.48", "20.20 ± 0.63", "12.14 ± 0.33", "46.22 ± 1.18"], ["**Denture status"], ["Full-mouth complete denture", "13.91 ± 0.41", "20.67 ± 0.63", "13.23 ± 0.23", "47.81 ± 1.05"], ["Single complete denture"
