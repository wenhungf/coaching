p in the literature</em>（文獻缺口）是學術寫作的核心概念：別人沒做過的那一塊，就是研究的立足點。<em>address a gap</em> 是固定搭配，不是 solve 也不是 fix。"}, {"en": "The research hypothesis was that denture satisfaction would be the strongest predictor of OHRQoL among the variables mentioned above that relate to wearing of removable dentures.", "zh": "研究假設是：在上述與配戴活動假牙相關的變項中，假牙滿意度會是口腔健康相關生活品質最強的預測因子。", "g": "<em>The research hypothesis was that...</em> 直接點名研究假設，後面用 <em>would be</em>（而不是 is），因為假設是還沒驗證的推測。這個時態選擇很重要，寫的時候別用錯。"}]}, {"h": "Methods · Participants", "zh": "研究方法 · 研究對象", "s": [{"en": "This was a cross-sectional study carried out from September 2009 to January 2010.", "zh": "本研究為橫斷式研究，執行期間自 2009 年 9 月至 2010 年 1 月。", "g": "<em>carried out</em> 是過去分詞，修飾前面的 study（被執行的研究），等於 “which was carried out”。這種省略在 Methods 幾乎每句都有。"}, {"en": "A convenience sample of elderly subjects aged 65 years or over who wore removable dentures was recruited from the Kaohsiung City Government Senior Citizens’ Service.", "zh": "研究以方便取樣，自高雄市政府長青服務單位招募 65 歲以上、配戴活動假牙的長者。", "g": "<em>convenience sample</em>（方便樣本）指的是「找得到誰就收誰」，不是隨機抽樣。這會限制結果推論的範圍，作者在討論段也自己承認了。這個詞在寫方法時會用到。"}, {"en": "Subjects were excluded from the study for the following reasons: 1. did not complete the questionnaire; 2. did not eat the foods listed in the questionnaire due to religious beliefs, vegetarianism, or other personal reasons; 3. had three or more incorrect answers on the Short Portable Mental Status Questionnaire (SPMSQ), indicating mild to severe intellectual impairment.", "zh": "以下情況者排除於研究之外：一、未完成問卷；二、因宗教信仰、素食或其他個人理由而不食用問卷所列食物；三、簡易心智狀態問卷（SPMSQ）答錯三題以上，代表有輕度至重度智能障礙。", "g": "<em>exclusion criteria</em>（排除條件）與 <em>inclusion criteria</em>（納入條件）是每篇量性研究都要交代的東西。做問卷研究時，這一段是必寫的。"}, {"en": "Nine subjects were excluded from the study; five of them were vegetarian, three did not complete their questionnaire, and one additional subject had mild intellectual impairment.", "zh": "共九位受試者被排除：五位為素食者、三位未完成問卷，另一位有輕度智能障礙。"}, {"en": "In the present study, the SPMSQ was used to evaluate the participants’ ability to understand the questionnaire.", "zh": "本研究以 SPMSQ 評估受試者理解問卷的能力。", "g": "<em>In the present study</em>（在本研究中）是論文自我指稱的標準說法，比 “in our study” 正式。同義的還有 “in the current study”。"}, {"en": "The cognitive status of elderly individuals was defined as the number of wrong answers in the 10-question SPMSQ, whereby two or fewer incorrect answers indicate an intact cognitive status, three or four incorrect answers indicate mild intellectual impairment, and five or more incorrect answers indicate moderate to severe intellectual impairment.", "zh": "長者的認知狀態以十題 SPMSQ 的答錯題數定義：答錯兩題以內代表認知功能完整，答錯三至四題代表輕度智能障礙，答錯五題以上代表中度至重度智能障礙。", "g": "<em>was defined as</em>（被定義為）在 Methods 裡非常關鍵：它告訴讀者「這篇論文所說的 X，具體是指什麼」。讀論文時看到 defined as，一定要停下來看清楚。"}, {"en": "Written informed consent was obtained from all subjects prior to data collection.", "zh": "所有受試者於資料收集前均簽署書面知情同意書。", "g": "<em>informed consent</em>（知情同意）是研究倫理的核心，送 IRB 時一定會用到這個詞。<em>prior to</em> = before，只是比較正式。"}, {"en": "Ethical approval was obtained from the Institutional Review Board at Chung-Ho Memorial Hospital, Kaohsiung Medical University.", "zh": "本研究經高雄醫學大學附設中和紀念醫院人體試驗委員會核准。", "g": "<em>Institutional Review Board（IRB）</em> 就是人體試驗審查委員會。之後做問卷研究收人體資料，這一關跑不掉，指導教授一定會提。"}]}, {"h": "Methods · Questionnaire", "zh": "研究方法 · 問卷", "s": [{"en": "Information obtained by questionnaires included socio-demographic characteristics (age, gender, education level, living alone or with others, and the ability to afford living expenses), factors related to denture wearing (presence of oral pain, perceived loose denture, presence of oral ulcer, perceived halitosis, perceived dry mouth, and satisfaction with removable dentures), dental health service usage (regular dental checkups, treatment during toothache, dental visits in the last year), and OHRQoL, as measured using the GOHAI.", "zh": "問卷取得的資訊包括：社會人口特徵（年齡、性別、教育程度、獨居或與人同住、負擔生活費的能力）、與配戴假牙相關的因素（口腔疼痛、自覺假牙鬆脫、口腔潰瘍、自覺口臭、自覺口乾、對活動假牙的滿意度）、牙科醫療服務使用情形（定期口腔檢查、牙痛時就醫、過去一年就診次數），以及以 GOHAI 測量的口腔健康相關生活品質。", "g": "這是全篇最長的句子之一，但結構還是那招：<em>Information included A, B, C, and D</em>。括號一律先跳過，先數出有幾大塊，再回頭看細節。這個技巧在上台報告前整理投影片時特別好用。"}, {"en": "OHRQoL was measured using the GOHAI, which was originally developed for use in older adult populations.", "zh": "口腔健康相關生活品質以 GOHAI 測量，該量表原本就是為長者族群設計的。"}, {"en": "The GOHAI instrument provides a score based on the answers to 12 questions associated with the following three domains of OHRQoL: physical function (PF), including eating, speech, and swallowing; psychosocial function (PSF), including worry or concern about oral health, dissatisfaction with appearance, self-consciousness about oral health, and avoidance of social contact because of oral problems; and pain or discomfort (PD), including the use of medication to relieve pain or discomfort in the mouth.", "zh": "GOHAI 依據十二題的作答給分，涵蓋口腔健康相關生活品質的三個面向：物理功能（PF），包含進食、說話與吞嚥；心理社會功能（PSF），包含對口腔健康的擔憂、對外觀的不滿、對口腔狀況的在意，以及因口腔問題而避免社交；以及疼痛或不適（PD），包含使用藥物緩解口腔疼痛或不適。", "g": "冒號後面用<em>分號</em>分隔三大項，是因為每一項裡面已經有逗號了。看到分號就知道：這是一層更大的切割。讀長列舉時先數分號，就知道有幾大類。"}, {"en": "Score ranges for the dimensions of physical function, psychosocial function, and pain or discomfort are 4–20, 5–25, and 3–15, respectively.", "zh": "物理功能、心理社會功能、疼痛或不適三個面向的分數範圍分別為 4–20、5–25 與 3–15。", "g": "<em>respectively</em>（分別地）是論文寫數據的必備字：前面列了 A、B、C，後面列 1、2、3，用 respectively 表示一一對應。順序絕對不能弄反。"}, {"en": "The original English version of the GOHAI was translated into Chinese for use with Taiwanese people (GOHAI-T).", "zh": "GOHAI 英文原版經翻譯為中文，供台灣民眾使用（GOHAI-T）。"}, {"en": "A panel of professional experts carried out and verified the translation and cross-cultural adaptation of the original English version.", "zh": "由專業專家小組執行並確認英文原版的翻譯與跨文化調適。", "g": "<em>cross-cultural adaptation</em>（跨文化調適）不只是翻譯，還要把題目調整成在地文化說得通的樣子。若研究要用現成的英文量表，這一步是必要的，指導教授一定會問。"}, {"en": "Responses to GOHAI-T items were assessed using a 5-point Likert scale, ranging from 1 = always to 5 = never.", "zh": "GOHAI-T 各題以五點李克特量表計分，從 1 =「總是」到 5 =「從不」。", "g": "<em>Likert scale</em> 唸作 LIK-ert，不是 LIE-kert，這是最常唸錯的研究名詞之一。問卷十之八九也會用它。"}, {"en": "Total scores on the GOHAI-T were a summation of all individual scores obtained from the 12 items, with a higher score indicating a lower impact on OHRQoL.", "zh": "GOHAI-T 總分為十二題個別分數的加總，分數越高代表口腔健康相關生活品質受到的影響越小。", "g": "<em>with + 名詞 + Ving</em> 是論文最常用的補充結構：<em>with a higher score indicating...</em>（分數越高就表示……）。學會這個句型，寫結果時可以少寫很多零碎的短句。"}, {"en": "Denture satisfaction was evaluated by a denture-satisfaction assessment (DSA).", "zh": "假牙滿意度以假牙滿意度評估表（DSA）評量。"}, {"en": "In previous studies in which the DSA was utilized, six questions were used to evaluate the level of subjects’ satisfaction with their removable dentures.", "zh": "在先前使用 DSA 的研究中，以六個題目評估受試者對活動假牙的滿意程度。"}, {"en": "The questions were related to tasting, retention (including upper and lower dentures), esthetics, comfort (including upper and lower dentures), appearance, ability to speak, and mastication ability.", "zh": "題目涵蓋味覺、固位（含上下顎假牙）、美觀、舒適度（含上下顎假牙）、外觀、說話能力與咀嚼能力。", "g": "這六題是假牙滿意度的具體內容。新題目不以滿意度為主軸，這一段可略讀，知道有這套工具即可。"}, {"en": "Subjects’ satisfaction was recorded using a 5-point Likert scale, wherein the scores ranged from 1 (very unsatisfied) to 5 (very satisfied).", "zh": "受試者的滿意度以五點李克特量表記錄，分數從 1（非常不滿意）至 5（非常滿意）。"}, {"en": "The scores for questions concerning retention and comfort of the dentures were calculated as average scores of the upper and lower dentures.", "zh": "關於假牙固位與舒適度的題目，其分數以上下顎假牙的平均分數計算。"}, {"en": "Subjects’ responses to the six questions were summed to obtain a total denture satisfaction score.", "zh": "六題的作答加總後即為假牙滿意度總分。"}, {"en": "The sum score can range from 6 to 30, with a higher score indicating more satisfaction with the dentures.", "zh": "總分範圍為 6 至 30 分，分數越高代表對假牙越滿意。"}], "tables": [{"no": "Table 1", "title": "English and Taiwanese versions of the GOHAI", "zh": "GOHAI 的英文版與台灣版題目", "head": [["#", "English question", "台灣版題目 (GOHAI-T)"]], "rows": [["1", "How often did you limit the kinds or amounts of food you eat because of problems with your teeth or dentures?", "您會因為牙齒或假牙問題限制所吃的食物種類或數量嗎？"], ["2", "How often did you have trouble biting or chewing any kinds of food, such as firm meat or apples?", "您有無法咀嚼食物（例如肉類或蘋果）的困擾嗎？"], ["3", "How often were you able to swallow comfortably?", "您能夠舒適的吞嚥食物嗎？"], ["4", "How often have your teeth or dentures prevented you from speaking the way you wanted?", "您有因為牙齒或假牙而妨礙說話嗎？"], ["5", "How often were you able to eat anything without feeling discomfort?", "您吃任何食物時不會感到不舒服嗎？"], ["6", "How often did you limit contacts with people because of the condition of your teeth or dentures?", "您會因為牙齒或假牙狀況不良而限制與人交往嗎？"], ["7", "How often were you pleased or happy with the looks of your teeth and gums, or dentures?", "您對牙齒、牙齦或假牙的外觀感滿意或愉快嗎？"], ["8", "How often did you use medication to relieve pain or discomfort from around your mouth?", "您使用藥物減緩口腔的疼痛或不適嗎？"], ["9", "How often were you worried or concerned about the problems with your teeth, gums, or dentures?", "您擔慮或關心牙齒、牙齦或假牙的問題嗎？"], ["10", "How often did you feel nervous or self-conscious because of problems with your teeth, gums, or dentures?", "您因為牙齒、牙齦或假牙問題，感到緊張或不自在、不舒適嗎？"], ["11", "How often did you feel uncomfortable eating in front of people because of problems with your teeth or dentures?", "您會因為牙齒或假牙問題，在別人面前吃東西感覺到不自在嗎？"], ["12", "How often were your teeth or gums sensitive to hot, cold, or sweets?", "您的牙齒或牙齦，對冷、熱或甜的食物會感覺敏感嗎？"]], "note": "計分：5=always（總是）、4=usually（經常）、3=occasionally（偶爾）、2=seldom（很少）、1=never（從不）。第 3、7、12 題為反向計分。右欄為該研究實際使用的台灣版 GOHAI-T 題目原文。對照左右兩欄很值得做：英文問 How often（多常），中文全部改成「嗎？」的是非問句，這是跨文化調適時常見的調整，不是翻譯錯誤。"}]}, {"h": "Methods · Dental examination", "zh": "研究方法 · 口腔檢查", "s": [{"en": "The dental examinations were carried out by one of the authors, a family dentistry specialist with 15 years of clinical experience, in accordance with the guidelines of the World Health Organization.", "zh": "口腔檢查由作者之一執行，該作者為具十五年臨床經驗的家庭牙醫專科醫師，檢查依世界衛生組織指引進行。", "g": "兩個逗號夾住的 <em>a family dentistry specialist with 15 years of clinical experience</em> 是同位語，用來說明前面的 one of the authors 是誰。看到「名詞，名詞，」的結構，中間那塊通常是在解釋前面那個人或物。"}, {"en": "Intra-examiner reliability (kappa coefficient) was assessed in a sample of 14 subjects during the data collection.", "zh": "檢查者內信度（kappa 係數）在資料收集期間以十四位受試者評估。", "g": "<em>intra-</em> 是「內部的」（同一個人前後兩次），<em>inter-</em> 是「之間的」（不同人之間）。差一個字母，意思完全不同。<em>kappa coefficient</em> 就是用來檢驗這種一致性的指標。"}, {"en": "The kappa coefficient for intra-examiner agreement was 0.90, which indicates a high level of agreement.", "zh": "檢查者內一致性的 kappa 係數為 0.90，代表一致性相當高。", "g": "<em>kappa</em>（唸 KAP-uh）不是單純算「兩次答案一樣的比例」，而是先把「純靠運氣也會猜對」的部分扣掉，剩下的才算真正的一致。所以 kappa 一定比單純的一致率低。判讀慣例：0.81–1.00 幾近完全一致、0.61–0.80 高度一致、0.41–0.60 中度。本研究 0.90，代表同一位牙醫前後兩次檢查幾乎一樣，資料可信。<br><br>順帶注意原文最後寫 inter-examiner（檢查者之間），但前一句講的是 intra-examiner（同一人前後兩次），只有一位檢查者的研究不可能有 inter-。這是論文自己的小筆誤，讀到前後不一致時要敢懷疑，不要以為是自己看錯。"}, {"en": "Information was collected on the location, number, and type of natural teeth, and the kind of dentures.", "zh": "收集了天然牙的位置、數量與類型，以及假牙的種類。"}, {"en": "Teeth that were sound, decayed, filled, or filled but decayed were marked as natural teeth.", "zh": "健康、齲齒、已填補，或已填補但再度齲壞的牙齒，均計為天然牙。", "g": "<em>sound</em> 在這裡不是「聲音」，是「健康完好的」。牙科文獻裡 sound tooth 就是健康牙。一字多義在專業文章裡很常見，靠上下文判斷。"}, {"en": "Teeth with grade III mobility, retained roots, or extensive crown destruction were excluded.", "zh": "第三度動搖的牙齒、殘留牙根，或牙冠嚴重破壞者則不計入。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "We explored the relationships among the variables using STATA version 13.0, with the significance level set at 5%.", "zh": "我們以 STATA 13.0 版探討各變項之間的關係，顯著水準設定為 5%。", "g": "這一段是全篇最難的一段，但它其實只在回答三個問題：用什麼軟體、資料長什麼樣子、用哪些方法算。<em>significance level set at 5%</em> 就是 α = 0.05：p 值小於 0.05 才算「有差」。為什麼是 5%？沒有科學理由，是醫學界沿用下來的慣例。"}, {"en": "Continuous variables and categorical variables are expressed as mean ± standard error (SE), counts (n), and percentages (%), respectively.", "zh": "連續變項以平均值±標準誤（SE）表示，類別變項則以個數（n）與百分比（%）表示。", "g": "第一步永遠是交代資料型態，因為它決定後面能用什麼方法。<em>continuous</em>（連續，如年齡、分數）配平均值±標準誤；<em>categorical</em>（類別，如性別、假牙種類）配個數與百分比。挑錯了，統計就錯了。順序記住：respectively 表示前後一一對應。"}, {"en": "Bivariate analysis was used to compare GOHAI-T scores with socio-demographic characteristics, dentition and denture status, dental care service usage, and factors related to denture wearing.", "zh": "以雙變項分析比較 GOHAI-T 分數與社會人口特徵、齒列與假牙狀況、牙科服務使用情形，以及與配戴假牙相關因素之間的關係。", "g": "<em>Bivariate</em> = bi（二）+ variate（變項），一次只看兩個。這是第一輪粗篩：先看每個因素單獨跟 GOHAI-T 有沒有關係，還不管其他因素的干擾。後面的多變項分析才是精算。研究通常「先粗篩、再精算」兩步走。"}, {"en": "A t-test and one-way analysis of variance were used to assess the distributions of GOHAI-T scores in relation to the categorical variables.", "zh": "以 t 檢定與單因子變異數分析評估 GOHAI-T 分數在各類別變項下的分布。", "g": "這裡是挑檢定的分界線，考試最愛問：兩組用 <em>t-test</em>，三組以上用 <em>one-way ANOVA</em>。例如比較男女（兩組）用 t 檢定；比較四種假牙狀況（四組）就得用 ANOVA。用錯了審查者一眼就看出來。"}, {"en": "Correlations between the GOHAI-T scores and continuous variables were evaluated using Spearman’s rank correlation analysis.", "zh": "GOHAI-T 分數與連續變項之間的相關性，以 Spearman 等級相關分析評估。", "g": "連續變項之間要看關聯，就用相關分析。這裡選 <em>Spearman</em>（等級相關）而不是 Pearson，因為資料不一定呈常態分布。Spearman 先把數值換成排名再算，比較耐得住不漂亮的資料。"}, {"en": "The reliability of the GOHAI-T scale was evaluated using the internal consistency approach (Cronbach’s alpha) in the presence and absence of each item for the subjects.", "zh": "GOHAI-T 量表的信度以內部一致性法（Cronbach's alpha）評估，並分別檢視每一題加入與移除後的情形。", "g": "接下來四句在做同一件事：證明「我的量表是可信的」。<em>internal consistency</em>（內部一致性）問的是：這 12 題是不是都在量同一個東西？做法是把每一題輪流拿掉再算一次，看結果有沒有大變。"}, {"en": "Further, the convergent validity of the GOHAI-T was assessed using Spearman’s rank correlation coefficient by examining the correlation between GOHAI-T scores and self-rated oral health for all subjects.", "zh": "此外，以 Spearman 等級相關係數檢視全體受試者的 GOHAI-T 分數與自評口腔健康之間的相關性，藉此評估聚斂效度。", "g": "<em>convergent validity</em>（聚斂效度）的邏輯是：如果我的量表真的測到口腔生活品質，那它應該跟「自評口腔健康」高度相關。用另一個相近的指標來互相印證，這就叫聚斂。"}, {"en": "The test-retest correlation coefficient for the GOHAI-T was assessed by re-interviewing 30 elderly subjects 1 week after the first interview.", "zh": "重測信度則以三十位長者在首次訪談一週後再次受訪的結果評估。", "g": "<em>test-retest</em>（重測）：同一批人隔一週再問一次。如果兩次分數差很多，就不是受試者變了，而是量表不穩。這裡只抽 30 人重測，是常見做法。"}, {"en": "Cronbach’s alpha for internal consistency was 0.801 for the total scale and ranged between 0.764 and 0.813 for each item.", "zh": "整體量表的內部一致性 Cronbach's alpha 為 0.801，各題介於 0.764 至 0.813 之間。", "g": "<em>Cronbach's alpha</em> 是內部一致性最常報的數字：0.7 以上可接受，0.8 以上算好。這裡 0.801，而且逐題檢查都在 0.764–0.813 之間，代表沒有哪一題是拖累整體的問題題。"}, {"en": "The correlation coefficient for the GOHAI-T score and self-rated oral health was 0.356.", "zh": "GOHAI-T 分數與自評口腔健康的相關係數為 0.356。", "g": "0.356 這個數字本身不算高，但在效度檢驗裡不需要很高——只要方向對、達顯著就夠了。過高反而可疑（代表兩個工具在量完全一樣的東西，其中一個就多餘了）。"}, {"en": "This supported the convergent validity and showed that a low GOHAI-T score, indicating a higher level of impairment of OHRQoL, was significantly associated with poor self-rated oral health.", "zh": "此結果支持聚斂效度，並顯示較低的 GOHAI-T 分數（代表口腔健康相關生活品質受損較嚴重）與較差的自評口腔健康顯著相關。", "g": "這句在解讀上一句的數字。注意 GOHAI 的方向：<em>分數低 = 生活品質受損嚴重</em>。所以「低分與自評口腔健康差相關」是合理的，方向對得上，效度成立。這個方向如果搞反，整段都會誤讀。"}, {"en": "The Spearman’s rank correlation coefficient for the test-retest was 0.797, indicating an acceptable level of reliability.", "zh": "重測的 Spearman 等級相關係數為 0.797，代表信度可接受。", "g": "重測相關 0.797，接近 0.8，作者說 acceptable（可接受）。學術英文很少講「很好」，通常用 acceptable、satisfactory 這類保守字眼。"}, {"en": "The internal consistency of the DSA (Cronbach’s alpha) was assessed in the presence and absence of each item for the subjects.", "zh": "DSA 的內部一致性（Cronbach's alpha）同樣以逐題加入與移除的方式評估。", "g": "換一個量表（DSA，假牙滿意度）重跑同一套檢驗。論文只要用了兩個量表，兩個都得各自交代信度與效度，不能只做一個。"}, {"en": "Cronbach’s alpha was 0.887 for the total scale and ranged between 0.857 and 0.881 for each item, indicating that the DSA had highly acceptable reliability.", "zh": "整體量表的 Cronbach's alpha 為 0.887，各題介於 0.857 至 0.881 之間，顯示 DSA 的信度相當良好。", "g": "DSA 的 alpha 0.887 比 GOHAI-T 的 0.801 更高。<em>highly acceptable</em>（相當良好）是作者對這個數字的評語——同樣是保守用詞，但比上面的 acceptable 高一階。"}, {"en": "The convergent validity of the DSA was assessed by examining the correlation between total denture satisfaction scores and the general satisfaction of the sample subjects.", "zh": "DSA 的聚斂效度則透過檢視假牙滿意度總分與受試者整體滿意度之間的相關性來評估。", "g": "DSA 的聚斂效度做法：拿「六題加總的滿意度總分」跟「整體滿意度」比。邏輯跟前面一樣：細項加起來，應該跟總體印象一致。"}, {"en": "The Spearman’s rank correlation coefficient was 0.7583, which supported the convergent validity and showed that a high total denture satisfaction score was significantly associated with good general denture satisfaction.", "zh": "Spearman 等級相關係數為 0.7583，支持聚斂效度，並顯示假牙滿意度總分越高，整體假牙滿意度也越好。", "g": "0.7583 相當高，支持效度。注意這裡的數字比 GOHAI-T 的 0.356 高很多，因為這兩個比的東西本來就更接近（都在問滿意度）。"}, {"en": "Our data indicated that the skewness and kurtosis of the GOHAI-T distribution were −0.77 and 3.25, respectively, and that these values were more normalized than the square-root-transformed or log-transformed GOHAI-T distributions.", "zh": "資料顯示 GOHAI-T 分布的偏態與峰度分別為 −0.77 與 3.25，較平方根轉換或對數轉換後的分布更接近常態。", "g": "<em>skewness</em>（偏態）看分布左右歪不歪，<em>kurtosis</em>（峰度）看尖不尖。目的是判斷資料夠不夠接近常態。作者試了平方根與對數兩種轉換，發現原始分數反而最接近常態——所以不轉換。"}, {"en": "Hence, the raw GOHAI-T scores were chosen for multiple linear regression analysis.", "zh": "因此，多元線性迴歸分析採用未經轉換的 GOHAI-T 原始分數。", "g": "<em>raw</em> 就是「未經處理的原始的」。上一句試了轉換後不如原始資料，所以這句決定用 raw scores。研究方法常這樣寫：先說試了什麼、比較結果，再說最後選哪個。"}, {"en": "Moreover, we conducted a robust linear regression to confirm the analysis results and found that all the statistically significant variables were the same as those obtained using general multiple linear regression.", "zh": "此外，我們另以穩健線性迴歸驗證分析結果，發現所有達統計顯著的變項與一般多元線性迴歸的結果一致。", "g": "這是在做<em>敏感度分析</em>：換一種方法重跑，看結論會不會變。兩種方法得到同一批顯著變項，說服力就強很多。口試如果被問「你怎麼知道結果可靠」，這就是標準答法之一。"}, {"en": "Robust regression methods are designed such that they are not overly affected by violations of assumptions by the underlying data-generating process.", "zh": "穩健迴歸法的設計，就是為了讓結果不會因為資料違反假設而受到過度影響。", "g": "這句在解釋上一句為什麼要用 robust regression：它比較不怕資料違反假設。<em>violations of assumptions</em>（違反假設前提）是統計最常見的問題——每個檢定都有前提，資料不一定滿足。"}, {"en": "To assess the impacts of different blocks of predictors on OHRQoL, we conducted hierarchical multiple regression analysis using all independent predictors, with variance inflation factors under 5 to avoid multicollinearity in the whole model.", "zh": "為評估不同組預測因子對口腔健康相關生活品質的影響，我們以所有自變項進行階層式多元迴歸分析，並將變異數膨脹因子控制在 5 以下，以避免整體模型出現多重共線性。", "g": "整段的核心句。<em>blocks</em>（區塊）是關鍵：不是一次把 18 個變項全丟進去，而是分成四組、一組一組加。<em>VIF under 5</em> 是在防多重共線性——避免兩個太像的變項互相干擾。"}, {"en": "The analysis was performed to determine the most predictive block of variables based on the GOHAI-T scores.", "zh": "此分析用以判斷哪一組變項對 GOHAI-T 分數最具預測力。", "g": "<em>most predictive block</em>（最具預測力的那一組）點明了整篇論文真正想比的東西：不是比哪個變項最強，而是比哪一「組」最強。答案是第三組，也就是與配戴假牙相關的因素。"}, {"en": "The GOHAI-T score was used as a dependent variable and the blocks of independent variables were entered in the following steps: Step 1, socio-demographic characteristics; Step 2, dentition and denture status; Step 3, dental care service usage; Step 4, factors related to denture wearing.", "zh": "以 GOHAI-T 分數為依變項，自變項分組依序投入：第一步為社會人口特徵，第二步為齒列與假牙狀況，第三步為牙科服務使用情形，第四步為與配戴假牙相關的因素。", "g": "四個步驟的順序不是隨便排的：從最難改變的（年齡、教育程度）排到最能改變的（假牙相關因素）。這樣最後一組增加的解釋力，才能解讀成「臨床上可以介入的部分」。這個設計邏輯值得寫論文時借用。"}, {"en": "R squared shows the percentage of variability in the dependent variable that can be accounted for by all predictors.", "zh": "R 平方代表所有預測因子能解釋依變項多少百分比的變異。", "g": "<em>R²</em>（R squared）唸作 “R squared”，就是模型的解釋力，0 到 1 之間。0.53 代表這個模型解釋了 53% 的變異，剩下 47% 是這些變項以外的原因。"}, {"en": "The change in R squared can be used to measure the amount of predictive power added to the model by the addition of another block of variables in the next step.", "zh": "R 平方的變化量可用來衡量下一步加入另一組變項後，模型增加了多少預測力。", "g": "<em>ΔR²</em>（delta R squared，R 平方的變化量）是階層式迴歸的靈魂。每加一組變項，看 R² 往上跳多少，就知道那一組貢獻多少。摘要說「多解釋 40%」正是從這裡來的。報告時直接講「R 平方增加了 40%」就好。"}, {"en": "We compared the standardized regression coefficients of independent variables to determine their impact on the GOHAI-T scores.", "zh": "我們比較各自變項的標準化迴歸係數，以判斷它們對 GOHAI-T 分數的影響程度。", "g": "最後一句解釋怎麼比出「誰最強」。因為年齡的單位是歲、滿意度的單位是分，數字不能直接比大小，得先<em>標準化</em>成 beta（β）。β 最大的那個就是最強的預測因子——本研究是假牙滿意度，β = 0.45。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Data were collected from 277 subjects who wore removable dentures.", "zh": "共自 277 位配戴活動假牙的受試者收集資料。"}, {"en": "More than half of them were women, the mean age was 76.8 years, two-thirds had a level of education of high school or above, the majority were living with others, and more than three-fourths were able to afford their living expenses.", "zh": "其中超過半數為女性，平均年齡 76.8 歲，三分之二具高中以上學歷，多數與他人同住，逾四分之三能負擔生活費用。", "g": "英文用分數表達比例的方式要熟：<em>two-thirds</em>（三分之二）、<em>three-fourths</em>（四分之三）。分子用基數、分母用序數，分子大於一時分母加 s。報告數據時常用。"}, {"en": "Further, the mean number of natural teeth was 7.8.", "zh": "此外，天然牙的平均數量為 7.8 顆。"}, {"en": "The distribution of the denture status was as follows: full-mouth complete denture, 24.9%; single complete denture, 24.9%; single partial denture, 24.6%; and full-mouth partial denture, 25.6%.", "zh": "假牙狀況分布如下：全口全口假牙 24.9%、單顎全口假牙 24.9%、單顎局部假牙 24.6%、全口局部假牙 25.6%。", "g": "<em>as follows</em>（如下）後面接冒號再列項目，是報告分布的標準寫法。注意四組比例都在 25% 左右，分布相當平均——這對後面的統計比較是好事。"}, {"en": "Those who had regular dental checkups, treatment during toothache, and dental visits in the last year accounted for 22.4%, 10.8%, and 39.4% of the population, respectively.", "zh": "有定期口腔檢查、牙痛時就醫，以及過去一年曾就診者，分別占 22.4%、10.8% 與 39.4%。"}, {"en": "Regarding factors related to denture wearing, 24 subjects always or often presented with oral pain, 51 perceived that they had a loose denture, 28 had an oral ulcer, 21 had perceived halitosis, 31 had perceived dry mouth, and the total denture satisfaction score was 19.0.", "zh": "在與配戴假牙相關的因素方面，24 位受試者經常或總是有口腔疼痛、51 位自覺假牙鬆脫、28 位有口腔潰瘍、21 位自覺有口臭、31 位自覺口乾，假牙滿意度總分為 19.0。", "g": "<em>Regarding...</em>（關於……）是切換話題的好用開場，等於 “With regard to” 或 “As for”。上台報告換段落時可以直接用。"}, {"en": "Gender, education level, living status, ability to afford living expenses, denture status, regular dental checkups, treatment during toothache, and dental visits in the last year were not significantly associated with the GOHAI-T scores.", "zh": "性別、教育程度、居住狀況、負擔生活費能力、假牙狀況、定期口腔檢查、牙痛時就醫，以及過去一年就診情形，與 GOHAI-T 分數均無顯著關聯。", "g": "<em>were not significantly associated with</em>——注意「沒有顯著關聯」不等於「沒有關聯」，只是這份資料看不出來。這個分寸在寫討論時很重要，別把不顯著講成「證明無關」。"}, {"en": "However, subjects who had oral pain, perceived that they had a loose denture, had an oral ulcer, or perceived that they had halitosis had lower physical function and total GOHAI-T scores.", "zh": "然而，有口腔疼痛、自覺假牙鬆脫、有口腔潰瘍或自覺口臭的受試者，其物理功能分數與 GOHAI-T 總分均較低。"}, {"en": "Further, those who had perceived dry mouth had lower GOHAI-T scores.", "zh": "此外，自覺口乾者的 GOHAI-T 分數也較低。"}, {"en": "Denture satisfaction scores were positively associated with physical function, psychosocial function, pain or discomfort, and total GOHAI-T scores.", "zh": "假牙滿意度分數與物理功能、心理社會功能、疼痛或不適及 GOHAI-T 總分均呈正相關。", "g": "<em>positively associated</em>（正相關：一個高，另一個也高）對應的是 <em>negatively associated</em>（負相關）。報告結果時這兩個詞用錯，意思會完全相反。"}, {"en": "We also found that the physical function and psychosocial function scores were significantly lower for subjects with a lower number of natural teeth.", "zh": "我們也發現，天然牙數目較少的受試者，其物理功能與心理社會功能分數顯著較低。"}, {"en": "However, age was not significantly correlated with the GOHAI-T scores.", "zh": "然而，年齡與 GOHAI-T 分數並無顯著相關。"}, {"en": "Hierarchical multiple regression was performed to investigate the ability of factors related to denture wearing to predict GOHAI-T scores, after controlling for socio-demographic variables, dentition and denture status, and dental care service usage.", "zh": "在控制社會人口變項、齒列與假牙狀況及牙科服務使用情形後，以階層式多元迴歸探討與配戴假牙相關的因素對 GOHAI-T 分數的預測力。", "g": "<em>after controlling for...</em>（在控制……之後）是多變項分析的關鍵說法：意思是「把這些干擾因素的影響先扣掉」，剩下的才是我們想看的效果。"}, {"en": "Socio-demographic characteristics were entered in Model I, and this model was not statistically significant.", "zh": "第一個模型僅放入社會人口特徵，未達統計顯著。"}, {"en": "We added dentition and denture status to the socio-demographic characteristics in Model II, and the model as a whole explained a total of 12.4% of the variance.", "zh": "第二個模型加入齒列與假牙狀況後，整體模型解釋了 12.4% 的變異。"}, {"en": "The education level, number of natural teeth, and denture status were predictors of GOHAI-T scores.", "zh": "教育程度、天然牙數目與假牙狀況為 GOHAI-T 分數的預測因子。"}, {"en": "In Model III, factors related to denture wearing were added, and the total variance explained by the model increased to 52.4%.", "zh": "第三個模型加入與配戴假牙相關的因素後，模型解釋的總變異提高至 52.4%。", "g": "從 12.4% 一口氣跳到 52.4%——這一句就是整篇論文最重要的一個數字變化。報告時如果只能講一張投影片，就講這裡。"}, {"en": "The introduction of factors related to denture wearing explained an additional 40.0% of the variance in GOHAI-T scores.", "zh": "加入與配戴假牙相關的因素後，額外解釋了 40.0% 的 GOHAI-T 分數變異。"}, {"en": "Dental care service usage was added in Model IV, and the total variance explained by the model was 53.3%.", "zh": "第四個模型再加入牙科服務使用情形，模型解釋的總變異為 53.3%。"}, {"en": "The introduction of dental care service usage explained an additional 0.9% of the variance in GOHAI-T scores.", "zh": "加入牙科服務使用情形僅額外解釋了 0.9% 的變異。", "g": "只多了 0.9%，等於幾乎沒有貢獻。論文用數字說話：不必寫「這個因素不重要」，把 0.9% 擺出來，讀者自己就看懂了。"}, {"en": "In the final model, 6 of 18 predictor variables were statistically significant, with denture satisfaction having a higher beta value than the remaining natural teeth, denture status, perceived loose denture, presence of oral ulcer, and educational level.", "zh": "在最終模型中，十八個預測變項有六個達統計顯著，其中假牙滿意度的 beta 值高於剩餘天然牙數、假牙狀況、自覺假牙鬆脫、口腔潰瘍與教育程度。"}], "tables": [{"no": "Table 2", "title": "Participants’ characteristics (N = 277)", "zh": "受試者基本特徵（N = 277）", "head": [["Variables", "n", "%"]], "rows": [["**Socio-demographic characteristics 社會人口特徵"], ["Gender 性別 — Male", "131", "47.3"], ["Gender — Female", "146", "52.7"], ["Age 65–69", "79", "28.5"], ["Age 70–79", "106", "38.3"], ["Age ≥80", "92", "33.2"], ["Age, mean ± SE (range)", "76.8 ± 0.4 (65–90)", ""], ["Education — Less than high school", "89", "32.1"], ["Education — High school or above", "188", "67.9"], ["Living status — Alone", "52", "18.8"], ["Living status — With others", "225", "81.2"], ["Able to afford living expenses — Yes", "218", "78.7"], ["Able to afford living expenses — No", "59", "21.3"], ["**Dentition and denture status 齒列與假牙狀況"], ["Remaining natural teeth, mean ± SE (range)", "7.78 ± 0.4 (0–26)", ""], ["Full-mouth complete denture", "69", "24.9"], ["Single complete denture", "69", "24.9"], ["Single partial denture", "68", "24.6"], ["Full-mouth partial denture", "71", "25.6"], ["**Dental care service usage 牙科服務使用"], ["Regular dental checkups", "62", "22.4"], ["Treatment during toothache", "30", "10.8"], ["Dental visits in the last year", "109", "39.4"], ["**Factors related to denture wearing 與配戴假牙相關的因素"], ["Presence of oral pain", "24", "8.7"], ["Perceived loose denture", "51", "18.4"], ["Presence of oral ulcer", "28", "10.1"], ["Perceived halitosis", "21", "7.6"], ["Perceived dry mouth", "31", "11.2"], ["Total denture satisfaction scores, mean ± SE (range)", "19.0 ± 0.3 (6–30)", ""], ["**Oral health related quality of life 口腔健康相關生活品質"], ["GOHAI-T scores", "47.8 ± 0.5 (22–60)", ""], ["Physical function", "14.3 ± 0.2 (4–20)", ""], ["Psychosocial function", "20.8 ± 0.3 (5–25)", ""], ["Pain and discomfort", "12.7 ± 0.1 (3–15)", ""]], "note": "這張表就是論文的「受試者長什麼樣子」。寫論文時，Table 1 或 Table 2 幾乎一定是這種表。"}, {"no": "Table 3", "title": "Oral health-related quality of life in denture-wearing elderly subjects (N = 277)", "zh": "配戴假牙長者的口腔健康相關生活品質（N = 277）", "head": [["Variables", "Physical function (max 20)", "Psychosocial function (max 25)", "Pain and discomfort (max 15)", "GOHAI-T (max 60)"], ["", "Mean ± SE", "Mean ± SE", "Mean ± SE", "Mean ± SE"]], "rows": [["**Gender"], ["Male", "14.37 ± 0.31", "20.86 ± 0.36", "12.84 ± 0.16", "48.08 ± 0.67"], ["Female", "14.18 ± 0.32", "20.66 ± 0.37", "12.61 ± 0.19", "47.44 ± 0.72"], ["**Education level"], ["Less than high school", "14.16 ± 0.27", "20.53 ± 0.31", "12.63 ± 0.15", "47.32 ± 0.60"], ["High school or  0.49 *"], ["Yes", "11.19 ± 0.74", "18.33 ± 1.17", "11.67 ± 0.60", "41.19 ± 1.90"], ["**Perceived dry mouth"], ["No", "14.46 ± 0.23", "21.16 ± 0.24", "12.83 ± 0.13", "48.45 ± 0.47 *"], ["Yes", "13.00 ± 0.69", "17.91 ± 1.10", "12.03 ± 0.42", "42.94 ± 1.95"]], "note": "p 值以單因子變異數分析（假牙狀況）與兩樣本 t 檢定（其他因素）計算。* p < 0.05。看法：比較每一組的 Yes 與 No 兩列，差距大的就是有影響的因素。"}, {"no": "Table 4", "title": "Correlations among oral health-related quality of life, age, and denture-related factors (N = 277)", "zh": "生活品質、年齡與假牙相關因素的相關分析（N = 277）", "head": [["Variables", "Physical function (max 20)", "Psychosocial function (max 25)", "Pain and discomfort (max 15)", "GOHAI-T (max 60)"], ["", "Coefficients", "Coefficients", "Coefficients", "Coefficients"]], "rows": [["Age (years)", "0.01", "−0.05", "0.09", "0.01"], ["Remaining natural teeth", "0.17 *", "0.25 *", "0.06", "0.03"], ["Total denture satisfaction scores", "0.65 *", "0.55 *", "0.56 *", "0.45 *"], ["Satisfaction with chewing ability", "0.54 *", "0.49 *", "0.43 *", "0.35 *"], ["Satisfaction with ability to speak clearly", "0.56 *", "0.47 *", "0.49 *", "0.38 *"], ["Satisfaction with appearance", "0.43 *", "0.31 *", "0.43 *", "0.29 *"], ["Satisfaction with tasting ability", "0.49 *", "0.44 *", "0.40 *", "0.31 *"], ["Satisfaction with retention of dentures (total, estimate)", "0.50 *", "0.43 *", "0.40 *", "0.35 *"], ["Satisfaction with comfort (total, estimate)", "0.52 *", "0.40 *", "0.47 *", "0.40 *"]], "note": "* p < 0.05。相關係數越接近 1，關聯越強；負號代表反向。注意年齡那一列全部接近 0，這就是論文說「年齡沒有顯著相關」的依據。"}, {"no": "Table 5", "title": "Hierarchical multiple regression analysis of GOHAI-T scores", "zh": "GOHAI-T 分數的階層式多元迴歸分析", "head": [["Block and variables", ["Model I", 3], ["Model II", 3], ["Model III", 3], ["Model IV", 3]], ["", "B", "β", "t", "B", "β", "t", "B", "β", "t", "B", "β", "t"]], "rows": [["**Socio-demographic characteristics"], ["Age", "0.03", "0.02", "0.31", "0.10", "0.08", "1.28", "0.07", "0.05", "1.11", "0.06", "0.04", "0.94"], ["Female vs. male", "0.01", "0.00", "0.01", "0.01", "0.00", "0.01", "0.52", "0.03", "0.67", "0.71", "0.04", "0.90"], ["Lower than high school vs. high school or above", "1.51", "0.09", "1.33", "2.56", "0.15", "2.29 *", "1.93", "0.11", "2.32 *", "1.92", "0.11", "2.28 *"], ["Living alone — Yes vs. no", "2.53", "0.12", "1.98 *", "2.26", "0.11", "1.82", "1.73", "0.08", "1.87", "1.55", "0.07", "1.66"], ["Able to afford living expenses — No vs. yes", "−2.60", "−0.13", "−2.13 *", "−2.27", "−0.11", "−1.92", "−1.26", "−0.06", "−1.43", "−1.39", "−0.07", "−1.55"], ["**Dentition and denture status"], ["Remaining natural teeth", "", "", "", "0.41", "0.36", "3.72 **", "0.24", "0.21", "2.87 **", "0.29", "0.26", "3.34 **"], ["Single CD vs. CD", "", "", "", "−5.07", "−0.27", "−3.47 **", "−2.54", "−0.14", "−2.28 *", "−2.24", "−0.12", "−1.94"], ["Single RPD vs. CD", "", "", "", "−3.47", "−0.18", "−2.17 *", "−3.18", "−0.17", "−2.60 *", "−3.07", "−0.16", "−2.47 *"], ["Full-mouth RPD vs. CD", "", "", "", "−4.43", "−0.24", "−2.04", "−2.59", "−0.14", "−1.57", "−2.52", "−0.13", "−1.52"], ["**Factors related to denture wearing"], ["Presence of oral pain — Yes vs. no", "", "", "", "", "", "", "−1.28", "−0.04", "−0.89", "−1.56", "−0.05", "−1.07"], ["Perceived loose denture — Yes vs. no", "", "", "", "", "", "", "−3.12", "−0.15", "−2.84 **", "−3.50", "−0.17", "−3.15 **"], ["Presence of oral ulcer — Yes vs. no", "", "", "", "", "", "", "−4.83", "−0.18", "−3.46 **", "−4.23", "−0.16", "−2.97 **"], ["Perceived halitosis — Yes vs. no", "", "", "", "", "", "", "−1.74", "−0.06", "−1.23", "−1.90", "−0.06", "−1.35"], ["Perceived dry mouth — Yes vs. no", "", "", "", "", "", "", "−1.88", "−0.08", "−1.61", "−2.00", "−0.08", "−1.71"], ["Total denture satisfaction scores", "", "", "", "", "", "", "0.77", "0.44", "8.79 **", "0.79", "0.45", "8.85 ***"], ["**Dental care service usage"], ["Regular dental checkups — No vs. yes", "", "", "", "", "", "", "", "", "", "−1.77", "−0.09", "−1.86"], ["Treatment during toothache — No vs. yes", "", "", "", "", "", "", "", "", "", "1.52", "0.06", "1.16"], ["Dental visits in the last year — No vs. yes", "", "", "", "", "", "", "", "", "", "−0.18", "−0.01", "−0.22"], ["**Model fit 模型適配"], ["R²", "", "", "0.035", "", "", "0.124 ***", "", "", "0.524 ***", "", "", "0.533 ***"], ["Adjusted R²", "", "", "0.018", "", "", "0.094 ***", "", "", "0.496 ***", "", "", "0.500 ***"], ["F (df1, df2)", "", "", "F(5,271) = 1.99", "", "", "F(9,267) = 4.20", "", "", "F(15,261) = 19.13", "", "", "F(18,258) = 16.35"], ["p", "", "", "0.081", "", "", "0.000", "", "", "0.000", "", "", "0.000"], ["ΔR²", "", "", "0.035", "", "", "0.089 ***", "", "", "0.400 ***", "", "", "0.009"], ["F change", "", "", "F(5,271) = 1.99", "", "", "F(4,267) = 6.75", "", "", "F(6,261) = 36.50", "", "", "F(3,258) = 1.68"], ["p for F change", "", "", "0.081", "", "", "0.000", "", "", "0.0000", "", "", "0.172"]], "note": "* p < 0.05、** p < 0.01、*** p < 0.001。VIF 設定小於 5 以避免多重共線性。這是全篇最重要的表：看最下面的 ΔR² 那一列，Model III 一口氣多解釋了 0.400（40%），就是「假牙相關因素最重要」的證據。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "Despite the important findings, our study had several limitations that should be considered with some caution when interpreting the results.", "zh": "儘管有重要發現，本研究仍有若干限制，解讀結果時應審慎考量。", "g": "<em>Despite + 名詞</em>（儘管……）後面不能接句子，這點跟 Although 不同。討論段先講限制再談發現，是這篇作者的安排；多數論文則是放在最後。"}, {"en": "First, we did not use a population-based sample, but a convenience sample from the Senior Citizens’ College of Kaohsiung City, and thus, our study represents only a subgroup of the public.", "zh": "第一，本研究並非採用族群為基礎的樣本，而是取自高雄市長青學苑的方便樣本，因此僅代表部分族群。", "g": "<em>not A but B</em>（不是 A 而是 B）是很好用的對比句型。這裡作者主動承認取樣限制——誠實交代限制反而讓論文更可信，寫的時候也該這樣。"}, {"en": "Future research should focus on generalizing the findings to elderly Taiwanese people wearing removable dentures.", "zh": "未來研究應著重於將結果推論至全體配戴活動假牙的台灣長者。", "g": "<em>Future research should...</em>（未來研究應……）是討論段的固定收尾句型之一。口試被問「你的研究有什麼不足」時，可以用這個結構回答。"}, {"en": "Second, the present study is characterized by a cross-sectional design, and therefore, we cannot make inferences with respect to the direction of the observed associations.", "zh": "第二，本研究為橫斷式設計，因此無法推論所觀察到的關聯之方向性。", "g": "這句是整篇最重要的方法學提醒：橫斷式研究只能說「兩者有關」，不能說「誰造成誰」。是假牙滿意度讓生活品質變好，還是生活品質好的人比較滿意假牙？這份資料分不出來。"}, {"en": "The third limitation was related to the study instrument.", "zh": "第三項限制與研究工具有關。"}, {"en": "Because no Chinese version of the GOHAI for Taiwanese had been validated when the study was performed, the original English version was translated by the researchers and was examined among a convenience sample of elderly subjects in Kaohsiung City for its construct validity and internal reliability.", "zh": "由於研究進行時尚無經過驗證的台灣中文版 GOHAI，研究者自行翻譯英文原版，並在高雄市長者的方便樣本中檢驗其建構效度與內部信度。", "g": "<em>had been validated</em> 是過去完成被動式：在「研究進行」這個過去時間點之前，就已經（沒有）被驗證過。時間有前後層次時，較早的那件事用 had + 過去分詞。"}, {"en": "Therefore, further studies may be required to determine whether this version can be applied to the elderly Taiwanese population.", "zh": "因此，可能仍需進一步研究來確認此版本能否適用於台灣長者族群。"}, {"en": "To enable the development of patient-oriented approaches in public health care and provide appropriate oral health care to elderly people wearing removable dentures, it is important to know which predictors actually affect the OHRQoL of elderly people.", "zh": "為了發展以病人為中心的公共衛生策略，並為配戴活動假牙的長者提供適當的口腔照護，了解哪些預測因子真正影響長者的口腔健康相關生活品質相當重要。"}, {"en": "Results of the hierarchical multiple regression showed that factors related to denture wearing were most strongly associated with OHRQoL, with denture satisfaction being the strongest predictor, and the number of remaining natural teeth was the second highest predictor.", "zh": "階層式多元迴歸結果顯示，與配戴假牙相關的因素和口腔健康相關生活品質關聯最強，其中假牙滿意度是最強的預測因子，剩餘天然牙數目則居第二。"}, {"en": "In addition, the OHRQoL of elderly people wearing removable dentures could also be predicted by education level, denture status, perceived loose denture, and presence of oral ulcer.", "zh": "此外，教育程度、假牙狀況、自覺假牙鬆脫與口腔潰瘍，也能預測配戴活動假牙長者的口腔健康相關生活品質。"}, {"en": "Thus, among the predictors analyzed in this study, denture satisfaction was the best predictor of OHRQoL of elderly people wearing removable dentures.", "zh": "因此，在本研究分析的預測因子中，假牙滿意度是配戴活動假牙長者口腔健康相關生活品質的最佳預測因子。"}, {"en": "The findings of this study suggested that high satisfaction with removable dentures was significantly related to a high GOHAI-T score, indicating a low level of impairment of OHRQoL.", "zh": "本研究發現，對活動假牙的高滿意度與較高的 GOHAI-T 分數顯著相關，代表口腔健康相關生活品質受損程度較低。"}, {"en": "This is in line with the findings of previous studies that showed a positive correlation between self-reported denture satisfaction and OHRQoL in the elderly.", "zh": "此結果與先前研究一致，該等研究顯示長者自陳的假牙滿意度與口腔健康相關生活品質呈正相關。", "g": "<em>in line with</em>（與……一致）是討論段比對前人研究的常用片語，同義的還有 <em>consistent with</em>、<em>in accordance with</em>。相反的是 <em>in contrast to</em>（與……相反）。"}, {"en": "In their 2-year longitudinal analysis, Stober et al. showed that elderly patients’ satisfaction with complete dentures was associated with OHRQoL, based on scores on the shortened version of the OHIP.", "zh": "Stober 等人在為期兩年的縱貫分析中，以簡短版 OHIP 分數顯示長者對全口假牙的滿意度與口腔健康相關生活品質有關。", "g": "<em>longitudinal</em>（縱貫）是追蹤同一批人一段時間，跟 <em>cross-sectional</em>（橫斷）只看一個時間點正好相對。縱貫研究才比較能談因果。"}, {"en": "Recently, Kuo et al. reported that patients’ satisfaction with complete dentures was significantly related to an improvement in their OHRQoL, as measured using the OHIP-14.", "zh": "近期 Kuo 等人以 OHIP-14 測量後指出，病人對全口假牙的滿意度與其口腔健康相關生活品質的改善顯著相關。"}, {"en": "In their cross-sectional analysis, Lee et al. showed that if the elderly are satisfied with their dentures, OHRQoL may be unaffected by oral health problems.", "zh": "Lee 等人的橫斷式分析顯示，若長者對自己的假牙感到滿意，口腔健康問題可能不會影響其口腔健康相關生活品質。"}, {"en": "A recent study described a positive correlation between professional ratings of removable denture quality and a low OHIP score, indicating a low level of impairment of OHRQoL.", "zh": "近期一項研究指出，專業人員對活動假牙品質的評分與較低的 OHIP 分數呈正相關，代表口腔健康相關生活品質受損較輕。"}, {"en": "However, a poorly fitting denture may be well tolerated in one person, while a well fitting denture may create problems for another.", "zh": "然而，同一副不密合的假牙，某些人可以適應良好，而密合良好的假牙卻可能造成另一個人的困擾。", "g": "<em>while</em> 在這裡不是「當……的時候」，而是「然而、相對地」，用來對比兩件事。這個用法在論文很常見，讀錯會整句誤解。"}, {"en": "Garrett et al. reported that 55% of 21 patients with poorly fitting dentures had moderate-to-complete denture satisfaction, as judged by examining dentists assessing the need for denture replacement.", "zh": "Garrett 等人指出，在二十一位假牙不密合的病人中，有 55% 對假牙的滿意度達中度至完全滿意；這是由評估是否需更換假牙的牙醫師判定的。"}, {"en": "Närhi et al. found a weak or statistically nonsignificant correlation between patients’ denture satisfaction and clinical measurements such as anatomic conditions, as well as denture quality.", "zh": "Närhi 等人發現，病人的假牙滿意度與解剖條件等臨床測量值及假牙品質之間，相關性微弱或未達統計顯著。"}, {"en": "Thus, denture satisfaction is not based on the technical quality of the dentures alone.", "zh": "因此，假牙滿意度並非僅取決於假牙的技術品質。", "g": "這句是整段的重點句（topic sentence 的結論版）。前面連舉三個研究，全都指向這一句。讀討論段時，找出這種「因此……」的句子，就抓到了作者真正想說的話。"}, {"en": "Moreover, Turker et al. suggested that although patients seek technical advice, psychological and emotional factors play an important role in their poor adaptation to the denture.", "zh": "再者，Turker 等人指出，儘管病人尋求的是技術上的建議，心理與情緒因素在其難以適應假牙上其實扮演重要角色。", "g": "<em>play an important role in</em>（在……扮演重要角色）是討論段的高頻片語，寫作時很好用，介系詞固定用 in。"}, {"en": "Another study showed that the dentist–patient relationship and psychological factors had a great impact on patients’ acceptance of and adaptation to removable dentures.", "zh": "另一項研究顯示，醫病關係與心理因素對病人接受並適應活動假牙有很大影響。", "g": "<em>acceptance of and adaptation to</em>——兩個名詞各配自己的介系詞（acceptance of / adaptation to），不能共用。這是英文寫作容易出錯的細節。"}, {"en": "Therefore, in addition to clinical and technical skills, gaining a better understanding of patient behavior and psychology, and improving communication, are crucial to improving patients’ denture satisfaction.", "zh": "因此，除了臨床與技術能力之外，更了解病人的行為與心理並改善溝通，對提升病人的假牙滿意度至關重要。", "g": "這句對口腔衛生師特別有意義：它把「溝通能力」寫進了專業建議裡。日後寫討論或做衛教設計時，這是可以直接引用的立場。"}, {"en": "In the present study, subjects with a perceived loose denture gained significantly lower mean GOHAI-T scores, indicating a worse OHRQoL than those without a perceived loose denture.", "zh": "本研究中，自覺假牙鬆脫者的 GOHAI-T 平均分數顯著較低，代表其口腔健康相關生活品質比未自覺鬆脫者差。"}, {"en": "This result is in accordance with those of previous studies showing that denture loosening was a significant contributing factor to low OHRQoL.", "zh": "此結果與先前研究一致，該等研究顯示假牙鬆脫是造成口腔健康相關生活品質低落的重要因素。"}, {"en": "Moreover, Hassel et al. showed that improving retention of previously insufficiently retained dentures was positively associated with OHRQoL among removable denture wearers.", "zh": "再者，Hassel 等人顯示，改善原本固位不足的假牙之固位力，與活動假牙配戴者的口腔健康相關生活品質呈正相關。"}, {"en": "Hassel et al. further indicated that denture loosening affects many aspects of quality of life, both psychological and social.", "zh": "Hassel 等人進一步指出，假牙鬆脫會影響生活品質的許多面向，包括心理與社會層面。"}, {"en": "Komagamine et al. also reported that sufficient retention of lower dentures is important to improving OHRQoL in edentulous patients.", "zh": "Komagamine 等人也指出，下顎假牙有足夠的固位力，對改善無牙患者的口腔健康相關生活品質相當重要。"}, {"en": "Hence, it is necessary to identify and improve retention of previously insufficiently retained dentures in order to improve the OHRQoL of elderly persons wearing removable dentures.", "zh": "因此，找出並改善原本固位不足的假牙，是提升配戴活動假牙長者口腔健康相關生活品質的必要做法。"}, {"en": "Removable dentures can injure oral tissues, and their use is associated with a high frequency of oral mucosal lesions.", "zh": "活動假牙可能傷害口腔組織，其使用與口腔黏膜病灶的高發生率有關。"}, {"en": "In the present study, subjects who had had an oral ulcer were more likely to report a poorer OHRQoL than their counterparts without oral ulcer experiences.", "zh": "本研究中，曾有口腔潰瘍者比沒有此經驗者更容易回報較差的口腔健康相關生活品質。", "g": "<em>had had</em> 不是打錯字：前面的 had 是過去完成式的助動詞，後面的 had 是「有」。合起來就是「在那之前曾經有過」。<em>counterparts</em> 指的是「對照的另一群人」。"}, {"en": "This finding is consistent with the results of many previous studies showing that oral ulcers were associated with a poor OHRQoL.", "zh": "此發現與許多先前研究一致，該等研究顯示口腔潰瘍與較差的口腔健康相關生活品質有關。"}, {"en": "In a study evaluating the sensitivity of patient-centered outcome measures to treatment, McGrath et al. suggested that patients with ulcers and symptomatic oral mucosal lesions had poorer OHRQoL than their counterparts with non-symptomatic lesions.", "zh": "McGrath 等人在一項評估以病人為中心的成效指標對治療敏感度的研究中指出，有潰瘍及有症狀口腔黏膜病灶的病人，其口腔健康相關生活品質比無症狀者差。"}, {"en": "Recently, Suliman et al. showed that oral ulcerative lesions were significantly associated with oral impacts on daily performance, indicating poor quality of life.", "zh": "近期 Suliman 等人顯示，口腔潰瘍性病灶與日常生活表現受口腔影響顯著相關，代表生活品質較差。"}, {"en": "Moreover, Mandali et al. suggested that recall visits and shortened denture usage are essential for prevention of oral mucosal lesions.", "zh": "再者，Mandali 等人建議，定期回診與縮短假牙配戴時間，對預防口腔黏膜病灶至關重要。", "g": "<em>recall visit</em> 是牙科的「回診、定期召回」，不是「回想」。這是專業領域的特殊用法，一般字典查不太到，靠上下文和領域知識判斷。"}, {"en": "Therefore, to improve the OHRQoL of the elderly population, it is important to educate and regularly review patients who wear dentures with regard to oral tissue injuries.", "zh": "因此，若要改善長者族群的口腔健康相關生活品質，針對口腔組織傷害對假牙配戴者進行衛教並定期追蹤相當重要。"}, {"en": "Our results demonstrated that the number of remaining natural teeth was positively associated with OHRQoL; thus, the larger the number of remaining natural teeth, the lower the impact on the OHRQoL.", "zh": "本研究結果顯示，剩餘天然牙數目與口腔健康相關生活品質呈正相關；也就是說，剩餘天然牙越多，對生活品質的影響越小。", "g": "<em>the + 比較級, the + 比較級</em>（越……就越……）是很實用的句型：the larger the number, the lower the impact。中文的「越……越……」直接對應這個結構。"}, {"en": "Zaitsu et al. suggested that the number of missing teeth was significantly associated with low GOHAI scores, indicating a poor OHRQoL.", "zh": "Zaitsu 等人指出，缺牙數目與較低的 GOHAI 分數顯著相關，代表口腔健康相關生活品質較差。"}, {"en": "In their meta-analysis, Gerritsen et al. showed that tooth loss is associated with impairment of OHRQoL, and this association seems to be independent of the assessment instrument used and the context of the included samples.", "zh": "Gerritsen 等人的統合分析顯示，缺牙與口腔健康相關生活品質受損有關，且此關聯似乎不受所用評估工具與樣本背景影響。", "g": "<em>meta-analysis</em>（統合分析）是把很多篇研究的數據合併起來重新分析，證據等級比單一研究高。查文獻時看到 meta-analysis 或 systematic review，優先讀。"}, {"en": "Moreover, Jain et al. indicated that a decrease in the number of remaining natural teeth was correlated with poor OHRQoL, independent of the effect of age and gender.", "zh": "再者，Jain 等人指出，剩餘天然牙數目減少與較差的口腔健康相關生活品質相關，且不受年齡與性別影響。"}, {"en": "Our study also showed that denture status was a predictor of OHRQoL, and that removable partial denture (RPD) wearers experienced a more adverse impact on their OHRQoL than did complete denture wearers.", "zh": "本研究也顯示假牙狀況是口腔健康相關生活品質的預測因子，且活動局部假牙（RPD）配戴者所受的負面影響大於全口假牙配戴者。"}, {"en": "Another study found that RPD users experienced impaired OHRQoL more often than did CD users.", "zh": "另一項研究發現，活動局部假牙使用者出現生活品質受損的情形，比全口假牙使用者更常見。"}, {"en": "In addition, Wong et al. reported that in a sample of community-dwelling elderly Chinese people, those who wore RPD experienced a greater OHRQoL impairment than did CD wearers.", "zh": "此外，Wong 等人指出，在社區居住的華人長者樣本中，配戴活動局部假牙者的生活品質受損程度大於全口假牙配戴者。"}, {"en": "These findings probably result from the unrealistic expectations of the wearers from their dentures; that is, RPD wearers tend to compare their dentures with natural teeth.", "zh": "這些發現可能源自配戴者對假牙的不切實際期待，也就是說，活動局部假牙的配戴者傾向拿假牙和天然牙相比。", "g": "<em>result from</em>（源自、起因於）與 <em>result in</em>（導致）方向完全相反，只差一個介系詞。這組是很多人會弄反的地方，寫的時候要特別小心。"}, {"en": "In contrast, researchers have shown that CD wearers have usually previously used RPD and might accept the lack of teeth and oral discomfort as a part of the aging process.", "zh": "相對地，研究顯示全口假牙配戴者通常先前就用過活動局部假牙，可能已把缺牙與口腔不適視為老化過程的一部分。"}, {"en": "Thus, CD wearers might be more accepting of the limitations of denture functions than RPD wearers are.", "zh": "因此，全口假牙配戴者對假牙功能限制的接受度，可能高於活動局部假牙配戴者。"}, {"en": "In our study, educational level had a significant influence on GOHAI-T scores.", "zh": "本研究中，教育程度對 GOHAI-T 分數有顯著影響。"}, {"en": "Subjects with a higher education level were more likely to have poorer OHRQoL, indicating more perceived dental problems in this group than in those with an education level lower than high school.", "zh": "教育程度較高者的口腔健康相關生活品質反而較差，代表這群人自覺的口腔問題比高中以下學歷者更多。", "g": "這是一個反直覺的結果，作者接下來連用兩段解釋它。討論段的價值就在這裡：不是重述結果，而是回答「為什麼會這樣」。"}, {"en": "A possible explanation for this trend may be related to a person’s expectations.", "zh": "此一趨勢的可能解釋，或許與個人的期待有關。", "g": "<em>A possible explanation ... may be ...</em>——一句話裡放了 possible 和 may 兩層保留。學術英文在提出解釋時刻意講得很保守，因為那只是推測，不是證據。"}, {"en": "Subjects with a lower level of education may have lower standards or expectations in their evaluation of health satisfaction or life satisfaction and, accordingly, be more likely to be satisfied than those who are more highly educated.", "zh": "教育程度較低者在評估健康或生活滿意度時，標準或期待可能較低，因而比高學歷者更容易感到滿意。"}, {"en": "Another possible reason is that subjects with a higher education level may be more concerned about problems with oral health and esthetics than those with a lower education level.", "zh": "另一個可能原因是，高學歷者可能比低學歷者更在意口腔健康與美觀方面的問題。"}, {"en": "Therefore, those with a lower education level and lower expectations may report higher GOHAI-T scores, indicating a better OHRQoL.", "zh": "因此，教育程度較低、期待也較低者，可能回報較高的 GOHAI-T 分數，代表較佳的口腔健康相關生活品質。"}, {"en": "Compared to other international literature dealing with OHRQoL in the elderly, we found lower GOHAI-T values in this study.", "zh": "與其他探討長者口腔健康相關生活品質的國際文獻相比，本研究的 GOHAI-T 數值較低。"}, {"en": "One possible reason for this is that the subjects in this study were elderly individuals wearing removable dentures.", "zh": "可能原因之一是本研究的受試者全都是配戴活動假牙的長者。"}, {"en": "Hogenius et al. showed that compared to people with natural teeth, those who wear removable dentures experience more significant negative impacts on social and emotional aspects of life.", "zh": "Hogenius 等人顯示，與擁有天然牙者相比，配戴活動假牙者在生活的社交與情緒層面受到更明顯的負面影響。"}, {"en": "Another possible reason may be that the subjects in this study were sourced from the Government Senior Citizens’ Service Center in Taiwan.", "zh": "另一個可能原因是，本研究的受試者來自台灣的政府長青服務中心。"}, {"en": "Elderly people attending this center tend to have a higher education level and better socioeconomic status.", "zh": "會來這個中心的長者，教育程度與社經地位往往較高。"}, {"en": "Subjects with a higher level of education may have higher expectations relating to their oral health satisfaction and, accordingly, be more likely to have lower GOHAI-T values.", "zh": "教育程度較高者對口腔健康滿意度的期待可能較高，因而更容易出現較低的 GOHAI-T 數值。"}, {"en": "The present study was performed in 2009, at which time the GOHAI had not yet been translated for use in Taiwan.", "zh": "本研究於 2009 年執行，當時 GOHAI 尚未翻譯成可供台灣使用的版本。"}, {"en": "A Chinese version of the GOHAI for older people living in Hong Kong and southern China was developed in 2002.", "zh": "供香港與華南地區長者使用的中文版 GOHAI 已於 2002 年發展完成。"}, {"en": "Though the Taiwanese language is influenced by Chinese culture, there are a number of differences between the spoken and written Chinese of Hong Kong and that of Taiwan, so the wording of the questions in the Chinese version of the GOHAI could confuse elderly Taiwanese individuals.", "zh": "雖然台灣的語言深受中華文化影響，但香港與台灣在口語及書面中文上仍有不少差異，因此中文版 GOHAI 的題目用詞可能會讓台灣長者感到困惑。", "g": "<em>that of Taiwan</em> 裡的 that 是為了避免重複 “the spoken and written Chinese”。英文很討厭重複，會用 that / those 代替前面提過的名詞。讀到 that 要回頭找它指誰。"}, {"en": "Therefore, in the current study, we did not use the Chinese version of the GOHAI for assessing OHRQoL measures.", "zh": "因此，本研究並未採用該中文版 GOHAI 來評估口腔健康相關生活品質。"}, {"en": "Instead, a Chinese version of the GOHAI for use with Taiwanese people specifically (GOHAI-T) was developed.", "zh": "取而代之的是，研究者發展了專供台灣民眾使用的中文版 GOHAI（GOHAI-T）。"}, {"en": "A strength of the current study was that we simultaneously controlled both for factors related to denture wearing and for relevant influencing factors mentioned in previous similar studies.", "zh": "本研究的優點在於同時控制了與配戴假牙相關的因素，以及先前類似研究中提到的相關影響因素。", "g": "<em>A strength of the current study was that...</em>——講完限制之後講優點，是討論段常見的平衡寫法。寫論文時兩邊都要有，只講優點會顯得不誠實。"}, {"en": "In the final model, the overall explanatory power was 0.533.", "zh": "最終模型的整體解釋力為 0.533。"}, {"en": "The present findings confirmed that factors related to denture wearing were most strongly associated with OHRQoL, with denture satisfaction being the strongest predictor.", "zh": "本研究結果證實，與配戴假牙相關的因素和口腔健康相關生活品質的關聯最強，其中假牙滿意度是最強的預測因子。"}, {"en": "Therefore, in clinical practice, denture satisfaction is a useful tool to evaluate the effect of denture treatment on OHRQoL.", "zh": "因此，在臨床實務上，假牙滿意度是評估假牙治療對口腔健康相關生活品質影響的實用工具。"}, {"en": "However, a weakness of the study was that the nature of the causality in which denture satisfaction is used to predict OHRQoL was still unclear due to the cross-sectional design.", "zh": "然而，本研究的弱點在於，由於採橫斷式設計，以假牙滿意度預測口腔健康相關生活品質的因果性質仍不明確。", "g": "<em>causality</em>（因果關係）與 <em>correlation</em>（相關）是完全不同的兩件事。這篇從頭到尾守住這條線：只說相關，不說因果。這是做問卷研究時最該學起來的一課。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "In conclusion, of the factors analyzed in this study, those related to denture wearing were most strongly associated with OHRQoL, and denture satisfaction was the strongest predictor among them.", "zh": "總結而言，在本研究分析的各項因素中，與配戴假牙相關的因素和口腔健康相關生活品質的關聯最強，其中又以假牙滿意度為最強的預測因子。", "g": "<em>In conclusion</em>（總結而言）是收尾的標準信號詞，同義的還有 <em>To sum up</em>、<em>Overall</em>。上台報告最後一張投影片就可以用這句開頭。"}, {"en": "It is suggested that denture satisfaction is useful as a tool for assessing the effect of denture treatment on the OHRQoL of elderly individuals wearing removable dentures.", "zh": "研究建議，假牙滿意度可作為評估假牙治療對配戴活動假牙長者口腔健康相關生活品質影響的工具。", "g": "<em>It is suggested that...</em> 又是被動，而且連「誰建議的」都不講。這是學術英文最保守的表達方式：把主張說出來，但不把自己擺在前面。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: the study was funded by the College of Dental Medicine, Kaohsiung Medical University.", "zh": "經費：本研究由高雄醫學大學口腔醫學院資助。", "g": "校內經費，沒有廠商介入。另外致謝中提到高醫口腔衛生學系的學生協助問卷訪談——這正是這位學生所屬的系。"}, {"en": "Competing interests: the authors declare that they have no competing interests.", "zh": "利益衝突：作者聲明無利益衝突。"}, {"en": "Ethical approval: Institutional Review Board at Chung-Ho Memorial Hospital, Kaohsiung Medical University (KMUH-IRB-980273).", "zh": "倫理審查：高雄醫學大學附設中和紀念醫院人體試驗委員會（KMUH-IRB-980273）。", "g": "倫理編號的格式值得看一下：機構縮寫－IRB－年份流水號。她自己送審後也會拿到這樣一組編號，論文裡必須寫出來。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "The abstract and the body report different mean ages.", "zh": "摘要與內文的平均年齡對不上。", "g": "摘要寫 76.0 歲，內文 Results 與 Table 2 都寫 76.8 歲。以內文與表格為準——那才是實際算出來的數字。已發表的論文出現這種小矛盾並不罕見，敢去核對就會發現。"}, {"en": "The paper says inter-examiner where it means intra-examiner.", "zh": "論文把 intra-examiner 誤寫成 inter-examiner。", "g": "只有一位牙醫做檢查，不可能有「檢查者<em>之間</em>」的一致性。intra- 是同一人前後兩次，inter- 是不同人之間。讀到前後不一致時要敢懷疑，不要以為是自己看錯。"}, {"en": "Education level is significant here but not in Tosun 2024.", "zh": "教育程度在本篇顯著，在 Tosun 2024 卻不顯著。", "g": "兩篇結論不一致，但層次不同：本篇的教育效果是在<em>多變項</em>控制其他因素後才浮現的（β=0.11），雙變項分析其實也不顯著；Tosun 2024 則根本沒做多變項。所以嚴格說兩篇在同一層次上是一致的。<br><br>另一個解釋是樣本分布：本篇高中以上佔 67.9%，Tosun 2024 以小學為主（50.7%）、16% 不識字。高學歷那一端人數夠，才比得出差異。"}, {"en": "The sample came from a senior citizens' college, not the general population.", "zh": "樣本來自長青學苑，不是一般族群。", "g": "作者自己承認這群長者的教育程度與社經地位偏高，所以 GOHAI 分數比其他國際研究低。取樣方式限制了推論範圍，引用時要說清楚。"}]}], "mesh": [["Aged", "老年人（65 歲以上）", "PubMed 為每篇論文貼上的主題標籤。Aged 指 65 歲以上的受試者。"], ["Aged, 80 and over", "80 歲以上長者", "樣本中若含 80 歲以上者會另外標記。本研究平均年齡 76.8 歲。"], ["Attitude to Health", "健康態度", "受試者對自身健康的看法與態度，本研究的「自覺」項目屬於這一類。"], ["Cross-Sectional Studies", "橫斷式研究", "在單一時間點蒐集資料的研究設計。只能看關聯，不能下因果結論。"], ["Deglutition / physiology", "吞嚥／生理學", "Deglutition 是 swallowing 的醫學用語。斜線後面是子標題，表示從生理角度切入。"], ["Dental Care / statistics & numerical data", "牙科照護／統計數據", "對應本研究的「牙科醫療服務使用情形」。"], ["Denture Retention / psychology", "假牙固位／心理層面", "Retention 是假牙的固位力；子標題 psychology 表示探討的是心理感受，不是力學測量。"], ["Denture, Complete / psychology*", "全口假牙／心理層面", "星號代表這是本篇的主要主題（major topic）。注意星號打在 psychology 上，表示重點是心理層面，不是假牙本身的技術問題。"], ["Denture, Partial, Removable / psychology*", "活動局部假牙／心理層面", "MeSH 的寫法是「大類, 次類, 修飾語」，倒著讀才順：removable partial denture。"], ["Educational Status", "教育程度", "本研究發現教育程度會顯著影響 GOHAI-T 分數。"], ["Facial Pain / psychology", "顏面疼痛／心理層面", "對應本研究的「自覺口腔疼痛」。"], ["Female", "女性", "性別標籤。論文只要有女性受試者就會標記。"], ["Geriatric Assessment", "老年評估", "針對長者的整體功能評估，GOHAI 屬於這一類工具。"], ["Halitosis / psychology", "口臭／心理層面", "對應本研究的「自覺口臭」。"], ["Humans", "人類", "表示這是人體研究，不是動物或細胞實驗。查 PubMed 時很常用來過濾。"], ["Interpersonal Relations", "人際關係", "對應 GOHAI 中「因口腔問題而避免社交」的題目。"], ["Male", "男性", "性別標籤。"], ["Mastication / physiology", "咀嚼／生理學", "咀嚼功能，本研究以自覺咀嚼能力測量。"], ["Oral Health*", "口腔健康", "本篇的主要主題之一（帶星號）。"], ["Oral Ulcer / psychology", "口腔潰瘍／心理層面", "對應本研究的「自覺口腔潰瘍」。"], ["Patient Satisfaction", "病人滿意度", "本研究的核心變項：假牙滿意度。"], ["Quality of Life*", "生活品質", "本篇的主要主題之一（帶星號）。搜尋文獻時這是最關鍵的一個詞。"], ["Self Concept", "自我概念", "對應 GOHAI 中「因口腔問題而在意自己形象」的題目。"], ["Social Class", "社會階層", "社經地位，本研究以教育程度與生活費負擔能力測量。"], ["Speech / physiology", "言語／生理學", "說話功能，GOHAI 物理功能面向的一部分。"], ["Taiwan", "台灣", "地理標籤。搜尋台灣本土研究時可以直接加這個詞。"], ["Xerostomia / psychology", "口乾症／心理層面", "Xerostomia 是 dry mouth 的醫學用語。"]], "vocab": {"removable dentures": ["dentures the wearer can take out and put back — not fixed in the mouth", "活動假牙（可自行取下佩戴）", "v", "B2"], "removable prosthesis": ["another word for a removable denture; papers switch terms to avoid repeating", "活動補綴物：即活動假牙，論文換字避免重複", "v", "C1"], "denture wearing": ["the fact of using a denture, treated here as a factor that can be studied", "配戴假牙（本研究把它當成一個可分析的因素）", "p", "B2"], "denture": ["a set of artificial teeth", "假牙、義齒", "v", "B2"], "edentulous": ["having no natural teeth left", "無牙的（重音在第二音節 e-DEN-tu-lous）", "v", "C1"], "oral function": ["how well the mouth does its jobs — chewing, speaking, swallowing", "口腔功能：咀嚼、說話、吞嚥等", "p", "B2"], "esthetics": ["how something looks; appearance (British spelling: aesthetics)", "美觀、外觀（英式拼法 aesthetics）", "v", "C1"], "oral health related-quality of life": ["how much a person's mouth affects their daily life, comfort and confidence", "口腔健康相關生活品質", "f", "C1"], "OHRQoL": ["short for oral health-related quality of life", "口腔健康相關生活品質的縮寫", "f", "C1"], "HRQoL": ["health-related quality of life — the broader, whole-body version of OHRQoL", "健康相關生活品質：範圍比 OHRQoL 大，少一個 O", "f", "C1"], "Additional information is required": ["a formal, impersonal way of saying 'we need to know more'", "「還需要更多資訊」的學術寫法，不說 we", "c", "B2"], "assess": ["to judge or measure something carefully", "評估", "v", "B2"], "factors": ["the things that may cause or affect a result", "因素", "v", "B1"], "The purpose of this study is to": ["the standard opening for stating what a paper set out to do", "論文交代研究目的的標準句型", "c", "B1"], "evaluate": ["to judge the value or quality of something", "評估、評定", "v", "B2"], "the association between": ["the statistical relationship linking two things — always 'between A and B'", "……之間的關聯（固定搭配 between A and B）", "p", "B2"], "be associated with": ["to be linked to — states a relationship, never a cause", "與……有關聯（只講關聯，不講因果）", "p", "B2"], "sample": ["the group of people actually studied, standing for a larger population", "樣本：實際受測的那群人", "f", "B2"], "study population": ["the whole group a study draws its participants from", "研究母群、研究對象", "f", "B2"], "face-to-face interviews": ["asking questions in person rather than by post or phone", "面對面訪談", "p", "B1"], "socio-demographic characteristics": ["background facts such as age, sex, education and income", "社會人口特徵：年齡、性別、教育程度等", "f", "C1"], "dental care service usage": ["how often and why a person goes to the dentist", "牙科醫療服務使用情形", "p", "B2"], "regular dental checkups": ["routine visits to the dentist when nothing is wrong", "定期口腔檢查", "p", "B1"], "perceived": ["as the person themselves reports it — not measured by a dentist. The key word of this paper.", "自覺的、受訪者自己認為的（非客觀檢查）——本篇關鍵字", "v", "B2"], "self-rated": ["scored by the person about themselves", "自評的", "v", "B2"], "loose denture": ["a denture that moves or slips instead of staying in place", "假牙鬆脫、不穩", "p", "B1"], "oral ulcer": ["a painful open sore inside the mouth", "口腔潰瘍、口瘡", "p", "B2"], "halitosis": ["the medical word for bad breath", "口臭（醫學用語）", "v", "C1"], "dry mouth": ["not enough saliva; the medical term is xerostomia", "口乾（醫學用語 xerostomia）", "p", "B1"], "denture satisfaction": ["how happy the wearer is with their own denture", "假牙滿意度", "p", "B2"], "Geriatric Oral Health Assessment Index": ["a 12-question scale built to measure oral quality of life in older adults", "老年口腔健康評估指標：專為長者設計的 12 題量表", "f", "C1"], "GOHAI": ["the 12-item scale used in this paper. Higher score = better quality of life.", "本研究使用的 12 題量表。分數越高代表生活品質越好", "f", "C1"], "GOHAI-T": ["the Taiwanese Chinese version of the GOHAI scale", "GOHAI 的台灣中文版", "f", "C1"], "Oral Health Impact Profile": ["a rival scale (OHIP). Careful: higher OHIP score = WORSE quality of life.", "口腔健康影響量表（OHIP）。注意：分數越高代表生活品質越差", "f", "C1"], "OHIP": ["Oral Health Impact Profile. Its scores run the opposite way to GOHAI.", "口腔健康影響量表，分數方向與 GOHAI 相反", "f", "C1"], "remaining natural teeth": ["the teeth a person still has of their own", "剩餘的天然牙", "p", "B1"], "denture status": ["what kind of denture a person wears, and where", "假牙狀況（種類與位置）", "p", "B2"], "mastication": ["chewing (medical word). Stress the third syllable: mas-ti-CA-tion.", "咀嚼（醫學用語，重音在第三音節）", "v", "C1"], "oral mucosal lesions": ["damaged patches on the soft tissue lining the mouth", "口腔黏膜病灶", "p", "C1"], "was performed": ["passive voice — the standard way Methods sections describe what was done", "被動語態，Methods 段的標準寫法", "c", "B2"], "was measured using": ["the standard Methods pattern for naming a tool", "「以……測量」，Methods 的標準句型", "c", "B2"], "independent": ["used to predict the outcome; also means 'not affected by'. Independent variables go IN, the dependent variable comes OUT.", "自變項的；也有「不受影響的」之意。記法：自變項是丟進去的，依變項是跑出來的", "v", "C1"], "predictors": ["the factors used to explain or predict the outcome", "預測因子", "f", "C1"], "accounted for": ["explained (a share of the variation) — a statistics use, not 'gave a
