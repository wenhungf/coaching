/* ---------- glossary ---------- */
function isWordChar(c){return (c>='a'&&c<='z')||(c>='A'&&c<='Z')||(c>='0'&&c<='9');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
/* Index-safe case-insensitive search. Lowercasing the whole string first is
   unsafe: some characters (e.g. Turkish 'I' with dot) lowercase to two code
   units, shifting every later index and corrupting the boundary check. */
function ciFind(text,term){
  var re=new RegExp(escRe(term),'gi'), m;
  while((m=re.exec(text))!==null){
    var idx=m.index, b=idx>0?text.charAt(idx-1):'',
        a=(idx+m[0].length<text.length)?text.charAt(idx+m[0].length):'';
    if(!isWordChar(b)&&!isWordChar(a)) return idx;
    re.lastIndex=idx+1;
  }
  return -1;
}
function sig(e){return e[2]+'|'+e[1];}
function processTextNode(node){
  var text=node.nodeValue; if(!text||!/[A-Za-z]/.test(text)) return;
  var bestIdx=-1,bestTerm=null;
  for(var i=0;i<TERMS.length;i++){
    var t=TERMS[i];
    if(USED[sig(VOCAB[t])]) continue;
    var idx=ciFind(text,t); if(idx===-1) continue;
    if(bestIdx===-1||idx<bestIdx||(idx===bestIdx&&t.length>bestTerm.length)){bestIdx=idx;bestTerm=t;}
  }
  if(bestTerm===null) return;
  var e=VOCAB[bestTerm]; USED[sig(e)]=1;
  var m=text.substr(bestIdx,bestTerm.length);
  var pre=text.slice(0,bestIdx), post=text.slice(bestIdx+bestTerm.length);
  var btn=document.createElement('span');
  btn.className='gl'; btn.setAttribute('role','button'); btn.setAttribute('tabindex','0');
  btn.setAttribute('data-gt',e[2]); btn.setAttribute('data-gw',m);
  btn.setAttribute('data-gz',e[1]); btn.setAttribute('data-gd',e[0]); btn.setAttribute('data-gl',e[3]||''); btn.setAttribute('data-gx',e[4]||'');
  btn.setAttribute('aria-expanded','false'); btn.textContent=m;
  var par=node.parentNode;
  if(pre) par.insertBefore(document.createTextNode(pre),node);
  par.insertBefore(btn,node);
  var pn=document.createTextNode(post); par.insertBefore(pn,node); par.removeChild(node);
  processTextNode(pn);
}
function linkifyPass(sel){
  Array.prototype.forEach.call(document.querySelectorAll(sel),function(s){
    var w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT,null,false), ns=[], n;
    while((n=w.nextNode())) ns.push(n);
    for(var i=0;i<ns.length;i++){ if(ns[i].parentNode) processTextNode(ns[i]); }
  });
}
function linkify(){
  if(!TERMS.length) return;
  USED={};
  linkifyPass('#body .sent, #ftBody .sent:not(.qs):not(.as)');
  USED={};
  linkifyPass('#ftBody .sent.qs, #ftBody .sent.as');
}

/* ---------- sentence panels ---------- */
function panelOf(el){
  var n=el.nextElementSibling;
  return (n&&n.classList.contains('tr'))?n:null;
}
function toggleSent(el,force){
  var p=panelOf(el); if(!p) return false;
  var want=(force===undefined)?!p.classList.contains('show'):force;
  p.classList.toggle('show',want);
  el.classList.toggle('open',want);
  return want;
}
function visibleSents(){
  var sel='#pTitle .sent, #body .sent';
  if(ftOpen) sel+=', #ftBody .sent';
  return document.querySelectorAll(sel);
}
function setAll(open){
  Array.prototype.forEach.call(visibleSents(),function(s){ toggleSent(s,open); });
  allOpen=open;
}

/* ---------- popup ---------- */
var pop=document.getElementById('pop');
var pT=document.getElementById('pop-tag'),pH=document.getElementById('pop-h'),
    pZ=document.getElementById('pop-zh'),pD=document.getElementById('pop-d'),
    pLv=document.getElementById('pop-lvl'),pArr=document.getElementById('pop-arrow'),
    pX=document.getElementById('pop-x');
var LABEL={v:"Word 單字",p:"Phrase 片語",c:"Grammar 文法",f:"Research term 研究術語",m:"MeSH term 主題詞"};
var openBtn=null;
function closePop(){ pop.classList.remove('show'); if(openBtn){openBtn.setAttribute('aria-expanded','false');openBtn=null;} }
function showPop(btn,t,head,zh,def,lvl,x){
  if(x){ pX.innerHTML='<b>\u767d\u8a71\u8aaa\u660e</b>'+esc(x); pX.classList.add('on'); }
  else { pX.innerHTML=''; pX.classList.remove('on'); }
  pT.className='tag '+t; pT.textContent=LABEL[t]||'';
  pH.textContent=head; pZ.textContent=zh; pD.textContent=def;
  pLv.textContent=lvl?('CEFR '+lvl):'';
  pop.classList.add('show');
  if(window.matchMedia('(max-width:600px)').matches){ pArr.style.display='none'; }
  else{
    pArr.style.display='block';
    var r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight,
        sx=window.scrollX,sy=window.scrollY,vw=document.documentElement.clientWidth;
    var left=sx+r.left+r.width/2-pw/2; left=Math.max(sx+10,Math.min(left,sx+vw-pw-10));
    var top=sy+r.bottom+12, below=true;
    if(r.bottom+12+ph>window.innerHeight&&r.top-12-ph>0){ top=sy+r.top-ph-12; below=false; }
    pop.style.left=left+'px'; pop.style.top=top+'px';
    var ax=sx+r.left+r.width/2-left-7; ax=Math.max(12,Math.min(ax,pw-26));
    pArr.style.left=ax+'px'; pArr.style.top=below?'-7px':(ph-7)+'px';
  }
  btn.setAttribute('aria-expanded','true'); openBtn=btn;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var g=e.target.closest?e.target.closest('.gl'):null;
  if(g){ e.stopPropagation();
    if(openBtn===g){closePop();}
    else{closePop();showPop(g,g.getAttribute('data-gt'),g.getAttribute('data-gw'),
         g.getAttribute('data-gz'),g.getAttribute('data-gd'),g.getAttribute('data-gl'),g.getAttribute('data-gx'));}
    return; }
  var m=e.target.closest?e.target.closest('.mterm'):null;
  if(m){ e.stopPropagation();
    var d=P().mesh[+m.getAttribute('data-mi')];
    if(openBtn===m){closePop();} else {closePop();showPop(m,'m',d[0],d[1],d[2],'');}
    return; }
  var tb=e.target.closest?e.target.closest('.tblbtn'):null;
  if(tb){ e.stopPropagation();
    var body=tb.parentNode.nextElementSibling, show=body.hidden;
    body.hidden=!show;
    tb.classList.toggle('on',show);
    tb.textContent=show?'Hide table \u6536\u8d77\u8868\u683c':'Show table \u986f\u793a\u8868\u683c';
    return; }
  if(pop.classList.contains('show')&&!pop.contains(e.target)){ closePop(); return; }
  var s=e.target.closest?e.target.closest('.sent'):null;
  if(s){ toggleSent(s); return; }
});
document.getElementById('popclose').addEventListener('click',function(e){e.stopPropagation();closePop();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closePop(); closeDrawer(); return; }
  if(e.key==='Enter'||e.key===' '){
    var t=e.target;
    if(t.classList&&t.classList.contains('gl')){ e.preventDefault();
      if(openBtn===t){closePop();} else {closePop();showPop(t,t.getAttribute('data-gt'),t.getAttribute('data-gw'),
        t.getAttribute('data-gz'),t.getAttribute('data-gd'),t.getAttribute('data-gl'),t.getAttribute('data-gx'));} }
    else if(t.classList&&t.classList.contains('mterm')){ e.preventDefault();
      var d=P().mesh[+t.getAttribute('data-mi')];
      if(openBtn===t){closePop();} else {closePop();showPop(t,'m',d[0],d[1],d[2],'');} }
    else if(t.classList&&t.classList.contains('sent')){ e.preventDefault(); toggleSent(t); }
  }
});
window.addEventListener('resize',closePop);
document.getElementById('openAllBtn').onclick=function(){ autoOpen=true; setAll(true); closeDrawer(); };
document.getElementById('closeAllBtn').onclick=function(){ autoOpen=false; setAll(false); closeDrawer(); };
document.getElementById('ftBtn').onclick=function(){ setFullText(!ftOpen); };
document.getElementById('qaBtn').onclick=function(){
  if(!ftOpen) setFullText(true);
  var el=document.getElementById('qaTop');
  if(el) el.scrollIntoView({block:'start'});
};

function setFullText(open){
  ftOpen=open;
  var el=document.getElementById('ftBody'), b=document.getElementById('ftBtn');
  el.hidden=!open;
  if(open&&autoOpen){ Array.prototype.forEach.call(el.querySelectorAll('.sent'),function(x){toggleSent(x,true);}); }
  b.classList.toggle('on',open);
  b.textContent=open?(P().ftBtnHide||'Hide the full text'):(P().ftBtnLabel||'Continue to the full text');
  if(!open){
    Array.prototype.forEach.call(document.querySelectorAll('#ftBody .sent.open'),
      function(s){toggleSent(s,false);});
  }
  doSearch();
}

/* ---------- drawer ---------- */
var drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');

function buildToc(){
  var html='';
  PAPERS.forEach(function(p,i){
    html+='<button class="tocitem'+(p.done?'':' todo')+'" data-i="'+i+'"'+(p.done?'':' disabled')+'>'+

      '<span class="meta">'+esc(p.journal)+'<br>'+p.why+'</span></button>';

  document.querySelectorAll('.tocitem[data-i]').forEach(function(b){

/* ---------- search ---------- */
function ctx(text,pos,len){
  var a=Math.max(0,pos-38), b=Math.min(text.length,pos+len+46);
  return (a>0?'…':'')+esc(text.slice(a,pos))+'<b>'+esc(text.slice(pos,pos+len))+'</b>'+
         esc(text.slice(pos+len,b))+(b<text.length?'…':'');
}
function doSearch(){
  var q=document.getElementById('q').value.trim();
  document.getElementById('qclear').hidden = !document.getElementById('q').value.length;
  var box=document.getElementById('hits'), note=document.getElementById('qnote');
  clearFlash();
  if(q.length<2){ box.innerHTML=''; note.textContent='Type at least two letters. 中英文都可以搜尋。'; return; }
  var lq=q.toLowerCase(), out='', n=0, p=P();
  function scan(list,which,label){
    (list||[]).forEach(function(sec,si){
      sec.s.forEach(function(st,ti){
        var hay=[[st.en,'en'],[st.zh,'zh'],[st.g||'','g']];
        for(var h=0;h<hay.length;h++){
          var txt=hay[h][0].replace(/<[^>]+>/g,''), pos=txt.toLowerCase().indexOf(lq);
          if(pos!==-1){
            n++;
            out+='<button class="hitrow" data-w="'+which+'" data-s="'+si+'" data-t="'+ti+'">'+
                 '<span class="hr-ch">'+esc(label)+' · '+esc(sec.h)+'</span>'+
                 '<span class="hr-sn">'+ctx(txt,pos,q.length)+'</span></button>';
            break;
          }
        }
      });
    });
  }
  if(p.titleZh){
    var tt=[p.title,p.titleZh,p.titleG||''];
    for(var i=0;i<tt.length;i++){
      var t2=tt[i].replace(/<[^>]+>/g,''), pz=t2.toLowerCase().indexOf(lq);
      if(pz!==-1){ n++; out+='<button class="hitrow" data-w="title" data-s="0" data-t="0">'+
        '<span class="hr-ch">Title · 標題</span><span class="hr-sn">'+ctx(t2,pz,q.length)+'</span></button>'; break; }
    }
  }
  scan(p.abstract,'a','Abstract');
  scan(p.fulltext,'f','Full text');
  (p.qa||[]).forEach(function(cat,ci){
    cat.items.forEach(function(it,ii){
      var sets=[[[it.q,it.qZh,it.qG||''],'qq','Q&A \u00b7 question'],
                [[it.a,it.aZh,it.aG||''],'qa','Q&A \u00b7 answer']];
      sets.forEach(function(set){
        for(var k=0;k<set[0].length;k++){
          var txt=set[0][k].replace(/<[^>]+>/g,''), pos=txt.toLowerCase().indexOf(lq);
          if(pos!==-1){ n++;
            out+='<button class="hitrow" data-w="'+set[1]+'" data-s="'+ci+'" data-t="'+ii+'">'+
                 '<span class="hr-ch">'+esc(set[2])+' \u00b7 '+esc(cat.cat)+'</span>'+
                 '<span class="hr-sn">'+ctx(txt,pos,q.length)+'</span></button>';
            break; }
        }
      });
    });
  });
  note.textContent = n ? (n+' result'+(n===1?'':'s')+' 筆結果') : 'Nothing found 找不到';
  box.innerHTML=out;
  box.querySelectorAll('.hitrow').forEach(function(b){
    b.onclick=function(){ jumpTo(b.getAttribute('data-w'),b.getAttribute('data-s'),b.getAttribute('data-t')); };
  });
}
var flashTimer=null;
function clearFlash(){
  if(flashTimer){ clearTimeout(flashTimer); flashTimer=null; }
  document.querySelectorAll('.sent.flash').forEach(function(s){s.classList.remove('flash');});
}
function jumpTo(w,si,ti){
  if(w==='f'&&!ftOpen) setFullText(true);
  closeDrawer(); clearFlash();
  if((w==='f'||w==='qq'||w==='qa')&&!ftOpen) setFullText(true);
  var root = w==='title' ? '#pTitle' : ((w==='f'||w==='qq'||w==='qa')?'#ftBody':'#body');
  var el=document.querySelector(root+' .sent[data-w="'+w+'"][data-s="'+si+'"][data-t="'+ti+'"]');
  if(!el) return;
  el.classList.add('flash');
  flashTimer=setTimeout(function(){ el.classList.remove('flash'); flashTimer=null; },1800);
  el.scrollIntoView({block:'center'});
  toggleSent(el,true);
}
document.getElementById('q').addEventListener('input',doSearch);
document.getElementById('qclear').onclick=function(){
  var q=document.getElementById('q');
  q.value=''; doSearch(); q.focus();
};

/* ---------- word bank ---------- */
function buildWordbank(){
  var GROUPS=[["v","Words","單字"],["p","Phrases","片語"],["c","Grammar","文法"],["f","Research terms","研究術語"]];
  var src=P().vocab||{}, seen={}, byType={v:[],p:[],c:[],f:[]};
  for(var k in src){
    var e=src[k], t=byType[e[2]]?e[2]:'v', s2=t+'|'+e[1];
    if(seen[s2]) continue; seen[s2]=1;
    byType[t].push([k,e]);
  }
  var html='';
  GROUPS.forEach(function(G){
    var items=byType[G[0]]; if(!items.length) return;
    items.sort(function(a,b){return a[0].toLowerCase().localeCompare(b[0].toLowerCase());});
    html+='<div class="wbhead '+G[0]+'"><span class="pip"></span>'+G[1]+
          ' <span style="font-family:var(--han);font-weight:600">'+G[2]+'</span>'+
          '<span class="n">'+items.length+'</span></div>';
    items.forEach(function(it){
      html+='<div class="wb"><span class="t">'+esc(it[0])+'</span> · <span class="z">'+it[1][1]+
            '</span><span class="x">'+esc(it[1][0])+'</span>'+(it[1][4]?'<span class="px">'+esc(it[1][4])+'</span>':'')+'</div>';
    });
  });
  document.getElementById('pane-words').innerHTML=html||'<p class="qnote">No word bank for this paper yet.</p>';
}

document.querySelectorAll('#sizes button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#sizes button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.documentElement.style.setProperty('--fs',b.getAttribute('data-size')+'px');
  };
});

buildToc();
render(0);
