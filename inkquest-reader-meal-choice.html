pa 值（一致性）", "f", "C1", "兩次判定（兩位檢查者，或兩種工具）對同一個人的分類是否一致，而且已經扣掉「碰巧一樣」的部分。常用判讀：0.41–0.60 中等、0.61–0.80 良好、0.81 以上幾乎完全一致。和相關不同：相關問「會不會一起高低」，kappa 問「判定結果是不是一樣」。"], "kappa": ["agreement between two ratings beyond what chance would give", "kappa 值（一致性）", "f", "C1", "兩次判定（兩位檢查者，或兩種工具）對同一個人的分類是否一致，而且已經扣掉「碰巧一樣」的部分。常用判讀：0.41–0.60 中等、0.61–0.80 良好、0.81 以上幾乎完全一致。和相關不同：相關問「會不會一起高低」，kappa 問「判定結果是不是一樣」。"], "sample size": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"], "G*Power": ["free software used to calculate the sample size needed before a study", "G*Power 樣本數計算軟體", "f", "C1", "免費的統計軟體，研究開始前用來算需要多少受試者。輸入預期的效果量、顯著水準（通常 0.05）和檢定力（通常 0.8），就會算出最少人數。檢定力 0.8 的意思是：如果差異真的存在，有 80% 的機會測得出來。"], "effect size": ["how large a difference or relationship is", "效果量", "f", "C1", "差異「有多大」，而不是「是不是巧合」。p 值只回答有沒有差，效果量回答差多少。常見的 Cohen's d：0.2 小、0.5 中、0.8 大。計算樣本數時，要先預估效果量。"], "post-hoc analysis": ["an analysis decided on after seeing the data", "事後分析", "f", "C1", "看過資料之後才決定要做的分析，不在原本的研究計畫裡。可以做，但要誠實標示，而且結論要保守，因為看了資料再挑方法，容易挑到碰巧好看的結果。"], "post-hoc": ["an analysis decided on after seeing the data", "事後分析", "f", "C1", "看過資料之後才決定要做的分析，不在原本的研究計畫裡。可以做，但要誠實標示，而且結論要保守，因為看了資料再挑方法，容易挑到碰巧好看的結果。"], "cohort": ["a group of people studied together", "世代（研究族群）", "f", "C1", "一群有共同特徵、被一起研究的人。Imamura 裡只是指「這一群受試者」。「世代研究」則是追蹤一群人、看誰後來發生某件事的研究設計。"], "consecutively admitted": ["everyone eligible was invited in order of arrival", "連續收案", "f", "C1", "不挑人，按照入院或就診順序，符合條件的一個接一個邀請。比研究者自己挑人更能避免選樣偏差。"], "consecutively": ["everyone eligible was invited in order of arrival", "連續收案", "f", "C1", "不挑人，按照入院或就診順序，符合條件的一個接一個邀請。比研究者自己挑人更能避免選樣偏差。"], "consecutive": ["everyone eligible was invited in order of arrival", "連續收案", "f", "C1", "不挑人，按照入院或就診順序，符合條件的一個接一個邀請。比研究者自己挑人更能避免選樣偏差。"], "sensitivity": ["the share of people with the condition whom the test correctly identifies", "敏感度", "f", "C1", "真正有問題的人當中，測驗抓出了多少比例。敏感度高 = 很少漏掉病人。篩檢最重視敏感度，因為漏掉病人的代價通常比較大。記法：敏感度看「有病的人」。"], "specificity": ["the share of people without the condition whom the test correctly clears", "特異度", "f", "C1", "真正沒問題的人當中，測驗正確判定為正常的比例。特異度高 = 很少誤判健康的人。記法：特異度看「沒病的人」。敏感度和特異度通常一升一降，像蹺蹺板。"], "false positives": ["a healthy person wrongly identified as having the condition", "偽陽性", "f", "C1", "其實沒問題，卻被測驗判定有問題。偽陽性多，會造成不必要的擔心和處置，例如把還能吃一般飲食的人改成軟食。特異度越高，偽陽性越少。"], "false positive": ["a healthy person wrongly identified as having the condition", "偽陽性", "f", "C1", "其實沒問題，卻被測驗判定有問題。偽陽性多，會造成不必要的擔心和處置，例如把還能吃一般飲食的人改成軟食。特異度越高，偽陽性越少。"], "false negatives": ["a person with the condition whom the test misses", "偽陰性", "f", "C1", "其實有問題，卻被測驗判定正常，也就是「漏診」。偽陰性多，病人會錯過治療。敏感度越高，偽陰性越少。"], "false negative": ["a person with the condition whom the test misses", "偽陰性", "f", "C1", "其實有問題，卻被測驗判定正常，也就是「漏診」。偽陰性多，病人會錯過治療。敏感度越高，偽陰性越少。"], "cut-off value": ["the value that divides results into normal and abnormal", "切點", "f", "C1", "把連續的數字切成「正常／不正常」的那條線。切點往哪邊移，敏感度和特異度就一升一降。切點是人訂的：在年輕人身上訂的切點，未必適合長者。"], "cut-off point": ["the value that divides results into normal and abnormal", "切點", "f", "C1", "把連續的數字切成「正常／不正常」的那條線。切點往哪邊移，敏感度和特異度就一升一降。切點是人訂的：在年輕人身上訂的切點，未必適合長者。"], "cut-off": ["the value that divides results into normal and abnormal", "切點", "f", "C1", "把連續的數字切成「正常／不正常」的那條線。切點往哪邊移，敏感度和特異度就一升一降。切點是人訂的：在年輕人身上訂的切點，未必適合長者。"], "Receiver operating characteristic": ["a graph of sensitivity against false positive rate at every cut-off", "ROC 曲線", "f", "C1", "把一個測驗在各種切點下的表現畫成一條線：縱軸是敏感度，橫軸是偽陽性率。曲線越往左上角靠，測驗越好；貼著對角線就等於隨機猜測。研究者用它比較工具，並找出最佳切點。"], "ROC curve": ["a graph of sensitivity against false positive rate at every cut-off", "ROC 曲線", "f", "C1", "把一個測驗在各種切點下的表現畫成一條線：縱軸是敏感度，橫軸是偽陽性率。曲線越往左上角靠，測驗越好；貼著對角線就等於隨機猜測。研究者用它比較工具，並找出最佳切點。"], "ROC": ["a graph of sensitivity against false positive rate at every cut-off", "ROC 曲線", "f", "C1", "把一個測驗在各種切點下的表現畫成一條線：縱軸是敏感度，橫軸是偽陽性率。曲線越往左上角靠，測驗越好；貼著對角線就等於隨機猜測。研究者用它比較工具，並找出最佳切點。"], "area under the ROC curve": ["one number summarising how well a test separates two groups", "曲線下面積（AUC）", "f", "C1", "ROC 曲線下方的面積，用一個數字總結測驗好不好。0.5 等於丟銅板，1.0 是完美。常用判讀：0.7–0.8 可接受、0.8–0.9 良好、0.9 以上優異。也可以這樣理解：隨機挑一位有問題和一位沒問題的人，測驗把兩人排對順序的機率。"], "area under the curve": ["one number summarising how well a test separates two groups", "曲線下面積（AUC）", "f", "C1", "ROC 曲線下方的面積，用一個數字總結測驗好不好。0.5 等於丟銅板，1.0 是完美。常用判讀：0.7–0.8 可接受、0.8–0.9 良好、0.9 以上優異。也可以這樣理解：隨機挑一位有問題和一位沒問題的人，測驗把兩人排對順序的機率。"], "AUC": ["one number summarising how well a test separates two groups", "曲線下面積（AUC）", "f", "C1", "ROC 曲線下方的面積，用一個數字總結測驗好不好。0.5 等於丟銅板，1.0 是完美。常用判讀：0.7–0.8 可接受、0.8–0.9 良好、0.9 以上優異。也可以這樣理解：隨機挑一位有問題和一位沒問題的人，測驗把兩人排對順序的機率。"], "Youden index": ["sensitivity plus specificity minus one; used to choose a cut-off", "Youden 指數", "f", "C1", "敏感度 + 特異度 − 1。用來找最佳切點：這個值最大的地方，就是敏感度和特異度加起來最平衡的點。"], "gold standard": ["the test against which other tests are judged", "參考標準（黃金標準）", "f", "C1", "用來評判其他工具的「標準答案」。新工具好不好，就看它和參考標準一不一致。所以參考標準本身若有問題（例如切點不適合長者），整個比較都會受影響。"], "reference test": ["the test against which other tests are judged", "參考標準（黃金標準）", "f", "C1", "用來評判其他工具的「標準答案」。新工具好不好，就看它和參考標準一不一致。所以參考標準本身若有問題（例如切點不適合長者），整個比較都會受影響。"], "prevalence": ["the share of a population that has a condition", "盛行率", "f", "C1", "某段時間內，有這個問題的人占全體的比例。盛行率會受診斷標準影響：同一批人，切點一換，盛行率就可能從 83.6% 變成 54%。"], "SPSS": ["a widely used statistics program", "SPSS 統計軟體", "f", "B2", "常用的統計分析軟體（IBM 出品），點選式介面，醫護與社會科學研究最常用。論文交代軟體與版本，是為了讓別人能重現分析。"]}, "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。"}, {"id": "taira2023", "no": "Paper 2", "part": "Abstract + full text", "short": "Taira 2023 · Denture use and food form in long-term care", "title": "Association between denture use and food form in older adults requiring long-term care: A multicenter cross-sectional study", "titleZh": "需長期照護長者的假牙使用與食物型態之關聯：多中心橫斷式研究", "titleG": "又是一個沒有動詞的名詞片語標題，拆法同樣是找介系詞：<em>Association between A and B in C: D</em> — A（假牙使用）與 B（食物型態）在 C（需長期照護的長者）身上的關聯，冒號後面的 D 交代研究設計。醫學論文標題很愛在冒號後面補研究設計，看到冒號就知道後面是方法而不是結論。", "authors": "Taira K, Watanabe Y, Okada K, Kondo M, Takeda M, Ito K, Nakajima J, Iwasaki M, Itoda M, Inohara K, Sasaki R, Nishi Y, Furuya J, Watanabe Y, Umemoto G, Kishima M, Tohara T, Sato Y, Yoshida M, Yamazaki Y", "journal": "J Prosthodont Res, 2023; 67(3): 366-375", "doi": "10.2186/jpr.JPR_D_21_00161", "lic": "Open access under CC BY-NC 4.0 — non-commercial use only; annotated here for private teaching.", "why": "【核心】假牙使用與實際吃到的食物型態，OR 2.82。新題目最貼近的一篇：它處理的正是「口腔狀況 → 實際吃什麼」，而且是機構供餐情境，與便當最接近。", "done": true, "abstract": [{"h": "Purpose", "zh": "研究目的", "s": [{"en": "This study aimed to determine whether denture use contributes to maintaining and improving food forms in long-term care facility (LTCFs) residents.", "zh": "本研究旨在確認配戴假牙是否有助於維持並改善長期照護機構住民的食物型態。", "g": "<em>aimed to determine whether...</em>（旨在確認是否……）是研究目的句的另一個標準寫法，跟 Yen 那篇的 “The purpose of this study is to evaluate...” 是同一類。兩句都背下來，寫自己的論文時任選一個。注意 <em>contribute to + Ving</em>，介系詞 to 後面要接動名詞，不是原形動詞。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "In 888 residents of 37 LTCFs in Japan, the following were investigated: nutritional intake status, food forms, age, sex, Barthel index (BI), clinical dementia rating (CDR), number of teeth present, number of occlusal supports, swallowing function, and use of dentures.", "zh": "研究對日本 37 家長期照護機構的 888 位住民，調查了以下項目：營養攝取狀況、食物型態、年齡、性別、巴氏量表（BI）、臨床失智評估量表（CDR）、現存牙數、咬合支持數、吞嚥功能，以及假牙使用情形。", "g": "<em>the following were investigated:</em>（以下項目接受了調查）後面接冒號再列清單，是 Methods 段最省字的寫法。這句要學的是：先講「調查了什麼」，冒號之後一口氣列完，不必每一項都寫一句。"}, {"en": "Among all residents, those who were well-nourished and had ≤9 occlusal supports were analyzed.", "zh": "在所有住民中，僅分析營養狀況良好且咬合支持數小於或等於 9 者。", "g": "<em>≤</em> 唸作 “less than or equal to”。研究刻意只留下這一群人，因為咬合支持多的人本來就吃得好，留下來會稀釋掉假牙的效果。這種「先篩出真正想看的人」的動作叫 <em>restriction</em>，是研究設計的常見手法。"}, {"en": "Based on standardized criteria, the food forms consumed by the subjects were divided into two groups: dysphagia and normal diet, which were further classified into four levels.", "zh": "依標準化的判定準則，將受試者食用的食物型態分為兩類：吞嚥調整飲食與一般飲食，再進一步細分為四個等級。", "g": "<em>be divided into</em>（被分成）與 <em>be classified into</em>（被歸類為）是同義替換，論文為了避免重複而交替使用。<em>further</em> 在這裡是「進一步」，不是「更遠」。"}, {"en": "Analysis was performed using a generalized estimation equation with the four levels of food forms as dependent variables and age, sex, BI, CDR, presence of dysphagia, number of teeth present, and use of dentures as independent variables.", "zh": "分析採用廣義估計方程式，以四個等級的食物型態為依變項，並以年齡、性別、巴氏量表、臨床失智評估量表、是否有吞嚥困難、現存牙數與假牙使用情形為自變項。", "g": "又是 <em>with A as dependent variables and B as independent variables</em> 這個結構——跟 Yen 那篇一模一樣，只是換了統計方法。讀第二篇論文的好處就在這裡：句型開始重複，會越讀越快。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The final analysis included 622 (70.0%) residents.", "zh": "最終納入分析者為 622 位（70.0%）住民。", "g": "<em>final analysis</em>（最終分析）指的是層層排除之後真正拿來算的樣本。從 888 人到 622 人，中間排除了誰、為什麼排除，Methods 必須交代清楚。"}, {"en": "Of these, 380 (61.1%) used dentures.", "zh": "其中 380 位（61.1%）有使用假牙。", "g": "<em>Of these</em>（其中）是承接上一句數字的簡短說法，等於 “Of these residents”。報告數據時很好用，可以少寫一個完整句子。"}, {"en": "The analyses revealed that food form was significantly associated with age (adjusted odds ratio [OR], 0.98), BI (OR, 1.04), number of teeth present (OR, 1.03), presence of dysphagia (OR, 0.44), and use of dentures (OR, 2.82).", "zh": "分析顯示食物型態與年齡（調整後勝算比 OR 為 0.98）、巴氏量表（OR 1.04）、現存牙數（OR 1.03）、是否有吞嚥困難（OR 0.44）與假牙使用情形（OR 2.82）顯著相關。", "g": "<em>odds ratio（OR，勝算比）</em>的讀法：OR = 1 表示沒有差別；大於 1 表示機會提高；小於 1 表示機會降低。所以假牙的 2.82 是「使用假牙者吃到較高等級食物型態的機會將近三倍」，而吞嚥困難的 0.44 是「機會不到一半」。<em>adjusted</em>（調整後）代表已經把其他因素的影響扣掉了。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Denture use was associated with food forms among Japanese LTCF residents.", "zh": "在日本長期照護機構住民中，假牙使用情形與食物型態有關。"}, {"en": "This indicates that the use of dentures is related to the maintenance of food forms, even in the elderly who participate in few activities of daily living, have reduced cognitive function, and require long-term care.", "zh": "這顯示即使是日常生活活動參與少、認知功能下降且需要長期照護的長者，配戴假牙仍與食物型態的維持有關。", "g": "<em>even in...</em>（即使在……身上）是這篇結論的關鍵詞。作者想說的不只是「假牙有用」，而是「連最弱的族群也有用」。找到 even、especially、particularly 這類字，就找到了作者強調的重點。"}]}], "fulltext": [{"h": "Introduction", "zh": "前言", "s": [{"en": "A dysphagia diet is provided to 26–67% of residents in long-term care facilities (LTCFs) to prevent aspiration.", "zh": "為預防嗆入，長期照護機構有 26–67% 的住民被提供吞嚥調整飲食。", "g": "開場就丟數字，是流行病學論文的常見起手式：先證明「這件事很普遍」，再談問題。<em>to prevent aspiration</em> 是不定詞表目的（為了預防）。"}, {"en": "However, a dysphagia diet may have a poor appearance, taste, and reduced nutritional value, which may cause dehydration.", "zh": "然而，吞嚥調整飲食可能外觀不佳、味道不好、營養價值降低，並可能導致脫水。", "g": "<em>However</em> 一出現，代表要翻面了：上一句講好處或現狀，這一句講代價。論文的問題意識常常就藏在第一個 However 後面。"}, {"en": "Furthermore, the intake of a dysphagia diet is associated with a lower quality of life.", "zh": "此外，食用吞嚥調整飲食與較低的生活品質有關。"}, {"en": "Therefore, maintaining and improving food forms in dysphagia diets is essential to maintain and improve the health and QOL of LTCF residents.", "zh": "因此，維持並改善吞嚥調整飲食的食物型態，對於維持與提升機構住民的健康與生活品質相當重要。", "g": "注意這三句的連接詞鏈：<em>However → Furthermore → Therefore</em>（然而 → 此外 → 因此）。這就是論文段落的骨架。讀前言時先把這些連接詞圈出來，論證的走向立刻清楚。"}, {"en": "In LTCF residents, the efficiency of the masticatory function is better in those with partial dentures than in those without partial dentures.", "zh": "在機構住民中，有配戴局部假牙者的咀嚼功能效率優於未配戴者。", "g": "<em>better in A than in B</em>——比較級的完整結構。介系詞 in 要重複出現在兩邊，這是台灣學生常漏掉的細節。"}, {"en": "Moreover, when food is divided into normal and dysphagia diets, the number of teeth present and tooth contact pairs, natural or artificial, significantly affect the maintenance of food forms.", "zh": "再者，當食物分為一般飲食與吞嚥調整飲食時，現存牙數以及天然或人工的牙齒接觸對數，都會顯著影響食物型態的維持。", "g": "<em>natural or artificial</em> 夾在兩個逗號之間，是在補充說明前面的 tooth contact pairs（不論是真牙還是假牙的接觸）。這種插入補充在論文極常見，讀的時候先跳過、抓完主幹再回頭。"}, {"en": "Until 2013, each institution and region used different terms to describe identical dysphagia diets in Japan.", "zh": "在 2013 年之前，日本各機構與各地區對同樣的吞嚥調整飲食使用不同的名稱。"}, {"en": "Therefore, the relationship between food forms assessed using standardized criteria and the use of dentures has not been fully elucidated.", "zh": "因此，以標準化準則評估的食物型態與假牙使用之間的關係，尚未被充分釐清。", "g": "<em>has not been fully elucidated</em>（尚未被充分釐清）是宣告研究缺口的高級說法，等於 “we still do not know”。同類的還有 remains unclear、has not been established。這三個片語擇一背下來，寫前言結尾直接用。"}, {"en": "Furthermore, a decline in activities of daily living (ADL) and cognitive function reportedly makes the use of dentures difficult.", "zh": "此外，據報導日常生活活動能力（ADL）與認知功能下降會使假牙的使用變得困難。", "g": "<em>reportedly</em>（據報導、據稱）是一個很有用的副詞：表示這是別人講的、作者不完全背書。學術寫作常用它來保持距離。"}, {"en": "However, few studies have examined whether dentures are associated with food forms even in LTCF residents with a decline in ADL and cognitive function.", "zh": "然而，很少有研究檢視在 ADL 與認知功能下降的機構住民身上，假牙是否仍與食物型態有關。", "g": "<em>few studies have examined...</em>（很少有研究檢視過……）是研究缺口的第二號句型。注意 few 是「很少」（偏負面），a few 是「有幾個」（偏正面），差一個 a 意思就反了。"}, {"en": "Many nursing home residents do not use dentures despite needing them, which is likely related to poorly fitting dentures.", "zh": "許多養護機構住民雖然需要假牙卻沒有使用，這可能與假牙不密合有關。", "g": "<em>despite + Ving</em>（儘管……）後面不能接句子。<em>poorly fitting</em>（不密合的）是假牙研究的核心詞，跟 ill-fitting 同義。"}, {"en": "Other factors, such as denture mismanagement, loss of dentures, and lack of oral care services, may also make denture use difficult for elderly residents in need of care.", "zh": "其他因素，例如假牙管理不當、假牙遺失、缺乏口腔照護服務，也可能使需要照護的長者難以使用假牙。", "g": "這一句對口腔衛生師特別有意義：它把問題從「病人的嘴」擴大到「照護系統」。<em>mismanagement</em> 的 mis- 是表示「錯誤地」的字首，同類的還有 misuse、misunderstand。"}, {"en": "Furthermore, it can be assumed that there is little cooperation between oral healthcare providers and nursing staff.", "zh": "此外，可以推測口腔照護提供者與護理人員之間缺乏合作。", "g": "<em>it can be assumed that...</em>（可以推測……）又是被動加虛主詞，把推測講出來但不把自己擺在前面。跟 Yen 那篇的 “It is suggested that...” 是同一套路。"}, {"en": "Therefore, we hypothesized that the use of dentures might be related to the maintenance of food forms, even in LTCF residents with a decline in ADL and cognitive function.", "zh": "因此，我們假設即使在 ADL 與認知功能下降的機構住民身上，配戴假牙仍可能與食物型態的維持有關。", "g": "<em>we hypothesized that...</em>（我們假設……）——研究假設句，注意後面用 <em>might be</em> 而非 is，因為假設還沒驗證。這跟 Yen 那篇用 would be 是同樣的道理。"}, {"en": "Consequently, we conducted a cross-sectional survey on the use of dentures and food forms in Japanese LTCF residents to examine this relationship.", "zh": "於是，我們針對日本機構住民的假牙使用與食物型態進行橫斷式調查，以檢驗這項關係。", "g": "<em>Consequently</em>（於是、因此）跟 Therefore 同義，論文為了不重複而換字。前言的最後一句幾乎一定是「所以我們做了這個研究」。"}]}, {"h": "Methods · Study design and participants", "zh": "研究方法 · 設計與對象", "s": [{"en": "This was a cross-sectional study including Japanese LTCF residents.", "zh": "本研究為納入日本長期照護機構住民的橫斷式研究。"}, {"en": "A workshop was held for 30 specially appointed committee members of the Japanese Society of Gerodontology to explain the study content and establish unified evaluation criteria for survey items that were repeatedly standardized until all evaluations were in perfect agreement to ensure consistent assessments.", "zh": "研究為日本老年牙醫學會的 30 位特聘委員舉辦工作坊，說明研究內容並建立調查項目的統一評估準則，反覆標準化直到所有評估完全一致，以確保評估的一致性。", "g": "<em>unified evaluation criteria</em>（統一的評估準則）是多中心研究的命脈：37 家機構、不同人評估，如果標準不一，資料就沒有可比性。這正是多中心研究比單中心麻煩、但也更有說服力的地方。"}, {"en": "Subsequently, each committee member explained the study content to the institution’s chief and the staff of their corresponding facilities.", "zh": "隨後，各委員向其對應機構的負責人與工作人員說明研究內容。"}, {"en": "For this study, the members of the appointed committee collaborated with 37 facilities in 17 regions.", "zh": "本研究由特聘委員與 17 個地區的 37 家機構合作進行。", "g": "<em>multicenter</em>（多中心）的具體內容就在這句：17 個地區、37 家機構。相較於 Yen 那篇的單一來源（高雄市長青學苑），這篇的代表性更廣——這是報告時可以拿來比較兩篇的一個角度。"}, {"en": "In cases where it was possible to obtain consent from a participating LTCF resident, the researcher directly explained the study contents and obtained written consent for participation in the study from the LTCF resident.", "zh": "若能取得住民本人同意，研究者即直接向住民說明研究內容並取得書面同意書。"}, {"en": "In cases where it was difficult to obtain consent from potential study participants, their families received a written explanation of the study to obtain written consent from them.", "zh": "若難以取得潛在受試者本人的同意，則向其家屬提供書面說明並取得家屬的書面同意。", "g": "這兩句處理的是研究倫理的難題：受試者有認知功能下降，可能無法自己同意。做法是改由家屬代理同意（<em>proxy consent</em>）。這在失智族群研究中是標準程序，研究若涉及機構長者也會遇到。"}, {"en": "Written consent was obtained from 888 residents and their families to participate in the study, and the study was conducted between October 2018 and February 2019.", "zh": "共取得 888 位住民及其家屬的書面同意，研究於 2018 年 10 月至 2019 年 2 月間執行。"}, {"en": "This study was approved by the ethics committee of the Japanese Society of Gerodontology and the epidemiological research ethics committee of Hokkaido University.", "zh": "本研究經日本老年牙醫學會倫理委員會與北海道大學流行病學研究倫理委員會核准。", "g": "注意這篇過了<em>兩個</em>倫理委員會：學會的與大學的。多中心研究常常需要多重審查。"}, {"en": "This study was conducted following the ethical principles of the Declaration of Helsinki.", "zh": "本研究依赫爾辛基宣言的倫理原則執行。", "g": "<em>Declaration of Helsinki</em>（赫爾辛基宣言）是人體研究倫理的國際準則。幾乎每篇涉及人的論文都會寫這一句，自己的論文也一定要寫。"}]}, {"h": "Methods · Survey items", "zh": "研究方法 · 調查項目", "s": [{"en": "During the survey, the research members provided training on the evaluation of survey items to all nurses and registered dietitians of the included institutions, and the evaluation criteria were unified.", "zh": "調查期間，研究人員對各參與機構的所有護理師與營養師進行調查項目評估訓練，並統一評估準則。", "g": "<em>registered dietitian</em>（營養師）是這篇的關鍵角色之一：食物型態是由營養師判定的。這篇論文的資料其實是靠護理師與營養師收集的，不是牙醫——對口腔衛生背景的人來說，這正是跨領域合作的實例。"}, {"en": "The participants’ age, sex, BMI, recent serum albumin levels, nutritional methods, and use of dentures during meals were transcribed from nursing records by the nurses and registered dietitians in charge.", "zh": "受試者的年齡、性別、體重指數、近期血清白蛋白值、營養攝取方式與用餐時假牙使用情形，由負責的護理師與營養師自護理紀錄轉錄。", "g": "<em>serum albumin</em>（血清白蛋白）是營養狀況的常用血液指標，偏低代表營養不良。<em>in charge</em>（負責的）放在名詞後面修飾。<em>transcribed from nursing records</em> 說明資料是從既有紀錄抄來的，不是研究者現場量的——這種叫 <em>retrospective</em>（回溯性）取材。"}, {"en": "A charge nurse evaluated physical function using the Barthel index (BI).", "zh": "由責任護理師以巴氏量表（BI）評估身體功能。", "g": "<em>Barthel index</em>（巴氏量表）測的是日常生活活動能力：吃飯、穿衣、上廁所、移動等，滿分 100 分，分數越高越獨立。台灣申請長照與外籍看護也用這張表。"}, {"en": "Cognitive function was assessed using the clinical dementia rating (CDR) by nurses who received prior training from co-investigators on the standardized assessment criteria.", "zh": "認知功能由接受過共同研究者標準化評估訓練的護理師以臨床失智評估量表（CDR）評估。", "g": "<em>CDR</em>（臨床失智評估量表）分為 0、0.5、1、2、3 五級：0 是正常，0.5 是可疑，1 輕度，2 中度，3 重度。這篇有七成以上住民在 2 級以上，是相當嚴重的族群。"}, {"en": "Finally, a Japanese psychiatrist specializing in dementia, certified as a dementia specialist in Japan, checked all assessments and determined the final CDR score.", "zh": "最後由日本失智症專科精神科醫師檢核所有評估結果，並判定最終的 CDR 分數。", "g": "這一句在交代品質控管：不是護理師說了算，最後有專科醫師把關。研究方法寫得越細，審查者越放心——這是值得學的寫作習慣。"}, {"en": "Each facility’s registered dietitian calculated the average daily total oral energy intake for each resident during the previous week by referring to the amount of food provided by the dietitians and the amount of remaining food visually checked by the nurses and caregivers.", "zh": "各機構的營養師參考供餐量，以及護理師與照顧者目測的剩食量，計算每位住民前一週的每日平均口腔熱量攝取量。", "g": "<em>visually checked</em>（目測）是很務實的做法：機構不可能把每份剩菜秤重，所以靠目視估計。作者後面在討論段也承認了這個方法的限制。做研究常常要在精準與可行之間妥協。"}, {"en": "Participants were classified into oral and parenteral intake groups according to enteral and intravenous administration routes for nutrition.", "zh": "受試者依腸道與靜脈營養給予途徑，分為口腔攝取組與非口腔攝取組。", "g": "三個詞要分清楚：<em>oral</em>（經口）、<em>enteral</em>（經腸道，如鼻胃管）、<em>parenteral</em>（非經腸道，如靜脈注射）。這是營養照護的基本分類。"}, {"en": "The residents were assigned to the poorly nourished group if their average daily total oral energy intake was <75% or the well-nourished group if their average daily total oral energy intake was ≥75%.", "zh": "每日平均口腔熱量攝取量低於 75% 者歸入營養不良組，達 75% 以上者歸入營養良好組。", "g": "<em>be assigned to</em>（被分配到）是分組的標準說法。75% 這個切點不是隨便定的，作者在討論段解釋了它來自日本長照保險的分類標準——任何切點都應該有依據，這也是口試常被問的問題。"}, {"en": "The well-nourished group was further classified into two subgroups: a group with ≥10 occlusal supports and another with ≤9 occlusal supports.", "zh": "營養良好組再進一步分為兩個次組：咬合支持數 10 以上者與 9 以下者。", "g": "<em>subgroup</em>（次組、亞組）。這裡是分組的第二層。讀 Methods 時建議邊讀邊在紙上畫流程圖：888 人 → 排除 → 785 人 → 分營養良好／不良 → 再分咬合支持多／少 → 622 人。畫出來就不會迷路。"}, {"en": "The dietitian in charge classified dysphagia diets according to the Japanese Dysphagia Diet 2013 guidelines proposed by the Japanese Society of Dysphagia Rehabilitation.", "zh": "由負責營養師依日本吞嚥復健學會提出的「日本吞嚥調整食 2013」指引分類吞嚥調整飲食。", "g": "<em>JDD 2013</em> 是日本本國的吞嚥飲食分級標準。台灣目前多採用國際的 IDDSI 架構，作者在討論段也把兩套系統做了對照——這是報告時很好用的一個切入點，因為台灣現場也在處理同樣的標準轉換問題。"}, {"en": "Dysphagia diets were classified into five codes (0 to 4), with higher codes indicating dysphagia diets that were closer to a normal diet.", "zh": "吞嚥調整飲食分為 0 到 4 五個代碼，代碼越高代表越接近一般飲食。", "g": "<em>with higher codes indicating...</em> 又是那個 <em>with + 名詞 + Ving</em> 的補充結構。這篇跟 Yen 那篇都反覆用它，代表這真的是論文高頻句型，值得專門練。"}, {"en": "Although a normal diet is stiffer than a dysphagia diet, it is classified into two food forms.", "zh": "雖然一般飲食比吞嚥調整飲食更硬，但仍分為兩種食物型態。", "g": "<em>stiffer</em>（較硬的）——注意這裡用 stiff 而不是 hard 來形容食物質地。描述便當菜色軟硬時會用到，這類形容詞要成組蒐集：hard、soft、stiff、tender、chewy、crisp。"}, {"en": "The lower level comprised soft, tender, and easily chewable food forms or food forms that had been modified.", "zh": "較低的等級包含軟質、細嫩、易咀嚼的食物型態，或經過調整處理的食物型態。", "g": "<em>comprise</em>（包含、由……組成）是比 include 更正式的字。<em>tender</em>（細嫩的）常用來形容肉質。<em>modified</em>（經調整的）在吞嚥飲食語境中就是「切碎、勾芡、打成泥」這類處理。"}, {"en": "A higher level represented normal meals that were not modified for easier consumption.", "zh": "較高的等級代表未經調整以便於進食的一般餐食。"}, {"en": "Consequently, dysphagia and normal diets were classified into the following four levels: food form 1, JDD 2013 level <2-2; food form 2, JDD 2013 levels 3 and 4; food form 3, soft normal diet or normal modified diet; food form 4, normal diet that has not been modified to be soft and easy to eat.", "zh": "因此，吞嚥調整飲食與一般飲食共分為以下四個等級：食物型態 1 為 JDD 2013 等級低於 2-2；食物型態 2 為 JDD 2013 等級 3 與 4；食物型態 3 為軟質一般飲食或經調整的一般飲食；食物型態 4 為未經軟化調整的一般飲食。", "g": "這四個等級就是這篇的依變項，整篇的結論都建立在它上面。讀論文遇到核心變項的定義，一定要停下來確認清楚，否則後面每個數字都會看不懂。"}, {"en": "The swallowing function of the participants was assessed using a questionnaire for dysphagia screening developed by Ohkuma et al.", "zh": "受試者的吞嚥功能以 Ohkuma 等人開發的吞嚥困難篩檢問卷評估。"}, {"en": "This questionnaire consists of 15 items reflecting the history of pneumonia; nutritional status; oral, pharyngeal, and esophageal function; and epiglottis function.", "zh": "該問卷包含 15 題，涵蓋肺炎病史、營養狀況、口腔、咽部與食道功能，以及會厭功能。", "g": "解剖位置由上到下記一組：<em>oral</em>（口腔）→ <em>pharyngeal</em>（咽）→ <em>esophageal</em>（食道），中間有 <em>epiglottis</em>（會厭）擋住氣管。這組詞在吞嚥領域會一直出現。"}, {"en": "Each question was evaluated using a three-point scale: “A, severe symptoms;” “B, mild symptoms;” and “C, no symptoms.”", "zh": "每題以三點量表評估：A 為嚴重症狀、B 為輕微症狀、C 為無症狀。"}, {"en": "Based on previous studies, we considered that a participant had “dysphagia” if any of the 15 items were answered with “A” and “no dysphagia” if all items were answered with “B” or “C”.", "zh": "依據先前研究，只要 15 題中任一題答 A 即視為有吞嚥困難；全部答 B 或 C 則視為無吞嚥困難。", "g": "<em>if any of ... were answered with A</em>——只要有一題就算，這是很寬鬆的判定門檻（寧可多抓不要漏掉）。篩檢工具通常都這樣設計：<em>sensitivity</em>（敏感度）優先於 <em>specificity</em>（特異度）。"}]}, {"h": "Methods · Assessments", "zh": "研究方法 · 口腔評估", "s": [{"en": "A survey was conducted by 30 dentists and dental hygienists who were pretrained using the agreed-upon uniform evaluation criteria.", "zh": "調查由 30 位事先依統一評估準則受訓的牙醫師與口腔衛生師執行。", "g": "注意這句：<em>dental hygienists</em>（口腔衛生師）在日本的研究中是正式的資料收集者。在日本的研究裡，口腔衛生師是正式的資料收集者之一。報告這篇時，這是一個可以順帶提起的點。"}, {"en": "The dentists and dental hygienists were unaware of the food form consumed by the residents.", "zh": "牙醫師與口腔衛生師並不知道住民所食用的食物型態。", "g": "<em>unaware of</em>（不知道）在這裡是刻意設計的，就是<em>盲法（blinding）</em>：評估口腔狀況的人不知道結果變項，才不會不自覺地往預期方向評。這一句很小，但是研究品質的重要標誌，口試時值得主動提。"}, {"en": "“Number of teeth present” was defined as the number of erupted teeth in the oral cavity, excluding roots with collapsed crowns and teeth with a score of 3 according to Miller’s mobility index.", "zh": "「現存牙數」定義為口腔內已萌發的牙齒數，但排除牙冠崩塌的殘根以及 Miller 動搖度指數第三級的牙齒。", "g": "又是 <em>was defined as</em>。跟 Yen 那篇對照會發現兩篇的定義幾乎一樣（都排除殘根與第三度動搖），代表這是這個領域的共識做法。自己收資料時可以直接沿用，並引用這兩篇作為依據。"}, {"en": "When the crown structure of the tooth is lost and only a residual root is present, it is considered the “stump of the tooth” and corresponds to “C4” used in Japanese dental examinations to describe carious lesions.", "zh": "當牙冠結構喪失、僅存殘根時，稱為「殘根」，對應日本牙科檢查中用來描述齲齒病灶的「C4」。", "g": "<em>C1 到 C4</em> 是日本的齲齒分級。台灣的分級方式不同，所以讀日本論文時遇到本國專用分級，要先確認它對應什麼——這也是跨國比較研究的一個常見障礙。"}, {"en": "The dentists and dental hygienists surveyed residents or their caregivers about their use of dentures.", "zh": "牙醫師與口腔衛生師向住民或其照顧者詢問假牙使用情形。"}, {"en": "The “number of occlusal supports” was defined as the number of supports in which the same type of teeth on the ipsilateral upper and lower jaws belonged to one of the following combinations: tooth present and tooth present; tooth present and implant; tooth present and pontic; and pontic and pontic.", "zh": "「咬合支持數」定義為同側上下顎同類型牙齒符合以下組合之一的支持數：真牙對真牙、真牙對植體、真牙對牙橋假牙，以及牙橋假牙對牙橋假牙。", "g": "<em>ipsilateral</em>（同側的）對應 <em>contralateral</em>（對側的）。<em>pontic</em> 是牙橋中間懸空的那顆假牙。這個定義的重點是：上下要能對咬到，才算一個「咬合支持」——能對咬才咬得動食物。"}, {"en": "Roots with collapsed crowns, teeth affected by severe periodontitis, and wisdom teeth were excluded from the study.", "zh": "牙冠崩塌的殘根、嚴重牙周病的牙齒與智齒均排除在外。", "g": "<em>wisdom teeth</em>（智齒）被排除，因為它位置太後面、常常沒有對咬，算進去會高估咬合能力。研究裡每一個排除決定背後都該有理由。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "Categorical variables were analyzed using the chi-square test for item-specific comparisons between the well-nourished and poorly nourished groups.", "zh": "類別變項以卡方檢定進行營養良好組與營養不良組之間的逐項比較。", "g": "<em>chi-square test</em>（卡方檢定，唸 KY-square）是比較「類別變項」分布差異的標準方法，例如男女比例在兩組間是否不同。Yen 那篇也用了它。兩篇都出現的方法，優先記。"}, {"en": "Categorical variables with two terms were tested using the Cochran–Armitage trend test, and variables with three or more categories were tested using the Kruskal–Wallis test.", "zh": "二分類的類別變項以 Cochran–Armitage 趨勢檢定，三類以上者以 Kruskal–Wallis 檢定。", "g": "這裡的邏輯跟 Yen 那篇的「兩組用 t 檢定、三組以上用 ANOVA」一樣：組數決定方法。只是這篇的資料不呈常態，所以改用無母數（non-parametric）版本的 Kruskal–Wallis。"}, {"en": "Continuous variables were analyzed using the independent t-test or Mann–Whitney U test, considering normality.", "zh": "連續變項依常態性採用獨立 t 檢定或 Mann–Whitney U 檢定。", "g": "<em>considering normality</em>（考量常態性）是關鍵：資料呈常態就用 t 檢定，不呈常態就用 Mann–Whitney U。這組配對務必記牢，是生統考試的必考題。"}, {"en": "Subsequently, the items expected to have trends or differences between residents with occlusal supports ≤9 who ate any of the four food forms were tested using the Jonckheere–Terpstra trend test.", "zh": "隨後，針對咬合支持數 9 以下、食用四種食物型態之一的住民，以 Jonckheere–Terpstra 趨勢檢定檢視預期存在趨勢或差異的項目。", "g": "<em>trend test</em>（趨勢檢定）問的不是「有沒有差」，而是「有沒有順著方向遞增或遞減」。因為食物型態 1 到 4 是有順序的等級，用趨勢檢定比單純比大小更有力。"}, {"en": "A multivariate analysis was performed in residents with ≤9 occlusal supports to examine the relationship between food forms and the use of dentures.", "zh": "在咬合支持數 9 以下的住民中進行多變項分析，以檢視食物型態與假牙使用之間的關係。"}, {"en": "Based on previous test results, the four aforementioned levels of food forms were used as dependent variables, and sex, age, BI, CDR, number of teeth present, dysphagia, and use of dentures were independent variables.", "zh": "依先前檢定結果，以上述四個食物型態等級為依變項，性別、年齡、BI、CDR、現存牙數、吞嚥困難與假牙使用為自變項。", "g": "<em>aforementioned</em>（前述的）是很正式的字，等於 “mentioned above”。讀到它就回頭找前面提過的那個東西。"}, {"en": "In multivariate analysis, adjusted odds ratios (ORs) with 95% confidence intervals (CIs) were obtained using a generalized estimation equation, considering that the corresponding data had a hierarchical structure across multiple facilities.", "zh": "多變項分析以廣義估計方程式取得調整後勝算比（OR）與 95% 信賴區間（CI），因為資料在多家機構之間具有階層結構。", "g": "這句解釋了為什麼用廣義估計方程式而不是普通迴歸：同一家機構的住民吃同一個廚房煮的飯，資料彼此不獨立（<em>hierarchical structure</em>，階層結構）。忽略這件事會低估誤差。<em>95% CI</em>（信賴區間）如果跨過 1，就代表不顯著——看 OR 一定要連 CI 一起看。"}, {"en": "All statistical analyses were performed with SPSS Statistics version 26, and a p-value <0.05 was considered statistically significant.", "zh": "所有統計分析以 SPSS Statistics 26 版執行，p 值小於 0.05 視為統計上顯著。", "g": "這篇用 SPSS，Yen 那篇用 STATA。兩個都是常見軟體；課程若要求 SPSS，正好對得上這篇。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Of the 888 residents investigated using cross-sectional surveys, 785 were included in the analysis: 176 males and 609 females, with a mean age of 86.6 years and a standard deviation of 7.8 years.", "zh": "在接受橫斷式調查的 888 位住民中，785 位納入分析：男性 176 位、女性 609 位，平均年齡 86.6 歲，標準差 7.8 歲。", "g": "平均年齡 86.6 歲——比 Yen 那篇的 76.8 歲高了整整十歲，而且女性占近八成。兩篇的族群差很多，這正是比較兩篇時最該先講清楚的事。"}, {"en": "We excluded 60 residents who received parenteral nutrition and 43 participants with missing data.", "zh": "排除 60 位接受非經腸道營養者與 43 位資料缺漏者。", "g": "<em>missing data</em>（資料缺漏）是量性研究永遠要交代的事。排除多少人、為什麼排除，必須寫清楚，否則讀者無法判斷結果有沒有偏差。"}, {"en": "The characteristics of the participants were as follows: age: median, 87.0 years; BI: median, 30.0; number of teeth present: median, 5; and number of occlusal supports: median, 0.", "zh": "受試者特徵如下：年齡中位數 87.0 歲；巴氏量表中位數 30.0；現存牙數中位數 5 顆；咬合支持數中位數 0。", "g": "咬合支持數的中位數是 <em>0</em>——意思是超過一半的人完全沒有能對咬的牙齒。這個數字讓整篇論文的意義立刻清楚：對這群人來說，假牙不是加分，而是能不能咬東西的唯一途徑。"}, {"en": "There were 710 (90.4%) and 75 (9.6%) residents in the well-nourished and poorly nourished groups, respectively.", "zh": "營養良好組有 710 位（90.4%），營養不良組有 75 位（9.6%）。"}, {"en": "A comparison of both groups showed that the well-nourished group had significantly higher BMI, BI, and serum albumin levels, as well as significantly lower age and proportion of females than the poorly nourished group.", "zh": "兩組比較顯示，營養良好組的體重指數、巴氏量表與血清白蛋白值顯著較高，年齡與女性比例則顯著較低。", "g": "<em>as well as</em>（以及）用來連接兩串並列的內容。這句一次講了五個變項的方向，讀的時候先分成「較高的那些」與「較低的那些」兩堆。"}, {"en": "Of the 710 residents in the well-nourished group, 88 (12.4%) had ≥10 occlusal supports, and 622 (87.6%) had ≤9 occlusal supports.", "zh": "營養良好組的 710 位住民中，88 位（12.4%）咬合支持數 10 以上，622 位（87.6%）為 9 以下。"}, {"en": "Those with ≥10 occlusal supports were significantly younger and had a significantly higher BMI and number of teeth present than those with ≤9 occlusal supports.", "zh": "咬合支持數 10 以上者顯著較年輕，且體重指數與現存牙數顯著較高。"}, {"en": "Of the 622 residents with ≤9 occlusal supports, 99 (15.9%) ate food form 1, 164 (26.4%) ate food form 2, 244 (39.2%) ate food form 3, and 115 (18.5%) ate food form 4.", "zh": "咬合支持數 9 以下的 622 位住民中，99 位（15.9%）食用食物型態 1、164 位（26.4%）食物型態 2、244 位（39.2%）食物型態 3、115 位（18.5%）食物型態 4。"}, {"en": "As food forms approached a normal diet, age and the rate of dysphagia decreased significantly, while BI, the number of teeth present, and the rate of use of dentures increased significantly.", "zh": "隨著食物型態越接近一般飲食，年齡與吞嚥困難比例顯著下降，而巴氏量表、現存牙數與假牙使用率則顯著上升。", "g": "<em>As A..., B...</em>（隨著 A……，B……）是描述趨勢的好句型。注意這裡的 <em>while</em> 又是「相對地」而不是「當……時」——前半下降、後半上升，正好對比。假牙使用率從食物型態 1 的 31.3% 一路升到食物型態 4 的 84.3%，這個梯度就是整篇的核心圖像。"}, {"en": "Analyses using generalized estimation equations revealed that age, BI, number of teeth present, use of dentures, and dysphagia were significantly associated with the four levels of food forms.", "zh": "廣義估計方程式分析顯示，年齡、巴氏量表、現存牙數、假牙使用與吞嚥困難均與四個食物型態等級顯著相關。"}, {"en": "Moreover, the correlation matrix did not indicate independent variables with a correlation coefficient |r| > 0.8.", "zh": "此外，相關矩陣未顯示任何自變項的相關係數絕對值超過 0.8。", "g": "這一句在檢查<em>多重共線性</em>：如果兩個自變項相關太高（超過 0.8），就代表它們在量同一件事，模型會不穩。Yen 那篇用 VIF 檢查，這篇用相關矩陣——兩種做法都可以，目的相同。<em>|r|</em> 是絕對值，不論正負。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "This study investigated the actual food forms consumed by Japanese LTCF residents.", "zh": "本研究調查了日本長期照護機構住民實際食用的食物型態。"}, {"en": "The results revealed that food forms closer to a normal diet were associated with increased BI, a higher number of teeth present, absence of dysphagia, and use of dentures.", "zh": "結果顯示，越接近一般飲食的食物型態，與較高的巴氏量表分數、較多的現存牙數、無吞嚥困難以及使用假牙有關。"}, {"en": "This indicates that the use of dentures may have contributed to the maintenance of food forms, even in residents with a decline in ADL and cognitive function.", "zh": "這顯示即使在 ADL 與認知功能下降的住民身上，假牙仍可能有助於維持食物型態。", "g": "注意 <em>may have contributed</em>（可能曾有助於）：這是很克制的說法。橫斷式研究不能講因果，所以連「有助於」都要加上 may。這個分寸跟 Yen 那篇一樣。"}, {"en": "A cross-sectional study of 639 Canadian LTCF residents reported significant associations of the four food forms with ADL and cognitive performance scores.", "zh": "一項針對 639 位加拿大機構住民的橫斷式研究，指出四種食物型態與 ADL 及認知表現分數顯著相關。"}, {"en": "Previous studies also reported that dysphagia risk, a factor that directly affects food intake, was positively correlated with modified food texture.", "zh": "先前研究也指出，直接影響進食的吞嚥困難風險，與經調整的食物質地呈正相關。", "g": "<em>modified food texture</em>（經調整的食物質地）——便當若要做成高齡友善，調整的就是這個。這篇論文的 food form 與題目裡的 food texture 是同一個概念的不同說法——寫文獻回顧時，這兩個詞都要當關鍵字搜尋。"}, {"en": "There was no significant association between food forms and cognitive function between the groups in our study.", "zh": "本研究中，食物型態與認知功能在各組間並無顯著關聯。"}, {"en": "However, we found significant associations between food forms and ADL, as well as food form and dysphagia risk, similar to the aforementioned Canadian study.", "zh": "然而，我們發現食物型態與 ADL，以及食物型態與吞嚥困難風險之間存在顯著關聯，與前述加拿大研究相似。", "g": "討論段的標準動作：把自己的結果跟別人的比，一項一項講「這裡一致、那裡不一致」。不一致的地方還要試著解釋原因，這就是討論的價值。"}, {"en": "Moreover, a dysphagia diet may be chosen to prevent aspiration when masticatory and swallowing abilities decline.", "zh": "再者，當咀嚼與吞嚥能力下降時，可能會選用吞嚥調整飲食以預防嗆入。"}, {"en": "Studies conducted on Japanese people aged ≥65 years reported that a higher level of competence in daily living and the number of teeth present were significantly associated with objective masticatory function.", "zh": "針對 65 歲以上日本人的研究指出，較高的日常生活能力與現存牙數，與客觀咀嚼功能顯著相關。", "g": "<em>objective masticatory function</em>（客觀咀嚼功能）是用儀器測的，相對於 <em>subjective</em>（主觀的，問本人）。研究若要測咀嚼能力，就得決定用哪一種——這是可以帶去問指導教授的問題。"}, {"en": "The results of our study support these findings.", "zh": "本研究結果支持這些發現。", "g": "<em>support these findings</em>（支持這些發現）是討論段最常見的收束句之一，等於「我的結果跟前人一致」。同義的還有 are consistent with、are in line with。"}, {"en": "According to the correlation matrix in this study, no independent variable had a correlation coefficient of |r| > 0.8.", "zh": "依本研究的相關矩陣，沒有任何自變項的相關係數絕對值超過 0.8。"}, {"en": "Therefore, we considered the possibility of multicollinearity low, and all independent variables were included in the analysis.", "zh": "因此，我們認為多重共線性的可能性低，故將所有自變項納入分析。"}, {"en": "Generally, significant confounding is present between the loss of teeth and the use of dentures.", "zh": "一般而言，缺牙與假牙使用之間存在顯著的干擾效應。", "g": "<em>confounding</em>（干擾、混淆）是流行病學的核心概念：兩個因素糾纏在一起，分不清是誰的效果。牙齒少的人才需要假牙，所以這兩件事天生相關——作者接下來要解釋為什麼這篇沒出現這個問題。"}, {"en": "However, this was not observed in this study.", "zh": "然而本研究並未觀察到此現象。"}, {"en": "This may indicate that many participants with fewer teeth had their dentures removed.", "zh": "這可能表示許多牙齒較少的受試者其實把假牙取下不用了。", "g": "這個解釋很值得注意：牙齒少的人「應該」要戴假牙，但實際上反而不戴。這正是這篇論文想喊的重點——機構裡有一大群該戴而沒戴的人。"}, {"en": "Furthermore, no significant association was found between the CDR scores and food forms, possibly because ≥70% of residents had severe cognitive decline with CDR scores ≥2.", "zh": "此外，CDR 分數與食物型態之間未發現顯著關聯，可能是因為超過 70% 的住民 CDR 分數達 2 以上、認知功能嚴重下降。", "g": "這叫<em>天花板／地板效應</em>：當大多數人都集中在量表的同一端，就看不出差異了。不是因素不重要，而是這群樣本沒有變異可比。口試時如果被問「為什麼這個因素不顯著」，這是一個標準且漂亮的答法。"}, {"en": "The rates of age, cognitive decline, and use of dentures were higher in the present study than in studies conducted in other countries.", "zh": "本研究的年齡、認知功能下降比例與假牙使用率，均高於其他國家的研究。"}, {"en": "However, in Japan, the percentage of the total population of older people is the highest globally, and the percentage of people with cognitive decline is high.", "zh": "然而在日本，老年人口占總人口的比例為全球最高，認知功能下降者的比例也高。", "g": "這一段在處理「我的數字跟別人不一樣」的問題。作者的解法是：因為日本人口結構本來就特殊。這是合理的辯護，但也提醒讀者——這篇的結果要套到台灣之前，得先確認兩國族群是否可比。"}, {"en": "Accordingly, the participants in this study were similar to the general Japanese LTCF resident population.", "zh": "因此，本研究受試者與一般日本機構住民族群相似。"}, {"en": "Dietary intake was used as an index for nutritional assessment.", "zh": "本研究以飲食攝取量作為營養評估指標。"}, {"en": "Although BMI is commonly used, it is often difficult to measure the height and weight of the elderly, especially those who need nursing care, due to various factors such as inability to stand or deformity of the spinal column.", "zh": "雖然體重指數是常用指標，但長者（尤其是需照護者）常因無法站立或脊柱變形等因素而難以測量身高與體重。", "g": "這是很實務的一段：理論上最好的指標，現場可能根本量不到。做機構研究一定會遇到這種取捨。若要收高齡者的資料，這類現場限制值得提前想清楚。"}, {"en": "In the present study, the stumps of teeth were not counted based on the number of teeth according to the classification of carious lesions used in dental examinations in Japan.", "zh": "本研究依日本牙科檢查的齲齒病灶分類，未將殘根計入牙齒數。"}, {"en": "The present study postulates that the use of removable prosthetic devices in the ≤9 occlusal support group is advisable.", "zh": "本研究主張，咬合支持數 9 以下者宜使用活動補綴裝置。", "g": "<em>postulate</em>（主張、假定）是比 suggest 更強一點的字。<em>advisable</em>（可取的、建議的）。這句是作者給臨床的建議，也是整篇論文的實務價值所在。"}, {"en": "According to these guidelines, oral rehabilitation treatment is a generic term for a treatment process that involves occlusal treatment, restorative and prosthetic therapy, orthodontic treatment, and implant therapy to restore oral function lost due to periodontal disease.", "zh": "依該指引，口腔重建治療是一個總稱，涵蓋咬合治療、修復與補綴治療、齒顎矯正與植牙治療，目的是恢復因牙周病喪失的口腔功能。", "g": "<em>generic term</em>（總稱、通稱）。這一句把一個大詞拆成四個子項目，是定義專業術語的標準寫法。寫論文的名詞解釋段可以直接套這個句型。"}, {"en": "Moreover, these guidelines recommend the use of removable prosthetic devices, particularly when the number of occlusal supports is ≤9.", "zh": "此外，該指引建議使用活動補綴裝置，特別是在咬合支持數 9 以下時。", "g": "這解釋了「9」這個切點的來源——來自日本牙周病學會的指引，不是作者自己訂的。任何切點都要有出處，這是口試最常被追問的地方之一。"}, {"en": "In Japan, doctors and nurses at LTCFs usually assess the patients’ eating behaviors and determine the optimal dietary approach.", "zh": "在日本，機構的醫師與護理師通常負責評估病人的進食行為並決定最適飲食方式。"}, {"en": "However, since the use of dentures is rarely considered in this assessment, this study was conducted.", "zh": "然而，由於此項評估很少考量假牙使用情形，本研究因此進行。", "g": "這一句是整篇論文真正的動機，而且非常實務：決定飲食的人不看假牙。作者想用數據去改變一個照護流程。這是報告時最有力的一張投影片。"}, {"en": "In the International Dysphagia Diet Standardization Initiative (IDDSI) framework, which is considered an international criterion for dysphagia diets, each of the dysphagia stages is considered to correspond to the following food forms: minced and moist, soft and bite-sized, easy-to-chew, and regular diets.", "zh": "在被視為吞嚥飲食國際標準的 IDDSI 架構中，各吞嚥等級分別對應以下食物型態：細碎濕潤、軟質小口、易咀嚼與一般飲食。", "g": "<em>IDDSI</em> 就是台灣現在推的那一套。這四個詞務必背下來：<em>minced and moist</em>（細碎濕潤）、<em>soft and bite-sized</em>（軟質小口）、<em>easy-to-chew</em>（易咀嚼）、<em>regular</em>（一般）。論文寫到食物質地時，幾乎一定會用到 IDDSI 的分級名稱。"}, {"en": "We believe that the classification used in this study approximates that of the IDDSI framework.", "zh": "我們認為本研究採用的分類近似於 IDDSI 架構。", "g": "<em>approximates that of</em>——那個 <em>that</em> 又是為了避免重複 “the classification”。這個代稱用法在 Yen 那篇也出現過，是論文的固定習慣。"}, {"en": "Patients in the poorly nourished group were excluded from the analysis based on previous studies suggesting that if the food form provided to LTCF residents is unsuitable, their nutritional status becomes poor.", "zh": "營養不良組被排除於分析之外，依據是先前研究指出若提供給住民的食物型態不適當，其營養狀況會變差。"}, {"en": "The exclusion of the poorly nourished group from further analyses may have created selection bias.", "zh": "將營養不良組排除於後續分析之外，可能造成選樣偏差。", "g": "<em>selection bias</em>（選樣偏差）：因為挑人的方式而讓結果失真。主動承認它、再解釋為什麼影響不大，比假裝沒這回事可信得多。"}, {"en": "However, since similar results were obtained in analyses including the poorly nourished group, and the poorly nourished group was much smaller than the well-nourished group, we believe that the effect of excluding the poorly nourished group is insignificant.", "zh": "然而，納入營養不良組的分析也得到相似結果，且該組人數遠少於營養良好組，因此我們認為排除的影響不大。", "g": "這就是<em>敏感度分析</em>的實例：把排除的人放回去再跑一次，結果一樣，就證明排除沒有扭曲結論。跟 Yen 那篇用穩健迴歸重跑是同一個思路。"}, {"en": "As the number of teeth present and occlusal supports has been reported to be associated with food avoidance, these results also support the findings of previous studies.", "zh": "由於現存牙數與咬合支持數已被報導與食物迴避行為有關，這些結果也支持先前研究的發現。", "g": "<em>food avoidance</em>（食物迴避）是指因為咬不動而刻意不吃某些食物。<em>food avoidance</em>（食物迴避）直接對應新題目：長者面對便當時，哪些菜會被留下不吃？這是最該列進關鍵字清單的一個詞。"}, {"en": "Moreover, a low number of teeth and posterior occluding pairs are associated with a high risk of malnutrition, and our results are consistent with the results of previous studies that confirm significant differences in BMI between the groups.", "zh": "此外，牙齒數少與後牙咬合對數少與營養不良的高風險有關，本研究結果與先前確認各組間體重指數存在顯著差異的研究一致。", "g": "<em>posterior occluding pairs</em>（後牙咬合對）——後牙才是磨碎食物的主力，前牙只負責咬斷。這個區別在咀嚼功能研究裡很重要。"}, {"en": "Greater cognitive impairment, dependence on other people to perform ADL, and risk of dysphagia have been reported to be associated with a dysphagia diet prescription for LTCF residents.", "zh": "認知功能損害較重、日常生活需依賴他人，以及吞嚥困難風險，都被報導與機構住民被開立吞嚥調整飲食有關。"}, {"en": "Additionally, it has been shown that the number of teeth present significantly affects food forms when food is divided into regular and dysphagia diets.", "zh": "此外，已有研究顯示當食物分為一般飲食與吞嚥調整飲食時，現存牙數會顯著影響食物型態。"}, {"en": "Therefore, we believe that the results of our study support those of previous studies.", "zh": "因此，我們認為本研究結果支持先前研究的發現。"}, {"en": "The present study showed that dentures may have contributed to the maintenance of food forms, even in residents with a decline in ADL and cognitive function.", "zh": "本研究顯示，即使在 ADL 與認知功能下降的住民身上，假牙仍可能有助於維持食物型態。"}, {"en": "However, it is undesirable to force all elderly people receiving care to use dentures because there are several reports of denture-related accidents, such as accidental ingestion, in denture users with cognitive impairment.", "zh": "然而，不宜強迫所有受照護長者使用假牙，因為已有多起報告指出認知功能受損的假牙使用者發生誤食等假牙相關意外。", "g": "這一段是整篇論文最重要的倫理轉折。前面一直在講假牙的好處，這裡忽然自己踩剎車：認知障礙者可能把假牙吞下去。好的論文不會只推銷自己的結論。"}, {"en": "Furthermore, dentures can cause changes in oral sensation and decrease oropharyngeal swallowing efficiency.", "zh": "此外，假牙可能改變口腔感覺並降低口咽吞嚥效率。"}, {"en": "Second, nursing homes now focus on creating an environment in which patients can die peacefully and painlessly at the end of their lives.", "zh": "其次，養護機構現今著重於營造讓住民能在生命末期平靜無痛離世的環境。"}, {"en": "For example, there is a movement to introduce comfort feeding only (CFO) as an oral intake at the end of dementia.", "zh": "例如，有一股推動在失智末期採用「僅以舒適為目的的餵食」（CFO）作為經口攝取方式的趨勢。", "g": "<em>comfort feeding only</em>（僅求舒適的餵食）是安寧照護的概念。這個詞目前可能還陌生，但在高齡口腔照護的討論裡越來越重要。"}, {"en": "In CFO, the goal of feeding is not to nourish but to enjoy life.", "zh": "在 CFO 中，餵食的目標不是營養，而是享受生活。", "g": "<em>not to nourish but to enjoy life</em>——又是 <em>not A but B</em> 的對比句型，而且是全篇最有力量的一句。整段的重點在這裡：有時候吃東西的意義不是活下去，而是活得好。"}, {"en": "Patients should eat what they want to eat, when they want to eat, in the amount they want to eat, and should not be forced to eat against their preference.", "zh": "住民應能吃自己想吃的、在想吃的時候吃、吃自己想要的量，不應被強迫違背自身意願進食。", "g": "三個 <em>they want to eat</em> 的平行重複是刻意的修辭，讀起來有節奏也有力量。論文很少出現這種寫法，作者在這裡明顯放進了價值主張。"}, {"en": "Therefore, it is preferable that the patient is willing to use dentures; however, if the patient experiences pain from using dentures, the decision to not force the patient to use dentures can be taken.", "zh": "因此，最好是住民本人願意使用假牙；但若使用假牙會造成疼痛，也可以決定不強迫使用。"}, {"en": "This study has certain limitations.", "zh": "本研究有若干限制。", "g": "<em>This study has certain limitations.</em> 這句幾乎是所有論文的固定句，看到它就知道限制段開始了。寫論文時可以直接照抄這一句。"}, {"en": "First, the facilities surveyed in this study are relevant to members of the Japanese Society of Gerodontology; therefore, there is bias in institutional sampling.", "zh": "第一，本研究調查的機構與日本老年牙醫學會成員有關，因此機構取樣存在偏差。"}, {"en": "We analyzed data from 622 participants, which we considered a sufficient sample size according to the sample sizes of previous studies.", "zh": "我們分析了 622 位受試者的資料，依先前研究的樣本數判斷，此樣本量足夠。"}, {"en": "Unfortunately, we did not have information on the number of people who had explanations about participation in the study, the number of people who declined, or the reasons for their refusal.", "zh": "可惜我們沒有關於接受研究說明人數、拒絕人數或拒絕原因的資訊。"}, {"en": "Therefore, the results of this study should be interpreted with caution due to possible selection bias.", "zh": "因此，由於可能存在選樣偏差，本研究結果應謹慎解讀。", "g": "<em>should be interpreted with caution</em>（應謹慎解讀）是限制段的標準收尾。誠實講出來，反而讓結論更可信。"}, {"en": "The clear purpose and content of the study could have led denture non-users and those unable to use dentures to refuse to participate in the study.", "zh": "研究目的與內容明確，可能導致未使用假牙者及無法使用假牙者拒絕參與。"}, {"en": "However, the analysis that excludes these individuals would not overestimate the observed association because it would work toward not rejecting the null hypothesis.", "zh": "然而，排除這些人的分析並不會高估所觀察到的關聯，因為它的作用方向是傾向不拒絕虛無假設。", "g": "<em>null hypothesis</em>（虛無假設）是「兩者沒有關係」這個預設立場。作者在說：如果偏差存在，它會讓我更難找到關聯，所以我找到的關聯反而更可信。這是很高明的辯護方式，值得學。"}, {"en": "Second, we focused on the food forms; however, experts in swallowing disorders have not determined the food forms of residents using detailed tests, such as video fluoroscopy or video endoscopy.", "zh": "第二，我們著重於食物型態，但吞嚥障礙專家並未以吞嚥攝影或內視鏡等詳細檢查來判定住民的食物型態。", "g": "<em>video fluoroscopy</em>（吞嚥攝影 VFSS）與 <em>video endoscopy</em>（吞嚥內視鏡 VE）是吞嚥評估的兩大客觀工具。這篇沒做，所以吞嚥功能是靠問卷判定的——這是讀這篇時該注意的限制。"}, {"en": "Third, since this was a cross-sectional study, we were unable to determine a causal relationship between denture use and food form.", "zh": "第三，由於本研究為橫斷式研究，我們無法確立假牙使用與食物型態之間的因果關係。", "g": "又是這一句。兩篇論文都在最後鄭重聲明「不能談因果」。這件事重複到這個程度，就知道它有多重要——本研究也會是橫斷式，同樣的話同樣得寫。"}, {"en": "More research is needed to investigate this causal relationship.", "zh": "尚需更多研究來探討此因果關係。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "In conclusion, the use of dentures was associated with food forms, even in LTCF residents with a severe decline in ADL and cognitive function.", "zh": "總結而言，即使在 ADL 與認知功能嚴重下降的機構住民身上，假牙使用仍與食物型態有關。"}, {"en": "This highlights the importance of providing prosthodontic treatment to the elderly in need of long-term care and supporting the use of dentures in cooperation with caregivers if the elderly in need of long-term care are willing to use dentures.", "zh": "這凸顯了為需要長期照護的長者提供補綴治療的重要性，並在長者願意使用假牙時，與照顧者合作支持其使用。", "g": "<em>This highlights the importance of...</em>（這凸顯了……的重要性）是結論段最後一句的高頻句型。注意作者最後還是加了 <em>if ... are willing</em>（若他們願意）這個條件——把前面討論到的倫理顧慮帶進結論，首尾呼應。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Ethical approval: the ethics committee of the Japanese Society of Gerodontology and the epidemiological research ethics committee of Hokkaido University.", "zh": "倫理審查：日本老年牙醫學會倫理委員會與北海道大學流行病學研究倫理委員會。", "g": "過了<em>兩個</em>倫理委員會——學會的與大學的。多中心研究常需多重審查。"}, {"en": "The paper reports no commercial funding and no competing interests.", "zh": "論文未報告商業經費，亦無利益衝突。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "The examiners did not know what food form each resident ate.", "zh": "檢查者事先不知道住民吃的是哪一級食物。", "g": "這是刻意設計的<em>盲法</em>：評估口腔狀況的人不知道結果變項，才不會不自覺往預期方向評。這一句在論文裡只佔一行，卻是研究品質的重要標誌，口試時值得主動提出來。"}, {"en": "The null finding for cognitive function is a ceiling effect, not evidence of no effect.", "zh": "認知功能不顯著是天花板效應，不是「沒有影響」。", "g": "超過七成住民的 CDR 已達 2 以上，全部集中在量表的同一端，就看不出差異了。不是因素不重要，而是這群樣本沒有變異可比。被問「為什麼這個因素不顯著」時，這是標準且漂亮的答法。"}, {"en": "The median number of occlusal supports is zero.", "zh": "咬合支持數的中位數是 0。", "g": "超過一半的人完全沒有能對咬的牙齒。這個數字讓整篇論文的意義立刻清楚：對這群人來說，假牙不是加分，而是能不能咬東西的唯一途徑。"}, {"en": "The paper argues for dentures, then stops itself.", "zh": "論文推薦假牙，卻又主動踩剎車。", "g": "討論段先說假牙有助於維持食物型態，接著指出認知障礙者可能誤食假牙，並引入「僅求舒適的餵食」概念——生命末期吃東西的意義不是活下去，而是活得好。好的論文不會只推銷自己的結論。"}]}], "mesh": [["Activities of Daily Living", "日常生活活動（ADL）", "本篇以巴氏量表測量。NLM 用這個主題詞，代表 ADL 是本篇的重要變項之一。"], ["Aged", "老年人（65 歲以上）", "年齡標籤。本篇平均 86.6 歲。"], ["Cross-Sectional Studies", "橫斷式研究", "研究設計標籤。只能看關聯，不能談因果。"], ["Deglutition Disorders* / etiology", "吞嚥障礙／病因學", "星號代表這是本篇主要主題。斜線後的 etiology（病因學）是子標題，表示探討的是原因。Deglutition Disorders 就是 dysphagia 的 MeSH 正式名稱——這點很重要：搜 dysphagia 時，PubMed 會自動對應到這個詞。"], ["Dentures", "假牙", "注意是複數形 Dentures。MeSH 名詞多用複數。"], ["Humans", "人類", "人體研究標籤，用來排除動物與細胞實驗。"], ["Long-Term Care*", "長期照護", "本篇另一個主要主題。"]], "vocab": {"food form": ["how solid or soft a meal is served — this paper's outcome. Same idea as 'food texture'.", "食物型態：餐食的軟硬與處理程度，即便當菜色的軟硬與處理程度", "f", "B2"], "food forms": ["the four graded levels of meal texture used in this study", "食物型態（本研究分為四個等級）", "f", "B2"], "dysphagia diet": ["a meal modified to be safer to swallow — minced, softened or thickened", "吞嚥調整飲食：為安全吞嚥而調整過的餐食", "f", "C1"], "normal diet": ["an ordinary meal with no texture modification", "一般飲食：未經質地調整的普通餐食", "p", "B1"], "long-term care facility": ["a residential home for older people needing daily care. Often shortened to LTCF.", "長期照護機構（常縮寫為 LTCF）", "f", "B2"], "residents": ["the older people living in the facility — the study participants here", "住民：住在機構裡的長者，本研究的受試者", "v", "B1"], "aspiration": ["food or liquid going into the airway instead of the stomach", "嗆入、誤入呼吸道", "f", "C1"], "occlusal supports": ["upper and lower teeth that meet, so food can actually be crushed. No support means no chewing.", "咬合支持：上下能對咬的牙齒對；沒有咬合支持就咬不動食物", "f", "C2"], "Barthel index": ["a 0-100 score for daily living ability — eating, dressing, toileting, moving. Higher is more independent.", "巴氏量表：日常生活活動能力評分，0–100，越高越獨立", "f", "C1"], "clinical dementia rating": ["a 0 to 3 staging of dementia severity. 0 normal, 0.5 questionable, 1 mild, 2 moderate, 3 severe.", "臨床失智評估量表（CDR）：0 正常、0.5 可疑、1 輕度、2 中度、3 重度", "f", "C1"], "activities of daily living": ["the basic self-care tasks of everyday life. Abbreviated ADL.", "日常生活活動（ADL）：吃飯、穿衣、如廁等基本自理", "f", "B2"], "generalized estimation equation": ["a regression that allows for data being clustered — here, residents grouped inside the same facility", "廣義估計方程式：處理資料有群聚結構（同機構住民彼此不獨立）的迴歸", "f", "C2"], "hierarchical structure": ["data nested in groups, so observations inside a group are not independent", "階層結構：資料分群嵌套，同群內觀察值不獨立", "f", "C2"], "trend test": ["asks not just whether groups differ, but whether values rise or fall in order", "趨勢檢定：問的是有沒有順序性的遞增或遞減", "f", "C2"], "multicollinearity": ["predictors so similar that the model cannot tell them apart", "多重共線性：預測因子太相似，模型分不出來", "f", "C2"], "selection bias": ["distortion caused by who ended up in the study and who did not", "選樣偏差：因為誰被納入、誰沒被納入而造成的失真", "f", "C2"], "null hypothesis": ["the default assumption that there is no relationship. Studies try to disprove it.", "虛無假設：預設「沒有關係」，研究要做的是推翻它", "f", "C2"], "malnutrition": ["poor nutrition from eating too little or badly", "營養不良", "v", "B2"], "well-nourished": ["having adequate nutrition", "營養狀況良好的", "p", "B2"], "serum albumin": ["a blood protein used as a marker of nutritional status. Low means poorly nourished.", "血清白蛋白：營養狀況的血液指標，偏低代表營養不良", "f", "C1"], "enteral": ["nutrition delivered into the gut, e.g. by a feeding tube", "經腸道營養，如鼻胃管", "f", "C2"], "parenteral": ["nutrition delivered outside the gut, e.g. into a vein", "非經腸道營養，如靜脈注射", "f", "C2"], "registered dietitian": ["a qualified nutrition professional. In this study they judged the food forms.", "營養師。本研究的食物型態是由營養師判定的", "f", "B2"], "dental hygienists": ["oral hygiene professionals — the author's own profession, and data collectors in this study", "口腔衛生師：本研究的資料收集者之一", "f", "B2"], "masticatory function": ["how well a person can chew", "咀嚼功能", "f", "C1"], "ipsilateral": ["on the same side of the body. Opposite: contralateral.", "同側的（對側是 contralateral）", "v", "C2"], "pontic": ["the false tooth suspended in the middle of a bridge", "牙橋中間懸空的假牙", "f", "C2"], "periodontitis": ["gum disease that destroys the bone holding the teeth", "牙周病（破壞支持骨）", "v", "C1"], "wisdom teeth": ["the third molars at the very back of the mouth", "智齒", "p", "B2"], "erupted": ["of a tooth, having come through the gum", "（牙齒）已萌發的", "v", "C1"], "oropharyngeal": ["relating to the mouth and throat together", "口咽的", "v", "C2"], "comfort feeding only": ["feeding at the end of life aimed at pleasure rather than nutrition", "僅求舒適的餵食：生命末期以享受而非營養為目標", "f", "C2"], "modified": ["changed — here, food chopped, softened or thickened", "經調整的：食物被切碎、軟化或勾芡", "v", "B1"], "minced and moist": ["an IDDSI texture level: is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "p-value": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "mean age": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "mean": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "median": ["the middle value when all values are put in order", "中位數", "f", "B2", "把所有人的數值由小排到大，站在正中間的那一個。它不受極端值影響，所以資料分布不對稱時（例如少數人幾乎沒牙、多數人還有很多牙），比平均數更能代表「一般人」。"], "standard deviation": ["how spread out the values are around the mean", "標準差", "f", "C1", "描述大家的數值離平均數有多分散。標準差小，代表大家差不多；標準差大，代表個別差異很大。常寫成「平均數 ± 標準差」，例如 82.4 ± 6.8 歲。"], "confidence intervals": ["a range that probably contains the true value", "95% 信賴區間", "f", "C1", "研究只測了一部分人，算出的數字一定有誤差。信賴區間給一個範圍：真正的數值很可能落在裡面。範圍越窄，估計越精準。比較兩組的差值時，區間沒有跨過 0（比值則是沒有跨過 1），通常就代表顯著。"], "continuous variables": ["a variable that can take any number, such as age or bite force", "連續變項", "f", "C1", "可以是任何數值的資料，例如年齡、咬合力、葡萄糖濃度。通常用平均數或中位數描述。資料屬於哪一種，決定了後面該用哪一種統計方法。"], "categorical variables": ["a variable that sorts people into groups, such as sex or denture use", "類別變項", "f", "C1", "把人分成幾類的資料，例如性別、有沒有戴假牙、教育程度。通常用人數和百分比描述，比較時用卡方檢定而不是 t 檢定。"], "categorical": ["a variable that sorts people into groups, such as sex or denture use", "類別變項", "f", "C1", "把人分成幾類的資料，例如性別、有沒有戴假牙、教育程度。通常用人數和百分比描述，比較時用卡方檢定而不是 t 檢定。"], "normality": ["whether the data follow the bell-shaped normal curve", "常態分布（檢定）", "f", "C1", "常態分布是中間多、兩邊少、左右對稱的鐘形。t 檢定、Pearson 相關這類方法都假設資料是這個形狀，所以研究者會先檢查資料是否常態，再決定用哪一類統計方法。"], "t-test": ["a test comparing the means of two groups", "t 檢定", "f", "C1", "比較「兩組」的平均數有沒有差別，例如男性和女性、戴假牙和沒戴假牙。前提是資料大致常態分布；如果不是，就改用 Mann–Whitney U 檢定。"], "Mann–Whitney U test": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "Mann–Whitney": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "Kruskal–Wallis test": ["a non-parametric test comparing three or more groups", "Kruskal–Wallis 檢定", "f", "C1", "比較「三組以上」的無母數方法，相當於 ANOVA 的無母數版本。它只能說明「各組之間有差」，無法指出是哪兩組有差，要再做事後兩兩比較才知道。"], "Kruskal–Wallis": ["a non-parametric test comparing three or more groups", "Kruskal–Wallis 檢定", "f", "C1", "比較「三組以上」的無母數方法，相當於 ANOVA 的無母數版本。它只能說明「各組之間有差」，無法指出是哪兩組有差，要再做事後兩兩比較才知道。"], "chi-square test": ["a test comparing proportions between groups", "卡方檢定", "f", "C1", "比較「類別資料」的比例，例如兩組中「有戴假牙」的比例是否不同。數值型資料用 t 檢定，類別型資料（是／否、男／女）用卡方檢定。"], "chi-square": ["a test comparing proportions between groups", "卡方檢定", "f", "C1", "比較「類別資料」的比例，例如兩組中「有戴假牙」的比例是否不同。數值型資料用 t 檢定，類別型資料（是／否、男／女）用卡方檢定。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlated": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "positively correlated": ["both measures rise together", "正相關", "f", "C1", "一個數值上升，另一個也跟著上升。它只說明兩者一起變動，不代表誰造成誰。"], "dependent variables": ["the outcome a study tries to explain", "依變項", "f", "C1", "研究想要解釋或預測的「結果」，例如生活品質分數。可以想成：被影響的那一方。"], "independent variables": ["the factors used to explain the outcome", "自變項", "f", "C1", "用來解釋依變項的「影響因素」，例如年齡、假牙類型、咀嚼能力。要注意：在橫斷研究裡這只是分析上的角色，不代表真的有因果關係。"], "independent variable": ["the factors used to explain the outcome", "自變項", "f", "C1", "用來解釋依變項的「影響因素」，例如年齡、假牙類型、咀嚼能力。要注意：在橫斷研究裡這只是分析上的角色，不代表真的有因果關係。"], "confounding": ["a third factor that affects both the cause and the outcome", "干擾因素", "f", "C1", "同時影響「原因」和「結果」的第三個因素，會讓兩者看起來有關係，其實不然。例如年紀大的人牙齒少，也比較常吃軟食；不控制年齡，就可能誤以為牙齒少「造成」吃軟食。處理方式：設計時配對或排除，分析時放進迴歸調整。"], "regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "hierarchical": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "odds ratios": ["how much more likely an outcome is in one group than another", "勝算比（OR）", "f", "C1", "比較兩組發生某件事的機會。OR = 1 代表兩組一樣；OR = 2 代表一組的勝算是另一組的兩倍；OR = 0.5 則只有一半。結果是「有／沒有」這種二分類時常用。"], "odds ratio": ["how much more likely an outcome is in one group than another", "勝算比（OR）", "f", "C1", "比較兩組發生某件事的機會。OR = 1 代表兩組一樣；OR = 2 代表一組的勝算是另一組的兩倍；OR = 0.5 則只有一半。結果是「有／沒有」這種二分類時常用。"], "adjusted odds ratio": ["an odds ratio after other factors have been taken into account", "調整後勝算比", "f", "C1", "已經把其他因素（例如年齡、性別）的影響扣掉之後的勝算比，比未調整的數字更能看出這個因素本身的影響。論文的主要結論通常看調整後的數字。"], "adjusted odds ratios": ["an odds ratio after other factors have been taken into account", "調整後勝算比", "f", "C1", "已經把其他因素（例如年齡、性別）的影響扣掉之後的勝算比，比未調整的數字更能看出這個因素本身的影響。論文的主要結論通常看調整後的數字。"], "multivariate analysis": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "multivariate": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "sample size": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"], "sample sizes": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"], "cross-sectional": ["a study that measures everyone once, at one point in time", "橫斷研究", "f", "C1", "在同一個時間點，對一群人量一次。像拍一張照片：看得出哪些因素一起出現，但分不出誰先誰後，所以不能證明因果。餐食選擇的研究多半也屬於這種設計。"], "missing data": ["values that were not recorded for some participants", "遺漏值", "f", "C1", "有些受訪者沒回答某些題目，或某些檢查沒做到。處理方式會影響結果：直接刪掉這些人可能造成偏差，所以論文應該交代怎麼處理。"], "ceiling effect": ["when most people score at or near the top of a scale", "天花板效應", "f", "C1", "大多數人都拿到最高分或接近最高分，量表碰到「天花板」，再好的人也分不出來，組間差異因此被低估。例如大部分人都吃一般飲食時，飲食型態分級就會出現這個現象。"], "SPSS": ["a widely used statistics program", "SPSS 統計軟體", "f", "B2", "常用的統計分析軟體（IBM 出品），點選式介面，醫護與社會科學研究最常用。論文交代軟體與版本，是為了讓別人能重現分析。"]}, "meshLabel": "MeSH terms", "meshLabelZh": "PubMed 主題詞", "meshNote": "PubMed 為本篇編目的 MeSH 主題詞（PMID 35989265）。帶 <em>*</em> 號者為<em>主要主題（major topic）</em>，代表這篇論文主要就是在談它——本篇是 Deglutition Disorders 與 Long-Term Care 兩個。沒有星號的則是次要標籤。<br><br>最值得記的一條是 <em>Deglutition Disorders</em>：它才是「吞嚥障礙」的 MeSH 正式用語，dysphagia 只是同義詞。斜線後的 <em>etiology</em>（病因學）是子標題，表示這篇探討的是原因。PubMed 會自動把 dysphagia 對應過去，但若要用 MeSH 精準檢索，就得用正式名稱。<br><br>作者自訂關鍵字（Cross-sectional study、Denture use、Food forms、Older adults requiring long-term care、Swallowing function）與 MeSH 並不相同，搜尋時兩套都值得試。點任一標籤看說明。", "qa": [{"cat": "Opening the presentation", "catZh": "開場", "items": [{"q": "Could you tell us why you chose this paper?", "qZh": "可以說明您為什麼選這篇論文嗎？", "qG": "開場最常見的一題。考的不是英文，而是有沒有想清楚自己的研究方向。答案要在三句內把「這篇」和「我的題目」連起來。<em>Could you tell us...</em> 是客氣的問法，不是真的在問「可不可以」，所以不要回答 Yes。", "a": "I chose this paper because my own research is about denture wearers and food texture. This study looks at the same question in Japan. It uses a large sample, so I wanted to learn how they measured food forms.", "aZh": "我選這篇是因為我自己的研究是關於假牙配戴者與食物質地。這篇研究在日本探討同樣的問題。它的樣本數大，所以我想學習他們如何測量食物型態。", "aG": "三句，每句都短。第一句講關聯，第二句講這篇是什麼，第三句講想學什麼。<em>my own research</em>（我自己的研究）比 my study 更自然。<em>so I wanted to learn</em> 把話收回到自己身上，讓老師知道是有目的地在讀。"}, {"q": "In one sentence, what did this study find?", "qZh": "用一句話說，這篇研究發現了什麼？", "qG": "這一題是在測有沒有真的讀懂，而不是只把摘要背下來。準備一句 15 字以內的核心句，講到會背。任何論文都該準備這一句。", "a": "It found that residents who used dentures ate food closer to a normal diet, even when they needed a lot of care.", "aZh": "研究發現使用假牙的住民吃的食物更接近一般飲食，即使他們需要大量照護。", "aG": "<em>even when...</em>（即使……）是這篇的靈魂，一定要放進這句話。注意 <em>ate food closer to a normal diet</em> 用的是形容詞比較級 closer 修飾 food，不需要 that is。這樣講最短。"}]}, {"cat": "About the methods", "catZh": "關於研究方法", "items": [{"q": "Why did the authors only analyze residents with nine or fewer occlusal supports?", "qZh": "作者為什麼只分析咬合支持數九以下的住民？", "qG": "老師很愛問「為什麼排除某些人」，因為這考的是研究設計的理解。答案的關鍵詞是 <em>effect</em>（效果）會被 <em>dilute</em>（稀釋）——但這兩個字偏難，所以用簡單說法繞過去。", "a": "Residents with many occlusal supports can already chew well. If the authors included them, the effect of dentures would be harder to see. So they kept only the residents who really need dentures.", "aZh": "咬合支持多的住民本來就咬得動。如果把他們納入，假牙的效果就比較難看出來。所以作者只留下真正需要假牙的住民。", "aG": "不用 dilute 這個字也能講清楚：<em>harder to see</em>（比較難看出來）就夠了。答題原則是用自己會的字把邏輯講對，不要硬用查來的難字——講錯比講簡單糟糕得多。<em>If ... would be ...</em> 是假設語氣，用在談「如果當初那樣做會怎樣」。"}, {"q": "What does an odds ratio of 2.82 mean here?", "qZh": "這裡的勝算比 2.82 是什麼意思？", "qG": "數字題一定會考，而且是最該練熟的一題，因為答案有固定講法。記住三個錨點：等於 1 沒差別、大於 1 機會提高、小於 1 機會降低。", "a": "It means residents who used dentures were about three times more likely to eat a higher level of food form. The number is adjusted, so the other factors are already controlled.", "aZh": "意思是使用假牙的住民吃到較高等級食物型態的機會大約是三倍。這個數字是調整後的，所以其他因素已經被控制了。", "aG": "<em>about three times more likely to</em>（大約三倍的機會）是解讀 OR 的標準說法，背下來換數字就能用。第二句補上 <em>adjusted</em>（已調整）會讓答案聽起來很專業，而且只有九個字。"}, {"q": "Why did they use a generalized estimation equation instead of ordinary regression?", "qZh": "他們為什麼用廣義估計方程式而不是普通迴歸？", "qG": "這是進階題，可能不會問，但如果問了而答得出來，印象分會很高。核心概念只有一個：同一家機構的住民不是獨立的。", "a": "The residents came from thirty-seven facilities. People in the same facility eat the same food, so their data are not independent. This method takes that into account.", "aZh": "住民來自三十七家機構。同一家機構的人吃同樣的食物，所以他們的資料不是獨立的。這個方法把這件事納入考量。", "aG": "<em>eat the same food</em> 這個具體例子比背術語有用得多——它證明是真的懂，不是在複述。<em>take something into account</em>（把某事納入考量）是很實用的片語。"}]}, {"cat": "About limitations", "catZh": "關於研究限制", "items": [{"q": "What is the main limitation of this study?", "qZh": "這篇研究最主要的限制是什麼？", "qG": "限制題幾乎必考。好消息是答案永遠可以從研究設計講起，而這篇是橫斷式研究，所以有一個標準答案。壞消息是如果只講這一句會顯得敷衍，最好再加一項具體的。", "a": "It is a cross-sectional study, so we cannot say dentures cause better food forms. We only know the two things go together. Also, the facilities were all connected to one society, so the sample may be biased.", "aZh": "這是橫斷式研究，所以我們不能說假牙造成較好的食物型態。我們只知道這兩件事會一起出現。另外，這些機構都與同一個學會有關，所以樣本可能有偏差。", "aG": "<em>we cannot say A causes B</em>（我們不能說 A 造成 B）是限制題的萬用第一句。<em>the two things go together</em>（兩件事一起出現）是「有關聯但無因果」的白話說法，比 correlated 好用也好記。"}, {"q": "Do you think these results apply to Taiwan?", "qZh": "您認為這些結果適用於台灣嗎？", "qG": "這一題在測有沒有批判性，不是要選邊站。安全且漂亮的答法是：先說哪裡可能適用，再說哪裡要小心。切記不要只答 Yes 或 No。", "a": "Partly. Tooth loss and denture problems are similar in both countries. But the residents in this study were very old and needed a lot of care. Taiwanese community elderly may be different, so we need local data.", "aZh": "部分適用。缺牙與假牙問題在兩國相似。但這篇研究的住民非常年長且需要大量照護。台灣社區長者可能不同，所以我們需要本地的資料。", "aG": "<em>Partly.</em>（部分適用）一個字就把立場站穩，又不必選邊。這是很好的開場技巧。最後 <em>we need local data</em>（我們需要本地資料）順勢把話帶到自己的研究，一箭雙鵰。"}, {"q": "How will this paper help your own thesis?", "qZh": "這篇論文對您自己的論文有什麼幫助？", "qG": "這一題幾乎一定會出現，而且是最該準備的一題，因為它直接連到指導教授最關心的事。答案要具體到方法層面，不要只說「很有幫助」。", "a": "It shows me how to define food forms with a standard system. I also learned which factors I should control, such as swallowing function and the number of teeth. I plan to use a satisfaction questionnaire as well.", "aZh": "它讓我知道如何用標準化系統定義食物型態。我也學到應該控制哪些因素，例如吞嚥功能與牙齒數量。我還計畫使用滿意度問卷。", "aG": "三句分別對應：定義變項、控制變項、加上自己的東西。這個結構讓答案聽起來像有計畫的研究者，而不是讀者。<em>such as</em>（例如）後面接名詞就好，不要接句子。"}]}, {"cat": "When you get stuck", "catZh": "卡住的時候", "items": [{"q": "You did not hear the question clearly.", "qZh": "沒有聽清楚問題。", "qG": "先練這一句，比任何專業詞彙都重要。台上聽不懂是必然會發生的事，有準備就不會慌。語調要往上，聽起來才客氣。", "a": "I'm sorry, could you repeat the question?", "aZh": "抱歉，可以請您再說一次問題嗎？", "aG": "六個字，務必背到不用想。<em>Could you repeat...</em> 比 What? 或 Pardon? 都禮貌。若第二次仍未聽懂，可以加 <em>Could you speak a little more slowly, please?</em>（可以請您說慢一點嗎？）。"}, {"q": "You heard the question but you are not sure what it means.", "qZh": "聽到問題了，但不確定意思。", "qG": "這一句比直接亂答有用得多：把問題用自己的話講回去，請老師確認。很多時候講到一半就自己懂了。", "a": "Do you mean the number of teeth, or the number of occlusal supports?", "aZh": "您的意思是牙齒數量，還是咬合支持數？", "aG": "<em>Do you mean A, or B?</em>（您的意思是 A 還是 B？）——把模糊的問題切成兩個選項請對方選。這招同時展現出知道 A 和 B 是不同的東西，反而加分。"}, {"q": "You need a moment to think.", "qZh": "需要一點時間思考。", "qG": "沉默三秒在台上感覺像三十秒。有一句話墊著，就有時間整理思緒，而且聽起來從容。", "a": "That's a good question. Let me think for a moment.", "aZh": "這是個好問題。讓我想一下。", "aG": "這兩句是萬用的緩衝句，全世界的學術場合都在用。注意 <em>for a moment</em>（一下）不是 for a minute，後者聽起來真的要一分鐘。"}, {"q": "You do not know the answer.", "qZh": "不知道答案。", "qG": "這是最重要的一句。不知道而承認，遠比硬掰安全——老師一問下去就會露餡。承認之後接一個具體行動，聽起來就負責而不是放棄。", "a": "I'm not sure about that. I will look it up and get back to you.", "aZh": "我不太確定。我會查一下再回覆您。", "aG": "<em>look it up</em>（查資料）與 <em>get back to you</em>（之後回覆您）是兩個非常實用的片語。另一個版本是 <em>The authors didn't discuss that in this study.</em>（作者在這篇研究裡沒有討論到這一點）——如果問題確實超出論文範圍，這句更精準。"}], "tag": "P"}]}, {"id": "chen2025", "no": "Paper 3", "short": "Chen 2025 · Do self-rated and measured chewing agree? (Taiwan, KMU)", "title": "Association and relevant factors between objective masticatory performance and subjective masticatory ability among community-dwelling older adults", "titleZh": "社區長者客觀咀嚼表現與主觀咀嚼能力之關聯與相關因素", "titleG": "<em>Association and relevant factors between A and B among C</em> — 在 C（社區長者）身上，A（客觀咀嚼表現）與 B（主觀咀嚼能力）之間的關聯與相關因素。標題把「關聯」與「影響因素」兩件事並列，對應論文的兩個目的。", "authors": "Chen F-I, Chen J-H, Jeng J-H, Akifusa S, Liu H-Y", "journal": "Journal of Dental Sciences, 2025; 20: 69-76", "doi": "10.1016/j.jds.2024.10.008", "lic": "Open access under CC BY-NC-ND 4.0 — no-derivatives licence. Abstract reproduced for study; notes are InkQuest's own. Do not redistribute this annotated version.", "why": "【核心】高醫口腔衛生系、台灣 1,000 位社區長者。證實自評咀嚼能力可反映客觀表現——替「問長者吃不吃得動」的問卷做法背書。十四類食物問卷可改寫成便當菜色題型。", "mesh": [["Aging", "老化", "作者關鍵字。"], ["Chewing", "咀嚼", "本篇核心。"], ["Bite force", "咬合力", "作者關鍵字。"], ["Prosthodontics", "贗復牙科", "作者關鍵字。"], ["Dentures", "假牙", "本篇發現未使用假牙是咀嚼表現不佳的危險因子。"]], "part": "Abstract + study guide", "done": true, "abstract": [{"h": "Background / Purpose", "zh": "研究背景與目的", "s": [{"en": "Dentists often focus on masticatory performance (MP) rather than masticatory ability (MA) and treatment expectations when evaluating older adults.", "zh": "牙醫評估長者時，往往著重於咀嚼表現，而非咀嚼能力與治療期待。", "g": "整篇的關鍵就在 MP 與 MA 這兩個縮寫的差別：<em>masticatory performance</em>（咀嚼表現）是用儀器客觀測出來的，<em>masticatory ability</em>（咀嚼能力）是本人自評「我能不能吃某樣東西」。<br><br>這個區分對本研究題目至關重要：題目問的是「能吃的食物質地」，屬於 MA 那一側。"}, {"en": "This study aimed to determine if MA aligns with MP and to explore influencing factors.", "zh": "本研究旨在確認咀嚼能力是否與咀嚼表現一致，並探討其影響因素。", "g": "<em>align with</em>（與……一致、對得上）。這句就是整篇的研究問題：自己說的，跟儀器測的，對不對得上？"}]}, {"h": "Materials and methods", "zh": "研究方法", "s": [{"en": "This cross-sectional study utilized a multi-stage stratified cluster sampling, including one thousand community-dwelling adults aged 60 and older.", "zh": "本橫斷式研究採多階段分層集束抽樣，納入一千位六十歲以上的社區居住成人。", "g": "<em>multi-stage stratified cluster sampling</em>（多階段分層集束抽樣）是抽樣方法中相當嚴謹的一種，比 Yen 2015 的方便樣本、張炳華 2023 的配額抽樣都高一階。一千人也是目前所有文獻中樣本最大的。"}, {"en": "Participants underwent oral exams and questionnaire interviews, assessing tooth count and Eichner index levels.", "zh": "受試者接受口腔檢查與問卷訪談，評估牙齒數與艾希納指數等級。", "g": "<em>Eichner index</em>（艾希納指數）依上下顎後牙的接觸區數分為 A、B、C 三群：A 有四區都接觸，C 完全沒有接觸。這是比「剩餘牙數」更精準的咬合分類，跟 Taira 2023 的 occlusal support 是同一件事的另一種算法。"}, {"en": "MP and MA were quantified using a standard gummy jelly test and a 14-food group questionnaire, respectively.", "zh": "咀嚼表現以標準軟糖測試量化，咀嚼能力則以十四類食物問卷量化。", "g": "兩套工具都可以直接借用。十四類食物問卷跟 Alamoush 2025 的十種食物清單、Limpuangthip 2022 的二十項 CUMI 是同一路數——<em>用食物清單測「能吃什麼」</em>，這正是本研究題目需要的測量方式。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Approximately 25% of participants exhibited poor MP.", "zh": "約 25% 的受試者咀嚼表現不佳。"}, {"en": "Factors contributing to poor MP included increased age, low education, number of chronic diseases, tooth loss, without the assistance of removable dentures, and being in Eichner index group C.", "zh": "造成咀嚼表現不佳的因素包括年齡增加、教育程度低、慢性病數目、缺牙、未使用活動假牙，以及屬艾希納指數 C 群。", "g": "<em>without the assistance of removable dentures</em>（未使用活動假牙）被列為危險因子——換句話說，有戴假牙是保護因子。這與 Taira 2023 的 OR 2.82 方向一致，兩篇互相支持。"}, {"en": "Participants' MP declined significantly from good to poor, with MA scores decreasing from 11.96 to 7.52.", "zh": "隨著咀嚼表現由佳轉差，咀嚼能力分數亦由 11.96 顯著降至 7.52。", "g": "這一句就是本篇的核心證據：客觀表現變差，主觀能力分數也跟著掉。兩者同步，代表自評是可信的。"}, {"en": "The tooth number was a common factor influencing MA across food groups.", "zh": "牙齒數是影響各類食物咀嚼能力的共同因素。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "Self-rated MA in older adults effectively reflects their MP.", "zh": "長者的自評咀嚼能力能有效反映其客觀咀嚼表現。", "g": "這是對新題目最有用的一句話。它等於替「用問卷問長者吃不吃得動某道菜」這種做法背書——不必買儀器、不必做軟糖測試，自評就夠可信。引用這一句，就能替自己的方法選擇辯護。"}, {"en": "Maintaining a high tooth count to meet occlusal support and the use of dentures to assist with tooth loss in older adults are recommended.", "zh": "建議維持足夠的牙齒數以達成咬合支持，並以假牙協助缺牙的長者。", "g": "又是「保留真牙優先、假牙補位」。這已經是第六篇得到相同結論的研究了。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "Look at the corresponding author's address first.", "zh": "先看通訊作者的地址。", "g": "通訊作者劉秀月（hyliu@kmu.edu.tw）是<em>高雄醫學大學口腔衛生學系</em>，第二作者陳建豪也在高醫。這很可能就是系上的老師。<br><br>這件事有實際價值：引用同系老師的研究，在口試時是加分的；而且若研究設計上有疑問，理論上有機會直接請教。"}, {"en": "Learn these two abbreviations before anything else.", "zh": "先把這兩個縮寫弄清楚再往下讀。", "g": "<em>MP = masticatory performance</em>（咀嚼表現，儀器客觀測量）；<em>MA = masticatory ability</em>（咀嚼能力，本人主觀自評）。全篇不斷交錯使用，分不清就整篇讀不懂。"}, {"en": "The Eichner index is worth learning properly.", "zh": "艾希納指數值得好好學。", "g": "依上下顎後牙的支持區數分群：A 群四個支持區都在、B 群部分喪失、C 群完全沒有後牙接觸。<br><br>本篇發現 C 群是咀嚼表現不佳的危險因子。若自己的研究要分類咬合狀況，這是比「剩幾顆牙」更有解釋力的做法。"}, {"en": "The sampling is the strongest of any paper in this set.", "zh": "抽樣是這組文獻中最嚴謹的。", "g": "多階段分層集束抽樣、一千人、社區居住長者。相較之下 Yen 2015 是方便樣本、張炳華 2023 是網路配額、Goguta 2023 只有 34 人。樣本代表性強，結論的推論力也強。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: supported by grants from the Ministry of Science and Technology (MOST108-2218-E-010-005, MOST109-2224-E-010-001) and the National Science and Technology Council, Taiwan (NSTC113-2314-B-037-075).", "zh": "經費：由科技部（MOST108-2218-E-010-005、MOST109-2224-E-010-001）與國家科學及技術委員會（NSTC113-2314-B-037-075）計畫資助。", "g": "台灣的國家級研究經費。注意編號的變化：<em>MOST</em> 是舊的科技部，<em>NSTC</em> 是 2022 年改制後的國科會。最後那個編號裡的 <em>B-037</em> 代表高雄醫學大學——這是高醫自己的計畫。"}, {"en": "Declaration of competing interest: the authors have no conflicts of interest relevant to this article.", "zh": "利益衝突聲明：作者就本文無利益衝突。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "This paper licenses the questionnaire approach.", "zh": "這篇替「用問卷」這個做法背書。", "g": "如果打算用自評問卷問長者「這道菜吃得動嗎」，一定會被問「自己說的準嗎」。本篇的答案是準——一千位台灣長者身上驗證過，自評咀嚼能力與客觀表現同步變化。<br><br>這是整篇最大的價值：<em>它讓一份低成本的問卷研究站得住腳</em>。而且樣本是台灣社區長者，與便當研究的族群相近。"}, {"en": "It is cross-sectional, so the direction is still unknown.", "zh": "它仍是橫斷式，方向仍然不明。", "g": "牙齒少所以咀嚼差，還是咀嚼差的人比較容易失去牙齒？本篇分不出來。跟其他六篇橫斷式研究一樣，只能談關聯。"}, {"en": "It tests chewing, not what people actually eat.", "zh": "它測的是咀嚼，不是實際吃什麼。", "g": "十四類食物問卷問的是「能不能吃」，屬於<em>能力</em>；新題目問的「便當怎麼選」是<em>行為</em>。兩者不同。<br><br>能力與實際行為之間有落差：有人咬得動卻為了省事吃軟的。那個落差才是值得研究的地方。"}, {"en": "The licence does not allow a shared annotated version.", "zh": "授權不允許散布註解版。", "g": "CC BY-NC-ND，禁止改作後散布。摘要可重製，全文逐句註解版只能留作個人使用。"}]}], "vocab": {"masticatory performance": ["chewing measured objectively with a test food or instrument", "咀嚼表現：以測試食物或儀器客觀測量的咀嚼效能", "f", "C1"], "masticatory ability": ["chewing as the person rates it themselves — what they say they can eat", "咀嚼能力：本人自評能吃什麼，屬主觀", "f", "C1"], "community-dwelling": ["living at home in the community, not in an institution", "社區居住的（非住在機構）", "p", "C2"], "tooth count": ["how many natural teeth a person still has", "牙齒數", "p", "B1"], "Eichner index": ["a three-group classification (A, B, C) of how many posterior contact zones remain. Group C has none.", "艾希納指數：依上下顎後牙接觸區數分 A、B、C 三群，C 群完全無接觸", "f", "C2"], "gummy jelly test": ["an objective chewing test using a standard jelly", "軟糖測試：以標準軟糖評估咀嚼的客觀方法", "f", "C2"], "chronic diseases": ["long-term illnesses such as diabetes or hypertension", "慢性病", "p", "B1"], "occlusal support": ["upper and lower teeth that meet, so food can be crushed", "咬合支持：上下能對咬的牙齒對", "f", "C2"], "Self-rated": ["scored by the person about themselves", "自評的", "v", "B2"], "conflicts of interest": ["interests that could bias the research", "利益衝突", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "stratified": ["divided into subgroups before analysis or sampling", "分層", "f", "C1", "先把人按某個特徵分組（例如年齡層、性別），再在各組裡分別抽樣或分析。用來確保每一組都有足夠的人，或檢查某個關係在不同族群是否一樣。"], "cross-sectional": ["a study that measures everyone once, at one point in time", "橫斷研究", "f", "C1", "在同一個時間點，對一群人量一次。像拍一張照片：看得出哪些因素一起出現，但分不出誰先誰後，所以不能證明因果。餐食選擇的研究多半也屬於這種設計。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。"}, {"id": "chang2023", "no": "Paper 4", "part": "English abstract + study guide", "short": "張炳華 2023 · Diet, oral care and preventive visits in Taiwan (Chinese paper)", "title": "To study the effect of dietary behavior, oral health care and preventive medical treatment on oral health", "titleZh": "探討飲食行為、口腔保健與預防性就醫對口腔健康之影響", "titleG": "這是中文論文所附的英文標題，寫法略顯生硬（動詞開頭的 To study 較少見於英文期刊標題）。台灣期刊的英文標題常是中文的直譯，讀的時候以中文正文為準。", "authors": "張炳華、陳彥臻、賴君瑋、徐桂芳、張珽宇、林川雄", "journal": "運動與遊憩研究, 2023; 18(1): 14-27", "doi": "10.29423/JSRR.202309_18(1).02", "lic": "中文期刊論文，未標示開放授權。英文摘要於此重製供學習之用，中譯與註解為 InkQuest 自行撰寫。請勿散布。", "why": "【核心】唯一的中文論文，主題就是飲食行為與口腔健康，台灣本土 1,229 人。也是唯一示範中介效果的一篇：口腔狀況 → 咀嚼 → 飲食選擇。", "done": true, "abstract": [{"h": "Purpose", "zh": "研究目的", "s": [{"en": "To study the influence of dietary behavior on oral health, and to analyze the mediating effect of oral health care and preventive medical treatment on dietary behavior and oral health.", "zh": "探討飲食行為對口腔健康之影響，並分析口腔保健與預防性就醫對飲食行為於口腔健康之中介效果。", "g": "這是本組文獻中唯一的中文論文，但它附了英文摘要——台灣期刊的慣例。<em>mediating effect</em>（中介效果）是它的核心概念：A 影響 C，但可能是透過 B 才影響的，B 就叫中介變項。這個概念在前六篇都沒出現過。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The investigation time was from July to September, 2020. The subjects of this study were 16 to 65-year-old people in Taiwan.", "zh": "調查時間為 2020 年 7 月至 9 月，研究對象為台灣 16 至 65 歲民眾。", "g": "16 到 65 歲——年齡範圍很寬，而且完全不是高齡族群。這篇提供的是台灣一般民眾的背景資料，不是長者的資料，引用時要說清楚。"}, {"en": "The proportional quota sampling method was used.", "zh": "採用比例配額抽樣法。", "g": "<em>quota sampling</em>（配額抽樣）是先依母體比例定好各區人數，再去湊滿。它比方便取樣嚴謹，但仍屬非隨機抽樣。本篇依內政部人口統計分配北中南東各區配額。"}, {"en": "The questionnaires included demographic data, oral health status, dietary behaviors, oral health care behaviors, and preventive medical treatment behaviors.", "zh": "問卷內容包含人口學資料、口腔健康現況、飲食行為、口腔保健行為與預防性就醫行為。"}, {"en": "The first draft of the questionnaire was finalized after expert validity and reliability analysis, and the Cronbach's α of the dimension reliability values were all greater than 0.6.", "zh": "問卷初稿經專家效度與信度分析後定稿，各構面信度值 Cronbach's α 均大於 0.6。", "g": "0.6 是很寬鬆的門檻。一般慣例是 0.7 以上可接受、0.8 以上良好——Yen 2015 的 GOHAI-T 是 0.801、DSA 是 0.887。本篇只報「大於 0.6」，沒有列出各構面的實際數值，這是可以提出的疑問。"}, {"en": "1,229 questionnaires were returned, and the regional distribution was 535 in the north, 350 in the central, 319 in the south and 25 in the east.", "zh": "共回收 1,229 份問卷，地區分布為北部 535 份、中部 350 份、南部 319 份、東部 25 份。", "g": "1,229 份是這組文獻中樣本最大的一篇。但東部只有 25 份（2%），遠低於實際人口比例，配額其實沒有真正達成。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "In the oral health analysis, 61.0% of the respondents had experience of jamming between teeth, 53.1% had tooth sensitivity, 34.8% had bad breath and 33.2% had bleeding gums.", "zh": "口腔健康分析中，61.0% 有食物塞牙縫經驗、53.1% 有牙齒敏感、34.8% 有口臭、33.2% 有牙齦出血。"}, {"en": "In terms of bad eating behaviors, the highest proportions of consuming sweets and sugar-sweetened beverages were 36.8% and 33.8% respectively.", "zh": "不良飲食行為中，攝取甜食與含糖飲料的比例最高，分別為 36.8% 與 33.8%。"}, {"en": "In oral health care, 60% of the respondents brushed their teeth twice a day, and half of the respondents completed brushing within 1 to 2 minutes.", "zh": "口腔保健方面，六成受訪者一天刷兩次牙，半數在一至二分鐘內完成刷牙。", "g": "「一至二分鐘完成」其實偏短。作者在內文評為「稍微草率」——一般建議至少兩分鐘。這是很實用的衛教切入點。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "In behavioral prediction, eating behavior can significantly predict oral health status. The higher the bad eating behavior is, the worse the oral health is, and the two are significantly negatively correlated.", "zh": "在行為預測上，飲食行為可顯著預測口腔健康狀況；不良飲食行為越高，口腔健康越差，兩者呈顯著負相關。"}, {"en": "The better the oral health care, the better the oral health, and the two were significantly positively correlated.", "zh": "口腔保健越好，口腔健康亦越好，兩者呈顯著正相關。"}, {"en": "At the same time, oral preventive medical treatment had no significant predictive effect on oral health status and no significant mediating effect.", "zh": "同時，預防性就醫對口腔健康現況無顯著預測性，亦無顯著中介效果。", "g": "這是本篇最反直覺的發現：定期看牙醫竟然不能預測口腔健康。作者的解釋是——正因為它是「預防性」就醫，很多是定期回診，跟當下的口腔狀況本來就不必然相關。這個解釋合理，但也可能是量表設計的問題。"}, {"en": "Only oral health care had a partial mediating effect on dietary behavior and oral health.", "zh": "僅口腔保健對飲食行為於口腔健康具部分中介作用。", "g": "<em>partial mediating effect</em>（部分中介）：飲食行為一部分直接影響口腔健康，另一部分透過口腔保健行為間接影響。若加入中介變項後直接效果完全消失，才叫完全中介（full mediation）。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "Read the Chinese body text, not the English abstract.", "zh": "讀中文正文，不要只讀英文摘要。", "g": "這篇的英文摘要是為了國際索引而附的，翻譯品質一般（例如 jamming between teeth 是「塞牙縫」的直譯，不是標準英文用語）。中文正文才是作者真正想講的。<br><br>但英文摘要仍值得讀一次：它示範了台灣期刊怎麼把中文研究包裝成英文，本研究將來若要投稿，這就是格式範本。"}, {"en": "This paper introduces one concept the other six do not: mediation.", "zh": "這篇帶進一個前六篇都沒有的概念：中介。", "g": "<em>中介變項</em>問的是「怎麼影響的」。飲食行為 → 口腔健康，是直接的嗎？還是要先經過口腔保健行為？本篇的答案是：一部分直接、一部分透過口腔保健。<br><br>這個思路對新題目很有用：口腔狀況影響便當的選擇，是直接影響，還是先影響咀嚼能力、再影響選擇？這就是可以設計的中介模型。"}, {"en": "The analysis runs in three stages, and each stage answers a different question.", "zh": "分析分三個階段，每階段回答不同問題。", "g": "第一階段皮爾森相關（誰跟誰有關）、第二階段階層式迴歸（控制其他因素後還有沒有關）、第三階段結構方程式 SEM（整條路徑合起來長什麼樣）。<br><br>三種方法層層遞進，是很好的示範：同一批資料可以用不同深度的方法反覆檢驗。"}, {"en": "The sample is young, and that limits what it can say.", "zh": "樣本偏年輕，這限制了它能說的話。", "g": "16 至 39 歲占超過六成，學生占 27.7%。這是一份關於年輕族群口腔行為的研究，不能拿來談高齡者。引用時應寫成「台灣一般成人族群」。"}, {"en": "The most quotable numbers are the descriptive ones.", "zh": "最值得引用的是描述性數字。", "g": "刷牙次數、刷牙時間、牙線使用率、洗牙頻率、不看牙醫的原因——這些台灣本土的行為數據，在寫研究背景時很好用，因為它們提供了「台灣現況」的具體圖像。"}, {"en": "One finding is worth challenging.", "zh": "有一個發現值得質疑。", "g": "「預防性就醫對口腔健康無顯著預測性」與一般常識相反，也與作者自己引用的衛福部資料（定期洗牙者較不易有齲齒或牙周病）相矛盾。<br><br>可能的解釋：口腔健康現況是自覺症狀（塞牙縫、敏感、出血），而定期就醫的人本來就比較注意、也比較容易察覺症狀，反而回報得更多。這叫<em>偵測偏差</em>（detection bias）。敢提出這種另類解釋，正是文獻評析的價值所在。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "This paper carries no declaration of funding, competing interests, or ethical approval.", "zh": "本篇未載明經費來源、利益衝突或倫理審查。", "g": "中文期刊過去較少要求這些聲明，但這是一個缺口。本研究以網路問卷收集 1,229 位民眾的資料，理論上仍應通過倫理審查（IRB）並揭露經費。<br><br>對照組來看：這組文獻中其他十一篇全都寫了。她自己的論文一定要寫——高醫的碩士論文必須附 IRB 核准文件。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "The sample is young, and that limits what it can say.", "zh": "樣本偏年輕，這限制了它能說的話。", "g": "16 至 39 歲占超過六成，學生占 27.7%，年齡上限 65 歲。這是一份關於年輕族群口腔行為的研究，不能拿來談高齡者。引用時應寫成「台灣一般成人族群」。"}, {"en": "One finding is worth challenging.", "zh": "有一個發現值得質疑。", "g": "「預防性就醫對口腔健康無顯著預測性」與常識相反，也與作者自己引用的
