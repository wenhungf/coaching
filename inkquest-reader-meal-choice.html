<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>InkQuest Reading Room · 高齡者口腔狀況與餐食選擇</title>
<style>
  :root{
    --paper:#F6F2E9; --panel:#FFFFFF; --ink:#1E1B16; --soft-ink:#4A453B; --rule:#DED6C4;
    --accent:#1F4E6B; --accent-deep:#123549; --accent-tint:rgba(31,78,107,.08);
    --word:#0E7C86; --phrase:#8A5AA8; --gram:#3F7D54; --res:#B8863B;
    --gl-line:#9C907A; --gl-line-hover:#5F5849; --hit:#FBE7A2;
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Songti TC","Noto Serif TC",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --han:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --fs:19px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;color-scheme:light;background:var(--paper)}
  html,body{background:var(--paper)!important}
  body{margin:0;background:var(--paper)!important;color:var(--ink)!important;
    font-family:var(--serif);line-height:1.72;font-size:var(--fs);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}

  #bar{position:sticky;top:0;z-index:30;background:var(--paper);
    border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;
    padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .iconbtn{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);line-height:0;border-radius:5px}
  .iconbtn:hover{background:var(--accent-tint)}
  .iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
  #barTitle{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--soft-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  #barTitle b{color:var(--accent)}

  header.article{margin:32px 0 6px}
  .kicker{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent);margin-bottom:12px}
  h1.title{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;line-height:1.14;font-size:31px;margin:0 0 14px}
  h1.title .sent{border-radius:5px}
  .cite{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--soft-ink);
    border-top:1px solid var(--rule);padding:12px 0 0}
  .cite b{color:var(--ink)}
  .cite .lic{display:inline-block;margin-top:5px;font-size:11.5px;color:var(--res);font-weight:700}
  .toolbar{display:flex;gap:9px;margin:20px 0 4px;flex-wrap:wrap}
  .tbtn{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:8px 13px;border:1px solid var(--rule);
    background:none;color:var(--ink);border-radius:20px;cursor:pointer}
  .tbtn:hover{background:var(--accent-tint);border-color:var(--accent)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}

  article{margin-top:22px}
  #body > h2.sec:first-child{border-top:0;padding-top:0;margin-top:26px}
  h2.sec{scroll-margin-top:66px;font-family:var(--sans);font-weight:800;font-size:15px;color:var(--ink);
    margin:34px 0 12px;padding-top:16px;border-top:1px solid var(--rule);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  h2.sec::before{content:"\25C8";color:var(--accent);font-size:11px}
  h2.sec .zh{font-family:var(--han);font-weight:600;font-size:13px;color:var(--soft-ink)}
  .para{margin:0 0 20px}
  .bigrule{border-top:2px solid var(--ink);margin:44px 0 0;padding-top:10px}
  .bigrule .lbl{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent)}

  .sent{cursor:pointer;border-radius:3px;padding:1px 0;-webkit-tap-highlight-color:transparent;
    transition:background .12s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sent:hover{background:rgba(31,78,107,.07)}
  .sent.open{background:rgba(31,78,107,.10)}
  .sent.flash{background:var(--hit);transition:background .6s ease}
  .sent:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  mark.hit{background:var(--hit);padding:0 1px;border-radius:2px}

  .tr{display:none;margin:12px 0 16px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
    font-family:var(--han);font-size:16px;line-height:1.78;color:var(--ink)}
  .tr.show{display:block}
  .tr .lab{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.1em;
    color:var(--accent);display:block;margin-bottom:5px}
  .tr .gnote{margin-top:13px;padding-top:12px;border-top:1px dashed var(--rule);
    font-size:14.5px;line-height:1.75;color:var(--soft-ink)}
  .tr .gnote .lab{color:var(--gram)}
  .tr .gnote em{font-family:var(--sans);font-style:normal;font-weight:700;color:var(--ink)}

  .gl{cursor:pointer;border-bottom:1.5px dotted var(--gl-line);transition:background .12s,border-color .12s}
  .gl:hover,.gl[aria-expanded="true"]{background:rgba(30,27,22,.08);border-bottom-color:var(--gl-line-hover)}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:2px}

  .tblblock{margin:22px 0 8px;border-top:1px solid var(--rule);padding-top:14px}
  .tblhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .tblname{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--accent)}
  .tblbtn{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 12px;
    border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:16px;cursor:pointer;margin-left:auto}
  .tblbtn:hover{border-color:var(--accent);background:var(--accent-tint)}
  .tblbtn.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}
  .tblcap{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:var(--soft-ink);margin:12px 0 8px}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
  .tblwrap table{border-collapse:collapse;font-family:var(--sans);font-size:12.5px;min-width:100%}
  .tblwrap th,.tblwrap td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
  .tblwrap thead th{background:#EFE9DA;font-weight:800;color:var(--accent-deep);position:sticky;top:0}
  .tblwrap td:first-child,.tblwrap th:first-child{white-space:normal;min-width:190px}
  .tblwrap.text td,.tblwrap.text th{white-space:normal}
  .tblwrap.text td:nth-child(1),.tblwrap.text th:nth-child(1){min-width:0;width:34px}
  .tblwrap.text td:nth-child(2),.tblwrap.text td:nth-child(3){min-width:0;line-height:1.55}
  .tblwrap.text td,.tblwrap.text th{padding:7px 8px}
  .tblwrap.text td:nth-child(3){font-family:var(--han)}
  .tblwrap tr.grp td{background:#F3EEE1;font-weight:800;color:var(--accent-deep);white-space:normal}
  .tblnote{font-family:var(--han);font-size:13px;line-height:1.7;color:var(--soft-ink);margin:10px 0 0}
  h3.qacat{font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--accent);
    margin:30px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  h3.qacat .zh{font-family:var(--han);font-weight:600;font-size:12.5px;color:var(--soft-ink)}
  .qablock{border-left:2px solid var(--rule);padding:4px 0 4px 14px;margin:16px 0 20px}
  .qa-line{margin:0 0 10px}
  .qtag{font-family:var(--sans);font-size:10px;font-weight:800;line-height:1;
    display:inline-block;width:18px;height:18px;border-radius:5px;text-align:center;
    padding-top:4px;margin-right:8px;vertical-align:2px}
  .qtag.q{background:var(--accent);color:#F6F2E9}
  .qtag.a{background:var(--gram);color:#F6F2E9}
  .sent.qs{font-weight:600}
  .sent.as{font-style:italic}
  .mesh{margin:10px 0 0;font-family:var(--sans);font-size:15px;line-height:2.1}
  .mesh .mterm{display:inline-block;margin:0 8px 8px 0;padding:5px 11px;border:1px solid var(--rule);
    border-radius:16px;background:var(--panel);cursor:pointer;font-size:14px;
    border-bottom:1px solid var(--rule);-webkit-tap-highlight-color:transparent}
  .mesh .mterm:hover{border-color:var(--res);background:#FBF6EA}
  .mesh .mterm.major{border-color:var(--res);background:#FBF6EA;font-weight:600}
  .star{color:var(--res);font-weight:800}
  .meshlegend{font-family:var(--sans);font-size:12px;color:var(--soft-ink);margin:10px 0 0}
  .meshnote{font-family:var(--sans);font-size:13px;line-height:1.65;color:var(--soft-ink);margin:4px 0 14px}

  #pop{position:absolute;z-index:60;max-width:390px;background:var(--ink);color:#F3EEE3;border-radius:12px;
    padding:15px 17px;box-shadow:0 18px 40px -12px rgba(30,27,22,.55);display:none;font-family:var(--sans)}
  #pop.show{display:block}
  #pop .px{display:none;margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);font-family:var(--han);font-size:14px;line-height:1.78;color:#F3EEE3}
  #pop .px.on{display:block}
  #pop .px b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#E7C58A;margin-bottom:4px}
  #pop .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:5px;margin-bottom:8px}
  #pop .tag.v{background:#5FC6D0;color:#04333a} #pop .tag.p{background:#C79EE0;color:#3a1f4a}
  #pop .tag.c{background:#8FCBA1;color:#123521} #pop .tag.f{background:#E0BC72;color:#2b1f08}
  #pop .tag.m{background:#E0BC72;color:#2b1f08}
  #pop .h{font-weight:800;font-size:15.5px;color:#fff;margin-bottom:2px}
  #pop .zh{font-family:var(--han);font-size:14px;color:#E7C58A;margin-bottom:9px;font-weight:600}
  #pop .d{font-size:13.5px;line-height:1.58;color:#DCD6C9}
  #pop .lvl{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;color:#A9A296;letter-spacing:.06em}
  #pop .arrow{position:absolute;width:14px;height:14px;background:var(--ink);transform:rotate(45deg)}
  #pop .close{position:absolute;top:8px;right:10px;background:none;border:0;color:#9a948a;font-size:20px;cursor:pointer;line-height:1;display:none}

  #scrim{position:fixed;inset:0;background:rgba(30,27,22,.34);z-index:40;display:none}
  #scrim.show{display:block}
  #drawer{position:fixed;top:0;left:0;bottom:0;width:min(88vw,350px);background:var(--panel);z-index:50;
    transform:translateX(-101%);transition:transform .22s ease;display:flex;flex-direction:column;
    box-shadow:0 0 44px -8px rgba(30,27,22,.4)}
  #drawer.open{transform:none}
  .d-head{padding:calc(20px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--rule)}
  .d-sub{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent);margin:0 0 3px}
  .d-title{font-family:var(--sans);font-size:16px;font-weight:800;margin:0;line-height:1.3}
  .tabs{display:flex;border-bottom:1px solid var(--rule)}
  .tab{flex:1;font-family:var(--sans);font-size:12.5px;font-weight:600;padding:12px 3px;background:none;
    border:0;border-bottom:2px solid transparent;color:var(--soft-ink);cursor:pointer}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .d-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:30px}
  .pane{display:none;padding:10px 0} .pane.on{display:block}

  .tocitem{display:block;width:100%;text-align:left;font-family:var(--sans);font-size:13.5px;line-height:1.45;
    padding:13px 20px;background:none;border:0;border-left:3px solid transparent;color:var(--ink);cursor:pointer}
  .tocitem:hover{background:var(--accent-tint)}
  .tocitem.cur{border-left-color:var(--accent);background:var(--accent-tint);font-weight:700}
  .tocitem.todo{color:#A9A396;cursor:default} .tocitem.todo:hover{background:none}
  .tocitem em{font-style:normal;color:var(--accent);font-size:11px;font-weight:700;display:block;margin-bottom:3px;letter-spacing:.05em}
  .tocitem.todo em{color:#BDB6A7}
  .tocitem .meta{display:block;font-size:11.5px;color:var(--soft-ink);margin-top:4px;font-weight:400}
  .tocitem.todo .meta{color:#BDB6A7}

  .qwrap{position:relative;margin:12px 20px 6px}
  #q{width:100%;font-family:var(--sans);font-size:14px;padding:10px 36px 10px 12px;
    border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
  #q:focus{outline:none;border-color:var(--accent)}
  #q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
  #qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;
    border:0;border-radius:50%;background:none;color:var(--soft-ink);font-size:19px;line-height:1;
    cursor:pointer;padding:0}
  #qclear:hover{background:var(--accent-tint);color:var(--ink)}
  .qnote{font-family:var(--sans);font-size:11.5px;color:var(--soft-ink);padding:4px 20px 8px;margin:0}
  .hitrow{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
    padding:11px 20px;cursor:pointer;font-family:var(--sans)}
  .hitrow:hover{background:var(--accent-tint)}
  .hitrow .hr-ch{font-size:11px;color:var(--accent);font-weight:700;display:block;margin-bottom:3px}
  .hitrow .hr-sn{font-size:12.5px;line-height:1.5;color:var(--soft-ink)}
  .hitrow .hr-sn b{color:var(--ink);background:var(--hit);font-weight:400}

  .wbhead{font-family:var(--sans);font-size:11.5px;font-weight:800;letter-spacing:.08em;
    margin:18px 20px 10px;display:flex;align-items:center;gap:8px}
  .wbhead .pip{width:9px;height:9px;border-radius:3px;flex:none}
  .wbhead.v{color:#0d6870} .wbhead.v .pip{background:var(--word)}
  .wbhead.p{color:#6E4488} .wbhead.p .pip{background:var(--phrase)}
  .wbhead.c{color:#2f6042} .wbhead.c .pip{background:var(--gram)}
  .wbhead.f{color:#8a6420} .wbhead.f .pip{background:var(--res)}
  .wbhead .n{margin-left:auto;font-weight:600;color:var(--soft-ink);letter-spacing:0}
  .wb{padding:0 20px;margin-bottom:12px;font-size:13.5px;line-height:1.45}
  .wb .t{font-family:var(--sans);font-weight:700}
  .wb .z{font-family:var(--han);color:var(--accent-deep);font-size:13px}
  .wb .x{display:block;font-family:var(--sans);color:var(--soft-ink);font-size:12px;margin-top:2px;line-height:1.5}
  .wb .px{display:block;font-family:var(--han);color:var(--ink);font-size:12.5px;margin-top:4px;line-height:1.7}

  .setrow{padding:16px 20px;border-bottom:1px solid var(--rule)}
  .setrow h4{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.06em;margin:0 0 10px;color:var(--soft-ink)}
  .sizes{display:flex;gap:8px}
  .sizes button{flex:1;font-family:var(--sans);font-size:12.5px;padding:9px 6px;border:1px solid var(--rule);
    background:none;border-radius:5px;cursor:pointer;color:var(--ink)}
  .sizes button.on{background:var(--accent);border-color:var(--accent);color:#F6F2E9}

  footer{margin:46px 0 60px;border-top:2px solid var(--ink);padding-top:14px;
    font-family:var(--sans);font-size:12px;color:var(--soft-ink);line-height:1.65}
  footer .strong{color:var(--ink);font-weight:700} footer .han{font-family:var(--han)}

  @media(max-width:600px){
    :root{--fs:18px}
    h1.title{font-size:26px}
    #pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;max-width:none;
      border-radius:16px 16px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom,0px));max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    #pop .arrow{display:none} #pop .close{display:block}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="bar">
  <button class="iconbtn" id="menuBtn" aria-label="Contents">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div id="barTitle"></div>
  <button class="iconbtn" id="searchBtn" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
</div>

<div class="wrap">
  <header class="article">
    <div class="kicker" id="kicker"></div>
    <h1 class="title" id="pTitle"></h1>
    <div class="cite" id="pCite"></div>
  </header>

  <article id="body"></article>
  <div class="toolbar" id="ftBar">
    <button class="tbtn" id="ftBtn">Continue to the full text</button>
    <button class="tbtn" id="qaBtn">Jump to the Q&amp;A</button>
  </div>
  <article id="ftBody" hidden></article>

  <footer id="foot"></footer>
</div>

<div id="scrim"></div>

<aside id="drawer" aria-label="Contents and search">
  <div class="d-head">
    <p class="d-sub">InkQuest</p>
    <p class="d-title">Reading Room · 口腔狀況與餐食選擇</p>
  </div>
  <div class="tabs">
    <button class="tab on" data-pane="toc">Papers</button>
    <button class="tab" data-pane="search">Search</button>
    <button class="tab" data-pane="words">Words</button>
    <button class="tab" data-pane="set">Settings</button>
  </div>
  <div class="d-body">
    <div class="pane on" id="pane-toc"></div>
    <div class="pane" id="pane-search">
      <div class="qwrap">
        <input id="q" type="search" placeholder="Search this paper&hellip;" autocomplete="off">
        <button id="qclear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <p class="qnote" id="qnote">Type at least two letters. 中英文都可以搜尋。</p>
      <div id="hits"></div>
    </div>
    <div class="pane" id="pane-words"></div>
    <div class="pane" id="pane-set">
      <div class="setrow">
        <h4>Text size 字級</h4>
        <div class="sizes" id="sizes">
          <button data-size="17">Small</button>
          <button data-size="19" class="on">Medium</button>
          <button data-size="22">Large</button>
        </div>
      </div>
      <div class="setrow">
        <h4>Translations 中譯</h4>
        <div class="sizes">
          <button id="openAllBtn">Open all 全部展開</button>
          <button id="closeAllBtn">Close all 全部收起</button>
        </div>
      </div>
    </div>
  </div>
</aside>

<div id="pop" role="dialog" aria-live="polite">
  <button class="close" id="popclose" aria-label="Close">&times;</button>
  <span class="tag" id="pop-tag"></span>
  <div class="h" id="pop-h"></div>
  <div class="zh" id="pop-zh"></div>
  <div class="d" id="pop-d"></div>
  <div class="px" id="pop-x"></div>
  <div class="lvl" id="pop-lvl"></div>
  <div class="arrow" id="pop-arrow"></div>
</div>

<script>
var PAPERS = [{"id": "imamura2023", "no": "Paper 1", "short": "Imamura 2023 · Comparing four chewing screening tools", "title": "Masticatory performance in oral function assessment: Alternative methods", "titleZh": "口腔功能評估中的咀嚼表現：替代方法", "titleG": "冒號前是主題範圍，冒號後是本篇切入的角度。<em>Alternative methods</em>（替代方法）——這種簡短的副標在方法學論文很常見，意思是「本篇要比較幾種可以互相取代的做法」。", "authors": "Imamura Y, Chebib N, Ohta M, Mojon P, Schulte-Eickhoff RM, Schimmel M, Graf C, Sato Y, Müller F", "journal": "J Oral Rehabil, 2023; 50: 383-391", "doi": "10.1111/joor.13421", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【簡報中・暫置第一】四種咀嚼篩檢工具的比較，離新題目最遠，但利益衝突那一段是全套文獻中最好的教學案例，也是近期簡報的主角。全文逐句版已收錄；討論段另有三句可直接引用到食物質地。", "mesh": [["Gluco sensor", "葡萄糖感測器", "Jelly-scan 測試所用的儀器。"], ["Hue-check gum", "變色口香糖", "以顏色變化判讀咀嚼效率。"], ["Masticatory function check gum", "咀嚼功能檢測口香糖", "混合能力測試用。"], ["Oral hypofunction", "口腔功能低下", "日本老年牙醫學會提出的診斷概念。"]], "part": "Abstract + full text", "done": true, "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Masticatory function declines with age or disease, implicating a poor chewing efficiency and an often-unconscious change for a less healthy, yet easy to chew diet.", "zh": "咀嚼功能隨年齡或疾病下降，導致咀嚼效率不佳，並常在不自覺中轉向較不健康但容易咀嚼的飲食。", "g": "<em>often-unconscious change</em>（常在不自覺中的轉變）——這一句對新題目非常有用：人不會宣布「我今天開始吃軟的」，而是慢慢把咬不動的菜留在便當盒裡。<br><br>這正是「食物迴避」（food avoidance）的機制，也說明了為什麼要問實際飲食內容，而不只是問「您覺得咬得動嗎」。"}, {"en": "Timely screening of masticatory function may foster an early-onset diagnosis and potential treatment.", "zh": "及時篩檢咀嚼功能有助於早期診斷與治療。"}, {"en": "The aim of this study was to compare alternative diagnostic tools for masticatory function to a Jelly-scan test.", "zh": "本研究旨在比較數種咀嚼功能診斷工具與 Jelly-scan 測試的差異。"}]}, {"h": "Materials and Methods", "zh": "材料與方法", "s": [{"en": "Patients aged 70 years and older who were hospitalised for rehabilitation were recruited for this study.", "zh": "本研究招募 70 歲以上住院接受復健的病人。", "g": "<em>hospitalised for rehabilitation</em>（住院復健）——這群人跟社區長者差很多，通常伴隨中風、骨折或其他急症後的失能。引用時要交代清楚。"}, {"en": "A total of four different tests for masticatory function were administered.", "zh": "共施行四種不同的咀嚼功能測試。"}, {"en": "The Japanese Society of Gerodontology glucose extraction test (Jelly-scan) was used as reference to compare a colour-changing gum test as well as a mixing ability test with a visual and opto-electronical analyses.", "zh": "以日本老年牙醫學會的葡萄糖溶出測試（Jelly-scan）為參考標準，比較變色口香糖測試，以及以目視與光電方式判讀的混合能力測試。", "g": "四種工具的差別在成本與客觀程度：葡萄糖溶出需要儀器、變色口香糖靠比色、混合能力測試可目視也可用機器判讀。臨床要的是又準又便宜。"}, {"en": "Receiver operating characteristic curves were used to establish the discriminative value, kappa-values were used to estimate individual agreements.", "zh": "以接收者操作特徵曲線建立區辨值，並以 kappa 值估計個別一致性。", "g": "<em>ROC 曲線</em>用來評估一個工具區分「有問題／沒問題」的能力，核心是<em>敏感度</em>（有問題的抓得出來）與<em>特異度</em>（沒問題的不誤判）。篩檢工具的評估標準就是這兩個。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Sixty-one patients aged 82.4 years participated in the experiments. The average number of natural teeth was 16.5, and 34.4% of the participants wore removable dentures.", "zh": "共 61 位平均 82.4 歲的病人參與，平均天然牙數 16.5 顆，34.4% 配戴活動假牙。"}, {"en": "For all tests, the sum of sensitivity and specificity was greater than 150%. All tests correlated with Jelly-scan.", "zh": "所有測試的敏感度與特異度總和均超過 150%，且皆與 Jelly-scan 相關。"}, {"en": "With Jelly-scan 51 participants (83.6%) were diagnosed with masticatory hypofunction. After reducing the cut-off value of the test, only 33 participants (54%) fulfilled the diagnosis.", "zh": "以 Jelly-scan 判定時有 51 位（83.6%）被診斷為咀嚼功能低下；調低切點後，僅 33 位（54%）符合診斷。", "g": "同一批人，只因為切點從 100 改成 65，診斷率就從 83.6% 掉到 54%。<em>切點決定了有多少人被貼標籤</em>，這是所有篩檢工具的共同課題。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "All three tests can be considered useful screening alternatives.", "zh": "三種測試皆可作為有用的替代篩檢工具。"}, {"en": "In its original version, Jelly-scan may tend to over-diagnose masticatory hypofunction, hence a novel cut-off with better agreement between tests is suggested.", "zh": "原版 Jelly-scan 可能有過度診斷咀嚼功能低下的傾向，因此建議採用一致性較佳的新切點。", "g": "<em>over-diagnose</em>（過度診斷）：把沒問題的人判成有問題。在高齡照護中這不是小事——被貼上「咀嚼功能低下」的標籤，可能導致不必要的飲食限制。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "The full text is included because of the conflict-of-interest lesson, not because the topic fits.", "zh": "收錄全文是為了利益衝突這個教材，不是因為題目貼近。", "g": "這是整組文獻中最偏方法學的一篇。它回答的是「臨床該用哪個工具篩檢咀嚼功能」，不是「口腔狀況與餐食選擇的關係」。<br><br>但它的經費聲明與利益衝突聲明互相矛盾，是少見的教學級案例；又因為是 CC BY 授權，全文可以合法逐句註解。兩個條件加起來，值得收。"}, {"en": "For the conflict-of-interest presentation, four places in the paper matter.", "zh": "要報告利益衝突，要看的是四個位置。", "g": "第一，首頁側欄的 <em>Funding information</em>：GC company。<br>第二，方法段的儀器名稱：Gluco Sensor GS-II, GC Corporation。<br>第三，文末的 <em>Conflict of Interest Statement</em>：揭露了薪資，卻說「無利益衝突需要揭露」。<br>第四，結論：Jelly-scan 會過度診斷——一個對資助者不利的結論。<br><br>四個位置在論文的四個不同角落。只看其中任何一個，都會得到錯的結論。"}, {"en": "The participants are hospital rehabilitation patients.", "zh": "受試者是住院復健病人。", "g": "平均 82.4 歲、住院中、多半剛經歷急症。這既不是社區長者，也不是長照機構住民，是第三種族群。三者不能混為一談。"}, {"en": "Watch what a cut-off value does.", "zh": "看清楚「切點」的威力。", "g": "切點從 100 mg/dL 降到 65 mg/dL，診斷率就從 83.6% 掉到 54%。若自己的研究要把連續變項切成「好／不好」，切點怎麼訂、依據是什麼，必須交代清楚——這是口試很容易被問的地方。"}, {"en": "Three sentences in the Discussion are worth copying out for the new topic.", "zh": "討論段有三句話，值得為新題目抄下來。", "g": "一：「咀嚼次數會依食物質地而調整」——質地改變行為的直接依據。<br>二：「缺牙代表咬合面總面積變小，食物被上下牙夾住的機會降低」——這是「整塊 vs 切塊」在解剖學上的機轉。<br>三：「難嚼的食物在老年越來越常被迴避」——食物迴避的文獻依據。<br><br>這三句加上前言那句「飲食改變常在不自覺中發生」，就是本篇對新題目的全部價值。"}]}, {"h": "Introduction", "zh": "前言", "s": [{"en": "Eating is recognised as one of the main pleasures in late life.", "zh": "進食被公認為晚年生活的主要樂趣之一。", "g": "論文的第一句很少是資料，通常是價值主張。這一句先把「吃」定位成<em>樂趣</em>，而不只是營養攝取——後面所有關於「不要隨便把飯菜打成泥」的論點，都從這裡長出來。<br><br><em>late life</em>（晚年）比 old age 更中性、更常見於老年醫學文獻。"}, {"en": "Furthermore, in old age, weight is crucial to prevent malnutrition and morbidity.", "zh": "此外，體重在老年是預防營養不良與罹病的關鍵。", "g": "<em>morbidity</em>（罹病率）與 <em>mortality</em>（死亡率）是老年研究的一組常客，兩個字長得像，意思差很多：前者是生病，後者是死亡。"}, {"en": "The masticatory function changes over the lifetime, and meals do take a longer time.", "zh": "咀嚼功能會隨著一生而改變，用餐時間也確實變長。", "g": "<em>do take</em> 的 do 是強調用法，等於「確實會」。學術寫作裡不多見，出現時多半是作者想強調一個容易被忽略的常識。"}, {"en": "Chewing function is further deteriorated by tooth loss, deterioration of the periodontal status, neurocognitive disorders and poor dental prostheses.", "zh": "咀嚼功能會進一步因為缺牙、牙周狀況惡化、神經認知疾病與不良假牙而下降。", "g": "這一句把四個原因並列，正是文獻回顧最好抄的句型：<em>X is further deteriorated by A, B, C and D.</em><br><br>注意 <em>poor dental prostheses</em>——假牙本身不是保障，做得不好的假牙也算危險因子。"}, {"en": "Often unnoticed by the resident, an adaptation of the diet takes place, replacing food of high nutritional value with a diet that requires little masticatory efficiency.", "zh": "住民往往沒有察覺，飲食已經悄悄調整，把高營養價值的食物換成不太需要咀嚼效率的飲食。", "g": "全篇最值得抄下來的一句。<em>Often unnoticed</em> 放在句首是分詞構句的倒裝，效果是先丟出「沒被發現」這個關鍵。<br><br>對便當研究的意義：飲食改變是<em>悄悄</em>發生的。沒有人會宣布「我從今天開始吃軟的」，而是把咬不動的排骨默默留在便當盒裡。所以問卷問「覺得自己咬得動嗎」可能問不出來，得看實際吃了什麼、剩了什麼。"}, {"en": "Decreased masticatory function refers to a condition where the occlusal force and motor function of the tongue and peri-oral muscles have declined, resulting in a state that may foster malnutrition.", "zh": "咀嚼功能下降是指咬合力與舌頭、口周肌肉的運動功能衰退，形成可能促成營養不良的狀態。", "g": "<em>peri-</em> 是「周圍」的字首（peri-oral 口周、peri-odontal 牙周、peri-implant 植體周圍）。認得字首，牙科單字會省下很多背誦時間。"}, {"en": "As the condition progresses, masticatory efficiency, food bolus formation and swallowing are impaired, which may negatively affect digestion and absorption of nutrients.", "zh": "隨著情況惡化，咀嚼效率、食團形成與吞嚥都會受損，可能對消化與營養吸收造成負面影響。", "g": "<em>food bolus</em>（食團）指咀嚼後準備吞下的那一口混合物。這個字在吞嚥與質地調整飲食的文獻裡會一直出現。"}, {"en": "Finally, compromised masticatory function may even lead a food intake that is insufficient to meet the amount of nutrition required.", "zh": "最後，咀嚼功能受損甚至可能導致食物攝取不足以滿足所需的營養量。", "g": "這一句原文有語法瑕疵：<em>lead a food intake</em> 少了 to，應為 <em>lead to a food intake</em>。<br><br>值得記住的不是抓錯字，而是一個事實：通過同儕審查的期刊論文裡也會留下這種錯誤。閱讀時看不懂某一句，有時不是讀者的問題。"}, {"en": "A poor oral and facial motor function was termed \"oral frailty\", and in addition, the Japanese Society of Gerodontology (JSG) has classified \"oral function\" based on the examination of seven parameters: oral hygiene, oral dryness, occlusal force, tongue-lip motor function, tongue pressure, masticatory function and swallowing.", "zh": "口腔與顏面運動功能不良被稱為「口腔衰弱」（oral frailty）；此外，日本老年牙醫學會（JSG）以七項參數的檢查來界定「口腔功能」：口腔衛生、口腔乾燥、咬合力、舌唇運動功能、舌壓、咀嚼功能與吞嚥。", "g": "這七項就是日本 <em>oral hypofunction</em>（口腔機能低下症）的診斷架構，台灣近年的口腔衰弱研究多半沿用。七項的中文對照值得抄進論文的名詞定義。<br><br><em>gerodontology</em> = gero-（老年）+ odonto-（牙）+ -logy（學），老年牙醫學。"}, {"en": "Oral hypofunction is defined as a state when three or more of the above mentioned seven signs are found to be below a given cut-off value.", "zh": "口腔機能低下症的定義是：上述七項指標中有三項以上低於特定切點值。", "g": "<em>cut-off value</em>（切點值）這個字這篇會出現很多次，而且整篇論文的結論就建立在它身上。先記住：切點是人訂的，不是天生的。"}, {"en": "A therapeutic intervention might re-establish a normal oral function, or at least preclude the deterioration of oral hypofunction to oral dysfunction.", "zh": "治療介入或許能恢復正常的口腔功能，至少能阻止口腔機能低下惡化為口腔功能障礙。", "g": "<em>hypofunction</em>（機能低下）與 <em>dysfunction</em>（功能障礙）在這個架構裡是兩個嚴重度不同的階段，中文不宜混用。"}, {"en": "Hence screening oral functions is important in the elderly population.", "zh": "因此，在高齡族群中篩檢口腔功能很重要。"}, {"en": "Numerous devices and tests for evaluating masticatory function have been described.", "zh": "已有許多評估咀嚼功能的器材與測試被提出。"}, {"en": "Within the JSG oral hypofunction test battery, a specific test for masticatory performance was proposed.", "zh": "在 JSG 的口腔機能低下測試組合中，提出了一項專門測量咀嚼表現的測試。", "g": "<em>test battery</em>（測試組合／成套測驗）——不是電池，是一整套一起施測的測驗。心理與功能評估文獻常見。"}, {"en": "Its diagnosis is based on the degree of the glucose concentration obtained from a jelly-like test specimen, the patient is asked to chew the specimen for 20 s, to sip 20 mL of water without swallowing and spitting the test specimen with the water in a cup through a mesh.", "zh": "其診斷依據是從膠狀測試物取得的葡萄糖濃度：請病人咀嚼測試物 20 秒，啜飲 20 毫升的水但不吞下，再將測試物連同水一起吐入杯中，通過濾網收集。", "g": "原理很直觀：嚼得越碎，糖溶出得越多。所以葡萄糖濃度是<em>咀嚼破碎程度</em>的代理指標（proxy）。<br><br>代理指標的概念在研究設計裡很重要——測不到真正想測的東西時，改測一個跟它高度相關、又量得到的東西。"}, {"en": "Traditionally, chewing efficiency and chewing performance were evaluated by a comminution test with breakable test foods such as nuts or silicon cubes with a subsequent particle size analysis using a set of sieves with decreasing mesh sizes, indicating the spread of particles according to their size.", "zh": "傳統上，咀嚼效率與咀嚼表現是以破碎測試評估：使用堅果或矽膠方塊等可破碎的測試食物，再用一組網目遞減的篩網做顆粒大小分析，以顯示顆粒依大小的分布情形。", "g": "<em>comminution</em>（破碎、粉碎）是咀嚼研究的專有動作名詞。這種篩網法就是「咀嚼效率」最原始的測法：嚼完吐出來，過篩，看碎成多小。<br><br>這段對排骨題目有直接啟發：咀嚼研究長期關心的就是<em>顆粒大小</em>。食物一開始的大小，與咀嚼後能碎到多小，是同一條軸上的兩端。"}, {"en": "A more recent two-colour mixing test uses a bi-coloured gum specimen which, after 20 cycles of mastication, can be judged for the degree of colour mixture and ability for bolus formation.", "zh": "較新的雙色混合測試使用雙色口香糖試片，咀嚼 20 次後，可判讀其顏色混合程度與形成食團的能力。"}, {"en": "Further analyses could be obtained by a numerical analysis of the degree of colour mixture after the specimen has been flattened to a 1 mm thick wafer and both sides have been digitised.", "zh": "把試片壓成 1 毫米薄片並將兩面數位化後，還可對顏色混合程度做數值分析。", "g": "同一個試片，三種判讀方式：肉眼比色、掃描後電腦算。這是「同一測量、不同判讀層次」的好例子——也正是本篇後面被自己點名的限制之一。"}, {"en": "Tests which require specific equipment and the intervention of a dental professional may be expensive and time consuming.", "zh": "需要特定儀器與牙科專業人員操作的測試，可能昂貴又耗時。"}, {"en": "Moreover the Jelly-scan test instructions can be challenging as participants can swallow the jelly specimen or the water compromising the glucose concentration readings from the gluco-sensor.", "zh": "此外，Jelly-scan 的施測指示不容易執行，因為受試者可能把膠狀試片或水吞下去，使葡萄糖濃度讀值失準。", "g": "<em>compromising</em> 在這裡不是「妥協」，而是「使⋯⋯受損、失準」。學術英文裡這個用法比「妥協」更常見。<br><br>這也是一個實務提醒：任何要求長者「含著不要吞」的測驗，都會有一定比例的資料報廢。設計實地研究時要先想好這種情況怎麼處理。"}, {"en": "More simple test methods, which could be even used by the patient himself at home, would facilitate the widespread screening of the ever-increasing number of elders in the population with chewing difficulties and would enable treatment before further deterioration to oral function.", "zh": "更簡單、甚至能由病人自己在家操作的測試方法，將有助於對人數不斷增加、有咀嚼困難的長者進行大規模篩檢，並能在口腔功能進一步惡化前就開始治療。", "g": "這就是本篇的「研究缺口」（research gap）：現有的黃金標準太貴太麻煩，所以需要替代工具。<br><br>文獻回顧的標準收尾結構——先說現況，再說現況不夠用，最後說本研究要補這個洞。"}, {"en": "The purpose of this study was to compare in hospitalised elders three alternative diagnostic methods for masticatory function and describe their sensitivity and specificity with regard to the reference, the Jelly-scan test, which is used in the oral function test battery, as described by the Japanese Society of Gerodontology in 2018.", "zh": "本研究的目的是在住院長者中比較三種咀嚼功能的替代診斷方法，並描述其相對於參考標準——日本老年牙醫學會 2018 年口腔功能測試組合中的 Jelly-scan 測試——的敏感度與特異度。"}, {"en": "The hypothesis of this study was that there is a positive correlation between the \"gold standard\" Jelly-scan test and the three alternative methods.", "zh": "本研究的假設是：「黃金標準」Jelly-scan 測試與三種替代方法之間存在正相關。", "g": "<em>gold standard</em>（黃金標準）加引號，是作者對這個稱呼保持距離的訊號——而整篇的結論正是在質疑這個黃金標準的切點。引號有時候就是論點的伏筆。<br><br>另外值得注意：假設只說「有正相關」。這是一個很低的門檻，幾乎一定會成立。假設訂得太寬鬆，後面說「假設獲得證實」的份量就有限。"}]}, {"h": "Methods · Ethics and participants", "zh": "研究方法 · 倫理與受試者", "s": [{"en": "The Swiss Cantonal Ethics Committee approved this study on oral hypofunction in hospitalised elders (CCER 2019-01338).", "zh": "瑞士州立倫理委員會核准了本項針對住院長者口腔機能低下的研究（CCER 2019-01338）。", "g": "倫理審查編號要寫進論文裡。準備 IRB 送件時，這一行就是最後長出來的東西。"}, {"en": "In this paper, only the findings from the masticatory function testing are reported.", "zh": "本文僅報告咀嚼功能測試的結果。", "g": "一個大型研究拆成多篇發表，很常見。誠實的做法就是像這樣講清楚「本文只報告其中一部分」。<br><br>閱讀時要留意：其他六項口腔功能的資料收了卻沒報告，所以無法從這篇知道這群人的整體口腔狀況。"}, {"en": "Participants were recruited from the pool of patients hospitalised at the Loex Hospital of the Geneva University Hospitals (HUG) between October 2019 and July 2020.", "zh": "受試者招募自 2019 年 10 月至 2020 年 7 月間在日內瓦大學醫院（HUG）Loëx 院區住院的病人。"}, {"en": "This hospital is a 200 beds centre for rehabilitation and long-term care.", "zh": "該院是一家 200 床的復健與長期照護中心。", "g": "這一句決定了整篇的外推範圍。復健與長照中心的住院病人，既不是社區長者，也不完全等同一般長照機構住民。引用本篇時，族群要交代清楚。"}, {"en": "Inclusion criteria comprised being aged 70 years or more, being hospitalised in University Hospitals of Geneva (Loex), understanding and being able to follow simple instructions, speaking French, having the cognitive ability to answer a questionnaire and signing the consent form.", "zh": "納入條件包括：年滿 70 歲、於日內瓦大學醫院（Loëx）住院、能理解並遵循簡單指示、會說法語、具備回答問卷的認知能力，並簽署同意書。", "g": "<em>Inclusion criteria</em>（納入條件）與 <em>exclusion criteria</em>（排除條件）是方法段的固定欄位，兩者一定要分開寫清楚。<br><br>注意「會說法語」也是一條納入條件。語言能力限制了誰能進入研究，這在多語社會（包括台灣）是很現實的問題。"}, {"en": "Patients presenting with disorders affecting oral intake were excluded from the participation.", "zh": "有影響經口進食之疾病的病人被排除在外。"}, {"en": "Patients with poorly-controlled diabetes, with gastro-intestinal diseases or symptoms (nausea, vomiting, diarrhoea, constipation) affecting oral intake, and those taking an antimicrobial treatment at time of screening were also excluded.", "zh": "血糖控制不佳的糖尿病患者、有影響經口進食之腸胃疾病或症狀（噁心、嘔吐、腹瀉、便祕）者，以及篩檢當時正在使用抗菌藥物者，也一併排除。", "g": "為什麼要排除糖尿病？因為參考標準測的是<em>唾液中的葡萄糖濃度</em>。血糖高的人，口水裡的糖本來就多，會污染讀值。<br><br>這是排除條件的最佳示範：排除的理由來自測量原理本身，不是隨便訂的。設計自己的研究時，每一條排除條件都應該能回答「為什麼排這個」。"}]}, {"h": "Methods · Protocol", "zh": "研究方法 · 施測流程", "s": [{"en": "A senior physician (R.S.) screened the patients for the inclusion and exclusion criteria.", "zh": "一位資深醫師（R.S.）依納入與排除條件篩選病人。"}, {"en": "Each participant was informed verbally and in written about the nature of the study.", "zh": "每位受試者都以口頭與書面方式被告知研究性質。", "g": "原文 <em>in written</em> 應為 <em>in writing</em>。又一個通過審查卻留下的小錯。"}, {"en": "Participants were given at least 24 hours time, and the possibility to have all pertinent questions answered, before deciding to participate in the study.", "zh": "受試者在決定是否參與前，至少有 24 小時的考慮時間，並可提出所有相關問題。", "g": "<em>至少 24 小時的考慮期</em>是知情同意的具體做法，不只是簽名而已。IRB 送件時，這種細節寫得出來，審查會順很多。"}, {"en": "After again verifying the inclusion and exclusion criteria, written informed consent was obtained.", "zh": "再次確認納入與排除條件後，取得書面知情同意。"}, {"en": "First, the participant's demographic characteristics, medical diagnoses and drug intake were noted from the medical records and added to the clinical record form by a study nurse (S.A.).", "zh": "首先由研究護理師（S.A.）從病歷中記錄受試者的人口學特徵、醫療診斷與用藥情形，並登錄於臨床記錄表。"}, {"en": "During the first visit, clinical signs and symptoms of oral hypofunction were measured.", "zh": "第一次訪視時，測量口腔機能低下的臨床徵象與症狀。"}, {"en": "The test battery included an oral examination, and assessments of oral hygiene, oral dryness, occlusal force, of the tongue-lip motor function, of the tongue pressure, of the swallowing function and of the masticatory function.", "zh": "測試組合包括一次口腔檢查，以及口腔衛生、口腔乾燥、咬合力、舌唇運動功能、舌壓、吞嚥功能與咀嚼功能的評估。"}, {"en": "Subsequently, further three methods were used to evaluate the masticatory function.", "zh": "接著再以另外三種方法評估咀嚼功能。"}, {"en": "All tests were performed by the same operators (Y.I. and M.O.).", "zh": "所有測試均由同兩位施測者（Y.I. 與 M.O.）執行。", "g": "同一批施測者可以減少施測者之間的差異，但也帶來代價：無法計算<em>施測者間信度</em>（inter-examiner reliability）。<br><br>對照 Yen 2015——該篇寫了「inter-examiner」，但全文只有一位檢查者，用詞是錯的。兩篇放在一起看，就知道這個名詞什麼時候能用、什麼時候不能用。"}, {"en": "This paper reports only the comparison of the three additional masticatory function tests with regard to the \"gold standard\" test.", "zh": "本文僅報告三種額外咀嚼功能測試與「黃金標準」測試的比較。"}]}, {"h": "Methods · The four chewing tests", "zh": "研究方法 · 四種咀嚼測試", "s": [{"en": "Four methods for testing masticatory function were performed, the \"Jelly-scan\" test recommended by the JSG's oral hypofunction test battery was used as reference.", "zh": "共執行四種咀嚼功能測試，以 JSG 口腔機能低下測試組合所建議的「Jelly-scan」測試作為參考標準。", "g": "<em>reference</em>（參考標準）在診斷研究裡是一個專門位置：其他工具的好壞，全部拿它來比。所以參考標準本身準不準，決定了整篇論文的地基。<br><br>本篇最有意思的地方就在這裡——它最後質疑了自己選的參考標準。"}, {"en": "The Jelly-scan test uses a test device (Gluco Sensor GS-II, GC Corporation).", "zh": "Jelly-scan 測試使用一台測試儀器（Gluco Sensor GS-II，GC Corporation）。", "g": "<em>GC Corporation</em> 這個名字要記下來。它是日本的牙科材料大廠，而後面的利益衝突問題，整個扣在這五個字上。<br><br>查文獻的實用習慣：讀到儀器或材料的品牌名稱時，順手查一下製造商是誰，再回頭對照經費來源。利益衝突常常不在作者名單裡，而藏在方法段的括號中。"}, {"en": "Masticatory performance is evaluated by measuring the glucose concentration obtained from a chewed gummy jelly specimen (Glucolumn GS-II, GC Co., Ltd.).", "zh": "咀嚼表現的評估方式，是測量咀嚼後軟糖試片（Glucolumn GS-II，GC 股份有限公司）所溶出的葡萄糖濃度。", "g": "儀器與耗材都出自同一家公司。也就是說，這套參考標準從頭到尾是 GC 的產品線。"}, {"en": "The participant is asked to chew 2 g of gummy jelly for 20 s, the patient is then asked to sip 20 mL of water and after retrieval of the crushed jelly, the amount of elutriated glucose is quantified using a glucor-sensor testing machine.", "zh": "請受試者咀嚼 2 公克軟糖 20 秒，接著啜飲 20 毫升的水，取回咬碎的軟糖後，以葡萄糖感測儀定量溶出的葡萄糖量。", "g": "<em>elutriated</em>（淘洗溶出的）是冷僻的專業動詞，看不懂很正常。原文的 <em>glucor-sensor</em> 也是 gluco- 的拼字錯誤。<br><br>讀方法段時，動作的順序比生字重要：嚼 20 秒 → 含 20 毫升水 → 吐出 → 測糖。"}, {"en": "When the measured glucose concentration is less than 100 mg/dL, the patient is diagnosed with poor masticatory function.", "zh": "當測得的葡萄糖濃度低於 100 mg/dL 時，即診斷為咀嚼功能不良。", "g": "這個 100 就是全篇的火藥庫。一條線，把連續的數值切成「正常」與「不良」兩類。<br><br>任何把連續變項切成二分類的研究，都要能回答三個問題：切點哪裡來？在哪個族群訂的？換一個族群還適用嗎？"}, {"en": "The first alternative test uses a colour changing gum (Gum1-colour) (Xylitol chewing gum, Oral Care Co., Ltd.).", "zh": "第一種替代測試使用變色口香糖（Gum1-colour）（木糖醇口香糖，Oral Care 股份有限公司）。"}, {"en": "The specimen has a size of 35 x 18 x 3 mm.", "zh": "試片尺寸為 35 × 18 × 3 公釐。"}, {"en": "The gum contains Xylitol and citric acid.", "zh": "此口香糖含有木糖醇與檸檬酸。"}, {"en": "The patient is asked to chew the specimen 60 times.", "zh": "請病人咀嚼試片 60 次。"}, {"en": "The red, yellow and blue dyes change colour when chewed.", "zh": "紅、黃、藍三種色素會在咀嚼過程中變色。", "g": "原理是唾液與咀嚼壓力使色素釋出並混合，嚼得越充分，顏色變化越完全。跟軟糖測糖一樣，都是用看得見的東西代替看不見的咀嚼力。"}, {"en": "The colour of the chewed gum is determined immediately after chewing to minimise further time-related changes using a colour scale (scale 0 to 9).", "zh": "咀嚼後立即以比色卡（0 至 9 分）判讀顏色，以減少隨時間產生的進一步變化。", "g": "<em>immediately</em> 是方法段的重要字眼：顏色會繼續變，所以判讀時機本身就是測量條件的一部分。<br><br>自己設計實地測量時，這類「幾秒內要完成」的細節必須寫進流程，否則不同天、不同人收的資料無法合併。"}, {"en": "The second alternative masticatory function test consist in chewing a two-colour chewing gum (Hue-Check Gum, Orophys GmbH, Muri b. Bern) (Gum2-visual) to assess masticatory performance.", "zh": "第二種替代咀嚼功能測試是咀嚼雙色口香糖（Hue-Check Gum，Orophys 公司，瑞士 Muri b. Bern）（Gum2-visual）來評估咀嚼表現。"}, {"en": "One blue and one pink gum are stuck together manually by slightly wetting them with water and by applying moderate digital force.", "zh": "將一片藍色與一片粉紅色口香糖稍微沾水，以適度的手指力量徒手黏合。", "g": "<em>digital</em> 在這裡不是「數位」，是「手指的」（digit = 手指）。同一篇論文裡，Gum2-digital 的 digital 卻真的是「數位」。同字異義出現在同一頁，讀的時候要靠上下文判斷。"}, {"en": "The resulting gum-complex has a size of 8 x 20 x 12 mm.", "zh": "黏合後的口香糖複合體尺寸為 8 × 20 × 12 公釐。"}, {"en": "The patient is asked to chew the gum complex 20 times before the specimen is retrieved from the oral cavity.", "zh": "請病人咀嚼此複合體 20 次，再從口腔中取出試片。"}, {"en": "The masticatory function is evaluated by comparison with the Hue-Check Gum colour scale (scale; SA1 to SA5).", "zh": "咀嚼功能以 Hue-Check Gum 比色卡（SA1 至 SA5）對照判讀。"}, {"en": "Scores range from SA1 for a little deformed specimen with clearly separated colours to SA5 for a well chewed bolus with perfect colour mixture.", "zh": "分數從 SA1（試片僅輕微變形、顏色清楚分離）到 SA5（充分咀嚼成食團、顏色完全混合）。", "g": "這是一個<em>序位量表</em>（ordinal scale）：SA1 到 SA5 有高低之分，但 SA2 到 SA3 的差距不一定等於 SA4 到 SA5。<br><br>序位資料不能直接算平均數，要用中位數與無母數統計——這篇後面用 Spearman 與 Mann–Whitney，正是這個原因。"}, {"en": "The third alternative masticatory function test (Gum2-digital) consist also in masticating 20 times the two-colour Hue-Check gum.", "zh": "第三種替代咀嚼功能測試（Gum2-digital）同樣是咀嚼雙色 Hue-Check 口香糖 20 次。"}, {"en": "However, for this test, the chewed Gum2 specimen is flattened to a 1 mm thick wafer and subsequently scanned with a flatbed scanner from both sides.", "zh": "但在此測試中，咀嚼後的 Gum2 試片會被壓成 1 公釐厚的薄片，再以平台式掃描器掃描兩面。"}, {"en": "The joint images of both sided are evaluated opto-electronically using the ViewGum software (dhal.com, Greece, Athens).", "zh": "兩面的合併影像以 ViewGum 軟體（dhal.com，希臘雅典）進行光電判讀。"}, {"en": "The software analyses the Variance of Hue (VOH) as the degree of colour-mixture.", "zh": "該軟體以色相變異數（VOH）作為顏色混合程度的指標。", "g": "<em>Variance of Hue</em>（色相變異數）：顏色混得越均勻，色相的變異越小。所以這個數值與咀嚼能力<em>反向</em>——數字越小代表嚼得越好。<br><br>這解釋了為什麼後面 Gum2-digital 與其他測試的相關係數是負號。看到負相關先別慌，先確認量尺方向。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "The sample size was calculated using the program G*Power 3.1.9.2 (Institute of Experimental Psychology, Heinrich Heine University, Dusseldorf) based on the relation between masticatory function and nutritional state.", "zh": "樣本數以 G*Power 3.1.9.2 軟體（海因里希海涅大學實驗心理學研究所，杜塞道夫）計算，依據的是咀嚼功能與營養狀態之間的關係。", "g": "同一套 G*Power 也出現在 Alamoush 2025。三篇對照著看很有價值：Alamoush 事前算了（84 人，收 90 人）；Goguta 2023 完全沒算（每組 17 人）；本篇算了，但是拿<em>另一個研究問題</em>的效果量來算。<br><br>本篇真正要回答的是「不同測試工具之間吻合嗎」，樣本數卻是依「咬合力與營養不良的關係」推的。算了，但沒算對題目。"}, {"en": "Matsuo et al. compared the average bite force 156 malnourished patients (121.6 +/- 126.2 N) with 72 non-malnourished volunteers (209.9 +/- 195.0 N).", "zh": "Matsuo 等人比較了 156 位營養不良病人（121.6 ± 126.2 N）與 72 位營養狀態正常的志願者（209.9 ± 195.0 N）的平均咬合力。", "g": "停下來看數字：標準差比平均數還大（126.2 > 121.6；195.0 > 209.9 雖略小但仍接近）。咬合力不可能是負值，所以這個分布一定嚴重右偏。<br><br>嚴重偏態的資料，用「平均數 ± 標準差」呈現會誤導，也不適合直接拿來推算效果量。<br><br>對照 Park 2022：平均 10.81 kPa、標準差 62.93，是同一類問題的更極端版本。"}, {"en": "Based on these results, the sample size was calculated using the calculated effect amount d = 0.50 (medium effect size).", "zh": "依據這些結果，以效果量 d = 0.50（中等效果量）計算樣本數。"}, {"en": "The required total sample size was calculated to be 54, in agreement with Maxwell et al. and a method corresponding to the effect size of Brydges, indicating a medium effect with n = 52 + p, with p being the number of explanatory variables.", "zh": "所需總樣本數計算為 54 人，與 Maxwell 等人的建議一致，並依 Brydges 的效果量對應方法，中等效果量的公式為 n = 52 + p，其中 p 為解釋變項的數目。"}, {"en": "The latter being in this analysis three, the resulting sample size is n = 55.", "zh": "本分析中 p 為 3，因此樣本數為 55 人。"}, {"en": "To account for drop-outs due to the high age and morbidity of the participants, the sample size in this study was determined to be 60.", "zh": "考量受試者年齡高、罹病率高可能造成退出，本研究將樣本數訂為 60 人。", "g": "<em>預留流失率</em>是實地研究的必要動作。本篇預估要 55 人，收 60 人，最後分析 61 人——剛好過關。<br><br>台灣的長者研究流失率往往更高，預留的比例要抓得更寬。"}, {"en": "The normality of distribution of continuous variables was tested by one-sample Kolmogorov-Smirnov test.", "zh": "連續變項的常態性以單樣本 Kolmogorov–Smirnov 檢定檢驗。", "g": "先檢查常態，再決定用母數或無母數方法——這是統計段落的標準開場。寫自己的方法段時，這個順序照抄不會錯。"}, {"en": "Age was normally distributed.", "zh": "年齡呈常態分布。"}, {"en": "Two-tailed t-tests were used to analyse the effect of age.", "zh": "以雙尾 t 檢定分析年齡的影響。"}, {"en": "The Mann-Whitney test was used to compare means of variables not normally distributed.", "zh": "非常態分布的變項以 Mann–Whitney 檢定比較。", "g": "原文說用 Mann–Whitney「比較平均數」，其實它比較的是<em>分布位置（中位數）</em>，不是平均數。這是很常見的寫法瑕疵。"}, {"en": "Spearman's correlation test was used to correlate age with the different masticatory diagnostic test (Jelly-scan, Gum1-colour, Gum2-visual and Gum2-digital).", "zh": "以 Spearman 相關檢定分析年齡與各項咀嚼診斷測試（Jelly-scan、Gum1-colour、Gum2-visual、Gum2-digital）的相關。", "g": "<em>Spearman</em> 用於序位或非常態資料，<em>Pearson</em> 用於常態的連續資料。因為這裡有 SA1–SA5 這種序位分數，所以選 Spearman。"}, {"en": "Sensitivity describes the percentage participants correctly identified as presenting with poor masticatory function among all those who were diagnosed the condition, and Specificity the percentage of participants correctly identified as not presenting with the condition among all those who do not have it.", "zh": "敏感度是指在所有確診者中，被正確判定為咀嚼功能不良的百分比；特異度則是在所有未患病者中，被正確判定為未患病的百分比。", "g": "記法：<em>敏感度看有病的人</em>——有病的人裡，抓到幾個。<em>特異度看沒病的人</em>——沒病的人裡，放過幾個。<br><br>敏感度低 → 漏掉病人（偽陰性多）。特異度低 → 誤判健康的人（偽陽性多）。這一對概念在本篇後面會反覆用到，先弄清楚很划算。"}, {"en": "The Receiver operating characteristic (ROC) curve was drawn based on the Jelly-scan diagnosis.", "zh": "以 Jelly-scan 的診斷結果為基準繪製 ROC 曲線。"}, {"en": "The cut-off point was defined as the minimum distance from the upper left corner of the ROC curve, confirmed further by computing the Youden index.", "zh": "切點的定義為距 ROC 曲線左上角最短距離之點，並以 Youden 指數進一步確認。", "g": "ROC 曲線的左上角代表「敏感度 100%、特異度 100%」的完美測試。離左上角最近的點，就是敏感度與特異度取得最佳平衡的位置。<br><br><em>Youden 指數</em> = 敏感度 + 特異度 − 1，是另一種找同一個點的方式。兩種方法互相驗證。"}, {"en": "The AUC (Area Under the Curve) was also calculated from the ROC curve.", "zh": "並由 ROC 曲線計算曲線下面積（AUC）。", "g": "AUC 的常用判讀：0.5 等於瞎猜，0.7–0.8 可接受，0.8–0.9 良好，0.9 以上優異。本篇三個工具落在 0.835–0.872，屬於良好。"}, {"en": "The kappa-value was calculated to analyse the individual agreement between tests.", "zh": "計算 kappa 值以分析各測試之間在個別受試者層次的一致性。", "g": "<em>相關</em>與<em>一致</em>是兩件事。相關只問「一起高一起低嗎」，一致問「同一個人身上，兩個工具給出同樣的判定嗎」。<br><br>本篇同時報告 Spearman（相關）與 kappa（一致），做得很對。kappa 的常用判讀：0.41–0.60 中等，0.61–0.80 良好。"}, {"en": "SPSS Version 26 (IBM) was used for the statistical analysis, and the statistical significance level was p <= .05.", "zh": "統計分析使用 SPSS 第 26 版（IBM），統計顯著水準訂為 p ≤ .05。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Participants were recruited from the consecutively admitted patients of the Loex Hospital.", "zh": "受試者招募自 Loëx 醫院連續入院的病人。", "g": "<em>consecutively admitted</em>（連續入院）是一種取樣方式：不挑人，按入院順序依序邀請。比起研究者自行挑選，能減少選樣偏差。"}, {"en": "In total, 249 patients were screened for inclusion and exclusion criteria.", "zh": "總共篩檢了 249 位病人的納入與排除條件。"}, {"en": "Finally, 66 eligible participants were included, signed the informed consent, of whom four left the hospital before the experiments took place.", "zh": "最終納入 66 位符合資格的受試者並簽署知情同意書，其中 4 位在實驗進行前已出院。"}, {"en": "Finally, 61 completed the all masticatory tests and were included in the present analysis.", "zh": "最後有 61 位完成所有咀嚼測試並納入本分析。", "g": "數字對一下：66 減 4 等於 62，但實際分析 61 人。少掉的那一位沒有交代去向。<br><br>這就是為什麼 CONSORT 與 STROBE 這類報告規範要求畫<em>受試者流程圖</em>：每一個人從篩檢到分析的去向都要能追蹤。自己寫論文時，流程圖裡的數字一定要加得起來。"}, {"en": "They were mostly hospitalised for physical rehabilitation, fractures, weakness or were waiting for admission to a nursing home.", "zh": "他們多半因身體復健、骨折、體虛而住院，或正在等待入住護理之家。"}, {"en": "Despite several patients presenting low MMSE scores, all participants were able to follow the instructions and perform the mastication tests.", "zh": "儘管有數位病人的 MMSE 分數偏低，所有受試者仍能遵循指示完成咀嚼測試。", "g": "<em>MMSE</em>（簡易智能狀態測驗）是認知功能的常用篩檢工具，滿分 30 分。長者研究幾乎都會報告。<br><br>這一句在防守一個可能的質疑：認知功能不好的人，測驗結果還算數嗎？作者的回答是：他們都做得到。"}, {"en": "Their mean age was 82.4 +/- 6.8 years and 38 (62.3%) of the participants were female.", "zh": "平均年齡為 82.4 ± 6.8 歲，其中 38 位（62.3%）為女性。"}, {"en": "The median number of natural teeth was 19 (Interquartile range IQR: 18); 21 (34.4%) of the participants wore removable dentures.", "zh": "自然牙數的中位數為 19 顆（四分位距 IQR：18）；21 位（34.4%）受試者配戴活動假牙。", "g": "摘要寫「平均 16.5 ± 10.5 顆」，本文寫「中位數 19 顆」。兩者不衝突——平均低於中位數，正說明分布左偏：有一群幾乎沒有牙齒的人把平均拉下來。<br><br>四分位距高達 18，代表這群人的牙齒狀況差距極大。用平均數描述這種資料會掩蓋掉最重要的訊息。"}, {"en": "Jelly-scan revealed a median glucose concentration of 59 (IQR 34) mg/dL; with 59 mg/dL for men and 64 mg/dL for women (n.s.).", "zh": "Jelly-scan 測得的葡萄糖濃度中位數為 59（IQR 34）mg/dL；男性 59 mg/dL、女性 64 mg/dL（無顯著差異）。", "g": "<em>n.s.</em> = not significant（未達統計顯著）。論文表格裡常見的縮寫。"}, {"en": "With the cut-off for \"poor masticatory function\" being set as 100 mg/L or lower, according to the Jelly-scan test 51 patients (83.6%) were categorised as presenting the condition.", "zh": "以「咀嚼功能不良」的切點訂為 100 mg/L 以下計算，依 Jelly-scan 測試有 51 位病人（83.6%）被歸類為患有此症。", "g": "單位寫錯了：全篇其他地方都是 <em>mg/dL</em>，這裡寫成 <em>mg/L</em>。兩者差 10 倍。<br><br>不是為了挑錯——而是提醒：讀到數字時順手確認單位，是一個能救命的習慣。同一篇論文裡單位不一致，並不罕見。"}, {"en": "The ROC curve of Gum1-colour was drawn with reference to the Jelly-scan findings, with the AUC being 0.872 (SE = 100%, p < .05, 95% CI: 0.780, 0.963) and an optimum cut-off value of 5.", "zh": "Gum1-colour 的 ROC 曲線以 Jelly-scan 的結果為基準繪製，AUC 為 0.872（SE = 100%，p < .05，95% CI：0.780, 0.963），最佳切點為 5。", "g": "<em>SE = 100%</em> 這個寫法有問題。SE（標準誤）不會是百分比，更不會是 100%。對照後面的數字，作者要表達的應該是<em>特異度 100%</em>。<br><br>表格與內文對不上的時候，以表格為準，並在文獻回顧中註明自己引用的是哪一個。"}, {"en": "Sensitivity and specificity were calculated from the optimum cut-off value, with sensitivity = 66.7% and specificity = 100%.", "zh": "依最佳切點計算，敏感度為 66.7%、特異度為 100%。"}, {"en": "Here, the AUC was 0.864 (SE = 97.4%, p < .05, 95% CI: 0.757, 0.971) and the optimum cut-off value was 3; sensitivity was 72.5% and specificity 90%.", "zh": "Gum2-visual 的 AUC 為 0.864（SE = 97.4%，p < .05，95% CI：0.757, 0.971），最佳切點為 3；敏感度 72.5%、特異度 90%。"}, {"en": "The AUC of Gum2-digital was 0.835 (SE = 90.0, p < .05, 95% CI: 0.722, 0.948) and the optimum cut-off value was 0.43, indicating a sensitivity of 56.9% and a specificity of 100%.", "zh": "Gum2-digital 的 AUC 為 0.835（SE = 90.0，p < .05，95% CI：0.722, 0.948），最佳切點為 0.43，敏感度 56.9%、特異度 100%。", "g": "三個工具的共同型態：特異度很高（90–100%），敏感度中等（57–73%）。<br><br>白話說：它們說「有問題」的時候幾乎都對，但會漏掉三到四成真正有問題的人。用在篩檢上，這個方向其實不理想——篩檢最怕的就是漏掉。"}, {"en": "A post-hoc analysis was performed with a novel cut-off value of 65 mg/dL for the Jelly-scan test.", "zh": "另以 Jelly-scan 的新切點 65 mg/dL 進行事後分析。", "g": "<em>post-hoc</em>（事後）——看過資料之後才決定要做的分析。<br><br>事後分析本身不是罪，但一定要標示清楚，而且結論的強度要打折。本篇有誠實標示，這點值得肯定。"}, {"en": "It was selected based on a ROC curve analysis using the number of teeth smaller than 20 as the test.", "zh": "此切點是以「牙齒數少於 20 顆」為判準所做的 ROC 曲線分析選出的。", "g": "這裡換了一個參考標準：不再拿 Jelly-scan 當基準，改拿<em>牙齒數少於 20 顆</em>當基準。<br><br>20 顆是「8020 運動」的門檻，背後有大量流行病學證據支持。用一個獨立於儀器的臨床指標來校正儀器的切點，這個想法其實相當聰明。"}, {"en": "This analysis showed that the combination \"sensitivity/1-specificity\" was optimal for 65 mg/dL.", "zh": "該分析顯示「敏感度／1 − 特異度」的組合在 65 mg/dL 時最佳。"}, {"en": "With the new cut-off value, only 33 participants (54%) were diagnosed with masticatory hypofunction.", "zh": "採用新切點後，僅 33 位受試者（54%）被診斷為咀嚼功能低下。", "g": "從 83.6% 掉到 54%。同一批人、同一批資料，沒有多做任何檢查，只是把一條線往下移了 35 個單位，三成的人就「痊癒」了。<br><br>這是整篇最有教學價值的一個數字對比：切點不是技術細節，它直接決定盛行率。"}, {"en": "The AUC remained similar, the sensitivity increased for both Gum2 tests, with a slight decrease in specificity for all three tests.", "zh": "AUC 大致不變，兩項 Gum2 測試的敏感度上升，三項測試的特異度則略為下降。", "g": "敏感度與特異度通常是蹺蹺板：抓得更緊，就會多誤傷；放得更寬，就會多漏掉。看到「敏感度上升、特異度下降」不要意外，那是切點移動的必然結果。"}, {"en": "All Kappa values increased to an absolute K > 0.5.", "zh": "所有 kappa 值均上升至絕對值大於 0.5。"}, {"en": "There were no statistically significant differences between men and women in all four tests for masticatory function.", "zh": "四項咀嚼功能測試在男女之間均無統計顯著差異。"}, {"en": "Age was significantly correlated to all four masticatory tests (p < .05), indicating a decrease in masticatory function as age increases; Jelly-scan was the least correlated with age (rho = 0.29), while Gum-visual was the most correlated (rho = 0.47).", "zh": "年齡與四項咀嚼測試均呈顯著相關（p < .05），顯示咀嚼功能隨年齡增長而下降；Jelly-scan 與年齡的相關最低（rho = 0.29），Gum2-visual 最高（rho = 0.47）。"}, {"en": "Correlations of Gum1-colour (rho = 0.611), Gum2-visual (rho = 0.625), and Gum2-digital (rho = -0.534) with Jelly-Scan were all significantly correlated at the 1% level.", "zh": "Gum1-colour（rho = 0.611）、Gum2-visual（rho = 0.625）與 Gum2-digital（rho = −0.534）與 Jelly-scan 的相關，均在 1% 水準達顯著。", "g": "Gum2-digital 是負號，但這不代表它反向。它測的是色相<em>變異數</em>——嚼得越好，數字越小。量尺方向相反，相關係數自然是負的。<br><br>看到不合預期的正負號，先回方法段確認量尺方向，再下結論。"}], "tables": [{"no": "Table 1", "zh": "四項咀嚼測試的描述統計", "title": "Descriptive scores of all four mastication tests.", "head": [["Test", "Unit", "Mean", "±SD", "Median", "IQR", "min", "max"]], "rows": [["Jelly-scan", "mg/dL", "70.8", "34.3", "59", "34", "27", "185"], ["Gum1-colour", "Colour scale: 0–9", "3.8", "1.9", "4", "3", "1", "8"], ["Gum2-visual", "Hue-Check Gum colour scale©: 1–5", "2.2", "1.0", "2", "2", "1", "5"], ["Gum2-digital", "Variance of Hue (0–1000)", "0.43", "0.25", "0.41", "0.52", "0.03", "0.81"]], "note": "先看 Jelly-scan 那一列：平均 70.8、中位數 59，最小 27、最大 185。平均數明顯高於中位數，代表分布右偏——少數幾位嚼得很好的受試者把平均拉高了。<br><br>而切點是 100。這一列的最大值才 185，中位數只有 59——也就是說，這條線畫在絕大多數人的上方。盛行率 83.6% 從這裡就看得出來了。"}, {"no": "Table 2", "zh": "以 Jelly-scan 為黃金標準、兩種切點的 ROC 分析", "title": "ROC curve analysis using Jelly-scan as gold standard with two different cut-off points.", "head": [["Cut-off value for Jelly-scan", "ROC Curve AUC", "Cut-off value", "Sensitivity %", "Specificity %", "Kappa"]], "rows": [["**Gum1-colour"], ["100 mg/dL", "0.872", "5", "67", "100", "0.40"], ["65 mg/dL", "0.853", "4", "67", "89", "0.55"], ["**Gum2-visual"], ["100 mg/dL", "0.864", "3", "73", "90", "0.41"], ["65 mg/dL", "0.854", "3", "88", "68", "0.57"], ["**Gum2-digital"], ["100 mg/dL", "0.835", "0.43", "57", "100", "0.30"], ["65 mg/dL", "0.794", "0.43", "73", "82", "0.54"]], "note": "這張表是全篇的核心。每一組工具都有兩列：上列是舊切點 100，下列是新切點 65。<br><br>看 Gum2-visual：敏感度從 73% 升到 88%，特異度卻從 90% 掉到 68%。這就是蹺蹺板——抓得更緊，就會多誤傷。<br><br>再看最右邊的 Kappa：三組都從 0.30–0.41（勉強）升到 0.54–0.57（中等）。作者建議換切點的主要依據就在這一欄。"}, {"no": "Table 3", "zh": "四項咀嚼測試間的 Spearman 相關係數", "title": "Spearman Rho correlation coefficients between the four masticatory tests.", "head": [["", "Jelly-scan", "Gum1-colour", "Gum2-visual"]], "rows": [["Gum1-colour", ".611", "", ""], ["Gum2-visual", ".625", ".855", ""], ["Gum2-digital", "−.534", "−.817", "−.810"]], "note": "Note: All Correlations significant at the 0.01 level (2-tailed).<br><br>三個負號都在 Gum2-digital 那一列，因為它用的是色相變異數（數字越小越好），量尺方向跟其他三項相反。<br><br>另外注意 Gum2-visual 與 Gum2-digital 的 −.810：這兩項用的是<em>同一個試片</em>，所以相關高是理所當然。作者在研究限制裡誠實地指出了這一點。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "In this study, a total of four different tests of masticatory function were performed in patients aged 70 years and older and hospitalised for rehabilitation.", "zh": "本研究在 70 歲以上住院復健的病人身上執行了四種不同的咀嚼功能測試。", "g": "討論段的第一段幾乎都是重述研究做了什麼、得到什麼。這一段可以快速讀過，重點在後面。"}, {"en": "Two of the tests were chosen, because they were easy to perform, and did not require specific equipment; one test was selected, as it is used in a large number of studies, especially in Europe.", "zh": "其中兩項測試之所以入選，是因為容易執行且不需特殊儀器；另一項則因在許多研究中被廣泛使用，尤其在歐洲。"}, {"en": "A novel cut-off for the Jelly-scan test was applied with 65 mg/dL; here, the kappa agreement of all three alternative tests increased to over 0.5.", "zh": "對 Jelly-scan 採用了 65 mg/dL 的新切點；此時三項替代測試的 kappa 一致性均上升至 0.5 以上。"}, {"en": "The sensitivity of the Gum2 tests increased, at the same time, the sensitivity of all three tests was slightly reduced.", "zh": "Gum2 測試的敏感度上升，同時三項測試的敏感度略為下降。", "g": "這一句自相矛盾：敏感度不可能同時上升又下降。對照結果段就知道，後半句的「敏感度」應該是<em>特異度</em>。<br><br>怎麼發現的？因為結果段寫的是「敏感度上升、特異度略降」。<em>不同段落互相對照</em>，是抓出這類錯誤唯一可靠的方法——也是口試委員最常用的方法。"}, {"en": "All three alternative test methods investigated in the present experiments correlated with the Jelly-scan method, hence confirming the study hypothesis.", "zh": "本實驗檢驗的三種替代測試方法均與 Jelly-scan 相關，因此支持研究假設。"}, {"en": "However, all three alternative tests presented a moderate sensitivity, which bears the risk to under-diagnose poor masticatory function.", "zh": "然而三種替代測試的敏感度均為中等，存在低估咀嚼功能不良的風險。", "g": "<em>under-diagnose</em>（診斷不足／漏診）與 <em>over-diagnose</em>（過度診斷）是本篇反覆出現的一組概念。<br><br>敏感度中等 → 漏診。這句話作者自己講得很清楚，但下一句就講反了。"}, {"en": "With an excellent specificity, there is little false negative present, avoiding overtreatment of the condition.", "zh": "由於特異度極佳，偽陰性很少，可避免過度治療。", "g": "這一句講反了。特異度高代表<em>偽陽性</em>少，不是偽陰性少。偽陰性少要靠敏感度高。<br><br>回頭看上一句：作者才剛說敏感度中等、有漏診風險——漏診就是偽陰性。兩句話直接打架。<br><br>把定義背熟的實際價值就在這裡：能讀出專家寫錯的地方。"}, {"en": "Using the Jelly-scan method, Shiga et al. measured the masticatory performance of 20 healthy and fully dentate individuals in their 20s and reported that the average glucose concentration was 175.0 mg/dL.", "zh": "Shiga 等人以 Jelly-scan 測量 20 位二十多歲、牙列完整的健康者，平均葡萄糖濃度為 175.0 mg/dL。"}, {"en": "One year later, Unno et al. repeated the experiments in 65 healthy fully dentate subjects in their 20s, and reported a glucose concentration between 102.5 and 186.8 mg/dL.", "zh": "一年後，Unno 等人在 65 位二十多歲、牙列完整的健康者身上重複實驗，測得的葡萄糖濃度介於 102.5 至 186.8 mg/dL。", "g": "注意這兩個參考值的來源：<em>二十多歲、牙齒健全的年輕人</em>。而切點 100 mg/dL 就是從這樣的族群訂出來的。<br><br>拿年輕人的標準去量八十幾歲的人，會發生什麼事？下一句就是答案。"}, {"en": "The patients in the present study were with a minimum age of 70 years significantly older than in these reference studies; hence in this cohort, the Jelly-scan test diagnosed 83.6% of the participants with \"compromised masticatory function\".", "zh": "本研究的病人最低 70 歲，明顯高於這些參考研究的年齡；因此在此世代中，Jelly-scan 診斷出 83.6% 的受試者有「咀嚼功能受損」。", "g": "83.6% 這個數字本身就是警訊。當一項篩檢說某族群有八成以上「不正常」，通常不是那個族群壞掉了，而是<em>常模訂錯了</em>。<br><br>這個道理可以直接搬到便當研究上：任何「可接受／不可接受」的判準，如果套用在長者身上會判出壓倒性的比例，就該回頭檢討判準，而不是檢討長者。"}, {"en": "In addition, the participants in the present cohort were hospitalised for rehabilitation and often presented with multiple chronic diseases requiring medication intake.", "zh": "此外，本世代的受試者因復健住院，常合併多重慢性病並需服藥。"}, {"en": "Furthermore, their average dental state was poorer than in the reference studies which might also explain the higher prevalence of poor masticatory function.", "zh": "再者，他們的平均牙齒狀況比參考研究差，這也可能解釋咀嚼功能不良的盛行率較高。"}, {"en": "Since in all three alternative test methods, only one patient was falsely diagnosed with compromised masticatory function, over-treatment is highly unlikely with these alternative tests.", "zh": "由於三種替代測試中僅一位病人被誤判為咀嚼功能受損，使用這些替代測試幾乎不可能造成過度治療。"}, {"en": "Hence one may assume, that the threshold of the gold-standard test for having the condition may be chosen too low.", "zh": "因此可以推測，黃金標準測試用來判定患病的門檻可能訂得太低。", "g": "這句話的方向容易讓人讀糊塗。數值上，切點從 100 降到 65 是<em>調低</em>；但就「多容易被判定有病」而言，原本的 100 其實是<em>太寬鬆</em>。<br><br>作者說 threshold「too low」，指的是後者——取得診斷的門檻太低。寫作上的教訓：談到切點移動，同時寫出<em>數字往哪走</em>與<em>結果往哪走</em>，才不會被誤讀。"}, {"en": "Hence, this novel cut-off value of 65 mg/dL should be preferred, as in elders who are at risk of malnutrition, a missed positive diagnosis may be more harmful to the patient than the occasional over-diagnosis.", "zh": "因此應採用 65 mg/dL 這個新切點，因為對有營養不良風險的長者而言，漏掉一個陽性診斷，可能比偶爾過度診斷更有害。", "g": "這一句的邏輯是反的。新切點把診斷率從 83.6% 降到 54%，也就是<em>製造更多漏診</em>。<br><br>但作者給的理由是「漏診比過度診斷更有害」——這個理由恰好支持<em>保留</em>舊切點，而不是換成新切點。<br><br>整篇最值得拿來討論的地方。它說明了一件事：論文的每一個「因此」都要自己驗算一次，不能因為作者是專家就照收。"}, {"en": "However, with the sum of sensitivity and specificity being above 150% for all tests and both cut-off levels, the proposed alternative tests may be considered useful.", "zh": "不過，由於所有測試在兩種切點下的敏感度與特異度之和均超過 150%，所提出的替代測試仍可視為實用。", "g": "<em>敏感度 + 特異度 > 150%</em> 是診斷研究常用的粗略門檻（等同 Youden 指數 > 0.5）。純瞎猜的工具，兩者之和是 100%。"}, {"en": "The area under the ROC curve (AUC) indicates how many more true positives are present per false positives; the higher this area is, the more reliable the test method is.", "zh": "ROC 曲線下面積（AUC）顯示每一個偽陽性對應多少個真陽性；面積越大，測試方法越可靠。"}, {"en": "In the present study, the AUC and sensitivity values were very high in all three tests, with both levels of cut-off value used for analysis.", "zh": "本研究中，三項測試在兩種切點下的 AUC 與敏感度都很高。", "g": "敏感度只有 57% 到 73%，作者自己在前面也寫了「moderate sensitivity」，這裡卻說「very high」。<br><br>同一篇論文對同一組數字給出兩種評價，通常是討論段寫到後面，語氣不自覺地往正面滑。寫自己的論文時值得警惕。"}, {"en": "Although chewing is a rhythmic movement programmed by a central pattern generator in the brain stem, changes occur during physiological aging.", "zh": "雖然咀嚼是由腦幹中樞模式發生器所控制的節律性動作，但生理性老化仍會帶來改變。"}, {"en": "While the chewing movements as such change little with age, the chewing sequence gets longer, as more cycles are needed before swallowing.", "zh": "咀嚼動作本身隨年齡變化不大，但咀嚼序列會變長，因為吞嚥前需要更多咀嚼次數。", "g": "這一句對便當題目很有用：長者不是<em>不能</em>吃，而是<em>要嚼更久</em>。<br><br>在有時間壓力的場合（共餐、送餐、團體用餐），嚼得久本身就會影響選擇——這正是「方便性」這個干擾因素的生理基礎，而不是純粹的個人喜好。"}, {"en": "In addition, the chewing function is determined by the dental state and the cycles are modified according to the food texture.", "zh": "此外，咀嚼功能取決於牙齒狀況，而咀嚼次數會依食物質地而調整。", "g": "全篇對新題目最關鍵的一句：<em>咀嚼次數會依食物質地而調整</em>。<br><br>這是「食物質地會改變咀嚼行為」的直接文獻依據。排骨切不切，改變的正是質地與尺寸這兩個變項。引用本篇時，這一句是必抄的。"}, {"en": "Tooth loss implies a smaller total occlusal surface available for food comminution, and therefore a lower likelihood of food-stuffs being interposed between an upper and a lower tooth.", "zh": "缺牙意味著可用於食物破碎的咬合面總面積減少，食物被上下牙齒夾住的機會也因此降低。", "g": "這一句解釋了<em>為什麼整塊比較難處理</em>：咬合面積越小，要把一大塊食物精準咬住的機會越低。<br><br>換句話說，把排骨切成三小塊，等於降低了對咬合面積的需求。這為「整塊 vs 切塊」的設計提供了生理機轉的說明——不只是主觀偏好，而是有解剖學基礎的。"}, {"en": "Especially when complete removable dental prostheses (CRDP) are present, the maximum bite force may be limited, but the chewing movements may equally be altered subconsciously to avoid displacement of the CRDPs.", "zh": "尤其在配戴全口活動假牙（CRDP）時，最大咬合力可能受限，而且咀嚼動作也可能在下意識中改變，以避免假牙移位。", "g": "<em>subconsciously</em>（下意識地）再次出現。全口假牙的使用者會不自覺地改變咀嚼方式，以免假牙鬆脫。<br><br>對便當研究的意義：受訪者未必說得出「我怕假牙掉下來」，但行為已經改了。自陳式問卷問不到的東西，觀察實際選擇有機會問到。"}, {"en": "Furthermore, the chewing forces seems to decrease with age even if the number of occlusal support zones remain, as hard-to-chew food items are increasingly avoided in older age.", "zh": "此外，即使咬合支持區數目不變，咬合力似乎仍會隨年齡下降，因為難以咀嚼的食物在老年時越來越常被迴避。", "g": "<em>食物迴避</em>（food avoidance）這個概念在這裡出現，而且帶著一個重要的因果推論：迴避難嚼的食物 → 咀嚼肌少用 → 咬合力進一步下降。<br><br>這是一個惡性循環，也正是「便當裡的排骨吃不吃」這個小問題背後真正的分量。"}, {"en": "Therefore the cut-off for determining a masticatory dysfunction should be adjusted, when applying the tests to an elderly population.", "zh": "因此，將這些測試應用於高齡族群時，判定咀嚼功能障礙的切點應予調整。"}, {"en": "For the Gum1-colour test, a cut-off was determined at the Tokyo Medical and Dental University for fully dentate volunteers, with an average age of 27.3 years.", "zh": "Gum1-colour 的切點是東京醫科齒科大學以牙列完整、平均年齡 27.3 歲的志願者訂出的。", "g": "又一次：切點來自平均 27.3 歲的年輕人。<br><br>這個問題在老年研究中非常普遍——許多臨床工具的常模都建立在年輕健康者身上。做高齡研究時，引用任何切點都要先查它是在誰身上訂的。"}, {"en": "Screening masticatory function is also important at admission to a long-term-care institution, where the medical personnel need to know if the elder can chew a normal diet or mixed meals need to be served.", "zh": "在入住長期照護機構時，篩檢咀嚼功能同樣重要，因為醫療人員需要知道長者能否咀嚼一般飲食，或必須提供攪碎的餐食。", "g": "這句話把整篇論文與飲食提供直接連起來：篩檢的結果，決定了機構端出什麼樣的餐。<br><br>台灣的長照機構與送餐服務也面對同樣的決策。這是本篇少數能直接連到便當題目的段落。"}, {"en": "Schimmel et al. reported that patients with a SA1 or SA2 score on the colour mixing-visual test would need being served a mixed meal.", "zh": "Schimmel 等人報告，在顏色混合目視測試中得分 SA1 或 SA2 的病人，需要被提供攪碎的餐食。", "g": "這是把測試分數<em>轉換成餐食決策</em>的具體例子：SA1–SA2 就改軟質餐。<br><br>如果便當研究想要有實務價值，最後也應該能給出類似的對照——什麼樣的口腔狀況，對應什麼樣的餐食處理方式。"}, {"en": "In principle, chewing is a beneficial activity, as it trains the chewing muscles, lubricates the food bolus with saliva and helps digestion; even an increased attention span was associated with the chewing activity.", "zh": "原則上，咀嚼是有益的活動：它能訓練咀嚼肌、以唾液潤滑食團、幫助消化；甚至注意力持續時間的提升也與咀嚼活動有關。"}, {"en": "Elderly residents should therefore be encouraged to benefit from non-mixed meals for as long as possible.", "zh": "因此應鼓勵機構長者盡可能長時間享用未經攪碎的餐食。", "g": "這一句可以當作整個研究方向的價值立場：<em>不要太早把飯菜打成泥</em>。<br><br>對照 Taira 2023——飲食型態下降與生活品質下降相關。兩篇合起來，就是「便當裡該不該把排骨切開」這個問題背後真正的賭注：切得太早，可能反而加速功能退化；切得太晚，長者乾脆不吃。"}]}, {"h": "Limitations", "zh": "研究限制", "s": [{"en": "When interpreting the findings of the present experiments, some shortcomings have to be born in mind.", "zh": "詮釋本實驗結果時，必須留意若干缺點。", "g": "<em>born in mind</em> 應為 <em>borne in mind</em>（謹記在心）。又一個通過審查的拼字錯誤。<br><br>固定用語 <em>bear in mind</em> 的過去分詞是 borne，不是 born。"}, {"en": "First, recruiting was difficult, and only 22% of the screened patients agreed to participate.", "zh": "第一，招募困難，僅 22% 的受篩檢病人同意參與。", "g": "算一下：篩檢 249 人，納入 66 人，是 26.5%；完成分析 61 人，是 24.5%。兩個都不是 22%。<br><br>三個數字對不起來。也許作者另有計算基礎，但論文沒有交代。自己寫論文時，每一個百分比都要能從流程圖的數字算得出來。"}, {"en": "This was due to their poor health status and fatigue, a busy rehabilitation schedule or just different priorities.", "zh": "原因包括健康狀況不佳與疲倦、復健行程繁忙，或單純有其他優先考量。"}, {"en": "A higher acceptance rate would have probably provided a larger range of masticatory functional capacity.", "zh": "較高的接受率或許能涵蓋更大範圍的咀嚼功能。", "g": "這其實是在承認<em>選樣偏差</em>：願意參加的人，可能是身體狀況比較好、比較有餘裕的那一群。<br><br>任何需要受訪者配合完成任務的研究都有這個問題。願意花時間看完一整個便當、回答一輪問題的長者，本來就不是最虛弱的那些人。"}, {"en": "Another shortcoming is related to the analysis of the same specimen for the Gum2-visual and Gum2-digital tests respectively.", "zh": "另一個缺點與 Gum2-visual 和 Gum2-digital 使用同一個試片進行分析有關。"}, {"en": "Although the analysis was carried out with a different methodology, the specimens were the same, hence eliminating the intra-individual variability between two consecutive tests.", "zh": "雖然兩者的分析方法不同，但試片相同，因而消除了兩次連續測試之間的個體內變異。", "g": "同一個樣本判讀兩次，兩個結果當然會高度相關——因為它們本來就是同一次咀嚼的產物。<br><br>這會讓 Gum2-visual 與 Gum2-digital 之間的相關（rho = −0.810）看起來比實際更好。作者誠實點出來了，這一點值得肯定。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "All alternative tests for assessing masticatory function in this study correlated positively with recommended Jelly-scan and can be considered acceptable alternatives.", "zh": "本研究中所有評估咀嚼功能的替代測試，均與建議使用的 Jelly-scan 呈正相關，可視為可接受的替代方案。"}, {"en": "In its original version, Jelly-scan may tend to over-diagnose masticatory hypofunction, hence a novel cut-off with better agreement between tests is suggested.", "zh": "原始版本的 Jelly-scan 可能傾向過度診斷咀嚼功能低下，因此建議採用一致性較佳的新切點。", "g": "這就是與資助者利益相反的那一句：本研究由 GC 公司支付部分薪資，而 Jelly-scan 所用的儀器正是 GC 的產品——結論卻說它會過度診斷。<br><br>換句話說，這筆錢並沒有買到有利的結果。這是判斷利益衝突影響力時的重要線索。"}, {"en": "Tests like Gum1-colour or Gum2-visual, which do not require special equipment, may be administered even at domicile to screen for deteriorated masticatory function and foster early detection and treatment of the condition.", "zh": "像 Gum1-colour 或 Gum2-visual 這類不需特殊儀器的測試，甚至可在居家施行，用以篩檢咀嚼功能退化並促進早期發現與治療。", "g": "<em>at domicile</em>（在住所、居家）是較正式的說法，等同 at home。歐洲醫學文獻常見。"}, {"en": "If the patient or their family can administer the test with the same result as a dental professional remains to be confirmed.", "zh": "病人或其家屬施測是否能得到與牙科專業人員相同的結果，仍有待確認。", "g": "結論的最後一句留下一個未解的問題，是很好的收尾方式：既表明立場，也不誇大。<br><br>句型值得抄：<em>Whether X remains to be confirmed.</em>（X 是否成立仍有待確認。）"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding information: GC company; University of Geneva. Open access funding provided by Universite de Geneve.", "zh": "經費資訊：GC 公司；日內瓦大學。開放取用費用由日內瓦大學支付。", "g": "<em>GC company</em> 這四個字要停下來。GC 是日本的牙材大廠，而本研究用來當作參考標準的 Gluco Sensor GS-II 正是 GC Corporation 的產品。<br><br>也就是說：被評估的儀器，其製造商付了研究者的薪水。"}, {"en": "Conflict of interest statement: funding of the salary of Yoshiki Imamura and Midori Ohta for 1.5 months was received from the GC Company. There are no conflicts of interest to disclose regarding this study.", "zh": "利益衝突聲明：Yoshiki Imamura 與 Midori Ohta 一個半月的薪資由 GC 公司支付。本研究無利益衝突需要揭露。", "g": "這兩句放在一起是自相矛盾的：前半句揭露了廠商支付薪資，後半句卻說沒有利益衝突需要揭露。<br><br>多數期刊編輯會認為這<em>就是</em>利益衝突——經費來自對結果有商業利害關係的一方，正是利益衝突的標準定義。詳見評析重點。"}, {"en": "Author contributions: the conception of the study: YI, NC, MO, CG, YS and FM. Recruitment and data collection: YI, NC, MO, RSE. Statistical analysis: PhM. Data interpretation and the first draft of the manuscript: YI, NC, PhM, MS and FM. All authors contributed to and approved the final version of the manuscript.", "zh": "作者貢獻：研究構思：YI、NC、MO、CG、YS、FM。招募與資料收集：YI、NC、MO、RSE。統計分析：PhM。資料詮釋與初稿撰寫：YI、NC、PhM、MS、FM。所有作者均參與並核可最終版本。", "g": "將作者貢獻與經費聲明對照著看，會多一層資訊：受 GC 資助薪資的兩位（YI、MO），正好負責招募與資料收集，而 YI 也參與了資料詮釋與初稿撰寫。<br><br>統計分析則由未受資助的第三人（PhM）單獨執行。這是一個降低利益衝突風險的實際做法，雖然論文沒有主動說明。"}, {"en": "Acknowledgements: this study was conducted by the University of Geneva, University Clinic of Dental Medicine, Division of Gerodontology and Removable Prosthodontics. The authors thank Sandrine Allain for her help in the collection of the data, and Dr. Noboru Kitagawa of Showa University, for their cooperation in this research project.", "zh": "致謝：本研究由日內瓦大學牙醫學院老年牙醫與活動補綴學科執行。作者感謝 Sandrine Allain 協助資料收集，以及昭和大學 Noboru Kitagawa 醫師對本研究計畫的協力。", "g": "致謝段裡出現的人名，是有貢獻但不夠格列名為作者的協助者。前面方法段提到的研究護理師（S.A.）就是這裡的 Sandrine Allain。"}, {"en": "Data availability statement: the data that support the findings of this study are available from the corresponding author upon reasonable request.", "zh": "資料取得聲明：支持本研究結果的資料，可向通訊作者提出合理要求後取得。", "g": "<em>upon reasonable request</em>（提出合理要求後）是最寬鬆的一種資料共享承諾。近年越來越多期刊要求作者直接公開資料集。<br><br>寫自己的論文時，這一欄也要寫。涵蓋個人資料的研究，通常寫「因涉及受訪者隱私，資料不公開」並說明理由。"}, {"en": "Licence: this is an open access article under the terms of the Creative Commons Attribution License (CC BY), which permits use, distribution and reproduction in any medium, provided the original work is properly cited.", "zh": "授權：本文為置於創用 CC BY 授權條款下的開放取用文章，允許以任何媒體使用、散布與重製，唯須正確引用原著作。", "g": "CC BY 是最寬鬆的開放授權：只要標明出處，全文可以重製、翻譯、註解、散布，商業用途也可以。本閱讀器收錄全文逐句版，依據就是這一行。<br><br>對照其他幾篇：CC BY-NC 禁商業用途，CC BY-NC-ND 連改編與翻譯都禁。授權不同，能做的事差很多。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "Two sentences in the Discussion contradict each other.", "zh": "討論段有兩句話互相矛盾。", "g": "討論段寫：「Gum2 測試的敏感度上升，同時三項測試的<em>敏感度</em>略為下降。」同一句話裡，敏感度不可能同時上升又下降。<br><br>回頭看結果段，寫的是「敏感度上升、<em>特異度</em>略降」。所以討論段後半句的敏感度是筆誤。<br><br>抓法很單純：把摘要、結果、討論三處對同一組數字的描述並排比對。口試委員就是這樣讀論文的。"}, {"en": "The paper mixes up false positives and false negatives.", "zh": "論文把偽陽性與偽陰性搞混了。", "g": "原文：「特異度極佳，偽陰性很少，可避免過度治療。」<br><br>特異度高代表<em>偽陽性</em>少。偽陰性少要靠敏感度高。而作者上一句才剛說敏感度只有中等、有漏診風險。<br><br>兩句話直接打架。把敏感度與特異度的定義背熟，實際的好處就是能讀出這種錯。"}, {"en": "The recommendation to change the cut-off argues against itself.", "zh": "更換切點的建議，理由與結論相反。", "g": "原文：「應採用 65 mg/dL 這個新切點，因為對有營養不良風險的長者而言，<em>漏掉一個陽性診斷，可能比偶爾過度診斷更有害</em>。」<br><br>但新切點把診斷率從 83.6% 降到 54%——製造的正是更多漏診。如果漏診真的更有害，應該<em>保留</em>舊切點才對。<br><br>這是全篇最值得帶到課堂上的一段。教訓是：論文裡每一個「因此」都要自己驗算，不能因為作者是專家就照收。"}, {"en": "The participant numbers do not add up.", "zh": "受試者人數加不起來。", "g": "納入 66 人，4 人提前出院，66 − 4 = 62；但最後分析 61 人。少掉的那一位沒有交代。<br><br>另外，研究限制寫「僅 22% 同意參與」，但 66/249 是 26.5%、61/249 是 24.5%，三個數字對不上。<br><br>這就是 STROBE 規範要求畫受試者流程圖的理由：每一個人的去向都要追得到，每一個百分比都要算得出來。"}, {"en": "The sample-size calculation answers a different question.", "zh": "樣本數計算算的是另一個問題。", "g": "G*Power 的計算依據是「咬合力與營養不良的關係」（Matsuo 等人的資料），但本研究真正要回答的是「不同測試工具之間是否吻合」。<br><br>而且所引用的咬合力資料，標準差比平均數還大（121.6 ± 126.2 N），分布嚴重偏態，本來就不適合拿來推算效果量。<br><br>三篇對照著看：Alamoush 2025 事前算對了題目；Goguta 2023 完全沒算；本篇算了，但算的不是自己的題目。"}, {"en": "Unit and label errors appear in the numbers.", "zh": "數字中夾雜單位與標示錯誤。", "g": "結果段寫切點是「100 mg/L」，全篇其他地方都是「mg/dL」，兩者差十倍。<br><br>ROC 的結果寫「SE = 100%」，但標準誤不會是百分比，對照數字應該是<em>特異度 100%</em>。<br><br>養成習慣：看到數字先確認單位，內文與表格對不上時以表格為準，並在文獻回顧中註明自己引用的是哪一個。"}, {"en": "The conflict-of-interest statement contradicts the funding line.", "zh": "利益衝突聲明與經費說明互相矛盾。", "g": "聲明寫著：兩位作者一個半月的薪資由 GC 公司支付，「本研究無利益衝突需要揭露」。<br><br>但本研究拿來當<em>參考標準</em>的 Jelly-scan 測試，用的正是 GC Corporation 製造的 Gluco Sensor GS-II。被評估的儀器，其製造商付了研究者的薪水。<br><br>多數期刊編輯會認為這就是利益衝突——經費來自對結果有商業利害關係的一方，正是標準定義。"}, {"en": "But the findings run against the funder's interest.", "zh": "然而結論其實對資助者不利。", "g": "本篇的結論是：原版 Jelly-scan 傾向<em>過度診斷</em>咀嚼功能低下，建議改用新的切點。這讓資助者自家的產品顯得不夠準確。<br><br>所以這筆錢看起來並沒有買到有利的結果。這反而是作者誠實面對數據的證據。"}, {"en": "That combination makes it a good case to learn from.", "zh": "正因如此，這是很好的學習案例。", "g": "它同時示範了兩件事：<em>一個本該揭露卻沒揭露的利益衝突</em>，以及<em>一篇結論與資助者利益相反的論文</em>。<br><br>學到的不該是「有廠商出錢就不可信」這種偷懶的結論，而是：不論利益衝突聲明怎麼寫，都要自己去看經費來源。"}, {"en": "Two habits worth keeping.", "zh": "兩個值得養成的習慣。", "g": "第一，<em>經費聲明與利益衝突聲明要一起看</em>。兩者寫在論文的不同位置，可能互相矛盾。<br><br>第二，<em>去查儀器是誰做的</em>。在牙科與醫材領域，利益衝突常常不在作者名單裡，而藏在方法段的品牌名稱底下。<br><br>對照 Limpuangthip 2022：它的經費聲明多寫了一句「資助者未參與研究設計、資料收集與分析、發表決定或稿件撰寫」。本篇沒有這一句。"}, {"en": "Consider whether this paper earns a slot.", "zh": "考慮這篇值不值得占一個名額。", "g": "十篇的名額有限，而咀嚼測量那一側已經有 Chen 2025、Nedeljković 2023、Limpuangthip 2022 三篇。本篇是純方法學比較，離題目最遠。<br><br>建議：留著當背景知識，但把名額讓給食物質地那一側。"}, {"en": "The population is a third kind of older adult.", "zh": "這是第三種長者族群。", "g": "社區長者（Chen 2025、Nedeljković 2023）、長照機構住民（Taira 2023）、住院復健病人（本篇）——三者的失能程度、照護環境與飲食型態都不同。文獻回顧時應分開陳述，不要含混地都寫成「長者」。"}, {"en": "Over-diagnosis has real consequences in elderly care.", "zh": "在高齡照護中，過度診斷是有代價的。", "g": "被判定為咀嚼功能低下，可能導致被改成軟質或糊狀飲食。而 Taira 2023 已經顯示，飲食質地下降與生活品質下降相關。<br><br>換句話說：一個過度敏感的篩檢工具，可能讓原本吃得動的人被降級。這是很好的討論素材。"}, {"en": "It is CC BY, so the full text may be annotated freely.", "zh": "本篇為 CC BY 授權，全文可自由註解。", "g": "Wiley 開放取用、CC BY 授權。若日後決定收錄，全文逐句版可以合法製作並收進學生的閱讀器。"}]}], "vocab": {"over-diagnose": ["to label people as having a condition when they do not", "過度診斷：把沒問題的人判成有問題", "v", "C2"], "screening": ["testing apparently healthy people to find problems early", "篩檢：對看似健康者施測以早期發現問題", "f", "B2"], "hypofunction": ["function that has fallen below normal", "功能低下", "v", "C2"], "Conflict of interest": ["a situation where an outside interest could sway the work", "利益衝突", "f", "C1"], "conflicts of interest": ["interests that could bias the research", "利益衝突", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "disclose": ["to state openly something others should know", "揭露", "v", "C1"], "comminution": ["the breaking of food into smaller particles by chewing", "破碎：咀嚼將食物分解成較小顆粒", "v", "C2"], "food bolus": ["the chewed mass of food made ready to swallow", "食團：咀嚼後準備吞下的食物團塊", "f", "C1"], "oral hypofunction": ["a decline in three or more of the seven oral functions defined by the JSG", "口腔機能低下症：七項口腔功能中有三項以上低於切點", "f", "C1"], "dentate": ["having natural teeth", "有牙的：仍有自然牙", "v", "C2"], "occlusal": ["to do with the biting surfaces where upper and lower teeth meet", "咬合的：與上下牙接觸面有關", "v", "C1"], "bear in mind": ["to remember and take into account; the past participle is borne, not born", "謹記在心：過去分詞為 borne，不是 born", "p", "B2"], "at domicile": ["at home; a formal expression common in European medical writing", "在居家：較正式的說法，歐洲醫學文獻常見", "p", "C2"], "remains to be confirmed": ["has not yet been established; a cautious way to end a conclusion", "仍有待確認：結論的謹慎收尾句型", "p", "C1"], "statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significance": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "p < .05": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "significance level": ["the threshold, usually 0.05, below which a p-value counts as significant", "顯著水準", "f", "C1", "研究者事先訂好的門檻，通常是 0.05。p 值低於這條線就判定為顯著。0.05 是學界慣例，意思是願意接受 5% 的機率把巧合誤認為真的差異。"], "mean age": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "mean": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "median": ["the middle value when all values are put in order", "中位數", "f", "B2", "把所有人的數值由小排到大，站在正中間的那一個。它不受極端值影響，所以資料分布不對稱時（例如少數人幾乎沒牙、多數人還有很多牙），比平均數更能代表「一般人」。"], "interquartile range": ["the range covered by the middle half of the values", "四分位距", "f", "C1", "資料排好之後，去掉最低的四分之一和最高的四分之一，中間那一半有多寬。常和中位數一起報告，功能類似標準差，但不受極端值影響。"], "IQR": ["the range covered by the middle half of the values", "四分位距", "f", "C1", "資料排好之後，去掉最低的四分之一和最高的四分之一，中間那一半有多寬。常和中位數一起報告，功能類似標準差，但不受極端值影響。"], "95% CI": ["a range that probably contains the true value", "95% 信賴區間", "f", "C1", "研究只測了一部分人，算出的數字一定有誤差。信賴區間給一個範圍：真正的數值很可能落在裡面。範圍越窄，估計越精準。比較兩組的差值時，區間沒有跨過 0（比值則是沒有跨過 1），通常就代表顯著。"], "continuous variables": ["a variable that can take any number, such as age or bite force", "連續變項", "f", "C1", "可以是任何數值的資料，例如年齡、咬合力、葡萄糖濃度。通常用平均數或中位數描述。資料屬於哪一種，決定了後面該用哪一種統計方法。"], "skewed": ["how much a distribution leans to one side", "偏態", "f", "C1", "分布歪向一邊的程度。例如大部分人分數都低、只有少數人特別高，分布就向右歪。偏態明顯時，平均數會被拉走，應該改看中位數，也要改用無母數方法。"], "normality": ["whether the data follow the bell-shaped normal curve", "常態分布（檢定）", "f", "C1", "常態分布是中間多、兩邊少、左右對稱的鐘形。t 檢定、Pearson 相關這類方法都假設資料是這個形狀，所以研究者會先檢查資料是否常態，再決定用哪一類統計方法。"], "normally distributed": ["whether the data follow the bell-shaped normal curve", "常態分布（檢定）", "f", "C1", "常態分布是中間多、兩邊少、左右對稱的鐘形。t 檢定、Pearson 相關這類方法都假設資料是這個形狀，所以研究者會先檢查資料是否常態，再決定用哪一類統計方法。"], "Kolmogorov-Smirnov test": ["a test of whether data follow a normal distribution", "Kolmogorov–Smirnov 檢定", "f", "C1", "用來檢查資料是不是常態分布。結果不顯著（p > .05）代表可視為常態，可以用 t 檢定；結果顯著代表不是常態，就改用 Mann–Whitney 這類無母數方法。"], "Kolmogorov-Smirnov": ["a test of whether data follow a normal distribution", "Kolmogorov–Smirnov 檢定", "f", "C1", "用來檢查資料是不是常態分布。結果不顯著（p > .05）代表可視為常態，可以用 t 檢定；結果顯著代表不是常態，就改用 Mann–Whitney 這類無母數方法。"], "t-tests": ["a test comparing the means of two groups", "t 檢定", "f", "C1", "比較「兩組」的平均數有沒有差別，例如男性和女性、戴假牙和沒戴假牙。前提是資料大致常態分布；如果不是，就改用 Mann–Whitney U 檢定。"], "Mann-Whitney": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlated": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlations": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlate": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "Spearman's correlation": ["a correlation calculated from ranks rather than raw values", "Spearman 等級相關", "f", "C1", "計算相關的一種方法，用的是「排名」而不是原始數字。資料不是常態分布，或是 1 到 5 分這種有順序的分數時就用它，結果寫成 rho（ρ）。資料常態又是連續數字時，則用 Pearson 相關。"], "Spearman": ["a correlation calculated from ranks rather than raw values", "Spearman 等級相關", "f", "C1", "計算相關的一種方法，用的是「排名」而不是原始數字。資料不是常態分布，或是 1 到 5 分這種有順序的分數時就用它，結果寫成 rho（ρ）。資料常態又是連續數字時，則用 Pearson 相關。"], "rho": ["the Spearman correlation coefficient", "Spearman 相關係數 ρ", "f", "C1", "Spearman 相關算出的數字，介於 −1 到 +1。粗略判讀：0.1–0.3 弱、0.3–0.5 中等、0.5 以上強。負號只代表方向相反，不代表比較弱。"], "kappa-value": ["agreement between two ratings beyond what chance would give", "kap
