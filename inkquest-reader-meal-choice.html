", "B1"], "percentages": ["values expressed out of 100", "百分比", "v", "B1"], "counts": ["plain numbers of cases, written n", "個數（寫作 n）", "v", "B1"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significance": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significance level": ["the threshold, usually 0.05, below which a p-value counts as significant", "顯著水準", "f", "C1", "研究者事先訂好的門檻，通常是 0.05。p 值低於這條線就判定為顯著。0.05 是學界慣例，意思是願意接受 5% 的機率把巧合誤認為真的差異。"], "mean age": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "mean": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "median": ["the middle value when all values are put in order", "中位數", "f", "B2", "把所有人的數值由小排到大，站在正中間的那一個。它不受極端值影響，所以資料分布不對稱時（例如少數人幾乎沒牙、多數人還有很多牙），比平均數更能代表「一般人」。"], "standard error": ["how precise an estimate such as the mean is", "標準誤", "f", "C1", "描述「平均數本身」估得有多準，而不是人與人之間的差異。樣本越多，標準誤越小。很容易和標準差搞混：標準差看個人差異，標準誤看估計值的精準度。"], "continuous variables": ["a variable that can take any number, such as age or bite force", "連續變項", "f", "C1", "可以是任何數值的資料，例如年齡、咬合力、葡萄糖濃度。通常用平均數或中位數描述。資料屬於哪一種，決定了後面該用哪一種統計方法。"], "categorical variables": ["a variable that sorts people into groups, such as sex or denture use", "類別變項", "f", "C1", "把人分成幾類的資料，例如性別、有沒有戴假牙、教育程度。通常用人數和百分比描述，比較時用卡方檢定而不是 t 檢定。"], "categorical": ["a variable that sorts people into groups, such as sex or denture use", "類別變項", "f", "C1", "把人分成幾類的資料，例如性別、有沒有戴假牙、教育程度。通常用人數和百分比描述，比較時用卡方檢定而不是 t 檢定。"], "skewness": ["how much a distribution leans to one side", "偏態", "f", "C1", "分布歪向一邊的程度。例如大部分人分數都低、只有少數人特別高，分布就向右歪。偏態明顯時，平均數會被拉走，應該改看中位數，也要改用無母數方法。"], "kurtosis": ["how peaked or flat a distribution is", "峰度", "f", "C1", "分布是尖還是平。和偏態一起用來判斷資料離常態分布有多遠，決定能不能用 t 檢定這類方法。"], "t-test": ["a test comparing the means of two groups", "t 檢定", "f", "C1", "比較「兩組」的平均數有沒有差別，例如男性和女性、戴假牙和沒戴假牙。前提是資料大致常態分布；如果不是，就改用 Mann–Whitney U 檢定。"], "one-way analysis of variance": ["a test comparing the means of three or more groups", "變異數分析（ANOVA）", "f", "C1", "比較「三組以上」的平均數。為什麼不做好幾次 t 檢定就好？因為比較的次數越多，碰巧出現顯著的機會就越大。ANOVA 一次檢定所有組別，避免這個問題。"], "analysis of variance": ["a test comparing the means of three or more groups", "變異數分析（ANOVA）", "f", "C1", "比較「三組以上」的平均數。為什麼不做好幾次 t 檢定就好？因為比較的次數越多，碰巧出現顯著的機會就越大。ANOVA 一次檢定所有組別，避免這個問題。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlated": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "correlations": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "Spearman’s rank correlation": ["a correlation calculated from ranks rather than raw values", "Spearman 等級相關", "f", "C1", "計算相關的一種方法，用的是「排名」而不是原始數字。資料不是常態分布，或是 1 到 5 分這種有順序的分數時就用它，結果寫成 rho（ρ）。資料常態又是連續數字時，則用 Pearson 相關。"], "Spearman": ["a correlation calculated from ranks rather than raw values", "Spearman 等級相關", "f", "C1", "計算相關的一種方法，用的是「排名」而不是原始數字。資料不是常態分布，或是 1 到 5 分這種有順序的分數時就用它，結果寫成 rho（ρ）。資料常態又是連續數字時，則用 Pearson 相關。"], "kappa coefficient": ["agreement between two ratings beyond what chance would give", "kappa 值（一致性）", "f", "C1", "兩次判定（兩位檢查者，或兩種工具）對同一個人的分類是否一致，而且已經扣掉「碰巧一樣」的部分。常用判讀：0.41–0.60 中等、0.61–0.80 良好、0.81 以上幾乎完全一致。和相關不同：相關問「會不會一起高低」，kappa 問「判定結果是不是一樣」。"], "kappa": ["agreement between two ratings beyond what chance would give", "kappa 值（一致性）", "f", "C1", "兩次判定（兩位檢查者，或兩種工具）對同一個人的分類是否一致，而且已經扣掉「碰巧一樣」的部分。常用判讀：0.41–0.60 中等、0.61–0.80 良好、0.81 以上幾乎完全一致。和相關不同：相關問「會不會一起高低」，kappa 問「判定結果是不是一樣」。"], "intra-examiner": ["agreement of one examiner with themselves over time", "檢查者內一致性", "f", "C1", "同一位檢查者在不同時間檢查同一批人，結果是否一致，用來確認檢查者自己的判斷穩定。"], "inter-examiner": ["agreement between different examiners", "檢查者間一致性", "f", "C1", "不同檢查者檢查同一批人，結果是否一致。只有一位檢查者時，就沒有檢查者間一致性可言。"], "dependent variable": ["the outcome a study tries to explain", "依變項", "f", "C1", "研究想要解釋或預測的「結果」，例如生活品質分數。可以想成：被影響的那一方。"], "independent variables": ["the factors used to explain the outcome", "自變項", "f", "C1", "用來解釋依變項的「影響因素」，例如年齡、假牙類型、咀嚼能力。要注意：在橫斷研究裡這只是分析上的角色，不代表真的有因果關係。"], "independent predictors": ["the factors used to explain the outcome", "自變項", "f", "C1", "用來解釋依變項的「影響因素」，例如年齡、假牙類型、咀嚼能力。要注意：在橫斷研究裡這只是分析上的角色，不代表真的有因果關係。"], "multiple linear regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "multiple regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "linear regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "Hierarchical multiple regression analysis": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "hierarchical multiple regression": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "hierarchical": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "robust linear regression": ["regression that is less affected by extreme values", "穩健迴歸", "f", "C1", "一種不太受極端值影響的迴歸。研究者用它再算一次，如果結果和一般迴歸差不多，就表示結論不是被少數特殊個案帶出來的。這是確認結果穩不穩的作法。"], "Robust regression": ["regression that is less affected by extreme values", "穩健迴歸", "f", "C1", "一種不太受極端值影響的迴歸。研究者用它再算一次，如果結果和一般迴歸差不多，就表示結論不是被少數特殊個案帶出來的。這是確認結果穩不穩的作法。"], "standardized regression coefficients": ["regression coefficients put on a common scale so they can be compared", "標準化迴歸係數（β）", "f", "C1", "把單位不同的因素（歲、顆、分數）換算到同一把尺上，才能比較誰的影響比較大。β 的絕對值越大，這個因素和結果的關係越強；正負號代表方向。"], "variance explained": ["the share of the outcome's variation that the model explains", "解釋量（R²）", "f", "C1", "模型裡所有因素加起來，能解釋結果差異的多少比例。R² = 0.533 表示約 53% 的差異可以用這些因素解釋，另外 47% 來自沒測到的東西。階層迴歸常看「加入新因素後 R² 增加多少」。"], "explanatory power": ["the share of the outcome's variation that the model explains", "解釋量（R²）", "f", "C1", "模型裡所有因素加起來，能解釋結果差異的多少比例。R² = 0.533 表示約 53% 的差異可以用這些因素解釋，另外 47% 來自沒測到的東西。階層迴歸常看「加入新因素後 R² 增加多少」。"], "predictive power": ["the share of the outcome's variation that the model explains", "解釋量（R²）", "f", "C1", "模型裡所有因素加起來，能解釋結果差異的多少比例。R² = 0.533 表示約 53% 的差異可以用這些因素解釋，另外 47% 來自沒測到的東西。階層迴歸常看「加入新因素後 R² 增加多少」。"], "variance inflation factors": ["a check for whether predictors overlap too much", "變異數膨脹因子（VIF）", "f", "C1", "檢查自變項之間是不是太像（共線性）。例如「牙齒數」和「咬合對數」幾乎在講同一件事，一起放進迴歸會互相搶功勞，結果不穩。VIF 太大（常用 5 或 10 當門檻）就代表有這個問題。"], "bivariate analysis": ["an analysis of two variables at a time", "雙變項分析", "f", "C1", "一次只看兩個變項的關係，例如只看年齡和生活品質，不考慮其他因素。通常是第一輪粗篩，找出可能有關的因素，再放進多變項分析確認。"], "Bivariate": ["an analysis of two variables at a time", "雙變項分析", "f", "C1", "一次只看兩個變項的關係，例如只看年齡和生活品質，不考慮其他因素。通常是第一輪粗篩，找出可能有關的因素，再放進多變項分析確認。"], "mediated by": ["when one factor affects an outcome through a second factor", "中介效果", "f", "C1", "A 透過 B 去影響 C。例如缺牙讓咀嚼能力下降，咀嚼能力下降又讓生活品質變差，咀嚼能力就是中介變項。「部分中介」表示 A 除了透過 B，自己也還直接影響 C。"], "cross-sectional": ["a study that measures everyone once, at one point in time", "橫斷研究", "f", "C1", "在同一個時間點，對一群人量一次。像拍一張照片：看得出哪些因素一起出現，但分不出誰先誰後，所以不能證明因果。餐食選擇的研究多半也屬於這種設計。"], "longitudinal": ["a study that follows the same people over time", "縱貫研究", "f", "C1", "追蹤同一群人一段時間，重複測量。看得出先後順序（例如先缺牙、後來生活品質才下降），比橫斷研究更接近因果，但費時也費錢。"], "convenience sample": ["participants chosen because they were easy to reach", "便利取樣", "f", "C1", "找方便找到的人當受試者，例如某家診所的病人。省時省錢，但這群人未必代表所有長者，研究結果能不能推到其他族群要打折扣。"], "Likert scale": ["an answer scale such as 'strongly disagree' to 'strongly agree'", "李克特量表", "f", "B2", "常見的問卷作答方式，例如「非常不同意、不同意、普通、同意、非常同意」，分別給 1 到 5 分。它有順序，但每一級之間的距離不一定相等，所以常用中位數和無母數方法處理。"], "Cronbach’s alpha": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "Cronbach": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "reliability": ["how consistent a measurement is", "信度", "f", "C1", "測量工具「穩不穩」：同一個人再測一次，或換一個人來測，結果會不會一樣。信度差的工具，量出來的數字本身就不可靠。常見指標有 Cronbach's α、ICC、kappa。"], "validity": ["whether a tool measures what it claims to measure", "效度", "f", "C1", "測量工具「準不準」：是不是真的測到想測的東西。信度是穩，效度是準；穩不一定準，但不穩一定不準。"], "convergent validity": ["agreement with another tool that measures the same concept", "聚合效度", "f", "C1", "新工具的分數，和另一個測量同一概念的工具有沒有高度相關。有的話，就表示兩個工具真的在測同一件事。"]}}, {"id": "goguta2023", "no": "Paper 12", "part": "Abstract + full text", "short": "Goguta 2023 · Unilateral vs bilateral partial dentures over five years", "title": "Impact of unilateral removable partial dentures versus removable partial dentures with major connector on oral health-related quality of life of elder patients: a clinical study", "titleZh": "單側活動局部假牙與含大連接體活動局部假牙對長者口腔健康相關生活品質之影響：臨床研究", "titleG": "<em>Impact of A versus B on C: D</em> — A 與 B 兩種做法對 C 的影響，冒號後交代研究類型。<em>versus</em>（對比）一出現，就知道這是比較型研究。", "authors": "Goguta L, Frandes M, Candea A, Ille C, Jivanescu A", "journal": "BMC Oral Health, 2023; 23: 182", "doi": "10.1186/s12903-023-02870-x", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【暫不需要】單側對雙側假牙的存活率與滿意度。主題是假牙治療做得好不好，新題目不問這個。留作背景知識。", "done": true, "abstract": [{"h": "Objective", "zh": "研究目的", "s": [{"en": "This study aimed to establish the survival rate of unilateral removable partial dentures (u-RPD) comparative with bilateral RPD (bi-RPD) with major connector in elder patients, as well as to determine both their treatment satisfaction and oral health.", "zh": "本研究旨在確立長者使用單側活動局部假牙與含大連接體的雙側活動局部假牙的存活率，並評估兩者的治療滿意度與口腔健康。", "g": "<em>survival rate</em>（存活率）在這裡指的是假牙用多久不壞，不是病人的存活。醫材研究借用了流行病學的詞。<em>comparative with</em> 是作者的筆誤，正確寫法是 compared with。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The study sample included 17 patients treated with u-RPD and 17 patients treated with bi-RPD with a major connector.", "zh": "研究樣本包含 17 位使用單側假牙者與 17 位使用含大連接體雙側假牙者。", "g": "每組 17 人、合計 34 人，是這組文獻中樣本最小的一篇。人數少不代表沒價值，但推論要保守。"}, {"en": "The patients were followed over five years with recalls every 6 months.", "zh": "病人追蹤五年，每六個月回診一次。", "g": "<em>followed over five years</em>——五年追蹤，是這組文獻中時間最長的。橫斷式研究只看一個時間點，這篇看五年，證據等級高得多。"}, {"en": "A 5-points Likert scale was used to determine the satisfaction of the patients.", "zh": "以五點李克特量表評估病人滿意度。"}, {"en": "The Oral Health Impact Profile-14 (OHIP-14) questionnaire was used to evaluate their oral health after each type of administrated treatment.", "zh": "以 OHIP-14 問卷評估兩種治療後的口腔健康。", "g": "又是 OHIP-14。這已經是第三篇用它的論文（Tosun、Alamoush 的參考文獻、本篇），代表它是這個領域的標準工具。若本研究要測生活品質，用它最容易跟前人比較。"}, {"en": "Kaplan–Meier survival analysis was conducted to evaluate the performance of the two treatments.", "zh": "以 Kaplan–Meier 存活分析評估兩種治療的表現。", "g": "<em>Kaplan–Meier</em>（唸 KAP-lan MY-er）是處理「事件何時發生」的方法，能處理追蹤期間退出或尚未壞掉的個案。這是這組文獻裡最進階的統計，本研究不會用到，但知道它存在、知道它在回答什麼問題就夠了。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The five-year survival rates for the two dentures were 94.1% for u-RPD vs. 88.2% for bi-RPD with a major connector, without a statistically significant difference between them.", "zh": "兩種假牙的五年存活率分別為單側 94.1%、雙側 88.2%，兩者無統計顯著差異。", "g": "94.1% 對 88.2% 看起來差了六個百分點，統計上卻不顯著——因為每組只有 17 人，一個人的差別就是 5.9%。這是「樣本數太小、檢定力不足」最清楚的示範，值得停下來講。"}, {"en": "The patients receiving u-RPD presented significantly higher satisfaction scores compared to the patients receiving bi-RPD, 4.88±0.48 vs. 4.41±0.62.", "zh": "單側假牙病人的滿意度分數顯著高於雙側假牙病人（4.88±0.48 對 4.41±0.62）。", "g": "注意這裡的對比：存活率不顯著，滿意度卻顯著。同一批人、同一個研究，客觀指標與主觀指標給出不同答案。客觀指標與主觀感受可以分岔——這個現象在新題目裡同樣成立：口腔檢查的結果，與長者自己怎麼挑便當，未必一致。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "Patients receiving u-RPD presented higher levels of treatment satisfaction and better oral health than patients receiving bi-RPD.", "zh": "使用單側活動局部假牙的病人，其治療滿意度與口腔健康均優於使用雙側者。"}, {"en": "The survival rates of the treatments u-RPD and bi-RPD were similar.", "zh": "兩種治療的存活率相近。", "g": "結論把兩件事分開講：滿意度有差、存活率沒差。這種「哪些有差、哪些沒差」分開交代的寫法，比籠統說「單側比較好」誠實得多。"}]}], "fulltext": [{"h": "Background", "zh": "前言", "s": [{"en": "Due to an increasing aging population retaining more teeth at an older age, in the era of fixed partial dentures, the removable partial dentures (RPD) are still used to restore edentate patients.", "zh": "由於高齡人口增加且到老仍保有較多牙齒，即使在固定假牙的時代，活動局部假牙仍被用來修復缺牙病人。", "g": "<em>retaining more teeth at an older age</em>（到老保有較多牙齒）是全球趨勢，也是為什麼「局部缺牙」的研究越來越多。這個趨勢對這個研究題目有利：需要局部假牙的人只會更多。"}, {"en": "Psychological factors are important in patients suffering from tooth loss and/or in those awaiting prosthetic care with fixed or removable dentures.", "zh": "心理因素對於缺牙者以及等待補綴治療者相當重要。"}, {"en": "Also, it was demonstrated that denture satisfaction is the strongest predictor of oral health-related quality of life (OHRQoL).", "zh": "此外已有研究證實，假牙滿意度是口腔健康相關生活品質最強的預測因子。", "g": "這一句的出處正是 Yen 2015，本篇參考文獻第 3 筆就是它。兩篇之間有直接引用關係，寫文獻回顧時可以明確把這條線畫出來。"}, {"en": "It would be correct to state that removable dental prostheses, given suitable pretreatment and follow-up regimes, can provide satisfactory solutions.", "zh": "可以說，只要有適當的前置處理與追蹤機制，活動補綴物能提供令人滿意的解決方案。", "g": "<em>given</em> 在這裡是「只要有、在有……的前提下」，不是「給予」。這個用法在論文條件句裡很常見。"}, {"en": "It was suggested that RPDs improve mastication in extremely shortened dental arches subjects, but without achieving normal mastication levels.", "zh": "有研究指出活動局部假牙能改善嚴重短縮牙弓者的咀嚼功能，但仍無法達到正常的咀嚼水準。", "g": "<em>shortened dental arch</em>（短縮牙弓）指後牙缺失、只剩前段牙弓。<em>but without achieving...</em> 這個轉折很重要：有改善，但沒有復原。談假牙效果時這個分寸要守住。"}, {"en": "Also, it was shown that the ability of chewing and the OHRQoL status in patients with partially dentition are significantly related and influenced by denture status and nonclinical characteristics.", "zh": "另有研究顯示，部分缺牙者的咀嚼能力與生活品質顯著相關，並受假牙狀況與非臨床特徵影響。", "g": "<em>nonclinical characteristics</em>（非臨床特徵）就是年齡、教育、收入、心理這些牙醫量不到的東西。這個詞值得記，它正是「滿意度」那一側的學術說法。"}, {"en": "Conventional RPD design is frequently bilateral and consists of a major connector that bridges both sides of the arch.", "zh": "傳統活動局部假牙多為雙側設計，以大連接體橫跨牙弓兩側。"}, {"en": "However, some patients cannot and will not tolerate such an extensive appliance.", "zh": "然而部分病人無法也不願忍受這麼大的裝置。", "g": "<em>cannot and will not</em>（無法也不願）——把生理限制與意願並列。一個是能力問題，一個是接受度問題，處理方式完全不同。"}, {"en": "For these patients, fixed partial denture may not be a predictable option and it is not always possible to provide implant-retained restorations.", "zh": "對這些病人而言，固定假牙未必是可預期的選項，也不一定能施作植體支持式修復。"}, {"en": "In these cases, the patients are preferring to realize the mastication using only the remaining natural teeth, instead of wearing and using the removable denture with major connector.", "zh": "在這些情況下，病人寧可只用剩餘的真牙咀嚼，也不願配戴含大連接體的活動假牙。", "g": "這句解釋了為什麼有人「該戴卻不戴」。Taira 2023在機構住民身上觀察到同樣現象。兩篇從不同角度指向同一個臨床問題。"}, {"en": "There are many patients who are not even aware of the importance of hygiene and maintenance of the removable dentures.", "zh": "許多病人甚至不知道活動假牙的清潔與維護有多重要。", "g": "這一句對口腔衛生師的工作直接相關：衛教的缺口就在這裡。Alamoush 2025也得到同樣結論。"}, {"en": "Studies have suggested that at least two teeth on each side should be splinted when extra-coronal distal extension attachment prostheses are used.", "zh": "研究建議，使用冠外遠心延伸附著體補綴物時，每側至少應有兩顆牙進行夾板固定。", "g": "<em>splint</em>（夾板固定）是把相鄰牙齒連在一起分擔受力。<em>distal extension</em>（遠心延伸）指缺牙區後端沒有牙齒可靠，力量只能由前面的支台齒與黏膜承擔——這正是 Kennedy 第一、二類最難處理的原因。"}, {"en": "It is important to protect the periodontal health of the abutment when restored with distal-extension extra-coronal attachments.", "zh": "以冠外遠心延伸附著體修復時，保護支台齒的牙周健康相當重要。"}, {"en": "Stress on the terminal abutment can be reduced by using an extra-coronal resilient attachment that allocates more loads onto the distal edentulous ridge.", "zh": "使用具彈性的冠外附著體可將更多力量分散到遠端無牙脊，減輕末端支台齒的受力。", "g": "<em>resilient attachment</em>（彈性附著體）是本篇單側假牙設計的核心：讓假牙有一點動的餘地，力量才不會全壓在最後一顆真牙上。這是理解本篇為什麼單側假牙表現不差的關鍵。"}, {"en": "The new fabrications techniques for RPD like subtractive CAD-CAM or additive selective laser sintering and selective laser melting are offering promising results.", "zh": "新的製作技術如減法式 CAD-CAM 或加法式選擇性雷射燒結與雷射熔融，都展現了不錯的成果。", "g": "<em>subtractive</em>（減法，從一塊材料切削出來）與 <em>additive</em>（加法，即 3D 列印逐層堆疊）是數位製造的兩大路線。本篇的金屬架構就是用雷射燒結做的。"}, {"en": "The RPD retention includes the selection of the potential abutment teeth taking into the account their prognosis, their position in the arch, as well as the planned prosthesis design.", "zh": "活動假牙的固位涉及支台齒的選擇，須考量其預後、在牙弓中的位置，以及預定的假牙設計。"}, {"en": "Retainer selection mainly depends on the remaining tooth substance, the intra- and inter-maxillary relationships, esthetics, and financial aspects.", "zh": "固位裝置的選擇主要取決於剩餘齒質、顎內與顎間關係、美觀與經濟因素。", "g": "注意最後一項：<em>financial aspects</em>（經濟因素）。連技術性的設計討論都得把錢算進去，這是臨床現實，也是 Alamoush 2025 發現「低收入者較多接受全口假牙」的另一面。"}, {"en": "The benefits of dental implants as additional retainers are the increased supportive area for the RPD, the minimized load of the soft tissue, as well as the reduced extension of the base of the prosthesis to enhance the patient's comfort.", "zh": "以植體作為額外固位裝置的好處包括：增加支撐面積、減輕軟組織負擔，並縮小假牙基底範圍以提升舒適度。"}, {"en": "The aim of this clinical study was to establish the survival of unilateral RPD compared to bilateral RPD with major connector, to assess the overall satisfaction of the patients wearing these dentures as well as their OHRQoL.", "zh": "本臨床研究的目的在確立單側與雙側活動局部假牙的存活情形，並評估配戴者的整體滿意度與生活品質。"}]}, {"h": "Methods · Study design and patients", "zh": "研究方法 · 設計與病人", "s": [{"en": "The study was realized in the Department of Prosthodontics, Faculty of Dentistry, Victor Babes University of Medicine and Pharmacy, Timisoara, Romania during 2016–2021.", "zh": "本研究於 2016 至 2021 年間在羅馬尼亞提米什瓦拉 Victor Babes 醫藥大學牙醫學院贗復科進行。", "g": "2016 到 2021 橫跨五年，對應摘要說的五年追蹤。研究期間寫得這麼長，通常代表是追蹤型研究而非橫斷式。"}, {"en": "Thirty-four partial edentate patients were included in the study.", "zh": "共納入 34 位部分缺牙病人。", "g": "34 人是這組文獻中樣本最小的一篇。而且論文從頭到尾<em>沒有事前的樣本數計算</em>——沒有 G*Power、沒有效果量、沒有檢定力。這一點在後面看結果時會變得很關鍵。"}, {"en": "Each patient has signed an informed consent in accordance with an Agreement from the Ethical Committee of the University.", "zh": "每位病人皆依大學倫理委員會的規定簽署知情同意書。"}, {"en": "The study was conducted according to the Declaration of Helsinki.", "zh": "本研究依赫爾辛基宣言執行。"}, {"en": "17 patients were treated with u-RPD, and a group of patients with the same size (17) were treated with bi-RPD with a major connector (control group).", "zh": "17 位接受單側活動局部假牙治療，另 17 位接受含大連接體的雙側假牙治療，作為對照組。", "g": "<em>control group</em>（對照組）——有對照組才能比較。前面幾篇橫斷式研究是把既有的人分組，這篇則是兩種治療的比較，設計上更接近臨床試驗。"}, {"en": "Both type of dentures had a metal frame and precision attachment: Rhein 83 OT unilateral and The F.M. hinge for the u-RPD, and external slide attachments, Vario-Soft 3 rod attachment, for the bi-RPD.", "zh": "兩種假牙皆採金屬架構與精密附著體：單側組使用 Rhein 83 OT 單側附著體與 F.M. 鉸鏈，雙側組使用外滑式附著體 Vario-Soft 3。", "g": "<em>precision attachment</em>（精密附著體）是取代金屬掛勾的固位裝置，藏在假牙內部，外觀看不到。成本較高，需要較高的技術。這也解釋了為什麼本篇的病人都是精挑細選的。"}, {"en": "The patient's inclusion criteria were: patients without neurological diseases; presenting Kennedy class I, II or extended class III edentate arches, with or without modifications, incorrect treated or not treated; abutment teeth with healthy periodontium or incipient periodontitis; the impossibility of realizing implant supported fixed partial denture; recalls every six months; direct reline every 12 months.", "zh": "納入條件為：無神經系統疾病；屬 Kennedy 第一、二類或延伸的第三類缺牙牙弓，不論有無修正、曾否接受不當治療；支台齒牙周健康或僅初期牙周炎；無法施作植體支持式固定假牙；每六個月回診；每十二個月直接重襯。", "g": "<em>abutment teeth</em>（支台齒）是支撐假牙的真牙，其健康狀況直接決定假牙能撐多久。納入條件特別要求支台齒牙周健康，就是為了排除這個干擾。"}, {"en": "The exclusion criteria were: missing the recalls; missing the reline appointments; patients who do not wear their removable dentures.", "zh": "排除條件為：未依約回診、未依約重襯，以及未實際配戴假牙者。", "g": "第三項排除很關鍵：<em>不戴的人被排除了</em>。留下來的都是願意戴、也戴得住的人，結果自然偏好。這是選樣偏差，而作者沒有在限制段提到。"}, {"en": "Following these criteria, the patients were randomly selected.", "zh": "依上述條件後，病人以隨機方式選取。", "g": "這句話有點問題：前面已經用了一長串納入與排除條件，剩下的人再「隨機選取」，跟一般所說的隨機分派（randomized）不是同一件事。本篇不是隨機對照試驗，別被這個字誤導。"}, {"en": "The examined aspects were maintenance of the occlusal contacts and the masticatory function; maintenance of the periodontal health of the abutment teeth; fractures of the removable dentures polymeric structure; fractures of the connectors; chipping of the aesthetic material of the fixed partial dentures; and comfort of the patients.", "zh": "檢查項目包括：咬合接觸與咀嚼功能的維持、支台齒牙周健康的維持、假牙高分子結構的斷裂、連接體斷裂、固定假牙美觀材料的崩落，以及病人的舒適度。", "g": "六個項目裡有五個是客觀的機械或生物指標，只有最後一個是主觀的舒適度。這個比例本身就反映了傳統贗復研究的重心。"}, {"en": "The type of the opposite dentition — natural teeth, fixed partial denture, removable or complete denture — was also recorded.", "zh": "對顎的齒列型態（天然牙、固定假牙、活動或全口假牙）亦一併記錄。", "g": "<em>opposite dentition</em>（對顎齒列）會影響咬合受力。Tosun 2024把「對顎可能是固定補綴物」列為限制，本篇則直接記錄下來——處理方式更完整。"}, {"en": "Periodontal assessment was realized by clinical examination and intraoral radiographic examination.", "zh": "牙周評估以臨床檢查與口內 X 光檢查進行。"}, {"en": "Maintenance of the occlusal contacts were checked by using 40 micron articulation paper. Masticatory efficiency was assessed by the administration of a questionnaire including yes/no questions.", "zh": "咬合接觸以 40 微米咬合紙檢查；咀嚼效率則以是非題問卷評估。", "g": "值得注意的落差：咬合用 40 微米的咬合紙精密測量，咀嚼效率卻只用是非題問卷。同一篇論文裡，客觀指標測得很細，主觀指標測得很粗——這正是這個領域長期的偏重。"}, {"en": "All the check-ups were realized by two experienced clinicians.", "zh": "所有回診檢查均由兩位資深臨床醫師執行。", "g": "兩位檢查者，但論文沒有報告檢查者間的一致性（kappa）。Yen 2015 就做了這件事並報告 kappa = 0.90。這是本篇方法上的一個缺口。"}, {"en": "The initial periodontal therapy, scaling, professional cleaning and rinsing with chlorhexidine and peroxide mouthwash was realized in all the cases.", "zh": "所有個案均接受初期牙周治療、洗牙、專業清潔，並以氯己定與過氧化物漱口水沖洗。"}]}, {"h": "Methods · Clinical procedure", "zh": "研究方法 · 臨床流程", "s": [{"en": "The patients receiving u-RPDs were treated following the next steps: preparation of the abutments for the fixed partial denture with external precision attachment.", "zh": "單側假牙病人的治療步驟如下：先為固定假牙的支台齒進行牙體預備，並設置外置精密附著體。"}, {"en": "In patients who received a u-RPD and had before a hybrid treatment with bi-RPDs, the old fixed partial dentures were removed.", "zh": "若病人先前曾接受雙側假牙的混合治療，則移除舊有的固定假牙。"}, {"en": "In the new cases, the abutment teeth were prepared for the fixed partial dentures very conservative, by using diamond burs and a vertical prepared finishing line.", "zh": "新個案的支台齒以鑽石車針保守地進行預備，並採垂直式完成線。", "g": "<em>conservative</em> 在牙科是「保守的」，指盡量少磨掉真牙。這是現代牙科的重要原則：能留的齒質就留。"}, {"en": "After 10 days with provisional fixed partial dentures, the prepared abutment teeth were impressed by using a vinylpolysiloxane impression material in one step technique.", "zh": "戴臨時假牙十天後，以聚乙烯矽氧烷印模材採一次性技術取模。"}, {"en": "The impression of the antagonists was taken with the same material in one step and the occlusion was recorded by using a bite impression material.", "zh": "對顎同樣以該材料一次取模，並以咬合記錄材記錄咬合關係。"}, {"en": "Then, the try-in of the selective laser sintered metal framework was performed.", "zh": "接著進行選擇性雷射燒結金屬架構的試戴。"}, {"en": "The final fixed partial denture with the external precision attachment was received from the laboratory and a final impression for the RPD was taken by using polyether material in an individual tray fabricated over the fixed partial denture.", "zh": "自技工所取得含外置精密附著體的最終固定假牙後，以個別托盤搭配聚醚材料為活動假牙取最終印模。"}, {"en": "The occlusion registration was realized with occlusal rims. Maximum two artificial teeth were selected when the fixed partial denture was fixed on two mesial abutments.", "zh": "咬合記錄以咬合堤完成。當固定假牙固定於兩顆近心支台齒時，最多選用兩顆人工牙。"}, {"en": "In the final, the fixed partial denture was cemented together with the u-RPD by using a glass ionomer cement.", "zh": "最後以玻璃離子水泥將固定假牙與單側活動假牙一併黏著固定。"}, {"en": "The treatment of the patients with bi-RPD with a major connector followed the same clinical steps as in the u-RPD treatments. The same materials and instruments were used during the treatment.", "zh": "雙側假牙組的治療流程與單側組相同，使用的材料與器械亦相同。", "g": "這句在交代<em>兩組的治療條件一致</em>，只有假牙設計不同。比較型研究必須做到這一點，否則分不清差異來自哪裡。"}, {"en": "After the prosthetic treatment has been completed, the patients were instructed: how to insert and remove the RPD; to remove the RPD during night and keep it in a mug with water; how to clean the RPDs by using cleaning tabs and a dental brush and toothpaste; and to come for the recalls every 6 months and to call any time they had a complaint.", "zh": "補綴治療完成後，向病人說明：如何裝戴與取下假牙、夜間取下並置於水杯中、如何以清潔錠與牙刷牙膏清潔假牙，以及每六個月回診、有不適隨時聯絡。", "g": "這一整段就是<em>衛教內容</em>，是口腔衛生師的核心工作。四件事：怎麼戴、夜間怎麼放、怎麼洗、什麼時候回來。寫衛教單張時可以直接照這個結構。"}]}, {"h": "Methods · Oral health questionnaire", "zh": "研究方法 · 口腔健康問卷", "s": [{"en": "The overall satisfaction of the patients was registered on a Likert scale 1 to 5: 1-not satisfied, 2-nearly satisfied, 3 satisfied, 4-very satisfied, 5-exceptional.", "zh": "病人的整體滿意度以一至五分李克特量表記錄：1 不滿意、2 接近滿意、3 滿意、4 非常滿意、5 極佳。", "g": "只用一題問整體滿意度，跟 Tosun 2024 用 VAS、Techapiroontong 2025 用深度訪談形成三種不同的做法。測同一個構念可以有很多層次，成本與資訊量成正比。"}, {"en": "The short form of the OHIP-14 questionnaire was used to evaluate the oral health of the patients after each type of administrated treatment.", "zh": "以 OHIP-14 簡版問卷評估兩種治療後的口腔健康。"}, {"en": "The questionnaire is organized into seven dimensions with two questions each: functional limitation, physical pain, psychological discomfort, physical disability, psychological disability, social disability, handicap, and addresses various aspects of oral health.", "zh": "問卷分為七個面向，每面向兩題：功能限制、生理疼痛、心理不適、生理障礙、心理障礙、社交障礙與失能，涵蓋口腔健康的各個層面。"}, {"en": "Each removable denture wearer responded to the 14 questions of the questionnaire. Each question had assigned a 5-point Likert scale based answer.", "zh": "每位活動假牙配戴者回答十四題，每題以五點李克特量表作答。"}, {"en": "The total score was calculated by summing up all the points of the answered questions, and its range was from 0 to 56. A higher score indicated a worse impact on oral health.", "zh": "總分為各題加總，範圍 0 至 56 分。分數越高代表口腔健康受到的負面影響越大。", "g": "再次確認方向：OHIP 分數高等於差。本篇跟 Tosun 2024 用同一個工具、同一個方向，兩篇的數字可以直接互相比較——本篇單側組總分 15、雙側組 23，Tosun 2024 全體平均 16.4。"}]}, {"h": "Methods · Statistical analysis", "zh": "研究方法 · 統計分析", "s": [{"en": "The statistical analysis was performed using SPSS version 25.0 and R project packages for statistical computing.", "zh": "統計分析以 SPSS 25.0 版與 R 套件執行。"}, {"en": "Descriptive statistics were presented as mean ± standard deviation for continuous variables or counts with percentage for the categorical ones.", "zh": "描述性統計中，連續變項以平均值±標準差表示，類別變項以個數與百分比表示。", "g": "這個句型跟 Tosun 2024 幾乎一字不差。統計方法段的寫法高度定型化，這對寫論文的人其實是好消息：可以放心套用標準句型。"}, {"en": "Kaplan–Meier survival analysis was conducted using two criteria of failure as endpoints, i.e., when either a repair was needed or a complete failure occurred, discriminated according to RPD type.", "zh": "以 Kaplan–Meier 存活分析進行，並以兩種失敗判準作為終點：需要修理，或完全損壞，並依假牙類型區分。", "g": "<em>endpoint</em>（終點、事件點）是存活分析必須先定義清楚的東西：什麼算「失敗」？本篇定得很寬（需要修理就算），所以存活率會比只算「完全損壞」低一些。定義不同，數字就不能直接比。"}, {"en": "In addition, restorations not meeting the failure criterion during the five-year follow-up period were labeled as censored.", "zh": "此外，五年追蹤期間未達失敗判準的修復體標記為設限。", "g": "<em>censored</em>（設限）是存活分析的核心概念：追蹤結束時還沒壞的個案，我們只知道它至少撐了五年，不知道還能撐多久。存活分析的價值就在於它能把這種「不完整的資訊」也算進去，而不是丟掉。"}, {"en": "A p-value of 0.05 was the threshold for the statistical significance.", "zh": "統計顯著性的門檻設為 p 值 0.05。", "g": "請留意方法段從頭到尾只交代了顯著水準，<em>完全沒有提到檢定力或樣本數計算</em>。對照 Alamoush 2025：那篇用 G*Power 做了事前檢定力分析（檢定力 0.8、效果量 0.2），算出需要 84 人，實收 90 人。本篇每組 17 人，卻沒有任何依據。這個差別在下一段看結果時就會顯現。"}]}, {"h": "Results", "zh": "結果", "s": [{"en": "The patients with u-RPD presented a mean age of 53.59 years, 95% CI (47.72; 59.46), while the mean age of patients with bi-RPD was 57.94 years, 95% CI (50.76; 65.12).", "zh": "單側假牙組平均年齡 53.59 歲（95% 信賴區間 47.72–59.46），雙側組 57.94 歲（50.76–65.12）。", "g": "又是一篇「不是高齡族群」的研究。這組文獻裡只有 Yen 2015與 Taira 2023是真正的長者樣本，這點在文獻回顧時要交代清楚。"}, {"en": "We observed no significant differences between the general characteristics of the two groups of patients, i.e., both groups included 35.3% of men and 64.7% of women, both groups had the treatment on mandibula in proportion of 76.5% and maxilla in proportion of 23.3%.", "zh": "兩組的一般特徵無顯著差異：男女比例均為 35.3% 與 64.7%，下顎治療比例均為 76.5%、上顎 23.3%。", "g": "兩組基本特徵一致，是比較研究的重要前提。對照 Alamoush 2025 兩組差很多，本篇在這一點上乾淨得多——<em>但下一句就會翻盤</em>。"}, {"en": "The group of patients receiving u-RPD presented Kennedy class I in proportion of 11.8%, while the patients receiving bi-RPD presented the same class in a significantly higher proportion 64.7%.", "zh": "單側假牙組屬 Kennedy 第一類者占 11.8%，雙側組則顯著較高，達 64.7%。", "g": "這是本篇最大的問題。第一類是兩側後端游離缺牙，本來就最難處理、預後最差。所以「雙側組結果較差」可能不是假牙設計的問題，而是這群人缺牙本來就比較嚴重。<br><br>上一句說兩組沒有顯著差異，這一句立刻出現一個 p=0.001 的顯著差異，而且是最關鍵的那個變項。"}, {"en": "On the contrary, the group of patients receiving u-RPD presented Kennedy class II in proportion of 76.5%, while the patients receiving bi-RPD presented the same class in a significantly lower proportion 29.4%.", "zh": "相對地，單側組屬第二類者占 76.5%，雙側組則顯著較低，僅 29.4%。"}, {"en": "When comparing the oral health of patients with u-RPD vs. patients with bi-RPD, we observed that patients with u-RPDs presented significantly better oral health in all OHIP-14 domains.", "zh": "比較兩組的口腔健康後發現，單側假牙組在 OHIP-14 的所有面向都顯著較佳。", "g": "七個面向<em>全部</em>都顯著較佳，總分 15 對 23。差距這麼一致、這麼大，反而要多想一層：是假牙設計的功勞，還是兩組的缺牙嚴重度本來就不同？"}, {"en": "The mean survival time in years was 4.882 for the u-RPD and 4.882 for the bi-RPD.", "zh": "兩種假牙的平均存活時間均為 4.882 年。"}, {"en": "The five-year survival rates for the two dentures were 94.1% for u-RPD vs. 88.2% for bi-RPD with a major connector, without a statistically significant difference between them (Log-rank test, p=0.584).", "zh": "兩種假牙的五年存活率為單側 94.1%、雙側 88.2%，兩者無統計顯著差異（Log-rank 檢定，p=0.584）。", "g": "94.1% 對 88.2% 看起來差了六個百分點，統計上卻不顯著——因為每組只有 17 人，<em>一個人的差別就是 5.9%</em>。94.1% 是 16/17，88.2% 是 15/17，實際上只差一個人。<br><br>這就是沒有做樣本數計算的代價：研究做完了，卻無法判斷「沒差異」是真的沒差，還是人數不夠測不出來。Alamoush 2025 事前算過需要 84 人，本篇每組 17 人——兩篇放在一起就是最好的正反教材。"}, {"en": "The patients receiving u-RPD presented significantly higher satisfaction scores compared to the patients receiving bi-RPD, 4.88±0.48 vs. 4.41±0.62, Mann-Whitney U test, p=0.026.", "zh": "單側假牙病人的滿意度分數顯著高於雙側假牙病人（4.88±0.48 對 4.41±0.62，p=0.026）。", "g": "注意這裡的對比：存活率不顯著，滿意度卻顯著。同一批人、同一個研究，客觀指標與主觀指標給出不同答案。這正是這個研究題目要處理的核心張力——假牙「好不好」和病人「覺得好不好」是兩件事。<br><br>另外也留意：兩組平均都超過 4.4 分（滿分 5），也就是<em>兩組其實都很滿意</em>。差異顯著，但實務意義有限。統計顯著不等於臨床重要。"}]}, {"h": "Discussion", "zh": "討論", "s": [{"en": "Improvements in OHQoL following provision of RPDs were still not consistently reported.", "zh": "配戴活動局部假牙後生活品質是否改善，文獻的結果仍不一致。", "g": "<em>not consistently reported</em>（結果不一致）是研究缺口的另一種說法。當前人研究彼此矛盾時，「釐清矛盾」本身就是一個正當的研究目的。"}, {"en": "It was observed that RPD wearers still had impaired OHQoL, despite being rehabilitated.", "zh": "研究觀察到，即使接受了補綴治療，活動局部假牙配戴者的生活品質仍受損。"}, {"en": "The present research has found that patients wearing RPDs have a good OHQoL, but it depends on the type of RPDs.", "zh": "本研究發現配戴活動局部假牙者的生活品質良好，但取決於假牙的類型。"}, {"en": "Recent research found also that unilateral nonmetal clasp dentures were better than conventional removable partial dentures for the OHQoL of individuals with unilateral distal-extension tooth loss in the mandible.", "zh": "近期研究亦發現，對於下顎單側後端游離缺牙者，單側非金屬掛勾假牙的生活品質優於傳統活動局部假牙。"}, {"en": "It was observed that masticatory performance compared with shortened dental arch improved with RPD, mainly among the younger age groups, in unilateral free end saddle male subjects.", "zh": "研究觀察到，與短縮牙弓相比，活動局部假牙可改善咀嚼表現，主要見於較年輕族群中的單側游離端男性受試者。"}, {"en": "In the present study, the maximum satisfaction was obtained in patients wearing before a bi-RPD, transformed into a resilient u-RPD.", "zh": "本研究中，滿意度最高者為原本配戴雙側假牙、後改為彈性單側假牙的病人。", "g": "這一群人的滿意度最高，可能有一部分是<em>對比效應</em>：他們親身經歷過雙側假牙的不適，換成單側之後感受特別強烈。這跟 Techapiroontong 2025 談的「期待」是同一個機制——滿意度是比較出來的。"}, {"en": "There were no significant differences between the u-RPDs survival and the bi-RPDs survival. According to studies recently published, similar survival rates of 90 to 94.7% during a 10-year follow-up period were found.", "zh": "單側與雙側假牙的存活率無顯著差異。近期研究在十年追蹤期間也發現 90 至 94.7% 的相近存活率。"}, {"en": "The bi-RPDs were previously compared to u-RPDs and the conclusion was that u-RPD cannot be used as long-time prosthetic treatment.", "zh": "先前曾比較兩者，結論認為單側假牙不適合作為長期補綴治療。", "g": "作者誠實地把跟自己結論相反的前人研究放進來。討論段敢引用不利於自己的文獻，是可信度的重要指標。"}, {"en": "Other researchers conclusion states that if the situation demands, the possibility of unconventional designs such as modified spring cantilever or precision attachments should be well explored and adopted, but a highly skilled dental team and a specific patient presentation is required for them to be a reasonable and predictable prosthetic option.", "zh": "其他研究者認為，若情況需要，非傳統設計如改良式彈簧懸臂或精密附著體值得探索採用，但需要高度熟練的牙科團隊與合適的病人條件，才能成為合理且可預期的選項。", "g": "這一句其實限縮了本篇結論的適用範圍：單側假牙好，但要有好的團隊和挑對病人。換到一般診所未必複製得出來。"}, {"en": "After comprehensive consideration, it is appropriate to choose two abutment teeth for restoration. To protect the periodontal health of the abutment when restored with distal extension extra-coronal attachment dentures, it is necessary to examine periodically after restored.", "zh": "綜合考量後，選用兩顆支台齒進行修復較為適當。以遠心延伸冠外附著體修復時，為保護支台齒的牙周健康，術後須定期檢查。"}, {"en": "In the present study, in all the cases treated with RPDs at least two mesial abutments teeth were used. In two cases treated with u-RPDs, where a distal abutment was present, it was used, and the support, retention, and stabilization were improved.", "zh": "本研究所有個案至少使用兩顆近心支台齒。兩例單側假牙個案因有遠心支台齒可用，其支持、固位與穩定均獲改善。"}, {"en": "Ending the denture teeth at the mesial cusp of second molar and positioning the occlusal contacts over the ridge crest adequately stabilize the abutment tooth and denture base.", "zh": "人工牙止於第二大臼齒近心牙尖，並將咬合接觸置於牙脊頂上方，可適當穩定支台齒與假牙基底。"}, {"en": "Another problem mentioned in the literature is the unnoticed swallow of the u-RPD, but also of the removable denture with major connector.", "zh": "文獻提到的另一個問題是單側假牙（以及含大連接體的活動假牙）可能被不自覺吞下。", "g": "這跟 Taira 2023 提到的「認知障礙者誤食假牙」是同一個安全議題。兩篇都在推薦假牙的同時主動提出風險，這種平衡的寫法值得學習。"}, {"en": "Denture ingestion is more common among patients with psycho-neurologic deficit, alcohol, or drug abusers. Among healthy and younger population, denture ingestion is rare.", "zh": "假牙誤食較常見於有精神神經功能缺損者、酒精或藥物濫用者；在健康且較年輕的族群中則相當罕見。"}, {"en": "Patients with denture loosening should be recommended to visit dentist as soon as possible.", "zh": "假牙有鬆脫情形者，應建議盡早就診。"}, {"en": "One of the inclusion criteria in this study was that the patients must have good neuromotor reflexes, and they should come to check-ups every six month or every time when they noticed a dental problem.", "zh": "本研究的納入條件之一是病人須有良好的神經肌肉反射，並每六個月回診或發現問題時就診。"}, {"en": "A better communication with the seniors was kept in constant telephone contact with them or their family.", "zh": "與長者及其家屬保持持續的電話聯繫，以維持良好溝通。"}, {"en": "Any prosthodontist is aware that treating seniors with removable dentures is a real challenge. Excellent communication with the patient and his family was extremely important during and following the prosthodontic treatment.", "zh": "任何贗復醫師都知道，為長者製作活動假牙是真正的挑戰。治療期間與治療後，與病人及其家屬的良好溝通極為重要。", "g": "又一次強調溝通。從 Techapiroontong 2025 的質性訪談、Alamoush 2025 的衛教建議到本篇的五年追蹤，不同設計的研究都指向同一件事：技術之外，溝通決定成敗。"}, {"en": "Further clinical studies on many patients, comparing the u-RPD with and without a distal abutment, using the new technologies would be interesting for restoring seniors' dentition and for assuring them a better life comfort.", "zh": "未來若能以更多病人進行臨床研究，比較有無遠心支台齒的單側假牙並運用新技術，對於修復長者齒列與提升生活舒適度會很有意義。", "g": "<em>on many patients</em>（更多病人）——作者自己也知道 34 人太少。這句其實就是在承認樣本數的問題，只是沒有寫進限制段。"}, {"en": "The limitations of this study were the small number of patients included, and the comparisons between only two groups of removable denture wearers.", "zh": "本研究的限制為納入病人數過少，且僅比較兩組活動假牙配戴者。", "g": "限制段只有一句話，寫得非常簡略。而且它只提到「人數少」，沒有提到<em>兩組 Kennedy 分類不平衡</em>與<em>排除不戴假牙者</em>這兩個更嚴重的問題。相較之下 Yen 2015、Taira 2023、Techapiroontong 2025 的限制段都寫了整段——限制寫得越詳細，通常代表作者對自己研究的理解越透徹。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "Patients receiving u-RPD presented higher levels of treatment satisfaction and better oral health than patients receiving bi-RPD.", "zh": "使用單側活動局部假牙的病人，其治療滿意度與口腔健康優於使用雙側者。"}, {"en": "The survival rates of the treatments u-RPD and bi-RPD were similar.", "zh": "兩種治療的存活率相近。", "g": "結論把兩件事分開講：滿意度有差、存活率沒差。這種「哪些有差、哪些沒差」分開交代的寫法，比籠統說「單側比較好」誠實得多。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: this research did not receive any specific funding. The study was realized in the Research Centre TADERP at Victor Babes University of Medicine and Pharmacy.", "zh": "經費：本研究未獲特定經費，於 Victor Babes 醫藥大學 TADERP 研究中心完成。", "g": "值得注意：本篇使用了 Rhein 83、Bredent、New Ancorvis 等多家廠商的精密附著體產品，卻聲明無特定經費也無利益衝突。使用商業產品本身不構成利益衝突，但若產品由廠商免費提供，一般應該揭露。論文沒有交代這一點。"}, {"en": "Competing interests: the authors declare no conflict of interest.", "zh": "利益衝突：作者聲明無利益衝突。"}, {"en": "Ethical approval: the Ethics Committee of Victor Babes University of Medicine and Pharmacy, Timisoara.", "zh": "倫理審查：提米什瓦拉 Victor Babes 醫藥大學倫理委員會。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "The two groups had very different Kennedy classifications.", "zh": "兩組的 Kennedy 分類差很多。", "g": "雙側組有 64.7% 屬 Class I（兩側後端游離缺牙，最難處理），單側組只有 11.8%，差異達顯著（p=0.001）。所以「雙側組結果較差」可能根本不是假牙設計的問題，而是這群人缺牙本來就比較嚴重。<br><br>作者把這個數字放在表一，卻沒有列入限制段。這是讀這篇時最該提出的批評——<em>表格會說話，但作者不一定會講</em>。"}, {"en": "Patients who did not wear their dentures were excluded.", "zh": "不戴假牙的人被排除了。", "g": "排除條件第三項明寫「不實際配戴假牙者」。留下來的都是願意戴、也戴得住的人，結果自然偏好，這是<em>選樣偏差</em>。有意思的是，Taira 2023 的重點正是「機構裡一堆該戴而不戴的人」——本篇把那群人排除掉了，兩篇正好互補。"}, {"en": "The study never calculated how many patients it needed.", "zh": "本研究從頭到尾沒有計算需要多少病人。", "g": "方法段只交代顯著水準 p=0.05，沒有事前檢定力分析、沒有效果量、沒有樣本數估計。<br><br>對照 <em>Alamoush 2025</em>：那篇用 G*Power 做了事前分析（檢定力 0.8、效果量 0.2、雙尾 α 0.05），算出需要 84 人，實收 90 人。本篇每組 17 人，毫無依據。<br><br>代價就在存活率那一行：94.1% 對 88.2%，其實只差一個人（16/17 對 15/17），p=0.584。研究做完了，卻無法判斷「沒差異」是真的沒差，還是人數不夠測不出來——這叫<em>檢定力不足</em>，不能解讀為「兩者一樣好」。兩篇放在一起，就是「有沒有算樣本數」最清楚的正反教材。"}, {"en": "A six-point gap in survival was not significant.", "zh": "存活率差了六個百分點卻不顯著。", "g": "94.1% 對 88.2%，看起來差很多，統計上卻不顯著——因為每組只有 17 人，一個人就是 5.9%。這是「樣本數太小、檢定力不足」最清楚的示範，值得停下來講。"}, {"en": "Survival was not significant but satisfaction was.", "zh": "存活率沒差，滿意度卻有差。", "g": "同一批人、同一個研究，客觀指標與主觀指標給出不同答案。客觀指標與主觀感受可以分岔。新題目要問的是實際的選擇行為，與客觀口腔狀況之間也可能有落差。"}, {"en": "The limitations are a single sentence.", "zh": "限制只寫了一句話。", "g": "「病人數過少，且僅比較兩組」。Kennedy 分類不平衡、排除不戴假牙者這兩個更嚴重的問題，都沒有寫進去。"}]}], "vocab": {"unilateral": ["on one side only. Opposite: bilateral.", "單側的（相對於 bilateral 雙側）", "v", "C1"], "bilateral": ["on both sides", "雙側的", "v", "C1"], "major connector": ["the metal bar that joins the two sides of a partial denture across the arch", "大連接體：橫跨牙弓、連接假牙兩側的金屬結構", "f", "C2"], "censored": ["still working when follow-up ended, so the true lifespan is unknown", "設限：追蹤結束時尚未失敗，真正壽命未知", "f", "C2"], "endpoints": ["the events a study counts as failure", "終點：研究認定為失敗的事件", "f", "C2"], "recalls": ["scheduled follow-up appointments", "定期回診", "v", "C1"], "reline": ["adding material inside the denture so it fits the changed ridge again", "重襯：在假牙內面加材料以重新密合", "f", "C2"], "abutment teeth": ["the natural teeth that support a denture or bridge", "支台齒：支撐假牙或牙橋的真牙", "f", "C2"], "periodontium": ["the tissues around a tooth that hold it in place", "牙周組織", "v", "C2"], "Kennedy class": ["a four-way classification of partial tooth loss by where the gaps are. Class I is bilateral free-end, the hardest to treat.", "Kennedy 分類：依缺牙區位置分四類。第一類為兩側後端游離缺牙，最難處理", "f", "C2"], "edentate": ["having lost teeth", "缺牙的", "v", "C2"], "shortened dental arch": ["a dentition where the back teeth are gone and only the front segment remains", "短縮牙弓：後牙缺失，僅剩前段牙弓", "f", "C2"], "inclusion criteria": ["the rules for who may join a study", "納入條件", "f", "B2"], "exclusion criteria": ["the rules for who may not join", "排除條件", "f", "B2"], "occlusal contacts": ["the points where upper and lower teeth meet", "咬合接觸點", "f", "C2"], "nonclinical characteristics": ["factors a dentist cannot measure in the mouth — age, income, psychology", "非臨床特徵：年齡、收入、心理等牙醫量不到的因素", "f", "C2"], "denture ingestion": ["accidentally swallowing a denture", "誤食假牙", "p", "C1"], "Declaration of Helsinki": ["the international ethical code for research on humans", "赫爾辛基宣言：人體研究的國際倫理準則", "f", "C1"], "splinted": ["joined together so neighbouring teeth share the load", "夾板固定：把相鄰牙齒連在一起分擔受力", "v", "C2"], "distal extension": ["a gap with no tooth behind it, so the denture rests partly on gum", "遠心延伸：缺牙區後端無牙可靠，假牙部分落在牙床上", "f", "C2"], "resilient attachment": ["an attachment with some give, so force is not all borne by the last natural tooth", "彈性附著體：留有活動餘地，避免力量全壓在最後一顆真牙", "f", "C2"], "precision attachment": ["a hidden retainer replacing a visible metal clasp", "精密附著體：藏在假牙內部、取代外露金屬掛勾的固位裝置", "f", "C2"], "conservative": ["removing as little natural tooth as possible", "保守的：盡量少磨真牙", "v", "B2"], "provisional": ["temporary, used while the final restoration is made", "臨時的（過渡用）", "v", "C1"], "opposite dentition": ["the teeth in the other jaw that bite against the denture", "對顎齒列：與該假牙咬合的另一側", "p", "C2"], "occlusal rims": ["wax blocks used to record how the jaws meet", "咬合堤：記錄上下顎咬合關係的蠟塊", "f", "C2"], "chlorhexidine": ["an antiseptic mouth rinse", "氯己定：抗菌漱口水", "v", "C2"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Conflict of interest": ["a situation where an outside interest could sway the work", "利益衝突", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "informed consent": ["written agreement to take part, given after the risks are explained", "知情同意", "f", "C1"], "statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significance": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "p-value": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "mean age": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "mean": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "standard deviation": ["how spread out the values are around the mean", "標準差", "f", "C1", "描述大家的數值離平均數有多分散。標準差小，代表大家差不多；標準差大，代表個別差異很大。常寫成「平均數 ± 標準差」，例如 82.4 ± 6.8 歲。"], "95% CI": ["a range that probably contains the true value", "95% 信賴區間", "f", "C1", "研究只測了一部分人，算出的數字一定有誤差。信賴區間給一個範圍：真正的數值很可能落在裡面。範圍越窄，估計越精準。比較兩組的差值時，區間沒有跨過 0（比值則是沒有跨過 1），通常就代表顯著。"], "descriptive statistics": ["numbers that summarise the sample without testing anything", "描述性統計", "f", "B2", "只描述樣本長什麼樣子，例如平均年齡、女性比例、牙齒數的中位數，不做比較也不做推論。幾乎每篇論文的結果都從這裡開始，通常就是 Table 1。"], "continuous variables": ["a variable that can take any number, such as age or bite force", "連續變項", "f", "C1", "可以是任何數值的資料，例如年齡、咬合力、葡萄糖濃度。通常用平均數或中位數描述。資料屬於哪一種，決定了後面該用哪一種統計方法。"], "categorical": ["a variable that sorts people into groups, such as sex or denture use", "類別變項", "f", "C1", "把人分成幾類的資料，例如性別、有沒有戴假牙、教育程度。通常用人數和百分比描述，比較時用卡方檢定而不是 t 檢定。"], "Mann-Whitney U test": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "Mann-Whitney": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "control group": ["the comparison group", "對照組", "f", "B2", "用來比較的那一組。沒有對照組，就無法知道改變是來自介入本身，還是本來就會發生。兩組的條件越相似，比較越公平。"], "Likert scale": ["an answer scale such as 'strongly disagree' to 'strongly agree'", "李克特量表", "f", "B2", "常見的問卷作答方式，例如「非常不同意、不同意、普通、同意、非常同意」，分別給 1 到 5 分。它有順序，但每一級之間的距離不一定相等，所以常用中位數和無母數方法處理。"], "Kaplan–Meier": ["a method for estimating survival over time", "Kaplan–Meier 存活分析", "f", "C1", "追蹤一群人（或一批假牙）隨時間仍然「存活」的比例，畫成階梯狀往下的曲線。好處是追蹤到一半失聯的個案也能納入，不必丟掉。"], "Log-rank test": ["a test comparing two survival curves", "log-rank 檢定", "f", "C1", "比較兩條 Kaplan–Meier 存活曲線有沒有顯著差別，例如兩種假牙五年內的存活率是否不同。"], "log-rank": ["a test comparing two survival curves", "log-rank 檢定", "f", "C1", "比較兩條 Kaplan–Meier 存活曲線有沒有顯著差別，例如兩種假牙五年內的存活率是否不同。"], "survival analysis": ["the share still in use after a given time", "存活率／存活分析", "f", "C1", "在牙科研究裡，「存活」通常是指假牙或植體仍在使用、沒有失敗更換，不是指病人的生死。存活分析就是看隨著時間，還有多少比例仍在使用。"], "survival rates": ["the share still in use after a given time", "存活率／存活分析", "f", "C1", "在牙科研究裡，「存活」通常是指假牙或植體仍在使用、沒有失敗更換，不是指病人的生死。存活分析就是看隨著時間，還有多少比例仍在使用。"], "survival rate": ["the share still in use after a given time", "存活率／存活分析", "f", "C1", "在牙科研究裡，「存活」通常是指假牙或植體仍在使用、沒有失敗更換，不是指病人的生死。存活分析就是看隨著時間，還有多少比例仍在使用。"], "SPSS": ["a widely used statistics program", "SPSS 統計軟體", "f", "B2", "常用的統計分析軟體（IBM 出品），點選式介面，醫護與社會科學研究最常用。論文交代軟體與版本，是為了讓別人能重現分析。"]}, "mesh": [["Patient satisfaction", "病人滿意度", "作者關鍵字。本篇以單題五點量表測量。"], ["Removable partial dentures", "活動局部假牙", "研究對象。"], ["Oral health", "口腔健康", "以 OHIP-14 測量。"], ["Quality of life", "生活品質", "作者關鍵字。"], ["Survival analysis", "存活分析", "Kaplan–Meier 法，五年追蹤。這是本篇的方法特色。"]], "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字，建議另到 PubMed 查 MeSH 主題詞。<br><br>本篇為 CC BY 4.0，允許改作與散布，因此全文與註解均可收錄。"}, {"id": "techa2025", "no": "Paper 13", "part": "Abstract + study guide", "short": "Techapiroontong 2025 · What makes a partial denture a success (qualitative)", "title": "Determinants of removable partial denture success in patients' perspectives", "titleZh": "從病人觀點看活動局部假牙的治療成功要素", "titleG": "再練一次拆標題：<em>Determinants of A in B</em> — A（活動局部假牙的治療成功）的決定因素，在 B（病人的觀點）之下。<em>determinant</em>（決定因素）比 factor 語氣更強，指的是真正左右結果的那些因素。", "authors": "Techapiroontong S, Chuenjitwongsa S, Limpuangthip N", "journal": "Journal of Dentistry, 2025; 163: 106145", "doi": "10.1016/j.jdent.2025.106145", "lic": "© 2025 Elsevier Ltd. All rights reserved — not open access. Abstract reproduced for study; the section guide is InkQuest's own.", "why": "【暫不需要】質性研究、治療成功要素。方法學上很好看（質性研究長什麼樣），但主題已偏離。", "done": true, "abstract": [{"h": "Objective", "zh": "研究目的", "s": [{"en": "To provide insight into how successful removable partial dentures (RPDs) are determined from the patients’ perspectives, as well as associating factors that affect success with a qualitative approach.", "zh": "以質性方法深入了解病人如何判斷活動局部假牙是否成功，以及影響成功的相關因素。", "g": "<em>To provide insight into...</em>（深入了解……）是質性研究交代目的的典型說法。量性研究會用 to determine、to evaluate（確定、評估），質性研究則用 insight、explore、understand。動詞選得不一樣，是因為兩種研究要的東西不一樣。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "A qualitative study with case study methodology was conducted among 15 experienced RPD patients (mean age: 65.2 ± 8.4 years old).", "zh": "本研究以個案研究法進行質性研究，對象為十五位有活動局部假牙使用經驗者（平均年齡 65.2 ± 8.4 歲）。", "g": "平均年齡 65.2 歲，而且標準差 8.4 很大，代表年齡分布很廣。引用時要注意：這不是高齡長照族群，跟 Taira 2023 的 86.6 歲差二十歲。"}, {"en": "Demographic data were collected using questionnaires, while oral status and denture characteristics were clinically examined by the investigators.", "zh": "以問卷收集人口學資料，口腔狀況與假牙特徵則由研究者進行臨床檢查。", "g": "質性研究也可以有量性的部分。這裡用問卷和臨床檢查描述受訪者是誰，是為了讓讀者判斷這些人的話能代表誰。"}, {"en": "Face-to-face interviews were performed until data saturation was achieved.", "zh": "進行面對面訪談，直到達到資料飽和為止。", "g": "<em>data saturation</em>（資料飽和）是質性研究決定樣本數的方式：不是事先算出來的，而是訪談到沒有新東西出現就停。這就是為什麼質性研究不需要 G*Power。"}, {"en": "Demographic data were analyzed with descriptive statistics.", "zh": "人口學資料以描述性統計分析。"}, {"en": "Content and framework analyses were used to identify recurring themes relevant to determinants of RPD success from the transcribed interviews.", "zh": "以內容分析與架構分析，從訪談逐字稿中辨識與治療成功有關的反覆出現主題。", "g": "<em>content analysis</em>（內容分析）找的是「出現了哪些東西、出現多少次」；<em>framework analysis</em>（架構分析）則是拿一個既有架構去比對驗證。兩者搭配使用，前者發現，後者確認。"}, {"en": "A preliminary questionnaire was conducted to validate the framework and to determine the difference from neutral agreement score.", "zh": "另以初步問卷驗證該架構，並檢定其與中性同意分數的差異。", "g": "這一步是把質性得到的架構，拿去用量性方法初步檢驗——作法上偏向混合方法。這也是為什麼這篇後面會出現 Wilcoxon 檢定。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Four main themes related to RPD success included: (1) individual background and experience, (2) treatment expectations, (3) improvement of oral health-related quality of life (OHRQoL) and satisfaction, and (4) treatment acceptance.", "zh": "與治療成功有關的四個主要主題為：（一）個人背景與經驗、（二）治療期待、（三）口腔健康相關生活品質與滿意度的改善、（四）治療接受度。", "g": "這四個主題就是這篇的「結果」。量性研究的結果是數字與 p 值，質性研究的結果是主題——這是兩者最直觀的差別。"}, {"en": "These themes, especially acceptance, provided a more comprehensive understanding of RPD success.", "zh": "這些主題——尤其是接受度——讓我們對治療成功有更完整的理解。", "g": "四個主題裡只有接受度是新的，所以 especially 這個字是在標示這篇的貢獻。讀摘要時看到 especially、particularly、notably，通常就是作者在指他最想被記住的那一點。"}, {"en": "Treatment satisfaction was closely related to OHRQoL improvements, and acceptance emerged as how patients adapted to RPD limitations over time.", "zh": "治療滿意度與生活品質的改善密切相關，接受度則呈現為病人隨時間逐漸適應假牙限制的過程。", "g": "<em>emerged</em>（浮現）是質性研究的關鍵動詞：主題不是研究者事先設定的，而是從資料裡長出來的。這個字在質性論文裡會一直出現。"}, {"en": "Significant agreement was found on four of the proposed associations.", "zh": "所提出的關聯中有四項獲得顯著的同意。", "g": "五項關聯只有四項達顯著，沒過的是「個人背景 → 治療期待」那一條。摘要沒說是哪一條，要看內文才知道——摘要報喜不報憂是常態，這正是不能只讀摘要的原因。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "This study highlights the importance of considering patient background, realistic expectation-setting, dentist-patient communication, and adaptation support in RPD treatment.", "zh": "本研究凸顯了在活動局部假牙治療中，考量病人背景、設定合理期待、醫病溝通與適應支持的重要性。", "g": "四個要素裡有三個跟臨床技術無關，全是溝通與心理層面。這對口腔衛生師的衛教工作特別有參考價值。"}, {"en": "A revised diagram of RPDs’ determinants of success was proposed to guide clinicians in enhancing patient-centered care.", "zh": "本研究提出修訂後的治療成功決定因素圖，以引導臨床人員提升以病人為中心的照護。", "g": "論文的 Fig. 1 就是這張圖，藍框是前人提過的主題、橘框是新發現的接受度。質性研究的產出常常是一個模型或架構圖，而不是一張數據表。"}]}, {"h": "Clinical Significance", "zh": "臨床意義", "s": [{"en": "To achieve RPD treatment success, patients’ prior experiences should be identified and incorporated into RPD treatment plan, aligning with their individual expectations.", "zh": "欲達成治療成功，應辨識病人先前的經驗並納入治療計畫，使其與個別期待相符。", "g": "<em>Clinical Significance</em> 是 Journal of Dentistry 這類臨床期刊特有的欄位，要求作者直接講「這對臨床工作者有什麼用」。Yen 2015、Taira 2023 都沒有這一欄。"}, {"en": "Effective communication between patients and clinicians is crucial, involving comprehensive discussion about RPD functionality, potential limitations, and establishing realistic expectations.", "zh": "醫病之間的有效溝通至關重要，包含充分討論假牙的功能、潛在限制，並建立合理的期待。"}, {"en": "Addressing the adaptation process following treatment is essential to enhance patient satisfaction and acceptance.", "zh": "處理治療後的適應過程，對提升病人的滿意度與接受度不可或缺。"}, {"en": "Post-treatment OHRQoL assessments during maintenance periods are required to provide long-term patient support.", "zh": "維護期間應進行治療後的生活品質評估，以提供長期的病人支持。", "g": "這一句對她的研究有直接啟發：如果滿意度會隨時間變化，那單一時間點的橫斷式調查就只能拍到一張快照。這是她在討論限制時可以引用的論點。"}]}], "fulltext": [{"h": "Section guide", "zh": "分節導讀", "s": [{"en": "The Introduction moves in three steps: tooth loss is common, partial dentures are widely used, but many people stop wearing them.", "zh": "前言分三步走：缺牙很普遍、活動局部假牙使用廣泛，但很多人後來就不戴了。", "g": "論文提到的停戴率是 17.9% 到 47.0%，範圍很大。看到這種大範圍區間，通常代表各研究的定義與追蹤時間不一致——這本身就可以寫進文獻回顧的討論。"}, {"en": "Then it names the gap: we know satisfaction matters, but we do not know how the pieces fit together.", "zh": "接著點出研究缺口：我們知道滿意度重要，但不知道各個環節如何串連。", "g": "這正是 <em>few studies clearly explain how these factors impact treatment success</em> 這類句型的功能。前言的倒數第二段幾乎一定是研究缺口。"}, {"en": "The Methods section is where this paper looks least like the other two.", "zh": "方法一節是這篇跟另外兩篇差最多的地方。", "g": "沒有樣本數計算、沒有統計檢定表。取而代之的是：訪談如何進行、誰訪談、問了哪些題目、如何分析逐字稿。質性研究的嚴謹度展現在流程透明，不在數字。"}, {"en": "Look for three things there: purposive sampling, data saturation, and researcher triangulation.", "zh": "在方法段找這三樣東西：立意取樣、資料飽和、研究者三角檢證。", "g": "<em>purposive sampling</em>（立意取樣）是刻意挑選能提供豐富資訊的人，不是隨機抽樣。<em>triangulation</em>（三角檢證）是三位研究者各自編碼再比對，用來降低主觀。這三個詞是讀懂任何質性研究的鑰匙。"}, {"en": "The Results section is mostly quotations from patients, sorted into themes.", "zh": "結果一節主要由受訪者引語構成，依主題分類排列。", "g": "這對語言學習其實是好消息：病人講的是口語，比論文正文好懂得多。可以挑幾則當朗讀與聽力材料。"}, {"en": "The Discussion connects the themes to older studies and ends with advice for dentists.", "zh": "討論一節把各主題與前人研究連結，最後提出給牙醫的建議。", "g": "建議的重點是：治療前就要誠實說明假牙的限制，把期待調到合理範圍，並在適應期給予支持。這對口腔衛生師的衛教工作直接適用。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: supported by the 90th Anniversary of Chulalongkorn University, Rachadapisek Sompote Fund.", "zh": "經費：由朱拉隆功大學九十週年 Rachadapisek Sompote 基金資助。", "g": "校內基金。與 Limpuangthip 2022 同校、同一個研究團隊，經費來源也類似。"}, {"en": "Declaration of competing interest: the authors declare that they have no known competing financial interests or personal relationships that could have appeared to influence the work reported in this paper.", "zh": "利益衝突聲明：作者聲明無已知可能影響本研究的競爭性財務利益或個人關係。", "g": "Elsevier 的制式措辭，比單純一句「無利益衝突」完整：它同時涵蓋<em>財務利益</em>與<em>個人關係</em>。人際關係也可能構成利益衝突，這點常被忽略。"}, {"en": "Ethical approval: human research ethics committee of the Faculty of Dentistry, Chulalongkorn University (HREC-DCU 2024-073).", "zh": "倫理審查：朱拉隆功大學牙醫學院人體研究倫理委員會（HREC-DCU 2024-073）。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "This is qualitative research, and it answers a different question.", "zh": "這是質性研究，回答的是另一種問題。", "g": "量性研究問「多少」，用數字回答；質性研究問「為什麼、怎麼樣」，用文字回答。本篇訪談 15 人、整理出四個主題，不做推論、不算 p 值。它的價值在於解釋問卷研究只能呈現、卻無法說明的東西。"}, {"en": "Satisfaction and quality of life are not the same thing.", "zh": "滿意度與生活品質不是同一件事。", "g": "作者的區分很實用：影響到日常生活的，算生活品質；不影響日常生活、但病人仍在意的（診所收費、看診流程、印模不舒服），算滿意度。這條界線對設計問卷很有幫助。"}, {"en": "A satisfied patient does not always have a good denture.", "zh": "滿意的病人，假牙不一定好。", "g": "這與 Yen 2015 討論段的說法完全一致——滿意度不只取決於假牙的技術品質。兩篇可以互相引用，是文獻回顧裡很好的一組對照。"}, {"en": "The participants are not elderly, and the setting is Thailand.", "zh": "受訪者不是高齡族群，地點在泰國。", "g": "平均年齡 65.2 歲、標準差 8.4，且為大學附設診所的回診名單。引用時要誠實交代族群與國別，不能與 Taira 2023 的機構住民混為一談。"}]}], "mesh": [["Removable partial denture", "活動局部假牙", "作者自訂關鍵字。這篇未被 PubMed 以 MeSH 編目（Journal of Dentistry 屬 Elsevier，收錄狀態需自行確認），此處列出的是作者關鍵字。"], ["Success", "治療成功", "本篇的核心概念：從病人角度定義何謂成功。"], ["Quality of life", "生活品質", "與滿意度並列為成功的兩個替代指標（surrogate indicators）。"], ["Expectation", "期待", "本篇的關鍵中介概念：治療結果要拿來跟期待比較，才產生滿意或不滿意。"], ["Satisfaction", "滿意度", "與生活品質相關但不完全重疊。"], ["Healthcare", "醫療照護", "涵蓋醫病溝通與照護流程層面。"]], "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "這篇未取得 MeSH 主題詞，此處列出的是論文自己標示的作者關鍵字。<br><br><em>注意授權：</em>本篇為 Elsevier 版權所有，非開放取用。上方的英文句子是 InkQuest 依論文內容自行改寫的重述，不是原文；閱讀時請搭配學校下載的 PDF 原文對照。", "vocab": {"partial dentures": ["dentures replacing some teeth only", "局部假牙", "p", "B2"], "themes": ["The recurring ideas a qualitative study reports as its findings — the qualitative equivalent of a variable in a quantitative study.", "主題：質性研究反覆出現的概念，就是它的研究產出。相當於量性研究裡的「變項」——量性產出數字，質性產出主題", "f", "C1"], "data saturation": ["the point where new interviews stop producing new information, so you stop", "資料飽和：再訪談也問不出新東西，就停止收案", "f", "C2"], "expectations": ["what a person believes will or should happen", "期待、預期", "v", "B1"], "satisfaction": ["how content a person is with what they received", "滿意度", "v", "B1"], "quality of life": ["how much something affects daily living, comfort and confidence", "生活品質", "f", "B2"], "acceptance": ["coming to terms with something and its limits over time", "接受度：隨時間理解並接受其限制", "v", "B2"], "purposive sampling": ["choosing participants on purpose because they can give rich information", "立意取樣：刻意挑選能提供豐富資訊的人，非隨機", "f", "C2"], "triangulation": ["checking findings from more than one angle or coder to reduce bias", "三角檢證：多人或多角度交叉檢核以降低主觀", "f", "C2"], "quotations": ["the participants' own words, reproduced in the paper", "引語：論文中直接引用受訪者的原話", "v", "B2"], "case study methodology": ["a qualitative design that studies a phenomenon closely within its real setting", "個案研究法：在真實情境中深入研究某一現象", "f", "C2"], "recurring": ["appearing again and again across different people", "反覆出現的", "v", "B2"], "determinants": ["the factors that really decide an outcome — stronger than 'factors'", "決定因素（語氣比 factor 強）", "f", "C1"], "emerged": ["came out of the data by itself, rather than being set in advance", "浮現：從資料中自然產生，非事先設定", "v", "B2"], "patient-centered care": ["care organised around what the patient needs and values", "以病人為中心的照護", "f", "C1"], "prior experiences": ["what happened to the person before this treatment", "先前的經驗", "p", "B2"], "maintenance periods": ["the follow-up phase after treatment is finished", "維護期：治療完成後的追蹤階段", "p", "C1"], "Content and framework analyses": ["two paired qualitative methods: content analysis counts what appears; framework analysis tests the text against an existing structure", "內容分析與架構分析：前者辨識文本中出現了什麼，後者拿既有架構比對驗證。兩者搭配，前者發現、後者確認", "f", "C2"], "removable partial dentures": ["dentures replacing some but not all teeth, taken out by the wearer. Abbreviated RPDs.", "活動局部假牙（縮寫 RPDs）：只補部分缺牙，可自行取下", "f", "B2"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "mean age": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "mean": ["the average: the total divided by the number of people", "平均數", "f", "B2", "全部加起來除以人數。好算好懂，但容易被少數極端值拉走：一群人裡只要有一位特別高，平均數就會偏高。所以資料分布歪斜時，論文常改報中位數。"], "descriptive statistics": ["numbers that summarise the sample without testing anything", "描述性統計", "f", "B2", "只描述樣本長什麼樣子，例如平均年齡、女性比例、牙齒數的中位數，不做比較也不做推論。幾乎每篇論文的結果都從這裡開始，通常就是 Table 1。"]}, "ftLabel": "SECTION GUIDE", "ftLabelZh": "分節導讀", "ftBtnLabel": "Continue to the section guide", "ftBtnHide": "Hide the section guide"}, {"id": "tosun2024", "no": "Paper 14", "part": "Abstract + study guide", "short": "Tosun 2024 · OHIP-14 and satisfaction in denture wearers", "title": "Examination of oral health quality of life and patient satisfaction in removable denture wearers with OHIP-14 scale and visual analog scale: a cross-sectional study", "titleZh": "以 OHIP-14 量表與視覺類比量表檢視活動假牙配戴者的口腔健康生活品質與病人滿意度：橫斷式研究", "titleG": "這個標題把「用什麼工具」也寫進去了：<em>Examination of A and B in C with D and E: F</em> — 在 C（活動假牙配戴者）身上，用 D 和 E 兩個工具，檢視 A（生活品質）與 B（滿意度），冒號後的 F 交代研究設計。看到 <em>with</em> 就知道後面接的是測量工具。", "authors": "Tosun B, Uysal N", "journal": "BMC Oral Health, 2024; 24: 1353", "doi": "10.1186/s12903-024-05124-6", "lic": "Open access under CC BY-NC-ND 4.0 — no-derivatives licence. Abstract reproduced for study; notes and guide are InkQuest's own. Do not redistribute this annotated version.", "why": "【暫不需要】OHIP-14 與滿意度。方法流程仍是很乾淨的範本，主題新題目用不到。", "done": true, "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Oral Health-Related Quality of Life (OHRQoL) is a term that encompasses conditions such as oral health status, living conditions, and function.", "zh": "口腔健康相關生活品質是一個涵蓋口腔健康狀況、生活條件與功能等面向的概念。", "g": "<em>encompass</em>（涵蓋、包含）比 include 語氣更大，指的是把好幾個面向整個包進來。定義句常用它。"}, {"en": "OHQoL can change with the varying health conditions of the same individual.", "zh": "同一個人的口腔健康相關生活品質，會隨其健康狀況改變而變動。", "g": "順帶注意：這裡縮寫寫成 <em>OHQoL</em>，前一句卻是 <em>OHRQoL</em>，少了一個 R。這是論文自己的筆誤。已發表的論文出現這種小瑕疵並不少見，敢去核對就會發現。"}, {"en": "Many patients cannot afford implants or have anatomical limitations and therefore use traditional removable dentures.", "zh": "許多病人負擔不起植牙或有解剖上的限制，因此使用傳統活動假牙。"}, {"en": "There are comparatively few studies investigating OHRQoL and denture satisfaction that include the patients’ sociodemographic data, denture satisfaction and related questions.", "zh": "同時納入社會人口資料、假牙滿意度及相關題目來探討生活品質與滿意度的研究相對較少。", "g": "<em>There are comparatively few studies...</em>（相對較少研究……）又是研究缺口句型。這已經是第三篇用類似句型了：Yen 用 has not been fully elucidated，Taira 用 few studies have examined。三種寫法擇一背下來即可。"}]}, {"h": "Aim", "zh": "研究目的", "s": [{"en": "This study aimed to investigate OHRQoL and patients’ satisfaction with three types of dentures: upper and lower complete dentures, upper and lower partial dentures, and upper complete lower partial dentures.", "zh": "本研究旨在探討三種假牙類型使用者的生活品質與滿意度：上下顎全口假牙、上下顎局部假牙，以及上顎全口配下顎局部假牙。", "g": "這三種分組（ULCD／ULPD／UCLPD）是這篇的核心自變項。如果問卷研究要依假牙類型分組，這是一套現成可引用的分法。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The study was conducted between January 2022 and June 2023, with 150 patients using removable dentures.", "zh": "研究於 2022 年 1 月至 2023 年 6 月間進行，對象為 150 位活動假牙使用者。", "g": "150 人分成三組，每組 50——但內文其實是每組預計 75 人。這種摘要與內文對不上的情形，讀到就要回內文查。"}, {"en": "Patients’ age, gender, education level, place of residence, smoking status, reasons for tooth loss and visiting the clinic, type of denture and the duration of denture use were recorded.", "zh": "記錄病人的年齡、性別、教育程度、居住地、吸菸狀況、缺牙原因與就診原因、假牙類型及配戴時間。", "g": "<em>duration of denture use</em>（配戴時間）這一項要特別留意，它是這篇最有意思的發現所在。收案時若不問這題，它就會變成看不見的干擾因素。"}, {"en": "Oral Health Impact Profile (OHIP-14) and patient satisfaction with dentures as measured on a Visual Analog Scale (VAS) were used to assess patients’ satisfactions with OHRQoL and dentures respectively.", "zh": "以口腔健康影響量表（OHIP-14）與視覺類比量表（VAS）分別評估生活品質與對假牙的滿意度。", "g": "同時用兩個工具是這篇值得學的設計：OHIP-14 是十四題的多面向量表，VAS 只問一句「您對假牙有多滿意？」畫在 100 mm 的線上。一個測構念、一個測整體印象，成本很低卻多抓到一層資訊。"}, {"en": "Descriptive statistics, the Shapiro-Wilk normality test, the Mann-Whitney non-parametric test and the Kruskal-Wallis test were used.", "zh": "使用描述性統計、Shapiro-Wilk 常態性檢定、Mann-Whitney 無母數檢定與 Kruskal-Wallis 檢定。", "g": "這四個一路讀下來就是一套標準流程：先描述資料 → 檢定常態性 → 不符常態就改用無母數 → 兩組用 Mann-Whitney、三組以上用 Kruskal-Wallis。順序是有邏輯的，不是隨便列。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Statistically significant differences were found between gender, prosthetic type, usage duration and OHIP and VAS scores (p<0.05).", "zh": "性別、假牙類型與配戴時間，與 OHIP 及 VAS 分數之間有統計上顯著的差異。"}, {"en": "Women’s OHIP scores were higher than men’s, patients using complete dentures had higher scores than those using partial dentures in both jaws, those using dentures for less than 1 year had higher scores than those that had used them for more than 1 year.", "zh": "女性的 OHIP 分數高於男性；使用全口假牙者高於上下顎皆為局部假牙者；配戴未滿一年者高於配戴超過一年者。", "g": "這句是全篇最容易誤讀的地方，讀之前先確認方向：<em>OHIP 分數越高，代表生活品質越差</em>，跟 Yen 2015 的 GOHAI 正好相反。所以「女性分數較高」的意思是女性生活品質較差。<br><br>而 VAS 是滿意度、越高越滿意。同一段裡兩個指標方向相反，建議讀到這裡先畫一張方向對照表再往下。"}, {"en": "The analysis revealed no statistically significant differences in OHIP and VAS scores based on age, education level, and place of residence (p>0.05).", "zh": "年齡、教育程度與居住地則與 OHIP 及 VAS 分數無統計上顯著差異。", "g": "教育程度不顯著這一點值得記下來：Yen 2015 在台灣發現教育程度有顯著影響，這篇在土耳其卻沒有。兩篇結論不一致，而兩邊樣本的教育程度分布差很多。能把這種矛盾指出來並試著解釋，文獻回顧就從「整理」升級成「評析」了。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Patients may find it easier to adapt to removable partial dentures compared to complete dentures.", "zh": "相較於全口假牙，病人可能較容易適應活動局部假牙。"}, {"en": "Therefore, in prosthetic planning, dentists should prioritize preserving existing teeth.", "zh": "因此在贗復治療規劃上，牙醫應優先保留現有的牙齒。", "g": "<em>prioritize</em>（優先考慮）後面直接接動名詞或名詞，不加 to。這個結論跟 Yen 2015、Taira 2023 完全一致：留住真牙永遠是第一順位。三篇都指向同一件事，這在文獻回顧裡就可以寫成一個明確的共識。"}, {"en": "Regardless of the type of prosthesis, patients adapt to their prostheses over time, leading to increased satisfaction with prolonged use.", "zh": "不論假牙類型為何，病人都會隨時間適應，配戴越久滿意度越高。", "g": "<em>Regardless of</em>（不論……為何）後面接名詞。<br><br>但要注意：這句話只講到「越久越滿意」，內文其實還有下半段——超過五年之後滿意度又開始下降。摘要只講對自己有利的那一半，這是常見現象，也是不能只讀摘要的又一個理由。"}, {"en": "Since individuals do not have a habit of visiting the dentist when there is no known problem, dentists should encourage patients to attend regular dental check-ups.", "zh": "由於民眾在沒有明顯問題時沒有就醫習慣，牙醫應鼓勵病人定期接受口腔檢查。", "g": "這個結論對口腔衛生師的衛教工作直接相關。內文提到只有 4.7% 的人是為了定期檢查而來，其餘都是出了問題才就診。"}]}], "fulltext": [{"h": "How to read this paper", "zh": "讀這篇的重點", "s": [{"en": "Read the Methods section first, not the Results.", "zh": "先讀方法，不要先讀結果。", "g": "這篇的方法寫得乾淨完整，正好可以當自己論文的流程範本：樣本數怎麼算、常態性怎麼檢、檢定怎麼挑、事後比較怎麼做，一步一步都有交代。"}, {"en": "The sample size was calculated with G*Power, using an effect size borrowed from an earlier study.", "zh": "樣本數以 G*Power 計算，效果量取自先前的類似研究。", "g": "口試最常問的問題之一就是「你的樣本數怎麼來的」。這篇給了標準答法：信心水準 95%、效果量 0.2527（引自他人研究）、檢定力 0.95，算出每組至少 69 人，實際規劃每組 75 人。"}, {"en": "Check the direction of every score before reading any result.", "zh": "讀任何結果之前，先確認每個分數的方向。", "g": "OHIP-14 從 0 到 56，<em>分數越高、生活品質越差</em>；VAS 從 0 到 100，<em>分數越高、越滿意</em>。兩者方向相反。這篇全篇都在同一段裡交錯使用兩者，方向搞錯整段就會讀反。"}, {"en": "The most interesting finding is not in the abstract.", "zh": "最有意思的發現不在摘要裡。", "g": "滿意度不是一路上升：配戴未滿一年最不滿意，一到五年最滿意，超過五年又開始下降。作者推測是軟硬組織隨時間改變，造成固位力與美觀的流失。這代表「配戴時間」不能當成單純的連續變項丟進分析，分組處理才合理。"}, {"en": "Table 1 is worth copying as a template.", "zh": "表一值得當範本抄下來。", "g": "它把受試者特徵一次交代完：性別、教育程度、居住地、缺牙原因、吸菸、假牙類型、配戴時間、就診原因。自己寫論文時，第一張表幾乎一定長這樣。"}, {"en": "Note who these patients were before quoting this paper.", "zh": "引用這篇之前，先看清楚受試者是誰。", "g": "平均年齡男性 59.5 歲、女性 53.3 歲，教育程度以小學為主（50.7%），16% 不識字，超過半數住鄉村，土耳其單一醫學中心。<em>這不是高齡族群。</em>引用時要老實寫成「成人活動假牙使用者」，不能寫成「高齡者」。"}, {"en": "The limitations are short but real.", "zh": "限制寫得簡短，但都是真的。", "g": "單一中心、假牙由不同牙醫製作、對顎可能是固定補綴物。作者只用一段帶過。相較之下 Yen 2015 與 Taira 2023 的限制段寫得詳細得多，可以拿來對照什麼叫「把限制交代清楚」。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: there was no funding or financial support in this study.", "zh": "經費：本研究無任何經費或財務支持。", "g": "沒有經費也能做研究——這篇只用了問卷與既有門診病人。對資源有限的碩士生是個實際的參考：好的研究不一定需要錢。"}, {"en": "Competing interests: the authors declare no competing interests.", "zh": "利益衝突：作者聲明無利益衝突。"}, {"en": "Ethical approval: the ethics committee of Abant Izzet Baysal University (Decision No: 2023/97).", "zh": "倫理審查：Abant İzzet Baysal 大學倫理委員會（決議編號 2023/97）。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "Check the direction of every score before reading any result.", "zh": "讀任何結果之前，先確認分數方向。", "g": "OHIP-14 從 0 到 56，<em>分數越高、生活品質越差</em>；VAS 從 0 到 100，<em>分數越高、越滿意</em>。兩者相反，而本篇在同一段裡交錯使用。方向搞錯整段就會讀反。"}, {"en": "The most interesting finding is not in the abstract.", "zh": "最有意思的發現不在摘要裡。", "g": "摘要只說「配戴越久越滿意」，內文其實還有下半段——超過五年之後滿意度又開始下降，作者推測是軟硬組織變化造成固位力與美觀流失。摘要只講對自己有利的那一半，這是不能只讀摘要的又一個理由。"}, {"en": "These patients are not elderly.", "zh": "這些病人不是高齡族群。", "g": "平均年齡男性 59.5 歲、女性 53.3 歲，納入條件是 18 歲以上。若把這篇當成高齡者的證據引用，口試會被抓。正確用法是把它當<em>方法範本</em>：OHIP-14 加 VAS、G*Power 算樣本數、常態性檢定後選無母數方法，這整套流程可以直接借用。"}, {"en": "The abbreviation changes between the first two sentences.", "zh": "縮寫在前兩句之間就變了。", "g": "第一句寫 OHRQoL，第二句寫成 OHQoL，少一個 R。論文自己的筆誤。"}, {"en": "The limitations section is only one paragraph.", "zh": "限制段只寫了一段。", "g": "單一中心、假牙由不同牙醫製作、對顎可能是固定補綴物——就這些。相較之下 Yen 2015、Taira 2023、Techapiroontong 2025 都寫得詳細得多。限制寫得越細，通常代表作者對自己研究的理解越透徹，這點可以拿來對照。"}]}], "vocab": {"Oral Health-Related Quality of Life": ["how much a person's mouth affects daily life, comfort and confidence", "口腔健康相關生活品質", "f", "C1"], "encompasses": ["covers and includes several things at once", "涵蓋、包含（語氣比 include 大）", "v", "C1"], "implants": ["artificial tooth roots fixed into the jawbone", "植體、人工植牙", "v", "B2"], "removable dentures": ["dentures the wearer takes out and puts back", "活動假牙", "f", "B2"], "sociodemographic data": ["background facts such as age, sex, education, income and where a person lives", "社會人口資料", "f", "C1"], "complete dentures": ["dentures replacing every tooth in a jaw", "全口假牙（單顎全部缺牙）", "f", "B2"], "partial dentures": ["dentures replacing some teeth only", "局部假牙", "p", "B2"], "Oral Health Impact Profile": ["a 14-item scale, 0 to 56. CAREFUL: a HIGHER score means WORSE quality of life — the opposite of GOHAI.", "口腔健康影響量表（OHIP-14），0–56 分。注意：分數越高代表生活品質越差，與 GOHAI 方向相反", "f", "C1"], "OHIP": ["Oral Health Impact Profile. Higher score = worse quality of life.", "OHIP：分數越高，生活品質越差", "f", "C1"], "Visual Analog Scale": ["a 100 mm line the patient marks. Here a HIGHER score means MORE satisfied — the opposite direction to OHIP.", "視覺類比量表（VAS）：在 100 mm 線上標記。分數越高越滿意，方向與 OHIP 相反", "f", "C1"], "VAS": ["Visual Analog Scale. Higher = more satisfied.", "VAS：分數越高越滿意", "f", "C1"], "prosthetic type": ["which kind of denture a person wears", "假牙類型", "p", "B2"], "usage duration": ["how long the person has been wearing the denture", "配戴時間", "p", "B1"], "adapt to": ["to get used to something new", "適應", "p", "B1"], "prioritize": ["to put first. Followed by a noun or -ing, never 'to'.", "優先考慮（後接名詞或動名詞，不加 to）", "v", "B2"], "Regardless of": ["no matter what. Followed by a noun.", "不論……為何（後接名詞）", "c", "B2"], "prolonged": ["lasting a long time", "長期的、延長的", "v", "C1"], "regular dental check-ups": ["routine visits when nothing is wrong", "定期口腔檢查", "p", "B1"], "Methods section": ["the part of a paper describing exactly what was done", "方法一節", "p", "B1"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "Statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "p<0.05": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "p>0.05": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "Descriptive statistics": ["numbers that summarise the sample without testing anything", "描述性統計", "f", "B2", "只描述樣本長什麼樣子，例如平均年齡、女性比例、牙齒數的中位數，不做比較也不做推論。幾乎每篇論文的結果都從這裡開始，通常就是 Table 1。"], "normality": ["whether the data follow the bell-shaped normal curve", "常態分布（檢定）", "f", "C1", "常態分布是中間多、兩邊少、左右對稱的鐘形。t 檢定、Pearson 相關這類方法都假設資料是這個形狀，所以研究者會先檢查資料是否常態，再決定用哪一類統計方法。"], "Shapiro-Wilk normality test": ["a test of whether data follow a normal distribution, suited to small samples", "Shapiro–Wilk 常態檢定", "f", "C1", "同樣是檢查資料是否常態，樣本較小時比 Kolmogorov–Smirnov 更常用。p > .05 可視為常態；p < .05 表示不是常態，後面就改用無母數檢定。"], "Shapiro-Wilk": ["a test of whether data follow a normal distribution, suited to small samples", "Shapiro–Wilk 常態檢定", "f", "C1", "同樣是檢查資料是否常態，樣本較小時比 Kolmogorov–Smirnov 更常用。p > .05 可視為常態；p < .05 表示不是常態，後面就改用無母數檢定。"], "non-parametric": ["methods that do not assume a normal distribution", "無母數（檢定）", "f", "C1", "不要求資料是常態分布的方法，通常拿「排名」來比較，而不是原始數值。資料歪斜、樣本少，或是 1 到 5 分這種順序分數時使用。代價是偵測差異的能力稍弱。"], "Mann-Whitney": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "Kruskal-Wallis test": ["a non-parametric test comparing three or more groups", "Kruskal–Wallis 檢定", "f", "C1", "比較「三組以上」的無母數方法，相當於 ANOVA 的無母數版本。它只能說明「各組之間有差」，無法指出是哪兩組有差，要再做事後兩兩比較才知道。"], "Kruskal-Wallis": ["a non-parametric test comparing three or more groups", "Kruskal–Wallis 檢定", "f", "C1", "比較「三組以上」的無母數方法，相當於 ANOVA 的無母數版本。它只能說明「各組之間有差」，無法指出是哪兩組有差，要再做事後兩兩比較才知道。"], "sample size": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"], "G*Power": ["free software used to calculate the sample size needed before a study", "G*Power 樣本數計算軟體", "f", "C1", "免費的統計軟體，研究開始前用來算需要多少受試者。輸入預期的效果量、顯著水準（通常 0.05）和檢定力（通常 0.8），就會算出最少人數。檢定力 0.8 的意思是：如果差異真的存在，有 80% 的機會測得出來。"], "effect size": ["how large a difference or relationship is", "效果量", "f", "C1", "差異「有多大」，而不是「是不是巧合」。p 值只回答有沒有差，效果量回答差多少。常見的 Cohen's d：0.2 小、0.5 中、0.8 大。計算樣本數時，要先預估效果量。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "mesh": [["OHIP-14", "口腔健康影響量表（14 題版）", "作者關鍵字。本篇的主要測量工具，分數越高代表生活品質越差。"], ["Oral health-related quality of life", "口腔健康相關生活品質", "與 Yen 2015 共用的核心概念，但 Yen 2015 用 GOHAI 測量，方向相反。"], ["Removable dentures", "活動假牙", "本篇族群：上下顎全口、上下顎局部、上顎全口配下顎局部三類。"], ["Visual analog scale", "視覺類比量表", "單題整體滿意度，0 至 100 mm，分數越高越滿意。"]], "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。建議另到 PubMed 查它的 MeSH 主題詞，兩套詞彙不同，搜尋時都值得試。<br><br><em>授權提醒：</em>本篇為 CC BY-NC-ND，允許非商業重製，但<em>不允許散布改作後的版本</em>。上方的中譯與註解屬改作，請勿對外流通此註解版。"}, {"no": "Paper 15", "part": "待搜尋", "short": "A · 高齡者食物選擇行為", "title": "A · 高齡者食物選擇行為", "authors": "—", "journal": "—", "doi": "—", "lic": "—", "why": "關鍵字：food choice、food selection、food preference、dietary behaviour 配 older adults、oral status。已補入 Wu 2025（TEMS 中文版）與 Mena 2020（質地驅動選擇），仍可再找實際測量選擇行為的實證研究。", "done": false}, {"no": "Paper 16", "part": "待搜尋", "short": "B · 口腔狀況與飲食多樣性、營養攝取", "title": "B · 口腔狀況與飲食多樣性、營養攝取", "authors": "—", "journal": "—", "doi": "—", "lic": "—", "why": "關鍵字：dietary diversity、dietary variety score、nutrient intake、food avoidance 配 tooth loss、denture。Nitsuwat 2024（Nutrition Reviews 統合分析）在這一塊，之前沒收，建議補回。", "done"     '\u554f\u984c\u8ddf\u7b54\u6848\u90fd\u53ef\u4ee5\u9ede\u958b\uff0c\u4e0b\u65b9\u6703\u51fa\u73fe\u4e2d\u8b6f\u8207\u8aaa\u660e\u3002'+
    '\u7b54\u6848\u523b\u610f\u5beb\u5f97\u77ed\uff0c\u56e0\u70ba\u80cc\u5f97\u8d77\u4f86\u6bd4\u8b1b\u5f97\u6f02\u4eae\u91cd\u8981\u3002</p>';
  (qa||[]).forEach(function(cat,ci){

         '<span class="sent as" role="button" tabindex="0" data-w="qa" data-s="'+ci+'" data-t="'+ii+'">'+esc(it.a)+'</span>'+
         panelHtml({zh:it.aZh,g:it.aG})+'</div>'+

}
function secHtml(sec,si,which){

function render(i){

  TERMS=Object.keys(VOCAB).sort(function(a,b){return b.length-a.length;});

    p.fulltext.forEach(function(sec,si){ f+=secHtml(sec,si,'f'); });
    if(p.mesh&&p.mesh.length){
      f+='<h2 class="sec">'+esc(p.meshLabel||'MeSH terms')+' <span class="zh">'+(p.meshLabelZh||'PubMed 主題詞')+'</span></h2>'+
         '<p class="meshnote">'+(p.meshNote||'PubMed 為每篇論文貼上的標準主題標籤。用這些詞去搜尋，比自己拼關鍵字準得多。點任一標籤看說明。')+'</p><div class="mesh">';
      p.mesh.forEach(function(m,mi){
        var major=m[0].indexOf('*')!==-1;
        f+='<span class="mterm'+(major?' major':'')+'" role="button" tabindex="0" data-mi="'+mi+'">'+
           esc(m[0]).replace(/\*/g,'<span class="star">*</span>')+'</span>';
      });
      f+='</div><p class="meshlegend"><span class="star">*</span> = major topic \u4e3b\u8981\u4e3b\u984c</p>';
    }

  }else{
    ftEl.innerHTML='';

  }
  ftOpen=false; ftEl.hidden=true;
  var fb=document.getElementById('ftBtn');
  fb.classList.remove('on'); fb.textContent=p.ftBtnLabel||'Continue to the full text';

    '<span class="strong">InkQuest Reading Room · annotated research reading.</span> '+

    '<br>Translation, glossary and grammar notes are original InkQuest teaching material. '+
    '<span class="strong han">僅供教學使用。</span>';

  linkify(); buildWordbank(); markToc(); doSearch();
  setAll(autoOpen);
