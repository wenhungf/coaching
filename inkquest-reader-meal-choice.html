衛福部資料（定期洗牙者較不易有齲齒或牙周病）矛盾。<br><br>另一種解釋是<em>偵測偏差</em>：口腔健康現況是自覺症狀（塞牙縫、敏感、出血），而定期就醫的人本來就比較注意、也比較容易察覺症狀，反而回報得更多。這個推論論文沒說，是可以拿去跟指導教授討論的。"}, {"en": "The reliability threshold is unusually low.", "zh": "信度門檻訂得偏低。", "g": "本篇只報「各構面 Cronbach's α 均大於 0.6」，沒有列出實際數值。一般慣例是 0.7 以上可接受、0.8 以上良好——Yen 2015 的 GOHAI-T 是 0.801、DSA 是 0.887。這是可以提出的疑問。"}, {"en": "The quota was not actually met.", "zh": "配額其實沒有真正達成。", "g": "東部只回收 25 份（2%），遠低於實際人口比例。配額抽樣的重點就在於各區比例要符合母體，這一點沒做到。"}, {"en": "This paper brings in one concept the others do not: mediation.", "zh": "這篇帶進一個其他篇都沒有的概念：中介。", "g": "中介問的是「怎麼影響的」。飲食行為 → 口腔健康，是直接的嗎？還是要先經過口腔保健行為？本篇的答案是：一部分直接、一部分透過口腔保健（部分中介）。<br><br>這個思路對新題目很有用：口腔狀況 → 咀嚼能力 → 便當選擇，中間那一環值不值得放進模型？"}]}], "vocab": {"dietary behavior": ["what and how a person eats", "飲食行為", "f", "B1"], "preventive medical treatment": ["going to the dentist before anything hurts", "預防性就醫：沒有症狀時就先就診", "p", "B2"], "oral health care": ["daily self-care such as brushing, flossing and rinsing", "口腔保健：刷牙、牙線、漱口等日常自我照護", "p", "B1"], "proportional quota sampling": ["filling preset quotas that match the population's proportions. Not random.", "比例配額抽樣：依母體比例預設名額後湊滿，非隨機", "f", "C2"], "tooth sensitivity": ["pain from hot, cold or sweet food", "牙齒敏感", "p", "B1"], "bleeding gums": ["gums that bleed, usually a sign of inflammation", "牙齦出血", "p", "B1"], "sugar-sweetened beverages": ["drinks with added sugar", "含糖飲料", "p", "B2"], "predictive effect": ["how well one variable forecasts another", "預測效果", "p", "C1"], "oral health status": ["the current condition of a person's mouth", "口腔健康現況", "p", "B1"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "correlated": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "positively correlated": ["both measures rise together", "正相關", "f", "C1", "一個數值上升，另一個也跟著上升。它只說明兩者一起變動，不代表誰造成誰。"], "negatively correlated": ["one measure rises as the other falls", "負相關", "f", "C1", "一個數值上升，另一個反而下降。要注意量表方向：如果某個量表「分數越高代表越差」（例如 OHIP-14），負相關可能其實是兩件好事一起出現。"], "partial mediating effect": ["when one factor affects an outcome through a second factor", "中介效果", "f", "C1", "A 透過 B 去影響 C。例如缺牙讓咀嚼能力下降，咀嚼能力下降又讓生活品質變差，咀嚼能力就是中介變項。「部分中介」表示 A 除了透過 B，自己也還直接影響 C。"], "mediating effect": ["when one factor affects an outcome through a second factor", "中介效果", "f", "C1", "A 透過 B 去影響 C。例如缺牙讓咀嚼能力下降，咀嚼能力下降又讓生活品質變差，咀嚼能力就是中介變項。「部分中介」表示 A 除了透過 B，自己也還直接影響 C。"], "mediation": ["when one factor affects an outcome through a second factor", "中介效果", "f", "C1", "A 透過 B 去影響 C。例如缺牙讓咀嚼能力下降，咀嚼能力下降又讓生活品質變差，咀嚼能力就是中介變項。「部分中介」表示 A 除了透過 B，自己也還直接影響 C。"], "mediating": ["when one factor affects an outcome through a second factor", "中介效果", "f", "C1", "A 透過 B 去影響 C。例如缺牙讓咀嚼能力下降，咀嚼能力下降又讓生活品質變差，咀嚼能力就是中介變項。「部分中介」表示 A 除了透過 B，自己也還直接影響 C。"], "Cronbach's α": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "Cronbach": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "reliability": ["how consistent a measurement is", "信度", "f", "C1", "測量工具「穩不穩」：同一個人再測一次，或換一個人來測，結果會不會一樣。信度差的工具，量出來的數字本身就不可靠。常見指標有 Cronbach's α、ICC、kappa。"], "validity": ["whether a tool measures what it claims to measure", "效度", "f", "C1", "測量工具「準不準」：是不是真的測到想測的東西。信度是穩，效度是準；穩不一定準，但不穩一定不準。"], "expert validity": ["judgement by experts that the items are appropriate", "專家效度", "f", "C1", "請相關領域的專家逐題審查問卷，判斷題目是否合適、有沒有漏掉重要面向。是問卷發展最基本的效度檢查。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "mesh": [["飲食行為", "Dietary behavior", "本篇自變項。以九題李克特四等第量表測量，其中八題為反向題。"], ["口腔保健", "Oral health care", "中介變項之一。六題，含刷牙次數、時間點、平均時間、清潔舌頭、換牙刷頻率與潔牙工具。"], ["預防性就醫", "Preventive medical care", "中介變項之二。五題。本篇發現它對口腔健康無顯著預測性。"], ["口腔健康", "Oral health", "依變項。以九項自覺症狀測量：牙齒搖動、戴牙套、缺牙、假牙、口臭、疼痛、敏感、牙齦出血、食物塞牙縫。"]], "meshLabel": "關鍵詞", "meshLabelZh": "Keywords", "meshNote": "中文期刊的關鍵詞。本篇以中英文並列，點任一標籤看說明。<br><br>這四個詞正好就是本研究的四個構面：一個自變項、兩個中介變項、一個依變項。看關鍵詞就能看出研究架構，這是中文論文常見的寫法。"}, {"id": "limpuangthip2022", "no": "Paper 5", "short": "Limpuangthip 2022 · A ready-made chewing scale for denture wearers", "title": "Masticatory index for patients wearing dental prosthesis as alternative to conventional masticatory ability measures", "titleZh": "假牙配戴者咀嚼指數：傳統咀嚼能力測量的替代方案", "titleG": "<em>A as alternative to B</em>（A 作為 B 的替代方案）——標題就宣告了這是一篇工具開發論文，目的是取代既有的測量方式。", "authors": "Limpuangthip N, Tumrasvin W, Sakultae C", "journal": "PLOS ONE, 2022; 17(1): e0263048", "doi": "10.1371/journal.pone.0263048", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【核心】CUMI 量表：20 種食物、5 個咀嚼難度等級，已驗證信效度。便當菜色若要依咀嚼難度分級，這是現成架構。", "mesh": [["Masticatory ability", "咀嚼能力", "本篇要測量的構念。"], ["Dental prosthesis", "假牙補綴物", "含全口、局部與固定三類。"], ["Index development", "量表發展", "本篇屬工具開發與驗證研究。"], ["Reliability and validity", "信度與效度", "Cronbach's alpha 0.89、ICC 0.95。"]], "part": "Abstract + study guide", "done": true, "abstract": [{"h": "Objectives", "zh": "研究目的", "s": [{"en": "The study objectives were: to develop a masticatory index for evaluating masticatory ability in patients wearing a dental prosthesis, including complete dentures, removable partial denture, and fixed partial denture.", "zh": "研究目的為：發展一套咀嚼指數，用以評估配戴假牙者（全口假牙、活動局部假牙、固定假牙）的咀嚼能力。", "g": "<em>develop an index</em>（發展一套指數）——這是一篇<em>工具開發</em>的論文，跟前面所有「用工具去測某群人」的研究不同類。這類論文的價值在於：它做完之後，別人就有現成的工具可以用。"}, {"en": "To test the reliability and validity of the index, and to determine whether the index better reflected patients' masticatory ability compared with conventional subjective and objective measures.", "zh": "檢驗該指數的信度與效度，並確認其是否比傳統主客觀測量更能反映病人的咀嚼能力。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The present cross-sectional study consisted of 2 phases: developing the Chulalongkorn University masticatory index (CUMI) consisting of 20 food items in 5 masticatory difficulty grades using a 3-point Likert scale.", "zh": "本橫斷式研究分兩階段：第一階段發展朱拉隆功大學咀嚼指數（CUMI），包含二十種食物、分五個咀嚼難度等級，以三點李克特量表計分。", "g": "<em>20 food items in 5 masticatory difficulty grades</em>——二十種食物，依咀嚼難度分五級。這個結構可以直接移植：便當的菜色若要依咀嚼難度分級，這是一份現成的架構。"}, {"en": "The second phase was application of the CUMI in 110 patients wearing a dental prosthesis, including complete dentures, removable partial dentures, and fixed partial dentures as a control group.", "zh": "第二階段將 CUMI 應用於 110 位配戴假牙者，包含全口假牙、活動局部假牙，以及作為對照組的固定假牙使用者。"}, {"en": "The CUMI test-retest reliability was reevaluated 2 weeks later.", "zh": "CUMI 的重測信度於兩週後再次評估。", "g": "<em>test-retest</em>（重測信度）：同一批人隔兩週再填一次，分數應該差不多。Yen 2015 隔一週重測 30 人，做法相同。自編量表一定要做這一步。"}, {"en": "The convergent validity was compared with objective masticatory performance evaluated with a standard peanut chewing test, and subjective eating impacts evaluated by the Oral Impacts on Daily Performances Index.", "zh": "聚斂效度以標準花生咀嚼測試所測的客觀咀嚼表現，以及以日常生活口腔影響指數所測的主觀進食影響進行比較。", "g": "拿新工具去跟兩個既有工具比：一個客觀（花生測試）、一個主觀（OIDP 量表）。兩邊都對得上，新工具才站得住腳。這就是<em>聚斂效度</em>的做法。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The CUMI's Cronbach's alpha and intraclass correlation coefficient values were 0.89 and 0.95, respectively.", "zh": "CUMI 的 Cronbach's alpha 為 0.89，組內相關係數為 0.95。", "g": "0.89 的內部一致性屬良好（0.8 以上），0.95 的重測一致性非常高。這兩個數字加起來，代表這是一份可靠的量表。<br><br>對照張炳華 2023 只報「各構面均大於 0.6」，本篇的報告方式詳細得多。"}, {"en": "The convergent validity was shown by significant associations between the increased CUMI score, smaller peanut particle size and decreased eating impact score.", "zh": "CUMI 分數越高、花生顆粒越小、進食影響分數越低，三者顯著相關，證實聚斂效度。", "g": "三個方向要一起確認：CUMI 高（自覺咬得動）↔ 花生磨得細（客觀咬得動）↔ 進食影響低（生活沒受干擾）。三者同步，代表量表測到了該測的東西。"}, {"en": "Multivariable analyses found that the CUMI score, peanut particle size, and percentage of having an eating impact were significantly associated with the number of remaining teeth and posterior occluding pairs, and type and quality of dental prosthesis.", "zh": "多變項分析發現，CUMI 分數、花生顆粒大小與進食受影響比例，均與剩餘牙數、後牙咬合對數，以及假牙的類型與品質顯著相關。", "g": "注意最後一項：<em>假牙的品質</em>，不只是有沒有戴。這跟 Hirayama 2025 用 5-Defects 評分測假牙品質是同一個思路。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "The CUMI is a reliable and valid tool that can be used as an alternative measure of masticatory ability in patients wearing a dental prosthesis.", "zh": "CUMI 是一套具信效度的工具，可作為假牙配戴者咀嚼能力的替代測量方式。", "g": "<em>alternative measure</em>（替代測量方式）——它的定位是取代昂貴、費時的客觀測試。對資源有限的碩士生研究來說，這正是需要的東西。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "This paper hands over a ready-made tool.", "zh": "這篇直接交出一套現成工具。", "g": "二十種食物、五個難度等級、三點量表。已在 110 位假牙使用者身上驗證過信效度。若要測「能吃哪些質地的食物」，不必自己從零編題目。<br><br>PLOS ONE 是 CC BY，量表全文可以合法取用；但要用在論文裡，仍應寫信告知原作者並正確引用。"}, {"en": "The team is the same as Techapiroontong 2025.", "zh": "研究團隊跟 Techapiroontong 2025 是同一批人。", "g": "都來自朱拉隆功大學贗復科，Nareudee Limpuangthip 同時是兩篇的作者。這代表這個團隊在假牙與咀嚼、滿意度領域深耕多年，他們的其他論文也值得順著查。"}, {"en": "Watch how the food list is graded.", "zh": "留意食物清單是怎麼分級的。", "g": "不是隨便列二十種，而是依咀嚼難度分成五個等級。這個設計讓分數不只反映「能吃幾樣」，還反映「能吃到多難的等級」。<br><br>若自己要編食物清單，這個分級邏輯比單純列舉更有解釋力。"}, {"en": "Note what a validation study looks like.", "zh": "看清楚一篇「工具驗證」的論文長什麼樣。", "g": "信度（Cronbach's alpha、重測 ICC）、聚斂效度（跟既有工具比）、區辨效度（能不能區分不同口腔狀況的人）——三件事缺一不可。<br><br>若自編問卷，這三關也得過，而且得寫進方法段。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: this research is funded by Chulalongkorn University, Grant number CU_GR_63_11_32_04. The funders had no role in study design, data collection and analysis, decision to publish, or preparation of the manuscript.", "zh": "經費：由朱拉隆功大學資助（計畫編號 CU_GR_63_11_32_04）。資助者未參與研究設計、資料收集與分析、發表決定或稿件撰寫。", "g": "最後那一句是 PLOS 期刊要求的標準文字：<em>the funders had no role in...</em>（資助者未參與……）。它把「拿了錢」與「受了影響」分開，是處理經費揭露的良好範例。<br><br>Imamura 2023 的經費聲明就<em>沒有</em>這一句。"}, {"en": "Competing interests: the authors have declared that no competing interests exist.", "zh": "利益衝突：作者聲明無利益衝突。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "A validation study answers a different kind of question.", "zh": "工具驗證研究回答的是另一類問題。", "g": "它不問「假牙對生活品質有什麼影響」，而是問「這把尺準不準」。在文獻回顧裡，它應該放在<em>方法</em>那一節，而不是跟 Yen 2015、Tosun 2024 那些放在一起討論結果。"}, {"en": "The food list is culturally specific.", "zh": "食物清單有文化特定性。", "g": "泰國的二十種食物不一定適合台灣長者。若要採用，必須做<em>跨文化調適</em>——這正是 Yen 2015 把 GOHAI 翻成台灣版時做的事：翻譯、回譯、專家審查、在地預試。<br><br>直接照翻會出問題：清單裡若有台灣長者沒吃過的食物，答案就沒有意義。"}, {"en": "The control group is fixed-denture wearers, not people with natural teeth.", "zh": "對照組是固定假牙使用者，不是有天然牙的人。", "g": "所以它比較的是三種假牙之間的差異，而非「假牙 vs 真牙」。若想引用它談「假牙不如真牙」，這篇不支持那個結論。"}, {"en": "Using a published scale still requires permission and citation.", "zh": "使用已發表的量表仍需徵得同意並正確引用。", "g": "CC BY 授權的是論文本文，量表本身的使用慣例是寫信告知作者。這是學術禮儀，也能順便請教計分細節。對碩士生而言，寫這封信本身就是很好的訓練。"}]}], "vocab": {"masticatory performance": ["chewing measured objectively with a test food or instrument", "咀嚼表現：以測試食物或儀器客觀測量的咀嚼效能", "f", "C1"], "masticatory ability": ["chewing as the person rates it themselves — what they say they can eat", "咀嚼能力：本人自評能吃什麼，屬主觀", "f", "C1"], "masticatory index": ["a scored scale summarising how well someone can chew", "咀嚼指數：把咀嚼能力化為分數的量表", "f", "C1"], "posterior occluding pairs": ["pairs of back teeth that meet — the ones that actually grind food", "後牙咬合對：真正負責磨碎食物的後牙", "f", "C2"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "intraclass correlation coefficient": ["agreement between repeated measurements of a continuous score", "組內相關係數（ICC）", "f", "C1", "檢查連續分數的一致性，例如同一個人測兩次，或兩位檢查者替同一個人打分。0.75 以上良好、0.9 以上極佳。kappa 用在分類結果，ICC 用在連續分數。"], "Multivariable": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "multivariable": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "cross-sectional": ["a study that measures everyone once, at one point in time", "橫斷研究", "f", "C1", "在同一個時間點，對一群人量一次。像拍一張照片：看得出哪些因素一起出現，但分不出誰先誰後，所以不能證明因果。餐食選擇的研究多半也屬於這種設計。"], "control group": ["the comparison group", "對照組", "f", "B2", "用來比較的那一組。沒有對照組，就無法知道改變是來自介入本身，還是本來就會發生。兩組的條件越相似，比較越公平。"], "Likert scale": ["an answer scale such as 'strongly disagree' to 'strongly agree'", "李克特量表", "f", "B2", "常見的問卷作答方式，例如「非常不同意、不同意、普通、同意、非常同意」，分別給 1 到 5 分。它有順序，但每一級之間的距離不一定相等，所以常用中位數和無母數方法處理。"], "Cronbach's alpha": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "Cronbach": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "test-retest reliability": ["agreement between two administrations of the same test", "再測信度", "f", "C1", "同一批人隔一段時間再填一次同樣的問卷，兩次結果越接近越好。用來確認工具量出來的分數不會隨便浮動。"], "reliability": ["how consistent a measurement is", "信度", "f", "C1", "測量工具「穩不穩」：同一個人再測一次，或換一個人來測，結果會不會一樣。信度差的工具，量出來的數字本身就不可靠。常見指標有 Cronbach's α、ICC、kappa。"], "validity": ["whether a tool measures what it claims to measure", "效度", "f", "C1", "測量工具「準不準」：是不是真的測到想測的東西。信度是穩，效度是準；穩不一定準，但不穩一定不準。"], "convergent validity": ["agreement with another tool that measures the same concept", "聚合效度", "f", "C1", "新工具的分數，和另一個測量同一概念的工具有沒有高度相關。有的話，就表示兩個工具真的在測同一件事。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。"}, {"id": "park2022", "no": "Paper 6", "short": "Park 2022 · Textured food, chewing muscles and tongue pressure", "title": "Effects of textured food masticatory performance in older people with different dental conditions", "titleZh": "質地調整食品對不同口腔狀況長者咀嚼表現的影響", "titleG": "標題的英文其實有語病（effects of textured food masticatory performance 少了介系詞，應為 effects of textured food ON masticatory performance）。已發表論文出現這種瑕疵並不罕見，讀到不通順時可以先懷疑是原文的問題。", "authors": "Park Y-S, Hong H-P, Ryu S-R, Lee S, Shin W-S", "journal": "BMC Geriatrics, 2022; 22: 384", "doi": "10.1186/s12877-022-03064-w", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【核心】唯一直接測量食物質地的一篇。假牙者覺得同一份食物更硬——直接解釋便當為什麼會被挑剩。作者來自食品營養系，站在供餐那一端。", "mesh": [["Mastication", "咀嚼", "作者關鍵字。"], ["Older people", "長者", "65 至 85 歲韓國女性。"], ["Dental status", "口腔狀況", "分為有天然牙與全口假牙兩組。"], ["Tongue pressure", "舌壓", "以 IOPI 測量，兩組相差近一倍。"], ["Texture-modified food", "質地調整食品", "以汆燙時間製造不同硬度等級。"]], "part": "Abstract + study guide", "done": true, "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Physiological deterioration — aging, poor dental status, and reduced tongue pressure — makes chewing difficult.", "zh": "生理退化（老化、口腔狀況不佳、舌壓下降）使咀嚼變得困難。", "g": "注意這裡把<em>舌壓</em>與牙齒狀況並列。咀嚼不只靠牙齒，舌頭負責把食物推到牙齒之間、再集結成食團。這是前面幾篇都沒談到的一環。"}, {"en": "This study aimed to investigate the chewing patterns of older people with or without dentures, evaluate the textural and masticatory properties of texture-modified radish Kimchi, and investigate the correlation between dental status and tongue pressure.", "zh": "本研究旨在探討有無配戴假牙長者的咀嚼模式、評估質地調整蘿蔔泡菜的質地與咀嚼特性，並探討口腔狀況與舌壓的相關性。", "g": "<em>texture-modified</em>（質地調整）是高齡友善餐食的核心概念，便當若要調整，調的就是這個。這篇是目前所有文獻中，唯一真正動手做出不同質地的食物來測試的。"}, {"en": "Additionally, differences in the subjective–objective concordance of texture-modified Kimchi were investigated using the preference test.", "zh": "此外亦以偏好測試探討質地調整泡菜在主客觀一致性上的差異。", "g": "<em>concordance</em>（一致性）——客觀測出來的硬度，跟人吃起來覺得的硬度，對不對得上？這與 Chen 2025 問的是同一類問題，只是對象換成食物質地。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "This study included 32 Korean women aged between 65 and 85 years.", "zh": "本研究納入 32 位 65 至 85 歲的韓國女性。", "g": "只有 32 人，而且全是女性、全是韓國人。樣本小且單一，這是引用時必須交代的限制。"}, {"en": "Masticatory behavior was recorded by electromyography, and tongue pressure was measured using the Iowa Oral Performance Instrument.", "zh": "以肌電圖記錄咀嚼行為，並以愛荷華口腔功能量測儀測量舌壓。", "g": "<em>electromyography</em>（肌電圖，EMG）測的是肌肉的電位活動——咬肌與顳肌用力多少、用多久。<em>IOPI</em> 則是量舌頭往上頂的壓力，單位為 kPa。兩者都是客觀儀器測量，跟問卷完全不同層次。"}, {"en": "The preference for cooked radish Kimchi with various blanching times based on overall acceptability and self-reporting of preference was investigated to develop elderly-friendly food.", "zh": "以不同汆燙時間的熟蘿蔔泡菜，依整體接受度與自陳偏好進行調查，以開發高齡友善食品。", "g": "<em>blanching</em>（汆燙）——用汆燙時間長短做出硬度不同的樣本，這是食品科學的手法。作者群來自漢陽大學<em>食品營養學系</em>，不是牙醫系，所以整篇的視角跟其他文獻很不一樣。"}, {"en": "The subjective scores indicated whether the sample was hard or soft based on the chewing ability of the participants.", "zh": "主觀評分係依受試者的咀嚼能力判定樣本偏硬或偏軟。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The number of chews and chewing time increased with hardness, significantly activating the masseter and temporalis muscles.", "zh": "咀嚼次數與咀嚼時間隨硬度增加，並顯著活化咬肌與顳肌。"}, {"en": "The evaluation of masseter muscle activity showed that older people with complete dentures chewed less actively than those with natural teeth.", "zh": "咬肌活動的評估顯示，全口假牙長者的咀嚼活躍程度低於有天然牙者。"}, {"en": "The older people with natural teeth exhibited higher tongue pressure than those with complete dentures, and the difference was statistically significant.", "zh": "有天然牙的長者舌壓高於全口假牙者，差異達統計顯著（18.94 對 10.81 kPa）。", "g": "舌壓幾乎差了一倍。值得注意的是因果方向不明：是戴假牙導致舌壓下降，還是舌壓差的人本來就容易失去牙齒？這篇答不出來。"}, {"en": "Older people preferred food with familiar tastes and textures.", "zh": "長者偏好熟悉的味道與質地。", "g": "這句看似平常，卻是高齡飲食設計的核心：不是做得越軟越好，是要做得<em>像原本那樣</em>。這對衛教與食品建議都有意義。"}, {"en": "Denture wearers exhibited a lower chewing ability, and at the hardest level, they perceived greater hardness of food than those with natural teeth.", "zh": "假牙配戴者的咀嚼能力較低，在最硬的等級時，其對食物硬度的感受高於有天然牙者。", "g": "這是全篇最重要的一句，也直接解釋了便當為什麼會被挑剩：<em>同一塊食物，咬不動的人吃起來就是比較硬</em>。「食物有多硬」不是食物的客觀屬性，而是人與食物互動的結果。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Developing food with a modified texture can bridge the gap between physiological and psychological aspects of food texture.", "zh": "開發質地調整食品，可以彌合食物質地在生理與心理層面之間的落差。", "g": "<em>bridge the gap between physiological and psychological</em>——生理上咬不動是一回事，心理上覺得難吃、覺得被當成病人是另一回事。質地調整食品要同時處理這兩者。"}, {"en": "Texture-modified radish Kimchi, with limited blanching time, may be favorable for older people.", "zh": "適度汆燙的質地調整蘿蔔泡菜，可能較適合長者。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "This is a food science paper, not a dental one.", "zh": "這是食品科學論文，不是牙科論文。", "g": "作者來自漢陽大學食品營養學系與仁荷大學食品工程系。所以它談的是怎麼「做出」合適的食物，而不是怎麼「修復」病人的嘴。<br><br>這個視角對新題目特別重要：便當研究本來就站在食物那一端——不是修病人的嘴，是調整供餐。"}, {"en": "Three measurement layers appear here that no other paper in the set uses.", "zh": "這篇用了三種其他文獻都沒有的測量層次。", "g": "<em>肌電圖</em>測肌肉用力、<em>舌壓儀</em>測舌頭力量、<em>質地分析</em>測食物本身的硬度。前面幾篇多半只有問卷，這篇是實驗室級的客觀測量。"}, {"en": "The Korean texture levels are worth comparing with IDDSI.", "zh": "韓國的質地分級值得與 IDDSI 對照。", "g": "本篇用汆燙時間做出不同等級的樣本，對應的是韓國的高齡友善食品標準。台灣目前推的是 IDDSI。兩套標準的對應關係，是文獻回顧裡可以處理的一個小題目。"}, {"en": "Thirty-two people, all women, all Korean.", "zh": "三十二人，全為女性，全為韓國人。", "g": "樣本小、性別單一、國別單一，而且泡菜是韓國的日常食物、對台灣長者未必適用。引用它的<em>概念</em>（主觀硬度感受隨咀嚼能力而變）比引用它的<em>數字</em>安全得多。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: no funding was obtained for this study.", "zh": "經費：本研究未獲任何經費。"}, {"en": "Competing interests: the authors declare that they have no competing interests.", "zh": "利益衝突：作者聲明無利益衝突。"}, {"en": "Ethical approval: the study was approved by the institutional review board; participants gave written informed consent.", "zh": "倫理審查：經人體試驗審查委員會核准，受試者均簽署書面同意書。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "This is the only paper in the set that measures food texture directly.", "zh": "這是整組文獻中唯一直接測量食物質地的一篇。", "g": "其他篇談質地都是靠分級（Taira 2023 的四級食物型態）或靠問卷（Alamoush 2025 的十種食物）。本篇是真的做出不同硬度的樣本、真的量了肌肉出力。<br><br>如果題目要談「食物質地」，這篇是質地那一側的方法學支柱。"}, {"en": "Perceived hardness is not the same as measured hardness.", "zh": "感受到的硬度不等於測出來的硬度。", "g": "假牙者在最硬的等級覺得食物比有真牙者更硬。這代表<em>質地是相對的</em>——同一份餐食，對不同的人是不同的難度。<br><br>這對便當研究有直接啟發：同一個便當，對不同口腔狀況的人是不同的難度。問「您覺得這道菜好咬嗎」與記錄「這道菜剩多少」，測到的是兩回事。"}, {"en": "Tongue pressure is a variable the other papers ignore.", "zh": "舌壓是其他文獻都忽略的變項。", "g": "有真牙者 18.94 kPa，全口假牙者 10.81 kPa，差了將近一倍。舌頭負責把食物推到牙齒之間並集結成食團，舌壓不足時，光有假牙也不見得咬得動。<br><br>這是收案時可以考慮加測的東西——IOPI 一台儀器就能測，比軟糖測試簡單。"}, {"en": "The standard deviation on one figure looks wrong.", "zh": "有一個數字的標準差看起來不對。", "g": "摘要寫全口假牙組舌壓為 10.81 ± 62.93 kPa。平均值 10.81 卻配上 62.93 的標準差，這在數學上幾乎不可能（會出現大量負數壓力）。應為排版或小數點錯誤。<br><br>讀論文時看到<em>標準差遠大於平均值</em>要停一下，多半是打錯了。"}]}], "vocab": {"tongue pressure": ["how hard the tongue can press upward, measured in kPa. The tongue moves food onto the teeth and gathers it into a bolus.", "舌壓：舌頭上頂的壓力（kPa）。舌頭負責把食物推到牙齒之間並集結成食團", "f", "C2"], "electromyography": ["a recording of muscle electrical activity — here, how hard the chewing muscles work", "肌電圖：記錄肌肉電位活動，本篇用來測咀嚼肌出力", "f", "C2"], "masseter": ["the main chewing muscle at the side of the jaw", "咬肌：下顎側面的主要咀嚼肌", "f", "C2"], "temporalis": ["the fan-shaped chewing muscle at the temple", "顳肌：位於太陽穴的扇形咀嚼肌", "f", "C2"], "texture-modified": ["food deliberately softened, minced or thickened to make it easier to eat", "質地調整：刻意軟化、切碎或勾芡以利進食的食物", "f", "C1"], "blanching": ["briefly boiling food, here used to create different hardness levels", "汆燙：短時間水煮，本篇用來製造不同硬度", "v", "C1"], "hardness": ["how much force is needed to break the food down", "硬度", "v", "B1"], "preference test": ["asking people which sample they like best", "偏好測試", "p", "B2"], "concordance": ["the degree to which two measures agree", "一致性、吻合程度", "f", "C2"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "Institutional Review Board": ["the ethics committee that must approve research on people", "人體試驗審查委員會（IRB）", "f", "C1"], "informed consent": ["written agreement to take part, given after the risks are explained", "知情同意", "f", "C1"], "statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "standard deviation": ["how spread out the values are around the mean", "標準差", "f", "C1", "描述大家的數值離平均數有多分散。標準差小，代表大家差不多；標準差大，代表個別差異很大。常寫成「平均數 ± 標準差」，例如 82.4 ± 6.8 歲。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。"}, {"id": "wu2025", "part": "Abstract + reading guide", "short": "Wu 2025 · A Chinese eating-motivation instrument (TEMS)", "title": "Cross-cultural translation and linguistic validation of the eating motivation survey among older adults in the Chinese context", "titleZh": "進食動機量表於華人高齡者之跨文化翻譯與語言效度驗證", "titleG": "<em>Cross-cultural translation and linguistic validation of X among Y in the Z context</em>——把量表 X 翻譯成另一種語言並驗證，是工具開發論文的標準標題型。<br><br><em>linguistic validation</em>（語言效度驗證）不是普通翻譯：要正譯、回譯、專家審查、認知訪談，最後再測信效度。四道關卡缺一不可。", "authors": "Wu L, Chen X, Feng H, Cheng S", "journal": "Frontiers in Nutrition, 2025; 12: 1610598", "doi": "10.3389/fnut.2025.1610598", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【核心】這是目前唯一一篇中文、長者、已驗證、五年內、CC BY 全中的進食動機量表。TEMS 中文版 45 題、15 個動機構面，其中「便利」「喜好」「習慣」三個構面，正好是排骨題目最需要控制的干擾因素——用了這個量表，干擾因素就變成測量到的變項。", "done": true, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。", "mesh": [["healthy aging", "健康老化", "作者關鍵字。"], ["food choice", "食物選擇", "本篇與新題目的接點。"], ["eating motivation", "進食動機", "本篇核心構念。"], ["linguistic validation", "語言效度驗證", "工具翻譯的正式程序。"], ["cognitive interview", "認知訪談", "確認受訪者是否照設計者的原意理解題目。"]], "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Diet quality is a determinant of healthy aging and contributes to reducing the risk of chronic diseases such as cardiovascular disease, diabetes, and cancers, which impose considerable burdens on healthcare systems in China.", "zh": "飲食品質是健康老化的決定因素之一，有助於降低心血管疾病、糖尿病與癌症等慢性病的風險，而這些疾病為中國的醫療體系帶來沉重負擔。", "g": "<em>determinant</em>（決定因素）比 factor（因素）語氣更強，指的是對結果有實質決定力的變項。寫研究背景時，這個字要用得節制。"}, {"en": "Despite significant nutritional guidelines, older adults' adherence to healthy eating remains inadequate.", "zh": "儘管已有重要的營養指引，長者對健康飲食的遵從度仍然不足。", "g": "<em>adherence</em>（遵從度）：指引存在是一回事，人照不照做是另一回事。這個落差就是本篇的研究缺口。"}, {"en": "Understanding the determinants is essential for improving their adherence.", "zh": "要提升遵從度，必須先理解其決定因素。"}, {"en": "Eating motivation is a key factor in exploring the reasons behind food choices.", "zh": "進食動機是探討食物選擇背後原因的關鍵因素。", "g": "<em>the reasons behind food choices</em>（食物選擇背後的原因）——這正是排骨題目最缺的那一塊。<br><br>只問「選整塊還是切塊」，得到的是<em>結果</em>；問「為什麼」，得到的才是<em>機制</em>。本篇提供的就是問「為什麼」的標準工具。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "Brislin's classical translation model was rigorously utilized to translate the Eating Motivation Survey (TEMS) into Chinese, involving forward translation, back translation, and expert consultation by a panel of healthcare and nutrition specialists.", "zh": "採用 Brislin 經典翻譯模式將進食動機量表（TEMS）嚴謹地譯為中文，程序包括正譯、回譯，以及由醫護與營養專家小組進行的專家審查。", "g": "<em>Brislin 翻譯模式</em>是量表跨語言移植的公認程序：正譯（英譯中）→ 回譯（中譯英，由不知道原文的人做）→ 比對原文與回譯稿 → 專家審查。<br><br>若論文要沿用任何英文量表，這一段的作法必須照抄進方法段。直接自己翻一翻就拿去用，口試會被問倒。"}, {"en": "Cognitive interviews were conducted for further adaptation to assess clarity, intelligibility, and cultural appropriateness, following the Cognitive Interviewing Reporting Framework (CIRF).", "zh": "並依認知訪談報告架構（CIRF）進行認知訪談，以評估題目的清晰度、可理解性與文化適切性。", "g": "<em>認知訪談</em>（cognitive interview）是請受訪者一邊作答一邊說出自己怎麼理解題目。它檢查的不是答案對不對，而是<em>受訪者理解的題意，和設計者想問的是不是同一件事</em>。<br><br>面對長者，這一步特別重要，也是很值得學起來的技術。"}, {"en": "After linguistic adaptation, the Chinese version of TEMS was used on eligible older adults to test the reliability and validity.", "zh": "完成語言調適後，將中文版 TEMS 施測於符合條件的長者，以檢驗信度與效度。", "g": "<em>reliability</em>（信度）問的是「測得穩不穩」，<em>validity</em>（效度）問的是「測得對不對」。兩者是量表研究的兩根柱子，不能互相替代。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Cognitive interviews conducted with 23 participants over 3 iterative rounds revealed issues with item wording, font size, and layout.", "zh": "對 23 位受訪者進行三輪反覆的認知訪談，發現題目用字、字級與版面配置上的問題。", "g": "注意「字級與版面」也被當成問題處理。面對長者的問卷，<em>看不看得清楚</em>本身就是效度問題，不是美觀問題。"}, {"en": "Additionally, 249 elderly community residents participated in testing the reliability and validity.", "zh": "另有 249 位社區長者參與信效度檢驗。"}, {"en": "A total of 12 items were reworded to adapt the instrument to Chinese culture while maintaining their conceptual objectives.", "zh": "共有 12 題經過改寫，以適應華人文化，同時維持原本的概念目標。", "g": "<em>while maintaining their conceptual objectives</em>（同時維持原本的概念目標）是關鍵限制：可以改說法，不能改它在測什麼。<br><br>這一句話值得記住——它劃出了「本土化」與「另做一份量表」的界線。"}, {"en": "Colloquial words were revised and the formatting was adjusted with 1.5 line spacing and a font size of 14 in SimSun font to enhance readability.", "zh": "口語詞彙經過修訂，版面調整為 1.5 倍行距、14 級宋體字，以提升可讀性。"}, {"en": "Practical examples were added to improve item comprehension, particularly for less-educated respondents.", "zh": "並加入實例以增進題目理解，特別是針對教育程度較低的受訪者。", "g": "這一點對便當研究很實用：高齡受訪者的教育程度差異大，抽象題目（例如「便利性對您有多重要」）常常問不出東西，配上具體例子才問得到。"}, {"en": "The results indicated that Cronbach's alpha coefficient was 0.772, and the split-half coefficient was 0.871.", "zh": "結果顯示 Cronbach's α 係數為 0.772，折半係數為 0.871。", "g": "<em>Cronbach's α</em>（內部一致性信度）的常用判讀：0.7 以上可接受，0.8 以上良好。0.772 屬於可接受。<br><br><em>split-half</em>（折半信度）是把題目拆成兩半，看兩半的結果一不一致。0.871 算好。<br><br>兩個數字放在一起報告，是量表論文的標準作法。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "This study successfully adapts TEMS to the Chinese context, providing a reliable and culturally sensitive measure of eating motivations, which is crucial for developing effective dietary interventions to enhance diet quality and promote healthy aging.", "zh": "本研究成功將 TEMS 調適至華人情境，提供一份信度良好且具文化敏感度的進食動機測量工具，對發展有效的飲食介入、提升飲食品質與促進健康老化至關重要。", "g": "<em>culturally sensitive</em>（具文化敏感度）——量表移植的核心賣點。<br><br>不過台灣與中國的用語仍有差異（宋體、口語詞彙都是中國的習慣）。若要沿用，仍需再做一次台灣本地的詞彙確認，這一點在論文裡要誠實交代。"}, {"en": "The study underscores the importance of considering linguistic and cultural nuances in cross-cultural instrument adaptation and offers insights for future studies.", "zh": "本研究凸顯了跨文化工具調適中語言與文化細節的重要性，並為後續研究提供參考。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "This paper is a tool, not a finding.", "zh": "這一篇是工具，不是發現。", "g": "它沒有回答「長者為什麼這樣吃」，而是提供一把量尺去問這個問題。<br><br>文獻回顧裡的位置也因此不同：它該被放在<em>研究方法</em>的依據，而不是<em>研究背景</em>的證據。"}, {"en": "The fifteen motive dimensions are the reason to keep it.", "zh": "值得收的理由是那十五個動機構面。", "g": "TEMS 共 45 題、15 個構面：喜好、習慣、需求／飢餓、健康、<em>便利</em>、愉悅、傳統飲食、天然、社交、價格、視覺吸引力、體重控制、情緒調節、社會規範、社會形象。<br><br>把這十五個念一遍，會發現一件事：<em>裡面沒有「牙齒」</em>。進食動機這整個研究傳統，從來沒有把口腔狀況放進模型。"}, {"en": "That gap is the opening.", "zh": "這個空缺就是切入點。", "g": "食物選擇行為文獻（TEMS、食物選擇問卷 FCQ）不問口腔；口腔健康文獻（Nitsuwat、Watson、Taira 2023）不問為什麼選。<br><br>兩邊各做各的，中間是空的。把「能不能吃」與「想不想吃」放進同一份問卷，這件事本身就有貢獻。"}, {"en": "Three of the fifteen dimensions answer the confounding problem directly.", "zh": "十五個構面裡，有三個直接回答干擾因素的問題。", "g": "<em>便利</em>、<em>喜好</em>、<em>習慣</em>。<br><br>「就算是年輕人也會選切成三小塊，有時候只是一種喜好或便利性」——這句質疑指到的正是這三個構面。<br><br>只要這三個構面有被測量，它們就不再是干擾因素，而是研究裡的共變項。這是處理干擾最漂亮的一種作法：不是排除它，是測量它。"}, {"en": "Note what this paper counts as a validity problem.", "zh": "注意本篇把什麼算成效度問題。", "g": "字級、行距、字體、口語詞彙、有沒有舉例——這些通常被當成排版細節的東西，在這裡全部是效度問題。<br><br>理由很簡單：看不清楚、聽不懂的題目，答案就不是在測原本要測的東西。設計面向長者的問卷時，這是很實際的提醒。"}, {"en": "It is a Chinese instrument, but not a Taiwanese one.", "zh": "它是中文工具，但不是台灣工具。", "g": "受試者在湖南長沙，字體用宋體，口語詞彙依中國習慣修訂。<br><br>若要在台灣使用，仍需再做一輪本地的詞彙確認與預試，並在論文中說明。直接拿來用而不交代，是口試的送分題。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: this study was funded by the Guangzhou Science and Technology Key Project (Grant no. K0220090).", "zh": "經費：本研究由廣州市科技重點項目補助（計畫編號 K0220090）。", "g": "政府或公部門的研究計畫補助，是利益衝突風險最低的一種經費來源：資助者對研究結果沒有商業利害關係。<br><br>對照 Imamura 2023——經費來自製造受測儀器的廠商。同樣是「有人出錢」，性質完全不同。"}, {"en": "Conflict of interest: the authors declare that the research was conducted in the absence of any commercial or financial relationships that could be construed as a potential conflict of interest.", "zh": "利益衝突：作者聲明本研究在無任何可能被視為潛在利益衝突之商業或財務關係的情況下進行。", "g": "這是一份<em>乾淨</em>的利益衝突聲明，可以拿來當標準範本。<br><br>三個要素齊備：說明了範圍（商業或財務關係）、用了「可能被視為」（could be construed）這種寬認定的措辭、而且與經費聲明沒有矛盾。<br><br>把這一段和 Imamura 2023 的那一段並排，就是最好的教材——一邊是揭露了廠商付薪資卻說「無利益衝突需要揭露」，一邊是這樣。"}, {"en": "Ethics: the studies involving humans were approved by Xiangya Nursing School of Central South University in China.", "zh": "倫理：涉及人體之研究經中國中南大學湘雅護理學院核准。"}, {"en": "Author contributions: LW: conceptualization, formal analysis, investigation, methodology, writing - original draft. XC: writing - original draft, formal analysis. HF: supervision, writing - review and editing. SC: funding acquisition, supervision, writing - review and editing.", "zh": "作者貢獻：LW：研究構思、形式分析、調查執行、方法學、初稿撰寫。XC：初稿撰寫、形式分析。HF：指導、審閱與編修。SC：經費取得、指導、審閱與編修。", "g": "這種以 CRediT 分類（Conceptualization、Methodology、Investigation⋯⋯）逐項列出貢獻的寫法，近年已成為主流。<br><br>值得留意的是：取得經費的人（SC）與執行研究的人（LW）分開，而 SC 的角色限於指導與編修。這降低了經費影響資料的可能。"}, {"en": "Licence: open access under the Creative Commons Attribution License (CC BY 4.0).", "zh": "授權：採創用 CC BY 4.0 授權之開放取用文章。", "g": "CC BY，全文可自由翻譯、註解、散布。若之後決定要做全文逐句版，法律上沒有問題。"}]}], "vocab": {"eating motivation": ["the reasons a person gives for choosing what to eat", "進食動機：一個人選擇吃什麼的理由", "f", "B2"], "linguistic validation": ["the formal process of proving a translated questionnaire still measures what the original measured", "語言效度驗證：證明譯後問卷仍測到原問卷所測之物的正式程序", "f", "C1"], "back translation": ["translating the translated version back into the original language, by someone who has not seen the original", "回譯：由未看過原文者，將譯本再譯回原語言", "f", "B2"], "cognitive interview": ["asking respondents to think aloud while answering, to check they read the item as intended", "認知訪談：請受訪者邊作答邊說出想法，以確認題意理解無誤", "f", "C1"], "adherence": ["how closely people actually follow a guideline or treatment", "遵從度：人們實際遵循指引或療程的程度", "v", "B2"], "culturally sensitive": ["adapted so that it fits the assumptions and habits of the culture it is used in", "具文化敏感度：經過調整以貼合使用地的文化習慣與預設", "p", "B2"], "conceptual objective": ["what an item is meant to measure, as distinct from the words it uses", "概念目標：題目要測的東西，與它的措辭區分開來", "f", "C1"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "confounding": ["a third factor that affects both the cause and the outcome", "干擾因素", "f", "C1", "同時影響「原因」和「結果」的第三個因素，會讓兩者看起來有關係，其實不然。例如年紀大的人牙齒少，也比較常吃軟食；不控制年齡，就可能誤以為牙齒少「造成」吃軟食。處理方式：設計時配對或排除，分析時放進迴歸調整。"], "Cronbach's alpha": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "Cronbach": ["a measure of whether the items of a questionnaire measure the same thing", "Cronbach's α（內部一致性）", "f", "C1", "檢查一份問卷的題目是不是在測同一件事。例如十題都在問咀嚼，受訪者的答案應該要一致。數值 0 到 1：0.7 以上可接受、0.8 以上良好。太高（超過 0.95）反而可能代表題目重複。"], "split-half coefficient": ["agreement between two halves of the same questionnaire", "折半信度", "f", "C1", "把問卷題目分成兩半，看兩半的結果是否一致。越一致，代表整份問卷在測同一件事。"], "reliability": ["how consistent a measurement is", "信度", "f", "C1", "測量工具「穩不穩」：同一個人再測一次，或換一個人來測，結果會不會一樣。信度差的工具，量出來的數字本身就不可靠。常見指標有 Cronbach's α、ICC、kappa。"], "validity": ["whether a tool measures what it claims to measure", "效度", "f", "C1", "測量工具「準不準」：是不是真的測到想測的東西。信度是穩，效度是準；穩不一定準，但不穩一定不準。"]}, "no": "Paper 7"}, {"id": "mena2020", "part": "Abstract + reading guide", "short": "Mena 2020 · What older Australians and Chinese want from a meal", "title": "Exploring Meal and Snacking Behaviour of Older Adults in Australia and China", "titleZh": "澳洲與中國高齡者的餐食與點心行為探討", "titleG": "<em>Exploring X of Y in A and B</em>——探索性研究的標準標題，動名詞 <em>Exploring</em> 開頭就先聲明「這不是驗證假設，是去看看有什麼」。<br><br>探索性研究的結論不能講死，但它適合用在一個領域還沒有定論的時候。新題目目前就是這個階段。", "authors": "Mena B, Ashman H, Dunshea FR, Hutchings S, Ha M, Warner RD", "journal": "Foods, 2020; 9(4): 426", "doi": "10.3390/foods9040426", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【核心】這是目前找到最貼近排骨題目的一篇：焦點團體加聯合分析，受訪者含 60–81 歲的中國長者，結論直指「質地與風味是食物選擇的主要驅動因素」，而且明確記錄了長者覺得肉製品難吃下去（牛肉乾太乾太硬）。質地—選擇—肉類三件事在同一篇裡。", "done": true, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。", "mesh": [["focus group", "焦點團體", "質性資料的收集方式。"], ["meat products", "肉製品", "與排骨題目最直接相關的一項。"], ["qualitative multivariate analysis", "質性多變量分析", "本篇的方法特色。"], ["conjoint analysis", "聯合分析", "把選擇拆解成各屬性貢獻的方法。"], ["older adults", "高齡者", "研究對象。"]], "abstract": [{"h": "Abstract", "zh": "摘要", "s": [{"en": "Sensory perception and food preferences change as we age.", "zh": "感官知覺與食物偏好會隨年齡而改變。", "g": "開門見山把兩件事並列：<em>感官</em>（嚐得到什麼）與<em>偏好</em>（想要什麼）。<br><br>這個區分對排骨題目很有用——它提醒我們，除了咀嚼能力，味覺與嗅覺的退化也會改變選擇。又多一個要交代的干擾因素。"}, {"en": "This paper encompassed two studies with the aim being to investigate meal and snacking behaviour of older adults towards food, especially meat products, and understand the desirable characteristics of those products.", "zh": "本文包含兩項研究，目的是探討高齡者對食物、尤其是肉製品的餐食與點心行為，並了解這些產品的理想特性。", "g": "<em>two studies</em>（兩項研究）——一篇論文裡放兩個設計不同的研究，是消費者研究的常見作法：先質性探索，再量化驗證。<br><br>碩論其實也可以這樣安排：先訪談幾位長者找出他們在意什麼，再據此設計選擇任務。"}, {"en": "A qualitative multivariate analysis (QMA) focus group with Australian and Chinese older (60-81 years old) adults was conducted.", "zh": "以澳洲與中國的高齡者（60–81 歲）進行質性多變量分析（QMA）焦點團體。", "g": "受訪者包含<em>中國長者</em>，這是本篇對台灣研究最有價值的地方——飲食文化較接近，可比性遠高於純西方樣本。"}, {"en": "A conjoint concept database was used to determine older consumers' wants and needs for food in Australia and China.", "zh": "並以聯合分析概念資料庫判定澳洲與中國高齡消費者對食物的需求與想望。", "g": "<em>conjoint analysis</em>（聯合分析）是關鍵詞。它把一個產品拆成若干屬性（例如：大小、軟硬、價格、外觀），系統性地組合後讓人選，再反推每個屬性各佔多少權重。<br><br>「整塊排骨 vs 切成三小塊」就是一個只有一個屬性、兩個水準的極簡聯合分析。若日後要做得更完整，這篇是方法的出處。"}, {"en": "The QMA suggested that Australian consumers are not eating a proper breakfast or dinner but are 'snacking' throughout the day.", "zh": "QMA 顯示澳洲消費者不吃正式的早餐或晚餐，而是整天「吃點心」。"}, {"en": "In contrast, Chinese consumers are eating three regular meals through the day and occasionally snacks.", "zh": "相對地，中國消費者一天吃三餐，偶爾吃點心。", "g": "這個對比很重要：<em>用餐型態本身有文化差異</em>。<br><br>「便當」這個形式在台灣之所以成立，正是因為一日三餐、一餐一盒的結構。引用西方的高齡飲食文獻時，這個前提要先講清楚，否則推論會斷掉。"}, {"en": "For both groups, texture and flavour were key drivers for food choice.", "zh": "對兩組而言，質地與風味都是食物選擇的主要驅動因素。", "g": "全篇最值得抄的一句。<em>texture ... key drivers for food choice</em>——質地是食物選擇的主要驅動因素。<br><br>這句話直接支撐了排骨題目的前提：質地確實會驅動選擇。而且它成立於澳洲與中國兩個文化，不是單一族群的現象。<br><br>注意作者說的是 <em>drivers</em>（驅動因素），不是 determinants（決定因素）——語氣留了餘地，探索性研究該有的謹慎。"}, {"en": "Difficulty in eating meat products was evident, e.g., beef jerky was found too dry and hard.", "zh": "食用肉製品的困難相當明顯，例如牛肉乾被認為太乾、太硬。", "g": "肉製品是高齡飲食的痛點，而且被點名的正是<em>乾與硬</em>這兩個質地屬性。<br><br>排骨的問題同樣落在這兩個字上。這句話可以直接用來說明：為什麼選一道肉類菜色來測，而不是選青菜。"}, {"en": "Older consumers in China and Australia differed in responses to the four food categories investigated in terms of product traits and segmentation.", "zh": "中國與澳洲的高齡消費者，在所調查的四類食物上，於產品特性與市場區隔的反應有所不同。"}, {"en": "Both the conjoint analysis and QMA showed that demographics have an impact on consumer preferences towards food.", "zh": "聯合分析與 QMA 均顯示，人口學變項會影響消費者對食物的偏好。", "g": "<em>demographics</em>（人口學變項：年齡、性別、教育、收入等）會影響偏好——所以這些在分析時必須控制。<br><br>對便當研究的意思很直接：比較不同口腔狀況的長者時，得先確認兩組在年齡、性別、教育上沒有系統性差異，否則分不清是牙齒的效果還是背景的效果。"}, {"en": "This research suggested that there is an opportunity to create ready-to-eat, nutrient dense products to enhance the wellness of older consumers.", "zh": "本研究指出，開發即食、高營養密度的產品以增進高齡消費者的健康，是一個機會。", "g": "<em>ready-to-eat</em>（即食餐點）是英文文獻裡與「便當」最接近的概念。查資料時，用 ready-to-eat meals、home-delivered meals、meal service 這幾個詞，比用 lunch box 找得到的東西多得多。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "This is the closest paper so far to the rib question.", "zh": "目前為止，這是最貼近排骨題目的一篇。", "g": "三件事在同一篇裡湊齊了：<em>質地驅動選擇</em>、<em>肉製品是痛點</em>、<em>受訪者包含華人長者</em>。<br><br>其他幾篇通常只占其中一項。"}, {"en": "It comes from food science, not dentistry.", "zh": "它來自食品科學，不是牙醫學。", "g": "作者群隸屬墨爾本大學的農業與食品系，發表在 <em>Foods</em>。整篇沒有提到牙齒、假牙或咀嚼功能。<br><br>這說明了一件事：關於「長者怎麼選食物」的知識，有一大半不在牙醫的文獻庫裡。查資料時若只搜 PubMed 的牙科關鍵字，會整片漏掉。"}, {"en": "Learn the method, not just the findings.", "zh": "要學的是方法，不只是結果。", "g": "<em>聯合分析</em>（conjoint analysis）的核心邏輯：不要問「你覺得軟硬重不重要」，而是給出一組組具體選項讓人挑，再從選擇反推每個屬性的權重。<br><br>理由是：人說得出口的理由，與實際選擇時的依據，常常不一樣。直接問重要性會得到客氣的答案；讓人選，會得到真實的權衡。<br><br>「整塊 vs 切塊」就是這個方法最簡單的版本。"}, {"en": "The two-study structure is worth copying.", "zh": "兩階段的結構值得借用。", "g": "先做焦點團體（質性），找出長者真正在意什麼；再據此設計量化的選擇任務。<br><br>這個順序能避免一個常見錯誤：研究者自己想當然地決定要測哪些屬性，結果測了一堆受訪者根本不在乎的東西。<br><br>若時間允許，先訪談五、六位長者再定案，會讓後面的設計穩很多。"}, {"en": "The sample sizes are very different between the two studies.", "zh": "兩項研究的樣本數差距極大。", "g": "焦點團體 37 人（澳洲 16、中國 21），聯合分析問卷則有 14,400 份。<br><br>引用時要說清楚是引用哪一項。把「14,400 人的研究發現質地是主要驅動因素」寫進文獻回顧，是不準確的——那句結論主要來自焦點團體。"}, {"en": "Read the age range carefully.", "zh": "年齡範圍要看清楚。", "g": "焦點團體是 60–81 歲，聯合分析問卷則是 55 歲以上。<br><br>55 歲以上是「熟齡消費者」，不是老年醫學意義上的高齡者。兩者的口腔狀況與咀嚼能力差距很大，引用時不能含混地都說成「長者」。<br><br>同樣的提醒也適用於 Talens 2022——那篇的受訪者有 62% 落在 50–59 歲。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: this research was funded by The University of Melbourne through a Melbourne Research Scholarship. The conjoint study was supported by the Australian Government through the Australian Research Council (Grant number IH120100053), 'Unlocking the Food Value Chain: Australian industry transformation for ASEAN markets'.", "zh": "經費：本研究由墨爾本大學透過墨爾本研究獎學金補助。聯合分析部分由澳洲政府透過澳洲研究委員會補助（計畫編號 IH120100053），計畫名稱為「解鎖食品價值鏈：澳洲產業面向東協市場的轉型」。", "g": "值得停下來看的是計畫名稱：「解鎖食品價值鏈——澳洲產業面向東協市場的轉型」。<br><br>這是一個<em>產業發展導向</em>的計畫。它不是商業公司出錢，但也不是中性的基礎研究經費：計畫目標本身就是協助產業開發新市場。<br><br>結論「有機會開發即食、高營養密度的產品」與這個目標方向一致。這不構成利益衝突，但屬於<em>經費的取向</em>會影響研究問題選擇的情形，是閱讀時該留意的一層。"}, {"en": "Conflicts of interest: the authors declare no conflict of interest. The funders had no role in the design of the study; in the collection, analyses, or interpretation of data; in the writing of the manuscript, or in the decision to publish the results.", "zh": "利益衝突：作者聲明無利益衝突。資助者未參與研究設計、資料收集、分析或詮釋，未參與稿件撰寫，亦未參與發表決定。", "g": "第二句是利益衝突聲明的<em>黃金標準句型</em>，把資助者可能介入的五個環節逐一排除：設計、收集、分析／詮釋、撰寫、發表決定。<br><br>三篇並排就看得很清楚：<br>本篇與 Limpuangthip 2022——有這一句。<br>Imamura 2023——沒有這一句，而且揭露了廠商支付薪資之後還說「無利益衝突需要揭露」。<br><br>寫自己的論文時，這一句照著寫。"}, {"en": "Ethics: this exploratory study was conducted under the University of Melbourne human ethics protocol number 1749295; all participants provided informed consent.", "zh": "倫理：本探索性研究於墨爾本大學人體研究倫理案號 1749295 下執行，所有受訪者均提供知情同意。", "g": "焦點團體同樣需要倫理審查與知情同意。質性研究不是「只是聊聊天」就可以省略程序的。<br><br>原文另提到受訪者簽署了過敏原同意書——凡是讓受訪者實際接觸或食用食物的研究，過敏風險必須事先處理。這一點在排骨題目上同樣適用。"}, {"en": "Licence: open access under the Creative Commons Attribution License (CC BY 4.0).", "zh": "授權：採創用 CC BY 4.0 授權之開放取用文章。", "g": "MDPI 出版的論文預設為 CC BY。全文可自由翻譯與註解，若之後決定要做全文逐句版，法律上沒有問題。"}]}], "vocab": {"sensory perception": ["how the senses register taste, smell, texture and appearance", "感官知覺：味覺、嗅覺、質地與外觀的感知", "f", "B2"], "food preference": ["what a person likes, independent of what they are able to eat", "食物偏好：一個人喜歡什麼，與能不能吃無關", "f", "B1"], "snacking": ["eating small amounts between meals instead of at set mealtimes", "吃點心：在正餐之間少量進食，而非在固定餐時", "v", "B1"], "conjoint analysis": ["a method that works out how much each product attribute matters by watching which combinations people choose", "聯合分析：藉由觀察人們選擇哪些組合，推算各項產品屬性的權重", "f", "C1"], "driver": ["a factor that pushes a decision one way", "驅動因素：把決定推往某個方向的因素", "v", "B2"], "segmentation": ["dividing consumers into groups that want different things", "市場區隔：將消費者分成需求不同的群體", "f", "B2"], "demographics": ["background characteristics such as age, sex, education and income", "人口學變項：年齡、性別、教育、收入等背景特徵", "f", "B2"], "ready-to-eat": ["food sold in a form that needs no further cooking", "即食：售出時無須再烹調的食物型態", "p", "B1"], "nutrient dense": ["containing a lot of nutrients relative to the amount of food", "高營養密度：相對於分量含有較多營養素", "p", "B2"], "beef jerky": ["dried strips of beef, a hard and chewy snack", "牛肉乾：乾燥的牛肉條，質地硬而耐嚼", "v", "B1"], "multivariate analysis": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "multivariate": ["an analysis that considers several factors at once", "多變項分析", "f", "C1", "同時考慮好幾個因素的分析，例如迴歸。目的就是控制干擾因素：在其他因素都一樣的情況下，某個因素還有沒有影響。"], "sample sizes": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"]}, "no": "Paper 8"}, {"id": "alamoush2025", "no": "Paper 9", "part": "Abstract + study guide", "short": "Alamoush 2025 · Chewing, quality of life and satisfaction before and after dentures", "title": "Impact of a removable prosthesis on chewing ability, quality of life, and patient satisfaction", "titleZh": "活動補綴物對咀嚼能力、生活品質與病人滿意度的影響", "titleG": "<em>Impact of A on B, C, and D</em> — A（活動補綴物）對 B、C、D 三件事的影響。標題把三個結果變項並列，對應摘要裡的三個研究目的。", "authors": "Alamoush RA, Abu-Mahfouz HN, Rahhal RJ, Alnsour MM, Alakhras OM, Thaher RS, Haider J, AL-Omiri MK", "journal": "Scientific Reports, 2025; 15: 39038", "doi": "10.1038/s41598-025-23340-0", "lic": "Open access under CC BY-NC-ND 4.0 — no-derivatives licence. Abstract reproduced for study; notes and guide are InkQuest's own. Do not redistribute this annotated version.", "why": "【背景】十種食物的咀嚼量表仍可參考，也是唯一治療前後各測一次的研究。滿意度部分新題目用不到。", "done": true, "abstract": [{"h": "Aim", "zh": "研究目的", "s": [{"en": "This study aimed to investigate the effects of removable prostheses on oral health-related quality of life (OHRQoL), the effects of removable prostheses on chewing ability and the effects of prosthesis type (Removable partial denture RPD versus complete denture CD) and sociodemographic factors on both chewing ability and OHRQoL.", "zh": "本研究旨在探討活動補綴物對口腔健康相關生活品質的影響、對咀嚼能力的影響，以及假牙類型（活動局部假牙與全口假牙）與社會人口因素對咀嚼能力與生活品質的影響。", "g": "一句話塞了三個目的，讀的時候先數 <em>the effects of...</em> 出現幾次，就知道有幾個研究問題。這篇有三個，論文後面也用 (I) (II) (III) 標出來。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "Data from 90 participants were collected using a questionnaire.", "zh": "以問卷收集 90 位受試者的資料。"}, {"en": "Chewing ability and OHRQoL were assessed before and after treatment through questionnaires.", "zh": "咀嚼能力與生活品質於治療前後各以問卷評估一次。", "g": "<em>before and after treatment</em>（治療前後）是這篇跟前四篇最大的不同：前面幾篇都只測一次，這篇測兩次。同一批人測前後，就能看出「變化」而不只是「差異」。"}, {"en": "Differences between the RPD and CD treatment groups in terms of demographic variables and previous denture experience were analysed using the Mann–Whitney U test.", "zh": "兩組在人口變項與過去配戴經驗上的差異，以 Mann–Whitney U 檢定分析。"}, {"en": "A two-tailed α of 0.05 and 95% confidence intervals were applied to identify statistically significant results in this survey.", "zh": "以雙尾 α 0.05 與 95% 信賴區間判定統計顯著性。", "g": "<em>two-tailed</em>（雙尾）表示不預設差異的方向，兩邊都檢定。相對的是單尾，只檢定一個方向。研究若沒有明確的方向假設，一律用雙尾比較保險。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "Participants with RPD or CD demonstrated significant improvements in chewing ability and OHRQoL post-treatment (p<0.05), except for females in the RPD group, who showed no significant changes.", "zh": "兩組在治療後的咀嚼能力與生活品質都有顯著改善，唯獨活動局部假牙組的女性沒有顯著變化。", "g": "<em>except for...</em> 這個例外才是重點。作者在討論段花了整段解釋：可能與女性對美觀的期待較高、以及心理社會因素有關。這也呼應 Tosun 那篇「女性滿意度較低」的發現。"}, {"en": "Compared with the CD group, the RPD group had significantly better chewing ability both before (p<0.001) and after (p=0.027) treatment.", "zh": "與全口假牙組相比，活動局部假牙組在治療前後的咀嚼能力都顯著較佳。", "g": "「治療前就比較好」這件事要小心解讀：局部假牙的人本來就還有真牙，起點不同。這不是假牙的功勞，是牙齒的功勞。"}, {"en": "Stepwise regression revealed that higher income and smoking were associated with better pre-treatment outcomes, whereas having multiple dentures and smoking predicted worse post-treatment chewing scores.", "zh": "逐步迴歸顯示，較高收入與吸菸與較佳的治療前結果有關；而配戴多副假牙與吸菸則預測較差的治療後咀嚼分數。", "g": "<em>stepwise regression</em>（逐步迴歸）是讓軟體自動挑變項進出模型的做法，跟 Yen 那篇「研究者自己分四步投入」的階層式迴歸不同。逐步法比較容易過度配適，近年有不少批評，是可以拿來比較兩種做法的好例子。<br><br>另外注意吸菸這個變項：治療前是「較好」，治療後卻是「較差」，方向相反。作者自己也稱它 paradoxical（看似矛盾）。"}, {"en": "Notably, higher post-treatment chewing scores were associated with improved OHRQoL.", "zh": "值得注意的是，治療後咀嚼分數較高者，其生活品質也較好。", "g": "咀嚼與生活品質之間的橋樑。新題目若要說明「為什麼便當選擇值得研究」，這條線可以用。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Both the RPD and CD groups reported improved chewing ability and OHRQoL, with RPD resulting in superior functional outcomes.", "zh": "兩組的咀嚼能力與生活品質都有改善，其中活動局部假牙的功能性結果較佳。"}, {"en": "Sociodemographic factors such as income, sex, age, and smoking habits influenced the results both before and after treatment.", "zh": "收入、性別、年齡與吸菸習慣等社會人口因素，在治療前後都影響了結果。"}, {"en": "These findings highlight the importance of individualised patient assessment and support the clinical value of RPDs in partially edentulous patients.", "zh": "這些發現凸顯個別化評估的重要性，並支持活動局部假牙在部分缺牙病人身上的臨床價值。", "g": "結論又回到「保留真牙、優先考慮局部假牙」——與 Yen 2015、Taira 2023、Tosun 2024 完全一致。四篇不同國家、不同設計的研究指向同一個結論，這在文獻回顧裡就可以寫成一條明確的共識。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "This is the only paper in the set that measures the same people twice.", "zh": "這是目前這組文獻中唯一對同一批人測量兩次的研究。", "g": "治療前一次、治療後一次，屬於 <em>pre-post design</em>（前後測設計）。它能看出「變化」，而橫斷式研究只能看出「差異」。這是研究設計上的一個明顯升級，值得跟其他幾篇對照。"}, {"en": "Watch the direction of the OHRQoL score here.", "zh": "留意這篇生活品質分數的方向。", "g": "這篇自編的量表是 9 題、總分 9 到 45，<em>分數越低代表生活品質越好</em>（與 OHIP 同向、與 GOHAI 相反）。論文寫 improved OHRQoL 時常在括號裡註明 lower scores，讀的時候要跟著確認。"}, {"en": "The chewing scale is built from ten specific foods.", "zh": "咀嚼量表由十種具體食物組成。", "g": "醃漬物、新鮮水果、乾果、肉類與雞肉、魚、堅果、甜食、煮熟蔬菜、麵包與餅乾、生菜，每題 0 到 2 分，總分 0 到 20。這種「用食物清單測咀嚼能力」的做法，可以直接改寫成「便當裡這幾道菜您吃得動嗎」的題型。"}, {"en": "The sample is not elderly.", "zh": "這個樣本不是高齡族群。", "g": "多數在 40 至 60 歲（53.3%），60 至 80 歲占 37.8%，只有一位 80 歲以上。約旦單一大學的學生實習診所。引用時要寫成「成人假牙使用者」，不能寫成「高齡者」。"}, {"en": "The two groups were not comparable at baseline.", "zh": "兩組在治療前本來就不一樣。", "g": "全口假牙組年紀較大、收入較低、較多人失業或退休、吸菸比例較高。作者自己在表一列出這些差異都達顯著。所以兩組的比較要很小心：差異可能來自族群本身，而不是假牙類型。"}, {"en": "The smoking result is worth discussing.", "zh": "吸菸那個結果值得討論。", "g": "吸菸在治療前與較好的生活品質有關，治療後卻與較差的咀嚼分數有關。作者稱之為 paradoxical，並推測與吸菸改變感官知覺、以及吸菸者對口腔不適的適應有關。這種「自己也覺得奇怪」的誠實態度，是好論文的特徵。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: no funding was received for this work.", "zh": "經費：本研究未獲任何經費。"}, {"en": "Competing interests: the authors declare no competing interests.", "zh": "利益衝突：作者聲明無利益衝突。"}, {"en": "Ethical approval: Institutional Review Board / Deanship of Scientific Research at the University of Jordan (Reference: 10/2024/10,673).", "zh": "倫理審查：約旦大學人體試驗審查委員會／學術研究長室（編號 10/2024/10,673）。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "The two groups were not comparable at baseline.", "zh": "兩組在治療前本來就不一樣。", "g": "全口假牙組年紀較大、收入較低、較多無業或退休、吸菸比例較高，作者在表一列出這些差異都達顯著。所以兩組的比較要很小心：差異可能來自族群本身，而不是假牙類型。「治療前局部假牙組咀嚼就比較好」尤其如此——那是因為他們還有真牙，不是假牙的功勞。"}, {"en": "The smoking result contradicts itself, and the authors say so.", "zh": "吸菸的結果自相矛盾，作者也承認。", "g": "吸菸在治療前與較好的生活品質有關，治療後卻與較差的咀嚼分數有關。作者直接用 paradoxical（看似矛盾）形容，並推測與吸菸改變感官知覺、以及吸菸者對口腔不適的適應有關。敢寫「這看起來矛盾」是誠實的表現。"}, {"en": "This paper calculated its sample size in advance; Goguta 2023 did not.", "zh": "本篇事前算過樣本數，Goguta 2023 沒有。", "g": "本篇以 G*Power 做事前檢定力分析：檢定力 0.8、效果量 0.2、雙尾 α 0.05，估得需要 84 人，實收 90 人。<br><br><em>Goguta 2023</em>則完全沒有這一步，每組只收 17 人。結果就是存活率 94.1% 對 88.2%（實際只差一個人）測不出顯著，而作者把它解讀成「兩者相近」。<br><br>這兩篇放在一起看，就知道事前算樣本數不是形式：算過，才有資格說「沒有差異」；沒算過，只能說「這份資料看不出差異」。這個區分在口試被問到時特別重要。"}, {"en": "This is the only paper that measures the same people twice.", "zh": "這是唯一對同一批人測量兩次的研究。", "g": "治療前一次、治療後一次，屬於<em>前後測設計</em>。它能看出「變化」，而橫斷式研究只能看出「差異」。這是研究設計上的明顯升級。"}, {"en": "Female RPD wearers showed no improvement at all.", "zh": "局部假牙組的女性完全沒有改善。", "g": "咀嚼分數 p=0.751、生活品質 p=0.508，兩項都沒動。作者推測與女性美觀期待較高、以及心理社會因素有關。這呼應 Tosun 2024「女性滿意度較低」的發現，兩篇可以放在一起談。"}, {"en": "Stepwise regression is not the same as hierarchical regression.", "zh": "逐步迴歸與階層式迴歸不是同一回事。", "g": "本篇用逐步迴歸，由軟體自動增減變項；Yen 2015 用階層式迴歸，由研究者依理論決定投入順序。逐步法方便但容易過度配適、結果不穩定，近年受到不少批評。兩篇正好可以對照。"}, {"en": "The chewing scale is a list of ten foods.", "zh": "咀嚼量表就是十種食物的清單。", "g": "醃漬物、新鮮水果、乾果、肉類與雞肉、魚、堅果、甜食、煮熟蔬菜、麵包與餅乾、生菜，每題 0 到 2 分。這種「用食物清單測咀嚼能力」的做法，可以直接改寫成便當菜色的題型。"}]}], "vocab": {"removable prostheses": ["dentures the wearer takes out; covers both partial and complete", "活動補綴物：可取下的假牙，含局部與全口", "f", "B2"], "chewing ability": ["how well a person can chew; here scored on ten named foods", "咀嚼能力；本篇以十種指定食物計分", "f", "B1"], "prosthesis type": ["which kind of denture — partial or complete", "假牙類型：局部或全口", "p", "B2"], "sociodemographic factors": ["background facts such as income, sex, age, education and smoking", "社會人口因素：收入、性別、年齡、教育、吸菸等", "f", "C1"], "before and after treatment": ["measured twice on the same people — a pre-post design", "治療前後各測一次，屬前後測設計", "c", "B1"], "two-tailed": ["testing for a difference in either direction, not just one", "雙尾：不預設方向，兩邊都檢定", "f", "C1"], "post-treatment": ["after the treatment was given", "治療後", "v", "B1"], "pre-treatment": ["before the treatment was given", "治療前", "v", "B1"], "multiple dentures": ["wearing more than one denture at the same time", "配戴多副假牙", "p", "B2"], "individualised patient assessment": ["judging each patient separately rather than applying one rule", "個別化的病人評估", "p", "C1"], "partially edentulous": ["missing some but not all teeth", "部分缺牙", "f", "C1"], "superior": ["better than the alternative", "較優的、勝過的", "v", "B2"], "competing interests": ["whether the authors have anything to gain from the result", "利益衝突：作者是否從研究結果中獲益", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "Ethical approval": ["permission from an ethics committee to study people", "倫理審查核准", "f", "C1"], "Institutional Review Board": ["the ethics committee that must approve research on people", "人體試驗審查委員會（IRB）", "f", "C1"], "statistically significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significantly": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "significant improvements": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "p<0.05": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "p<0.001": ["the probability of seeing a result this large if there were really no difference", "p 值", "f", "C1", "假設兩組其實沒有差別，純屬巧合會看到這麼大差異的機率。p < .05 表示這個機率小於 5%，所以判定差異不是巧合。p 值越小越不像巧合，但 p 值只回答「有沒有差」，不回答「差多少」。"], "confidence intervals": ["a range that probably contains the true value", "95% 信賴區間", "f", "C1", "研究只測了一部分人，算出的數字一定有誤差。信賴區間給一個範圍：真正的數值很可能落在裡面。範圍越窄，估計越精準。比較兩組的差值時，區間沒有跨過 0（比值則是沒有跨過 1），通常就代表顯著。"], "Mann–Whitney U test": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "Mann–Whitney": ["a non-parametric test comparing two groups", "Mann–Whitney U 檢定", "f", "C1", "t 檢定的無母數版本，同樣比較兩組，但比的是排名（大致是中位數），不需要常態分布。資料歪斜或是順序分數時使用。"], "regression": ["a model that estimates each factor's link to the outcome while holding the others constant", "迴歸分析", "f", "C1", "同時放進好幾個因素，看每個因素在「其他因素固定不變」的情況下，和結果還有沒有關係。例如年齡和缺牙數常綁在一起，迴歸可以把兩者的影響分開。這是控制干擾因素最常用的方法。"], "hierarchical regression": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "hierarchical": ["regression in which factors are entered in planned blocks", "階層迴歸", "f", "C1", "把因素分批放進模型：先放背景因素（年齡、性別），再放研究者關心的因素（例如假牙狀況），看新加的那一批能多解釋多少結果。用來回答「扣掉背景因素之後，這個因素還重要嗎？」"], "Stepwise regression": ["regression in which the software picks factors automatically", "逐步迴歸", "f", "C1", "由電腦自動挑因素，一次加入或刪除一個，留下統計上最有用的幾個。方便，但常被批評：挑選看的是數字不是理論，換一批樣本結果可能就不同。和階層迴歸不一樣，階層迴歸的順序是研究者依理論決定的。"], "stepwise": ["regression in which the software picks factors automatically", "逐步迴歸", "f", "C1", "由電腦自動挑因素，一次加入或刪除一個，留下統計上最有用的幾個。方便，但常被批評：挑選看的是數字不是理論，換一批樣本結果可能就不同。和階層迴歸不一樣，階層迴歸的順序是研究者依理論決定的。"], "sample size": ["the number of participants in a study", "樣本數", "f", "B2", "研究收了多少人。人太少，就算真的有差別也可能測不出來；所以好的研究會在收案前先算「至少需要幾個人」，叫作樣本數計算。沒有做這一步的研究，陰性結果要特別小心解讀。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "mesh": [["Removable partial dentures (RPDs)", "活動局部假牙", "作者關鍵字。"], ["Complete dentures (CDs)", "全口假牙", "作者關鍵字。"], ["Chewing ability", "咀嚼能力", "本篇以十種食物組成的量表測量，總分 0–20。"], ["Oral health-related quality of life (OHRQoL)", "口腔健康相關生活品質", "本篇自編九題量表，總分 9–45，分數越低越好。"], ["Denture treatment outcomes", "假牙治療成效", "作者關鍵字。"]], "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。<br><br><em>授權提醒：</em>CC BY-NC-ND，允許非商業重製但不允許散布改作版本。此註解版請勿對外流通。"}, {"id": "nedeljkovic2023", "no": "Paper 10", "short": "Nedeljković 2023 · Subjective vs objective chewing, and what occlusion is made of", "title": "Subjective and Objective Assessment of Chewing Performance in Older Adults with Different Dental Occlusion", "titleZh": "不同咬合狀況長者咀嚼表現的主觀與客觀評估", "titleG": "<em>A and B Assessment of C in D with E</em> — 在 D（長者）、具 E（不同咬合狀況）的前提下，對 C（咀嚼表現）進行 A 與 B 兩種評估。標題把兩種評估方式並列，是比較型研究的典型寫法。", "authors": "Nedeljković Đ, Milić Lemić A, Kuzmanović Pfićer J, Stančić I, Popovac A, Čelebić A", "journal": "Med Princ Pract, 2023; 32: 110-116", "doi": "10.1159/000529240", "lic": "Open access under CC BY-NC 4.0 — non-commercial use only.", "why": "【背景】主客觀咀嚼一致（r=0.742），與 Chen 2025 互相印證。另發現功能牙單位的「類型」比「數量」更重要——記錄口腔狀況時值得參考。", "mesh": [["Chewing efficiency", "咀嚼效率", "以兩色口香糖混合測試量化。"], ["Two-color gum mixing test", "兩色口香糖混合測試", "客觀咀嚼評估工具。"], ["Chewing function questionnaire", "咀嚼功能問卷（CFQ）", "主觀評估工具，0–4 分李克特量表。"], ["Type of dentures", "假牙類型", "本篇發現類型比數量更能預測咀嚼功能。"], ["Teeth functional units", "功能牙單位", "與 occlusal support、Eichner index 為同一概念。"]], "part": "Abstract + study guide", "done": true, "abstract": [{"h": "Objectives", "zh": "研究目的", "s": [{"en": "Satisfactory masticatory function is a significant indicator of improved oral health-related quality of life in older adults, either with or without artificial teeth.", "zh": "良好的咀嚼功能是長者口腔健康相關生活品質改善的重要指標，不論其有無人工牙。"}, {"en": "The purpose of this study was to examine masticatory performance of older adults with different prosthodontic reconstructions and occlusion, as well as to compare subjective and objective assessment of chewing performance.", "zh": "本研究旨在檢視不同補綴重建與咬合狀況長者的咀嚼表現，並比較主觀與客觀的咀嚼評估。", "g": "又是主客觀比較——跟 Chen 2025 問同一個問題，只是換了工具、換了國家。兩篇可以互相印證。"}]}, {"h": "Material and Methods", "zh": "材料與方法", "s": [{"en": "This study included 100 participants aged 65 and more.", "zh": "本研究納入 100 位 65 歲以上受試者。"}, {"en": "The chewing function questionnaire (CFQ) with answers on the Likert scale 0–4 was used as an indicator of subjective masticatory assessment.", "zh": "以咀嚼功能問卷（CFQ）作為主觀咀嚼評估指標，採 0 至 4 分李克特量表（0 為無困難、4 為困難最大）。"}, {"en": "The two-color chewing gum test was used as objective assessment of masticatory function, based on the Z-score values.", "zh": "以兩色口香糖測試作為咀嚼功能的客觀評估，依 Z 分數判讀。", "g": "<em>two-color chewing gum test</em>（兩色口香糖混合測試）：嚼一段時間後把口香糖壓平，看兩種顏色混合得多均勻。混得越均勻代表咀嚼效率越好。這是目前國際上最常用的客觀咀嚼測試之一，比軟糖測試便宜、比花生測試乾淨。"}, {"en": "Dental occlusion was assessed using functional teeth units (FTU).", "zh": "咬合狀況以功能牙單位（FTU）評估。", "g": "<em>functional teeth units</em>（功能牙單位）是上下顎能對咬的成對後牙數。跟 Taira 2023 的 occlusal support、Chen 2025 的 Eichner index 是同一概念的三種算法——同一件事有三種名字，讀跨篇文獻時要認得出來。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "The results obtained using the CFQ and the clinical mixing ability test are in compliance with each other (r = 0.742).", "zh": "咀嚼功能問卷與臨床混合能力測試的結果彼此相符（r = 0.742）。", "g": "r = 0.742 是相當高的相關。與 Chen 2025 的結論一致：長者自評的咀嚼能力，跟儀器測出來的咀嚼表現對得上。<br><br>兩篇用不同工具、不同國家、不同樣本都得到同樣結論，這種<em>一致性</em>比單一研究有說服力得多。"}, {"en": "A decrease in the number of natural teeth, especially posterior teeth, progressively reduced chewing ability and increased difficulties in mastication.", "zh": "天然牙數目（尤其是後牙）減少，會逐步降低咀嚼能力並增加咀嚼困難。"}, {"en": "Participants with less FTUs, or with FTUs that are a part of removable denture, had greater reduction in masticatory function compared to those with FTUs composed of natural teeth or fixed partial dentures.", "zh": "功能牙單位較少者，或其功能牙單位由活動假牙構成者，其咀嚼功能的下降幅度大於由天然牙或固定假牙構成者。", "g": "這是本篇最重要的發現：<em>後牙接觸的「類型」比「數量」更重要</em>。同樣是一對能對咬的牙，真牙或固定假牙做的，比活動假牙做的有效得多。<br><br>對新題目的意義：若教授的計畫要記錄口腔狀況，建議連「功能牙單位是什麼做的」也一併記，否則會高估活動假牙使用者。"}]}, {"h": "Conclusion", "zh": "結論", "s": [{"en": "This study revealed a strong positive correlation between the subjective masticatory assessment in older adults using the validated questionnaire and the objective clinical test of the mixing ability of two chewing gums.", "zh": "本研究顯示，長者以驗證過的問卷所做的主觀咀嚼評估，與兩色口香糖混合能力的客觀臨床測試之間有強烈正相關。"}, {"en": "Our data on influence of the number and the type of FTU on masticatory performance will be valuable when planning prosthodontic therapy.", "zh": "本研究關於功能牙單位數量與類型對咀嚼表現影響的資料，對規劃補綴治療具有價值。"}]}], "fulltext": [{"h": "How to read it", "zh": "閱讀重點", "s": [{"en": "Read this alongside Chen 2025, not separately.", "zh": "這篇要跟 Chen 2025 一起讀，不要分開。", "g": "兩篇問同一個問題（主觀與客觀對不對得上），答案一致，但工具與樣本完全不同——本篇塞爾維亞 100 人、兩色口香糖；Chen 台灣 1,000 人、軟糖測試。<br><br>兩篇並列就能寫出一句有份量的話：這個結論在不同國家、不同工具下都成立。"}, {"en": "The Highlights box at the top is a gift.", "zh": "開頭的 Highlights 方塊是現成的重點整理。", "g": "Karger 期刊要求作者用三到四句話寫出重點。這一篇的四句話已經把全文濃縮完了，讀起來比摘要還快。<br><br>看到論文有 Highlights 或 Key Points，先讀它。"}, {"en": "Learn the three names for the same idea.", "zh": "把同一個概念的三個名字認熟。", "g": "<em>functional teeth units（FTU）</em>、<em>occlusal supports</em>（Taira 2023）、<em>Eichner index</em>（Chen 2025）——三者都在數「上下顎有幾處能對咬」，只是分類方式不同。<br><br>搜尋文獻時三個詞都要試，否則會漏掉一整批研究。"}, {"en": "One finding applies specifically to the very old.", "zh": "有一個發現只適用於最高齡者。", "g": "Highlights 裡寫著：85 歲以上者不論牙齒狀況如何，咀嚼效率都低。若研究族群包含很高齡的長者，這是一個必須考慮的天花板——到了某個年紀，牙齒可能已經不是主要限制。"}]}, {"h": "Declarations", "zh": "聲明事項", "s": [{"en": "Funding: this study is a part of a bilateral scientific exchange project between the Republic of Serbia and the Republic of Croatia. Grants included travel costs between the two countries.", "zh": "經費：本研究屬塞爾維亞與克羅埃西亞的雙邊科學交流計畫，補助包含兩國間的差旅費用。", "g": "國際學術交流經費，與商業無關。特別交代「補助內容為差旅費」是很細緻的做法——講清楚錢花在哪裡，比只寫「獲某某計畫補助」透明。"}, {"en": "Conflict of Interest Statement: the authors have no conflicts of interest to declare.", "zh": "利益衝突聲明：作者聲明無利益衝突。"}, {"en": "Statement of Ethics: approved by the Ethics Committee of the School of Dental Medicine, University of Belgrade (approval number 36/26).", "zh": "倫理聲明：經貝爾格勒大學牙醫學院倫理委員會核准（編號 36/26）。"}]}, {"h": "Critical notes", "zh": "評析重點", "s": [{"en": "Type of occlusal contact matters more than number.", "zh": "咬合接觸的類型比數量更重要。", "g": "由活動假牙構成的功能牙單位，效果明顯不如真牙或固定假牙構成的。<br><br>這對收資料有直接影響：若只記錄「有幾對能對咬」而不記錄「是什麼做的」，會系統性高估活動假牙使用者。建議兩者都記。"}, {"en": "Above 85, dental status stops predicting chewing.", "zh": "超過 85 歲之後，牙齒狀況就不再能預測咀嚼了。", "g": "這是一種<em>天花板效應</em>的變形——到了某個年齡，肌肉力量、舌壓、全身衰弱等因素接手，牙齒的影響被淹沒。<br><br>與 Taira 2023 的認知功能不顯著（因七成以上 CDR ≥2）是同一類現象：某個變項失效，往往不是它不重要，而是這群樣本沒有變異可比。"}, {"en": "The licence allows annotation but not commercial use.", "zh": "授權允許改作，但限非商業使用。", "g": "CC BY-NC（Karger）。可以做註解版，但不得用於商業用途。收費家教是否算商業使用是灰色地帶，這份檔案請勿併入對外流通的教材。"}, {"en": "The sample is Serbian and clinic-based.", "zh": "樣本來自塞爾維亞，且為診所來源。", "g": "100 位 65 歲以上、貝爾格勒大學牙醫學院贗復科。診所樣本代表的是「會來看牙的人」，與社區長者不同——這一點與 Yen 2015 的長青學苑樣本是類似的限制。"}]}], "vocab": {"masticatory performance": ["chewing measured objectively with a test food or instrument", "咀嚼表現：以測試食物或儀器客觀測量的咀嚼效能", "f", "C1"], "functional teeth units": ["pairs of opposing teeth that function together. Same idea as occlusal support and the Eichner index.", "功能牙單位（FTU）：能對咬並共同運作的牙齒對，與 occlusal support、Eichner index 是同一概念", "f", "C2"], "two-color chewing gum test": ["chew a two-colour gum, then flatten it and judge how evenly the colours mixed", "兩色口香糖測試：嚼後壓平，看兩色混合是否均勻", "f", "C2"], "Conflict of interest": ["a situation where an outside interest could sway the work", "利益衝突", "f", "C1"], "conflicts of interest": ["interests that could bias the research", "利益衝突", "f", "C1"], "Funding": ["who paid for the study", "經費來源", "v", "B1"], "significant": ["a difference or link that is unlikely to be due to chance alone", "統計上顯著", "f", "C1", "論文裡的「顯著」不是「很大、很重要」，而是「不太像巧合」。研究者先假設兩組其實沒差別，再算如果真的沒差、還會看到這麼大差異的機率（p 值）。這個機率小於事先訂好的門檻（通常 5%），就說達到統計顯著。要小心：顯著不等於差很多，樣本很大時，很小的差距也會顯著。"], "Z-score": ["how many standard deviations a value lies from the mean", "Z 分數（標準分數）", "f", "C1", "把一個人的數值換算成「離平均數幾個標準差」。Z = 0 剛好平均，Z = +1 比平均高一個標準差，Z = −2 則低很多。好處是單位不同的測量可以放在同一把尺上比較。"], "correlation": ["whether two measures tend to rise and fall together", "相關", "f", "C1", "兩個數字會不會一起變動：一個高另一個也高，叫正相關；一個高另一個反而低，叫負相關。相關係數介於 −1 到 +1，越接近兩端關係越強，0 代表沒關係。最重要的提醒：相關不等於因果。"], "Likert scale": ["an answer scale such as 'strongly disagree' to 'strongly agree'", "李克特量表", "f", "B2", "常見的問卷作答方式，例如「非常不同意、不同意、普通、同意、非常同意」，分別給 1 到 5 分。它有順序，但每一級之間的距離不一定相等，所以常用中位數和無母數方法處理。"]}, "ftLabel": "HOW TO READ IT", "ftLabelZh": "閱讀重點", "ftBtnLabel": "Continue to the reading notes", "ftBtnHide": "Hide the reading notes", "meshLabel": "Author keywords", "meshLabelZh": "作者關鍵字", "meshNote": "本篇列出的是作者自訂關鍵字。全文逐句註解版待文獻定案後再製作。"}, {"id": "yen2015", "no": "Paper 11", "part": "Abstract + full text", "short": "Yen 2015 · Denture wearing and quality of life in Taiwan", "title": "Impact of removable dentures on oral health-related quality of life among elderly adults in Taiwan", "titleZh": "活動假牙對台灣長者口腔健康相關生活品質的影響", "titleG": "論文標題通常沒有動詞，整個就是一個大名詞片語。拆法是找介系詞：<em>Impact of A on B among C</em> — A（活動假牙）對 B（口腔健康相關生活品質）在 C（台灣長者）身上的影響。看到 of / on / among / in 就切一刀，標題立刻變短。", "authors": "Yen Y-Y, Lee H-E, Wu Y-M, Lan S-J, Wang W-C, Du J-K, Huang S-T, Hsu K-J", "journal": "BMC Oral Health, 2015; 15:1", "doi": "10.1186/1472-6831-15-1", "lic": "Open access under CC BY 4.0 — reproduced with attribution.", "why": "【背景】只需留「口腔狀況會影響生活品質」這個大前提。滿意度的細節新題目用不到，但方法段（信效度、階層式迴歸）仍是很好的範本。", "done": true, "abstract": [{"h": "Background", "zh": "研究背景", "s": [{"en": "Although the use of removable dentures can improve oral function and esthetics for elderly people, compared to those who do not wear removable dentures, those wearing removable dentures could have worse oral health related-quality of life (OHRQoL).", "zh": "雖然配戴活動假牙可以改善長者的口腔功能與外觀，但與沒有配戴活動假牙的人相比，配戴活動假牙者的口腔健康相關生活品質（OHRQoL）反而可能較差。", "g": "這篇的第一句就是長句，但骨架只有一個：<em>Although A, B</em>。先找 B（主要子句）的主詞和動詞：<em>those wearing removable dentures</em>（主詞）+ <em>could have</em>（動詞）。中間那句 compared to... 是插入語，第一次讀先蓋住。長句不是難，是裝了很多註解；先拆出主詞動詞，句子就散了。<br><br><em>worse</em> 在這裡順便記一組三階變化：bad → worse → worst（壞、較壞、最壞），對應的好是 good → better → best。這兩組都是不規則變化，不能寫 more bad 或 worser。本篇結論句用的 <em>the strongest predictor</em> 也是最高級，最高級前面一律要加 the。"}, {"en": "Additional information is required to assess which factors related to denture wearing influence the OHRQoL of elderly individuals.", "zh": "我們還需要更多資料，才能評估與配戴假牙有關的哪些因素會影響長者的口腔健康相關生活品質。", "g": "<em>is required</em> 是被動語態。論文很少寫 “We need more information”，而是寫 “Additional information is required”——把人拿掉，只講事情。這是學術英文的基本語氣，寫論文時也會一直用到。"}, {"en": "The purpose of this study is to evaluate the association between denture wearing and OHRQoL in a sample of elderly individuals in Taiwan.", "zh": "本研究的目的是評估在台灣一組長者樣本中，配戴假牙與口腔健康相關生活品質之間的關聯。", "g": "<em>The purpose of this study is to + 原形動詞</em> 是論文最常見的句型之一，背下來直接可以用在自己的報告第一張投影片。另外記住 <em>association between A and B</em>（A 與 B 的關聯），介系詞固定用 between...and，不能換。"}]}, {"h": "Methods", "zh": "研究方法", "s": [{"en": "The study population included 277 elderly people wearing removable dentures (mean age = 76.0 years).", "zh": "研究對象包含 277 位配戴活動假牙的長者（平均年齡 76.0 歲）。", "g": "<em>wearing removable dentures</em> 是分詞片語，等於 <em>who wore removable dentures</em>，用來修飾前面的 277 elderly people。論文很愛這種省略關係代名詞的寫法，讀到「名詞 + Ving」就把它還原成 who...，意思馬上出來。<br><br>順便留意一個數字問題：摘要寫平均年齡 <em>76.0</em> 歲，但全文的 Results 段與 Table 2 都寫 <em>76.8</em> 歲。兩處不一致，摘要應是筆誤。讀論文時看到摘要與內文數字對不上，以內文與表格為準——那才是實際算出來的數字。這種小矛盾在已發表的論文裡並不罕見，敢去核對就會發現。"}, {"en": "Using face-to-face interviews, we collected data on the participants’ socio-demographic characteristics, dental care service usage (regular dental checkups, treatment during toothache, dental visits in the last year), and factors related to denture wearing (perceived oral pain, perceived loose denture, perceived oral ulcer, perceived halitosis, perceived dry mouth, and perceived total denture satisfaction scores).", "zh": "我們透過面對面訪談，收集了受訪者的社會人口特徵、牙科醫療服務使用情形（定期口腔檢查、牙痛時就醫、過去一年就診次數），以及與配戴假牙相關的因素（自覺口腔疼痛、自覺假牙鬆脫、自覺口腔潰瘍、自覺口臭、自覺口乾，以及自覺假牙整體滿意度分數）。", "g": "這句看起來嚇人，其實只有三塊：<em>we collected data on A, B, and C</em>。括號裡全部是舉例，第一次讀先跳過、拉出 A/B/C 三塊，句子立刻變短。還有一個關鍵字：<em>perceived</em>，是「受訪者自己覺得的」，不是牙醫檢查出來的，這篇全文反覆出現。"}, {"en": "OHRQoL was measured using the Taiwanese version of the Geriatric Oral Health Assessment Index (GOHAI-T).", "zh": "口腔健康相關生活品質以台灣版老年口腔健康評估指標（GOHAI-T）測量。", "g": "<em>was measured using...</em> 就是「用……來測量」。Methods 段落幾乎整段都是被動式：X was measured / was recorded / was performed。原因是重點在「做了什麼」，不是「誰做的」。寫自己論文的 Methods 時，直接套這個句型。"}, {"en": "The location and number of remaining natural teeth and the type of denture were also recorded.", "zh": "也記錄了剩餘天然牙的位置與數量，以及假牙的類型。", "g": "主詞很長：<em>The location and number of remaining natural teeth and the type of denture</em>，動詞是 <em>were also recorded</em>。主詞一長就容易看丟動詞，所以讀到 and 要先判斷：它是在串主詞，還是在串句子？"}, {"en": "Hierarchical multiple regression analysis was performed using GOHAI-T scores as the dependent variable.", "zh": "以 GOHAI-T 分數為依變項，進行階層式多元迴歸分析。", "g": "又是「被動 + using」。這裡要記一組詞：<em>dependent variable</em>（依變項）是被影響的那一個，其他預測因子叫 <em>independent variables</em>（自變項）。生統課會反覆用到這兩個字。"}]}, {"h": "Results", "zh": "研究結果", "s": [{"en": "All the predictors together accounted for 50% of the variance in GOHAI-T scores.", "zh": "所有預測因子合起來可以解釋 GOHAI-T 分數 50% 的變異。", "g": "<em>account for</em> 在這裡不是「解釋原因」，而是統計上的「解釋變異」。看到 <em>accounted for X% of the variance</em> 就直接理解成「解釋了 X%」，不用每次重新推。"}, {"en": "Further, education level, number of natural teeth, denture status, perceived loose denture, perceived oral ulcer, and perceived total denture satisfaction scores had statistically significant influences on OHRQoL.", "zh": "此外，教育程度、天然牙數目、假牙狀況、自覺假牙鬆脫、自覺口腔潰瘍，以及自覺假牙整體滿意度分數，對口腔健康相關生活品質有統計上顯著的影響。", "g": "六個並列主詞配一個動詞 <em>had</em>。讀這種長串列舉時，先找最後一個 <em>and</em>，就知道清單到哪裡結束，動詞緊接在後。搭配記住：<em>have an influence on</em>（對……有影響），介系詞用 on。"}, {"en": "When compared with other variables, factors related to denture wearing, especially perceived total denture satisfaction scores, had the greatest impact on GOHAI-T scores.", "zh": "與其他變項相比，與配戴假牙有關的因素——尤其是自覺假牙整體滿意度分數——對 GOHAI-T 分數的影響最大。", "g": "主詞是 <em>factors</em>，動詞是 <em>had</em>。中間 especially... 是插入補充，兩邊用逗號夾起來，可以先蓋住。最高級 <em>the greatest impact on</em> 前面一定要有 the。"}]}, {"h": "Conclusions", "zh": "結論", "s": [{"en": "Of the factors analyzed in this study, denture satisfaction was the strongest predictor of OHRQoL.", "zh": "在本研究分析的各項因素中，假牙滿意度是口腔健康相關生活品質最強的預測因子。", "g": "句首的 <em>Of the factors...</em> 等於 <em>Among the factors...</em>，意思是「在……之中」。這種倒裝開頭在結論句很常見，目的是先把範圍圈好再講重點。<em>analyzed</em> 是過去分詞，修飾 factors（被分析的因素）。"}, {"en": "This suggests that denture satisfaction is useful for assessing the effect of denture treatment on the OHRQoL of elderly individuals wearing removable dentures.", "zh": "這顯示假牙滿意度可用於評估假牙治療對配戴活動假牙長者口腔健康相關生活品質的影響。", "g": "<em>This suggests that...</em> 是結論段的標準收尾：不說「證明」，只說「顯示、暗示」。因為橫斷式研究不能講因果，所以用 suggests 而不是 proves——這是審查者最愛抓的點。另外：<em>useful for + Ving</em>，<em>the effect of A on B</em>（A 對 B 的影響）。"}]}], "fulltext": [{"h": "Background", "zh": "前言", "s": [{"en": "Because of the low fertility rate in Taiwan, the elderly population is rapidly increasing.", "zh": "由於台灣生育率偏低，老年人口正快速增加。", "g": "<em>Because of + 名詞</em>（因為某個東西），<em>Because + 句子</em>（因為某件事）。兩個不能混用，這是台灣學生最常寫錯的地方之一。"}, {"en": "By the end of 2026, people aged 65 years or over are expected to account for 20.1% of the total population of Taiwan, and, as such, there is a growing interest in helping the elderly to live a complete and healthy life, physically, mentally, and socially.", "zh": "預計到 2026 年底，65 歲以上人口將占台灣總人口的 20.1%，因此，如何協助長者在生理、心理與社會層面過完整而健康的生活，越來越受到重視。", "g": "<em>are expected to</em>（預計將會）是論文談趨勢與推估的標準說法，比 will 客氣，也比較安全。<em>account for</em> 在這裡是「占（多少比例）」，跟摘要裡統計上的「解釋變異」是同一個片語的不同用法——看上下文決定。"}, {"en": "Oral health is an important part of well-being, and oral health-related quality of life (OHRQoL) should be emphasized when providing dental care to elderly people.", "zh": "口腔健康是整體福祉的重要一環，在提供長者牙科照護時，應重視口腔健康相關生活品質。"}, {"en": "One of the most commonly used measures of OHRQoL is the Geriatric Oral Health Assessment Index (GOHAI), which was developed specifically for use with older adults.", "zh": "最常用的口腔健康相關生活品質測量工具之一是老年口腔健康評估指標（GOHAI），這是專為長者設計的量表。", "g": "<em>One of the most + 形容詞 + 複數名詞</em> 是介紹工具或方法的萬用開場。後面的 <em>which</em> 帶出補充說明，前面有逗號，代表這是額外資訊、不是限定，可以先跳過再回頭讀。"}, {"en": "Many previous studies have shown that implant-supported dentures can substantially improve the wearer’s quality of life; however, the higher cost of treatment with dental implants means that removable dentures continue to be widely used to replace missing teeth, especially in the elderly.", "zh": "許多先前研究顯示，植體支持式假牙能大幅改善配戴者的生活品質；然而，植牙治療費用較高，因此活動假牙仍被廣泛用來替代缺失的牙齒，長者尤其如此。", "g": "分號 <em>;</em> 加 <em>however</em> 是論文轉折的標準寫法：前半講好處，後半講現實限制。<em>Many previous studies have shown that...</em> 是文獻回顧的第一號句型，整篇會出現很多次。"}, {"en": "Unfortunately, individuals wearing a removable prosthesis can experience significant problems with regard to the social and emotional aspects of life, as compared to individuals with natural teeth.", "zh": "遺憾的是，與擁有天然牙的人相比，配戴活動補綴物者在生活的社交與情緒層面可能遭遇明顯的困擾。", "g": "<em>prosthesis</em>（補綴物）在這篇是 denture 的同義替換詞，論文常換字避免重複。讀的時候要意識到：換了字，講的還是同一件事。"}, {"en": "It may be difficult for some individuals to adapt to dentures, as wearing a removable prosthesis demands emotional and functional adjustments.", "zh": "有些人可能難以適應假牙，因為配戴活動補綴物需要在情緒與功能上做出調整。", "g": "<em>It is difficult for someone to do something</em>——這裡的 It 是虛主詞，真正的主詞是後面的 to adapt to dentures。中文沒有這個結構，所以很容易寫成 “Some people are difficult to adapt”（錯）。"}, {"en": "As such, elderly individuals wearing removable dentures may experience more OHRQoL impairments than do those who do not wear removable dentures.", "zh": "因此，配戴活動假牙的長者，其口腔健康相關生活品質受損的程度，可能高於未配戴活動假牙者。"}, {"en": "In elderly people, OHRQoL is known to be associated with socioeconomic status, regular dental visits, subjective masticatory ability, and the number of remaining natural teeth.", "zh": "在長者身上，口腔健康相關生活品質已知與社經地位、定期就診、主觀咀嚼能力，以及剩餘天然牙數目有關。", "g": "<em>be associated with</em>（與……有關聯）是本篇出現頻率最高的片語之一，整篇至少十幾次。注意它只講關聯，不講因果——這正是橫斷式研究能講的極限。"}, {"en": "Factors related to denture wearing that specifically affect the OHRQoL of elderly people wearing removable dentures include denture status, denture satisfaction, perceived loose denture, presence of oral pain, presence of oral ulcer, perceived halitosis and perceived dry mouth.", "zh": "特別會影響配戴活動假牙長者口腔健康相關生活品質的、與配戴假牙相關的因素，包括假牙狀況、假牙滿意度、自覺假牙鬆脫、口腔疼痛、口腔潰瘍、自覺口臭與自覺口乾。", "g": "這句的主詞從句首一路長到 <em>include</em> 才結束。訣竅：找到動詞 include，往前推的全部都是主詞。看到句子讀了兩行還沒出現動詞，就是遇到長主詞了，別慌，繼續往下找。"}, {"en": "Kuo et al. found that increased denture satisfaction was significantly related to an improvement in elderly patients’ OHRQoL.", "zh": "Kuo 等人發現，假牙滿意度提高與長者口腔健康相關生活品質的改善有顯著關聯。", "g": "<em>et al.</em> 是拉丁文 “and others” 的縮寫，唸作 /ˌet ˈæl/，中文就是「等人」。引用他人研究時的標準寫法：作者姓 + et al. + 過去式動詞（found / reported / showed）。"}, {"en": "In addition, Komagamine et al. showed a positive relationship between retention of the lower denture and OHRQoL, using the Oral Health Impact Profile (OHIP), in edentulous patients.", "zh": "此外，Komagamine 等人以口腔健康影響量表（OHIP）在無牙患者中，發現下顎假牙固位力與口腔健康相關生活品質之間呈正向關係。"}, {"en": "Moreover, Ekanayake et al. reported a significant association between halitosis and higher OHIP scores, indicating that people with halitosis had a worse OHRQoL than those who did not have halitosis.", "zh": "再者，Ekanayake 等人指出口臭與較高的 OHIP 分數之間有顯著關聯，顯示有口臭者的口腔健康相關生活品質比沒有口臭者差。", "g": "注意 OHIP 與 GOHAI 的分數方向相反：OHIP 分數越高代表生活品質越差，GOHAI 分數越高代表越好。讀到分數就要先確認方向，否則整段會理解顛倒。<em>indicating that...</em> 是分詞構句，等於 “which indicates that...”。"}, {"en": "In addition, a previous study indicated that elderly patients’ denture satisfaction is associated with health-related quality of life (HRQoL).", "zh": "此外，先前一項研究指出，長者的假牙滿意度與健康相關生活品質（HRQoL）有關。", "g": "注意兩個很像的縮寫：<em>OHRQoL</em> 是口腔健康相關生活品質，<em>HRQoL</em> 是整體健康相關生活品質，少一個 O，範圍大很多。這段刻意在比較兩者。"}, {"en": "However, Inoue et al. showed that HRQoL in patients with removable dentures was mediated by OHRQoL.", "zh": "然而，Inoue 等人顯示，配戴活動假牙者的健康相關生活品質是透過口腔健康相關生活品質而產生中介影響的。", "g": "<em>mediated by</em>（被……中介）是研究方法的專門用語：A 不是直接影響 C，而是先影響 B，再由 B 影響 C。B 就叫中介變項（mediator）。"}, {"en": "Moreover, Lee et al. observed that perceived oral health status, measured by the OHIP, had a greater impact on HRQoL than did the clinical factors, as measured by the 36-Item Short Form (SF-36) Health Survey.", "zh": "再者，Lee 等人觀察到，以 OHIP 測得的自覺口腔健康狀況，對健康相關生活品質的影響大於以 SF-36 健康量表測得的臨床因素。"}, {"en": "Therefore, it is important to assess the predictors of OHRQoL to improve HRQoL.", "zh": "因此，評估口腔健康相關生活品質的預測因子，對於改善整體健康相關生活品質相當重要。"}, {"en": "A previous study showed that although denture wearing could improve oral function and esthetics related to quality of life, people wearing removable dentures had a significantly higher median OHIP score than did those who do not wear removable dentures, indicating a poorer OHRQoL in the former group.", "zh": "先前一項研究顯示，雖然配戴假牙能改善與生活品質相關的口腔功能與外觀，但配戴活動假牙者的 OHIP 中位數分數顯著高於未配戴者，代表前者的口腔健康相關生活品質較差。", "g": "<em>the former</em> 指前面提到的兩者中的「前者」，相對的是 <em>the latter</em>（後者）。論文為了避免重複整串名詞常這樣用，讀到就要回頭確認它指誰。"}, {"en": "Hence, additional information is required to determine which factors related to denture wearing influence the OHRQoL of elderly subjects.", "zh": "因此，還需要更多資料來確定與配戴假牙相關的哪些因素會影響長者的口腔健康相關生活品質。", "g": "這句和摘要裡的第二句幾乎一模一樣，只換了 assess → determine。摘要本來就是全文的濃縮版，這種重疊很正常，也代表讀懂摘要就等於掌握了骨架。"}, {"en": "Improved understanding of the factors correlated with a better OHRQoL would help in clinical decision making to provide dental treatment appropriate for patients’ specific needs and concerns.", "zh": "更了解哪些因素與較佳的口腔健康相關生活品質有關，有助於臨床決策，提供符合病人特定需求與顧慮的牙科治療。"}, {"en": "Although the relationship between variables related to denture wearing and OHRQoL has been investigated in previous studies, it is unclear which variable is the strongest predictor of OHRQoL.", "zh": "雖然先前研究已探討過與配戴假牙相關的變項和口腔健康相關生活品質之間的關係，但仍不清楚哪一個變項是最強的預測因子。", "g": "<em>Although 前人做過 A，但 B 仍不清楚</em>——這就是論文的「研究缺口」句型，幾乎每篇前言的倒數第二段都會出現。找到這句，就找到了整篇論文存在的理由。"}, {"en": "Therefore, in the current study, we aimed to address this gap in the literature.", "zh": "因此，本研究旨在填補文獻中的這個缺口。", "g": "<em>ga
