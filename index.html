  .pg .x:hover { color: #1d160f; }
  .shelf:last-child .board { height: 18px; }

  footer { margin-top: 3.5rem; text-align: center; font-size: 0.92rem; color: var(--faded); line-height: 1.8; }
  footer a { color: var(--mist); }

    .shelf-label { padding: 0 0.6rem 0.7rem; } .shelf-label h2 { letter-spacing: 0.14em; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .stroke path { animation: none; stroke-dashoffset: 0; } .book, .pop { transition: none; } }
</style>

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const short = lv => lv.split("·")[0].trim();
const slug = s => s.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
const first = {};
const caseEl = document.getElementById("case");
caseEl.innerHTML = SHELVES.map((s, si) => {
  const anchor = first[s.series] ? "" : ` id="${slug(s.series)}"`; first[s.series] = 1;
  return `
  <section class="shelf"${anchor} aria-labelledby="sh${si}">
    <div class="shelf-label"><h2 id="sh${si}"><span class="ser">${esc(s.series)}</span> · ${esc(s.name)}</h2><span>${esc(s.sub)}</span></div>
    <div class="row">${s.books.map((b, bi) => {
      const id = `b${si}-${bi}`, face = bi === 0, style = `--a: var(${b.a});${b.h && !face ? ` --h:${b.h}px;` : ""}${b.w && !face ? ` --w:${b.w}px;` : ""}`;
      const ribbon = b.new ? `<span class="new">NEW</span>` : "";
      const label = `${b.title}. ${b.level}.`;
      return face
        ? `<button class="book cover" id="${id}" data-s="${si}" data-b="${bi}" style="${style}" aria-expanded="false" aria-controls="pop" aria-label="${esc(label)}">${ribbon}
             <span class="eb">${esc(s.mark)}</span><span class="t${b.title.length > 22 ? " long" : ""}">${esc(b.title)}</span><span class="orn"></span><span class="lv">${esc(short(b.level))}</span></button>`
        : `<button class="book spine" id="${id}" data-s="${si}" data-b="${bi}" style="${style}" aria-expanded="false" aria-controls="pop" aria-label="${esc(label)}">${ribbon}
             <span class="t">${esc(b.spine || b.title)}</span><span class="lv">${esc(short(b.level))}</span></button>`;
    }).join("")}</div>
    <div class="board" aria-hidden="true"></div>
  </section>`; }).join("");

caseEl.insertAdjacentHTML("beforeend", `<div class="pop" id="pop" role="dialog" aria-label="Book details"></div>`);
const pop = document.getElementById("pop");
let open = null;
function close(){ if(!open) return; document.getElementById(open).setAttribute("aria-expanded", "false"); pop.classList.remove("open"); open = null; }
function place(btn){
  const c = caseEl.getBoundingClientRect(), sh = btn.closest(".shelf"), bd = sh.querySelector(".board").getBoundingClientRect(), r = btn.getBoundingClientRect();
  const inner = caseEl.clientWidth, w = pop.offsetWidth, mid = r.left + r.width/2 - c.left - caseEl.clientLeft;
  const left = Math.max(6, Math.min(inner - w - 6, mid - w/2));
  pop.style.left = left + "px"; pop.style.top = (bd.bottom - c.top - caseEl.clientTop + 10) + "px";
  pop.style.setProperty("--cx", Math.max(18, Math.min(w - 18, mid - left)) + "px");
}
function show(btn){
  const sh = SHELVES[+btn.dataset.s], b = sh.books[+btn.dataset.b];
  if(open === btn.id){ close(); return; }
  if(open) document.getElementById(open).setAttribute("aria-expanded", "false");
  pop.style.setProperty("--a", `var(${b.a})`);
  pop.style.setProperty("--ad", `color-mix(in srgb, var(${b.a}) 45%, #2a1a10)`);
  pop.innerHTML = `<span class="caret"></span><div class="ob">
    <div class="pg l"><p class="ser">${esc(sh.series)} · ${esc(sh.name)}</p><p class="eyebrow">${esc(b.eyebrow)}</p><h3${b.title.length > 24 ? ' class="long"' : ""}>${esc(b.title).replace(/(\S+-\S+)/g, '<span class="nw">$1</span>')}</h3><span class="orn"></span>
      <p class="level">${esc(b.level)}</p></div>
    <div class="pg r"><button class="x" aria-label="Close">×</button><p class="blurb">${esc(b.blurb)}</p>
      <a class="start" href="${esc(b.href)}">${esc(b.start)}</a></div></div>`;
  pop.querySelector(".x").onclick = () => { const id = open; close(); document.getElementById(id).focus(); };
  btn.setAttribute("aria-expanded", "true"); open = btn.id;
  place(btn);
  requestAnimationFrame(() => pop.classList.add("open"));
  setTimeout(() => { const r = pop.getBoundingClientRect(); if(r.bottom > innerHeight) pop.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }, 260);
}
addEventListener("resize", () => { if(open) place(document.getElementById(open)); });
document.addEventListener("click", e => { if(open && !e.target.closest(".pop, .book")) close(); });
caseEl.addEventListener("click", e => { const btn = e.target.closest(".book"); if(btn) show(btn); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && open){ const id = open; close(); document.getElementById(id).focus(); } });
</script>
